ブル付近において、自分がチップを失うことの「痛み（損失価値）」が、チップを得ることの「喜び（獲得価値）」を大きく上回る現象を数値化した概念です。トーナメントでは現金価値がスタック量と非線形である（ICM）ため、キャッシュゲームと同じ勝率でもバブル期にはフォールドが正解になることが多くなります。この圧力を理解することが、バブルを生き残り上位入賞するための鍵となります。","ex":"「高いバブルファクターがかかっているため、このハンドは通常よりタイトに降りる。」"},{"n":363,"ja":"バブルライン","lv":3,"en":"Bubble Line","kana":"バブル・ライン","alias":["バブル","入賞ライン","ITM手前","賞金圏の境界線"],"desc":"トーナメントにおいて、あと数人が敗退すれば賞金圏内（インザマネー）が確定する、入賞のすぐ手前の局面を指します。例えば10位までが賞金を獲得できる大会で、残りが11人や12人といった、緊張感の高まる状況です。この局面では、賞金獲得を確実にしたいショートスタックのプレイヤーは、飛ばないよう極端に慎重になり、逆にチップを多く持つプレイヤーは、その心理を突いて積極的にプレッシャーをかけて攻めることができます。通常の期待値計算（チップEV）だけでなく、賞金額を加味したICMの考え方が重要になる場面であり、ここでの立ち回りがトーナメントの最終的な収支を大きく左右します。","ex":"「バブルラインに入ったから、ショートスタック相手にどんどんプレッシャーをかけよう。」"},{"n":364,"ja":"バランス","lv":6,"en":"Balance","kana":"バランス","alias":["均整","平衡"],"desc":"特定の状況において、自分のプレイが相手に読まれないよう、強いハンドでのバリューベットと、弱いハンドでのブラフを適切な頻度で混ぜ合わせることです。例えば、常に強い時だけベットしていると、相手は簡単にフォールドしてしまいますが、ブラフを一定割合で混ぜることで、相手に難しい決断を強いることができます。このように自分のレンジ（手札の範囲）に偏りを作らないことで、相手からのエクスプロイト（弱点を突くプレイ）を防ぎ、長期的な収益を最大化するGTO戦略の根幹となる考え方です。","ex":"「バリューとブラフのバランスを意識して、レンジ全体を読ませないように打った。」"},{"n":365,"ja":"バリアンス","lv":4,"en":"Variance","kana":"バリアンス","alias":["分散","振れ幅"],"desc":"統計学的な用語で、期待値（EV）と実際の結果との間に生じる「振れ幅（分散）」のことです。ポーカーは短期的には運の要素が強いため、正しいプレイをしていても負けが続く（下振れ）ことがあります。このバリアンスの存在を理解し、一喜一憂せずにバンクロール管理と冷静なプレイを続けることが、ポーカープレイヤーに求められる最も重要な資質の一つとされています。","ex":"「負けが込んでいるが、これは単なるバリアンス。自分のプレイは間違っていない。」"},{"n":366,"ja":"バリュー","lv":2,"en":"Value","kana":"バリュー","alias":["利益","価値"],"desc":"強い役を持っている時に、相手のより弱いハンドから「コール」を引き出すことで得られる利益のことです。相手が降りずに付いてきてくれる最大の金額を探り、利益を最大化することがポーカーで勝つための基本です。ブラフ（降ろす）とは対極にある、稼ぐための最も重要な概念です。","ex":"「相手にワンペアがあると読み、しっかりとバリューを取り切るサイズでベットした。」"},{"n":367,"ja":"バリューターン","lv":4,"en":"Value Turn","kana":"バリュー・ターン","alias":["ターンでのバリューベット"],"desc":"ターンのラウンドにおいて、自分の手が勝っているという確信のもと、さらに利益（バリュー）を積み増すために行う攻めのアクションです。フロップでの継続ベットがコールされた後、ターンでも強気に打つことでポットを大きく育てます。相手のドローハンドに対して安く見せる権利を与えず、自分の強い手から最大限のチップを引き出すための戦略的なベッティングです。","ex":"「ターンで役がさらに強まったので、迷わずバリューターンのベットを放った。」"},{"n":368,"ja":"バリューベット","lv":2,"en":"Value Bet","kana":"バリュー・ベット","alias":["利益最大化","利益確定のベット"],"desc":"自分のハンドが相手の持っているハンド（コールレンジ）よりも強いと確信している時に、相手からより多くのチップを引き出し、利益を最大化するために行うベットです。ブラフとは対照的な概念で、相手が「負けているかもしれないが、この額ならコールできる」と思わせる絶妙なサイズを選択することが重要になります。自分の手の強さに応じて、相手の弱いペアやドローからどれだけ多くのチップを合法的に「徴収」できるかが、ポーカーの実力差が最も顕著に現れるポイントの一つです。","ex":"相手がトップペアを持っていそうだったので、大きめのバリューベットを打った。"},{"n":369,"ja":"バレル","lv":5,"en":"Barrel","kana":"バレル","alias":["銃弾","連続ベット"],"desc":"ポストフロップにおいて、複数のストリート（フロップ、ターン、リバー）にわたって連続してベットを打ち込む攻撃的な行為です。1回目をシングルバレル、2回目をダブルバレル、3回目をトリプルバレルと呼びます。一貫して強さを主張し続けることで、相手に強力な心理的プレッシャーを与え、多少のメイドハンドであってもフォールドに追い込む狙いがあります。単なる無謀な連発ではなく、ボードの変化（スケアカードの出現など）を利用して、効果的にバレルを継続することが上級者の戦術です。","ex":"「フロップでのチェックに対し、強気なバレルを重ねて相手をフォールドさせた。」"},{"n":370,"ja":"バンクロール","lv":2,"en":"Bankroll","kana":"バンクロール","alias":["ポーカー資金","活動資金","軍資金"],"desc":"ポーカーをプレイするために用意した、私生活の資金とは完全に切り離された「活動専用の資金」の総額を指します。一時的な下振れ（分散）によって破産してしまわないよう、自分がプレイするレートのバイイン額の数十倍〜百倍以上の余裕を持つことが、ポーカーにおけるリスク管理の鉄則です。正しい判断（Aゲーム）を続けるためには、目の前の一回きりの勝負で資金が尽きないという精神的な安定感が必要であり、バンクロール管理こそがプロへの第一歩となります。","ex":"「ステークスを上げる前に、まずはしっかりとしたバンクロールを構築する必要がある。」"},{"n":371,"ja":"バンクロールマネジメント","lv":3,"en":"Bankroll Management","kana":"バンクロール・マネジメント","alias":["BRM","バンクロール管理","資金管理"],"desc":"ポーカーに充てる資金（バンクロール）を、破産しないように管理する考え方・技術を指します。「BRM」とも略されます。ポーカーは技術のゲームでありながら短期的には運（分散）の影響を強く受けるため、たとえ実力で勝ち越せるプレイヤーでも、自分の資金に対して高すぎるレートで打つと、一時的な負けが続いただけで資金が尽きてしまいます。これを避けるため、参加するレートやトーナメントのバイインを、バンクロールの一定割合以下（例：キャッシュなら20〜40バイイン以上を確保）に抑えるのが基本です。長くゲームを続けて実力を発揮し続けるための、勝ち組であり続けるうえで最も重要な土台となる規律です。","ex":"「調子は良いけど、バンクロールマネジメント的にまだ上のレートには上がらない。」"},{"n":372,"ja":"ハンド","lv":1,"en":"Hand","kana":"ハンド","alias":["手札","手役","1ゲーム"],"desc":"ポーカーにおける最小のプレイ単位（1回の配札）や、プレイヤーが持つ2枚の手札（ホールカード）、あるいは完成した5枚の役（ポーカーハンド）そのものを指します。非常に幅広い意味を持つ用語ですが、「良いハンドが来た（手札）」、「このハンドをプレイする（1ゲーム）」、「最強のハンドが完成した（役）」といった文脈で、ポーカーのあらゆるシーンで使われます。","ex":"「今回のハンドはAA。プリフロップ時点で最強のスターティングハンドだ。」"},{"n":373,"ja":"ハンドヒストリー","lv":3,"en":"Hand History","kana":"ハンド・ヒストリー","alias":["ハンドログ","プレイ履歴"],"desc":"オンラインポーカーなどで記録される、過去のアクションやカードの推移、ポット額などの詳細なプレイログのことです。「リーディング」の文脈では、過去の履歴を分析することが相手の手を絞り込む重要な鍵になるとされています。自分のプレイを見直し、リーク（弱点）を修正するための復習ツールとして、真剣に上達を目指すプレイヤーには不可欠な資料です。","ex":"「昨日のセッションのハンドヒストリーを見返して、自分のミスを徹底的に分析した。」"},{"n":374,"ja":"ハンドリーディング","lv":5,"en":"Hand Reading","kana":"ハンド・リーディング","alias":["ハンド読み","レンジ推定"],"desc":"相手のベットサイズ、アクションの速度、ポジション、およびボードとの関連性などのあらゆる情報を統合し、相手が現在持っている可能性のある手札の範囲（レンジ）を論理的に推測する高度な知的作業です。ポーカーにおける最強の技術の一つであり、正確なリーディングができれば、相手のブラフを見抜いてコール（ブラフキャッチ）したり、自分の弱い手で適切にフォールドしたりすることが可能になります。相手の手を特定の1枚に断定するのではなく、常に「可能性のある範囲」で考えることが基本とされています。","ex":"「徹底的なハンドリーディングにより、相手の弱気なサインを見逃さずブラフを敢行した。」"},{"n":375,"ja":"ハンドリード","lv":5,"en":"Hand Reading","kana":"ハンド・リード","alias":["ハンドリーディング","レンジ読み"],"desc":"相手のこれまでのアクション（ベット・レイズ・コールなど）、ポジション、ベットサイズ、テンポといった情報を手がかりに、相手が持っているであろうハンドの範囲（レンジ）を論理的に推測する技術を指します。特定の1ハンドをピンポイントで当てる超能力ではなく、「ありうるハンドの集合」を各ストリートの行動に応じて絞り込んでいく作業です。プリフロップのレンジを出発点として、フロップ・ターン・リバーと相手の行動に矛盾しないハンドを残し、矛盾するハンドを消去していくことで、精度の高い意思決定が可能になります。ポーカーの戦略的な面白さの核心であり、上達に最も直結するスキルの一つです。","ex":"「相手のハンドリードをすると、このベットはブラフの可能性が高い。」"},{"n":376,"ja":"ハンドレンジ","lv":4,"en":"Hand Range","kana":"ハンド・レンジ","alias":["レンジ"],"desc":"特定のプレイヤーが、その時点の状況やアクションにおいて持っている可能性のある「全ての手札の組み合わせの範囲」のことです。ポーカーでは相手の手札を1つの組み合わせに断定するのではなく、この「面（レンジ）」として推測し、戦略を立てることが基本です。ポジションが早いほどレンジは狭く強いものになり、ボタンに近づくほど広く多様なハンドが含まれるようになります。自分のレンジと相手のレンジを比較し、どちらが有利かを分析する「レンジリーディング」は、中上級者にとって必須のスキルです。","ex":"相手のUTGからのオープンに対し、そのハンドレンジをプレミアムハンド中心と予測した。"},{"n":377,"ja":"ヒーター","lv":3,"en":"Heater","kana":"ヒーター","alias":["ストリーク","上振れ"],"desc":"短期間に非常に良いカードが配られ続けたり、低い確率のドローが次々と完成したりして、勝利が止まらない絶好調の状態を指すスラング（造語）です。「ストリーク（運の流れ）」ともいいます。精神的に非常に優位に立てますが、自分の実力を過信してしまいがちな時期でもあるため、ヒーターが去った後の冷静なプレイ維持が重要になります。","ex":"「今日の彼は完全にヒーターに入っている。何を持っていても勝てそうにない。」"},{"n":378,"ja":"ヒーロー","lv":3,"en":"Hero","kana":"ヒーロー","alias":["自分","分析主役"],"desc":"ポーカーのハンド分析や戦略を解説する際、自分自身、あるいはその分析の主体となるプレイヤーを指す言葉です。対照的に、対戦相手は「ヴィリアン（悪役）」と呼ばれます。これはポーカー界における慣習的な表現であり、「ヒーローのアクション（自分の行動）」が正しかったかどうかを客観的に評価するために用いられます。自分がヒーローとしてどのような決断を下すべきか、という視点でゲームを捉えることは、自己のプレイスタイルを確立し、理論に基づいた正しい判断（Aゲーム）を維持するために役立ちます。","ex":"「ここでヒーローが選択すべき最も期待値の高いアクションは、フォールドだ。」"},{"n":379,"ja":"ヒーローコール","lv":4,"en":"Hero Call","kana":"ヒーロー・コール","alias":["勇気のコール"],"desc":"自分の役は弱く、通常であればフォールドするようなハンド（エースハイや弱いワンペアなど）で、相手のベットが「絶対にブラフである」という確信を持ってコールし、ポットを獲得することです。相手のストーリー（アクションの一貫性）の矛盾を完璧に突いた、高度なハンドリーディングの賜物と言えます。成功すれば大きな利益と高い評価を得られますが、もし相手が本物の手（バリュー）を持っていた場合は無謀なプレイとしてスタックを大きく失うため、確固たる根拠と冷静な計算が必要な、まさに「ヒーロー」のような勇気ある決断です。","ex":"「リバーでの特大ベットに対し、不自然さを感じてヒーローコールを成功させた。」"},{"n":380,"ja":"ヒーローフォールド","lv":4,"en":"Hero Fold","kana":"ヒーロー・フォールド","alias":["奇跡のフォールド"],"desc":"自分の手が非常に強い（例：フルハウスなど）にもかかわらず、相手のアクションからそれ以上の強手（例：フォーカード）を正確に読み取り、勇気を持って「フォールド」する高度なプレイです。「ハンドリーディング」や「タフな判断」の極致と言えます。本来ならコールして当然の強い手で降り、大きなスタックの喪失を最小限に抑えることができた際、賞賛を込めてこう呼ばれます。","ex":"「リバーでの特大レイズに対し、ヒーローフォールドでナッツ負けを回避した。」"},{"n":381,"ja":"ピオソルバー","lv":7,"en":"PioSOLVER","kana":"ピオ・ソルバー","alias":["Pio","ソルバー","GTOソルバー","GTO解析ツール"],"desc":"ポーカーのゲーム理論的最適（GTO）戦略を計算するための、代表的な解析ソフトウェア（ソルバー）の一つです。特定の局面を入力すると、双方が最善を尽くした場合の理論上最適なアクションの頻度やベットサイズを、膨大な計算によって導き出します。現代のポーカー研究に革命をもたらしたツールであり、トッププレイヤーから熱心な学習者まで、戦略のオフテーブル研究に広く活用されています。実戦でリアルタイムに使うことはできませんが、自分のプレイをソルバーの解と照らし合わせて検証することで、判断の精度を高められます。ピオソルバーで学んだ知見を実戦に落とし込むことが、現代的な上達法の一つとなっています。","ex":"「この局面をピオソルバーで回したら、自分のベットサイズが大きすぎると分かった。」"},{"n":382,"ja":"ピクチャー","lv":1,"en":"Picture","kana":"ピクチャー","alias":["絵札","フェイスカード"],"desc":"J（ジャック）、Q（クイーン）、K（キング）といった、絵柄が描かれているカードの総称です。また、「ピクチャーカード」「ピクチャー」とも言います。ハイカードの中でも強い部類に入り、これらが手元にあることは役を作る上で有利に働きます。特にAとピクチャーの組み合わせは、強力なスターティングハンドや「ブロードウェイ」ストレートの材料として重宝されます。","ex":"「ボードにはピクチャーが一枚も出ず、スモールペアが有利な展開になった。」"},{"n":383,"ja":"ビッグスタック","lv":1,"en":"Big Stack","kana":"ビッグ・スタック","alias":["ディープスタック","チリ"],"desc":"テーブルの平均やブラインド額に対し、非常に多くのチップを保有している状態です。「ディープスタック」や、トーナメントでの「チップリーダー」としてその有利さが説かれています。潤沢な資金背景から他のプレイヤーに強烈なプレッシャーをかけることができ、一度のミスでも致命傷になりにくいため、ゲームを支配する上で圧倒的に有利な立場となります。","ex":"「ビッグスタックの利を活かして、バブルラインでのスチールを繰り返した。」"},{"n":384,"ja":"ビッグブラインド","lv":1,"en":"Big Blind","kana":"ビッグ・ブラインド","alias":["BB"],"desc":"ゲーム開始時に強制的にチップを支払わなければならないポジション、またはそのベット額（BB）自体を指します。通常、スモールブラインド（SB）の左隣に位置し、SBの2倍の額を支払います。プリフロップでは最後に行動できる権利（オプション）がありますが、フロップ以降の全てのラウンドでは2番目に行動しなければならない不利な位置になります。強制的に参加費を奪われている状態であるため、いかに自分のブラインドを相手のレイズ（スチール）から守り抜くかという「ディフェンス戦略」が収支に大きく影響します。","ex":"BBのポジションを守るため、ボタンのレイズに対してディフェンスした。"},{"n":385,"ja":"ヒット","lv":1,"en":"Hit","kana":"ヒット","alias":["刺さる","ペア完成"],"desc":"自分の手札（ホールカード）の数字が、コミュニティカード（ボード）に現れた同じ数字とペアを作ることを指します。「トップヒット（トップペア）」などの形で頻出します。特にフロップで手札のAがボードのAと重なることを「Aがヒットした」と言います。役が完成する最も基本的な形態であり、ここから勝負が本格的に始まる第一歩となるアクションです。","ex":"「フロップでKがヒットし、最強のトップペアが完成したので自信を持って打つ。」"},{"n":386,"ja":"ピュアブラフ","lv":4,"en":"Pure Bluff","kana":"ピュア・ブラフ","alias":["エアー","ブラフ"],"desc":"ドローの可能性すら一切ない、完全に価値のない弱い手札（エアー）で行う純粋なブラフのことです。「セミブラフ」との対比で解説されています。コールされれば100%負けるというリスクを背負いながら、強気なアクションで相手をフォールドさせることだけを目的とします。情報の空白を突き、ポットを強奪するポーカーの最もスリリングな技術です。","ex":"「リバーまで何も引けなかったので、覚悟を決めてピュアブラフを撃ち込んだ。」"},{"n":387,"ja":"ピュア戦略","lv":8,"en":"Pure Strategy","kana":"ピュア・ストラテジー","alias":["純粋戦略","100%戦略"],"desc":"ゲーム理論の用語で、ある特定の状況・ハンドに対して、常に一つの決まったアクションを100%の頻度で取る戦略を指します。「純粋戦略」とも呼ばれ、確率的に複数のアクションを混ぜる「ミックス戦略（混合戦略）」と対になる概念です。例えば「このハンドは常にベット（チェックやコールは一切しない）」というのがピュア戦略です。GTOの均衡解では、相手に読まれないよう同じハンドでもベットとチェックを一定比率で混ぜるミックス戦略が多用されますが、実戦では人間が頻度を正確に再現するのは難しいため、敢えてシンプルなピュア戦略に寄せて運用したり、明確な弱点を持つ相手にはピュア戦略でエクスプロイトしたりすることもあります。","ex":"「複雑なミックスは実戦で再現できないから、まずはピュア戦略で単純化して覚える。」"},{"n":388,"ja":"ファイナルテーブル","lv":2,"en":"Final Table","kana":"ファイナル・テーブル","alias":["FT","決勝卓"],"desc":"大規模なトーナメントにおいて、参加人数が絞られ、最後に残った1テーブル（通常9人から10人）のことを指します。略して「FT（決勝卓）」とも呼ばれます。この舞台に到達することは全プレイヤーの憧れであり、最高額の賞金と名誉をかけた戦いが繰り広げられます。FTでは、1つのミスが数千ドルの賞金差に繋がるため、スタックの優位性や他プレイヤーのプレイスタイル、そして「賞金差（ICM）」を意識した高度な戦略が求められます。ポーカーにおける最も緊張感があり、かつ最もエキサイティングなステージと言えるでしょう。","ex":"憧れのファイナルテーブルに残り、プロと同じ卓で対局した。"},{"n":389,"ja":"ファウル","lv":2,"en":"Foul","kana":"ファウル","alias":["ファウルハンド","死に手","デッドハンド","反則"],"desc":"ルール違反などにより、そのハンドが無効（死に手）と判定され、ポットを獲得する権利を失った手札のことを指します。「ファウルハンド」「デッドハンド」とも呼ばれます。例えば、規定枚数と異なる枚数のカードを持っていた場合、自分のカードをマック（捨て札）に触れさせてしまった場合、不正行為があった場合などに、そのハンドはファウルとなります。一度ファウルと宣告されると、たとえ最強の役を持っていたとしても勝負に加わることはできず、ベットしたチップも戻ってきません。自分のカードの管理を徹底し、不用意な動作でハンドを死なせないことは、ライブポーカーの基本的な注意点です。","ex":"「カードをマックに触れさせてしまい、ファウルでハンドが死んでしまった。」"},{"n":390,"ja":"ファスト","lv":4,"en":"Fast","kana":"ファスト","alias":["速い","ターボ","アグレッシブ"],"desc":"ゲームの進行が非常に速いこと、あるいは戦略的に「速く（アグレッシブに）」プレイすることを指します。ブラインド上昇の速い「ターボ」ストラクチャーや、迷わず攻撃的に打つスタイルに関連して示唆されます。特に強いハンドを持っている時に、相手に考える時間を与えず、チェックやコールを許さずにポットを膨らませる攻撃的な速度を意味することもあります。","ex":"「ファストな展開に付いていくため、自分も積極的にレイズを返していく。」"},{"n":391,"ja":"ファミリーポット","lv":2,"en":"Family Pot","kana":"ファミリー・ポット","alias":["多人数参加"],"desc":"プリフロップにおいて、フォールドするプレイヤーがほとんどおらず、テーブルの全員（または大部分）がコールしてフロップを見ることになった多人数参加のポットです。通常、誰かがオープンレイズをせず、全員がリンプで回した際や、低い額のレイズに全員が付いてきた際に発生します。参加人数が多い分、個々のハンドの勝率（エクイティ）は分散されるため、ワンペア程度の役では勝つことが難しくなり、ストレートやフラッシュ、セットといった強力な「完成役」の価値が極めて高くなります。戦略的な駆け引きよりも、運の要素や「まくり」を期待する展開になりやすい状況です。","ex":"「レイズが入らなかったため、珍しくファミリーポットの展開になった。」"},{"n":392,"ja":"フィックスリミット","lv":3,"en":"Fixed Limit","kana":"フィックス・リミット","alias":["リミットポーカー","制限付き"],"desc":"各ベッティングラウンドにおいて、ベットやレイズができる金額がルールであらかじめ一定額に固定されている形式です。例えば「10/20リミット」では、前半のラウンドは10単位、後半は20単位でのみ賭けが可能です。ノーリミットのようにいきなり全額を賭けることはできず、1ラウンド内のレイズ回数も通常3〜4回に制限（キャップ）されます。一撃でスタックを失うリスクが低いため、数学的なオッズ計算や確率の正しさが長期的な収支に直結する、伝統的で論理的なポーカー形式です。","ex":"「フィックスリミットでは、一回のレイズの重みがノーリミットとは全く異なる。」"},{"n":393,"ja":"フィッシュ","lv":2,"en":"Fish","kana":"フィッシュ","alias":["カモ","弱いプレイヤー"],"desc":"経験が浅く、戦略的な誤ったプレイを繰り返して熟練者に利益を供給してしまう「弱いプレイヤー」を揶揄する言葉です。「シャーク（強者）」の対義語として定義されています。情報の非対称性や確率の無理解からカモにされやすい存在ですが、彼らが楽しくプレイを続けてくれることがポーカーエコシステムの維持には重要であるため、紳士的に接することがマナーとされます。","ex":"「彼は典型的なフィッシュだが、テーブルを盛り上げてくれる貴重な存在だ。」"},{"n":394,"ja":"ブイピーアイピー","lv":2,"en":"VPIP","kana":"ブイ・ピー・アイ・ピー","alias":["参加率","ブラインドはノーカウント"],"desc":"プリフロップにおいて、フォールドやチェックを除き、自らの意志でチップをポットに入れた頻度を示す統計データです。オンラインポーカーのHUDで最も重要視されるスタッツの一つです。この数値が高いプレイヤーは「ルース（手広い）」、低いプレイヤーは「タイト（慎重）」であると一目で判断できます。平均的には20〜25%程度が適正とされ、相手のプレイスタイルを分析する際の最強の武器となります。","ex":"「相手のブイピーアイピー（VPIP）は40%を超えており、相当ルースだとわかる。」"},{"n":395,"ja":"フィフスストリート","lv":3,"en":"Fifth Street","kana":"フィフス・ストリート","alias":["リバー"],"desc":"テキサスホールデムにおいて、5枚目（最後）に開かれるコミュニティカード、またはその最終ベットラウンドを指す別称です。4枚目の「フォースストリート（ターン）」に続く最終段階であり、ここで全ての情報が出揃います。この段階でのアクションは、ポットの勝者を決定づける最後の駆け引きであり、ショーダウン前の最も緊張感が高まる局面です。一般的には「リバー」と呼ばれますが、リミットポーカーやセブンカードスタッドなどの文脈では、5番目のベッティングラウンドを明確に示す言葉として伝統的に使われます。","ex":"「フィフスストリートで相手が大きく打ってきた。ブラフかどうか最後の読み合いだ。」"},{"n":396,"ja":"フェイズ","lv":3,"en":"Phase","kana":"フェイズ","alias":["段階","ストリート"],"desc":"ゲームが進行する中での特定の「段階」のことです。ポーカーでは「プリフロップ」「フロップ」「ターン」「リバー」という4つのフェイズ（ストリート）があり、それぞれで新しいカードが開き、新しいアクションが求められます。また、トーナメントにおいて数日にわたって行われる大会の各日程（Day 1A Day 1Bなど）をフェイズと呼ぶこともあり、その時点での目標設定が変わる節目を指します。","ex":"「ゲームは最終フェイズのリバー。ここで全ての決着がつくことになる。」"},{"n":397,"ja":"フェイスカード","lv":1,"en":"Face Card","kana":"フェイス・カード","alias":["絵札","ピクチャーカード"],"desc":"トランプのJ（ジャック）、Q（クイーン）、K（キング）といった、人物の肖像画が描かれた高ランクのカードのことです。日本語では「絵札」や「ピクチャーカード」と呼ばれます。ポーカーにおいては数字（ランク）が非常に高いため、これらのカードが手札にあれば強力なペアやストレート、フラッシュを作るための重要な戦力となります。ボードにフェイスカードが複数枚並ぶと、お互いに強力な役が完成している可能性が高まり、ポットが劇的に膨らみやすくなる「勝負のカード」としての側面も持っています。","ex":"「ボードにフェイスカードが重なった。相手にトップペアがあることを警戒すべきだ。」"},{"n":398,"ja":"フェイバリット","lv":3,"en":"Favorite","kana":"フェイバリット","alias":["有利","フェバリット"],"desc":"特定のハンド同士の対決において、数学的な勝率（エクイティ）で有利な立場にあるプレイヤーやハンドを指します。対義語は「アンダードッグ」です。例えば、AAはどんなハンドに対してもプリフロップ時点で圧倒的なフェイバリットとなります。ポーカーで勝ち続けるためには、常に自分がフェイバリットである状況を多く作り、そこで最大限のチップを賭けることが正攻法です。","ex":"「フロップ時点で私の勝率は80%。圧倒的なフェイバリットとしてリバーを迎える。」"},{"n":399,"ja":"フォーカード","lv":1,"en":"Four of a Kind","kana":"フォー・カード","alias":["クワッズ","4枚揃い"],"desc":"同じ数字のカードを4枚全て揃える、極めて強力な役です。「クワッズ（Quads）」の方が良く使用されます。出現確率は非常に低いですが、完成すればほぼ確実に勝利が約束される無敵に近いハンドです。特にボードにペアがある状況でポケットペアから発展することが多く、相手のフルハウスなどの強力な役からスタックを根こそぎ奪い取る破壊力を誇ります。","ex":"「フロップでセットを刺し、リバーで奇跡の4枚目が落ちてフォーカードになった。」"},{"n":400,"ja":"フォースストリート","lv":3,"en":"Fourth Street","kana":"フォース・ストリート","alias":["ターン"],"desc":"4枚目のコミュニティカードが開かれる段階、またはその3番目のベッティングラウンドを指す言葉です。一般的には「ターン」と呼ばれます。プリフロップ、フロップに続く4番目のアクションタイミングであり、ゲームが佳境に入る重要な局面です。ポットが大きくなり始める段階であるため、ここでの意思決定はリバーでの展開に決定的な影響を与えます。ドローが完成したり、新たな危険（スケアカード）が生まれたりと、戦況がダイナミックに変化するターニングポイントとしての性質を強く持っています。","ex":"「フォースストリートの1枚が、私のストレートを完成させる運命のカードとなった。」"},{"n":401,"ja":"フォーベット","lv":4,"en":"4-bet","kana":"フォー・ベット","alias":["4ベット","4bet","four bet","4BP"],"desc":"3ベット（リレイズ）に対して、さらに上乗せしてレイズを仕掛ける4番目のベットアクションです。プリフロップにおいては、オールインの一歩手前、あるいはオールインそのものを意味することが多く、AAやKKといった最強クラスのプレミアムハンド、あるいは極めて大胆なブラフであることを示唆する、ポーカーにおいて最もアドレナリンが出る激しい攻防です。","ex":"「彼の3ベットに対し、最強の手を確信して強気のフォーベット（4-bet）を返した。」"},{"n":402,"ja":"フォールド","lv":1,"en":"Fold","kana":"フォールド","alias":["降りる"],"desc":"相手のベットやレイズに対して勝負を諦め、自分の手札を捨ててゲームから降りるアクションです。これまでに自分がポットに入れたチップはすべて失いますが、それ以上の損失を防ぐための重要な防御手段となります。一見消極的な行動に見えますが、勝率の低いハンドを適切に見極めてフォールドを徹底することは、ポーカーの収支をプラスにするために最も重要かつ基本的なスキルです。日本語の「ドロップ」や、やや古い表現の「パス」も基本的には同じ意味で使われます。","ex":"相手のオールインには勝てないと判断し、潔くフォールドした。"},{"n":403,"ja":"フォールドエクイティ","lv":5,"en":"Fold Equity","kana":"フォールド・エクイティ","alias":["降ろし期待値"],"desc":"自分がベットやレイズを行うことで、相手がハンドを「フォールド」し、その結果として得られる「ポットを獲得できる確率」のことです。ハンドが弱くても、相手を降ろせればこれが利益となります。ポーカーの期待値（EV）は、「ショーダウンで勝つ確率」とこの「フォールドエクイティ」の合計で構成されます。セミブラフなどは、将来の逆転の可能性に加えて、このフォールドエクイティを拠り所として収益を上げる高度な戦略です。相手を降ろせる可能性が高い場面ほど、このエクイティは価値を持ちます。","ex":"今の状況はフォールドエクイティが高いので、ブラフを打つ価値がある。"},{"n":404,"ja":"プッシュ","lv":4,"en":"Push","kana":"プッシュ","alias":["押し込み","オールイン"],"desc":"持っている全てのチップをポットに投じる「オールイン」アクションの別称、またはよりアグレッシブな文脈で使われる表現です。特にトーナメントのショートスタック時に、相手にプレッシャーをかけてフォールドを迫る際や、強い手で勝負を決定づける際に「プッシュする」と言います。数学的な根拠に基づいた「プッシュ・オア・フォールド（オールインか降りるか）」の判断は、トーナメントプレイヤーが生き残るために避けて通れない、極めて正確な計算が必要な戦略的アクションの一つです。","ex":"「スタックが10BBを切ったので、ボタンからA9oでプッシュすることにした。」"},{"n":405,"ja":"プッシュオアフォールド","lv":5,"en":"Push or Fold","kana":"プッシュ・オア・フォールド","alias":["プッシュフォールド","シュブオアフォールド","P","F"],"desc":"主にトーナメントでスタックが浅くなった局面で、選べるアクションを実質的に「オールイン（プッシュ）」か「フォールド（降りる）」の二択に絞ってプレイする戦略を指します。スタックが概ね10〜15BB以下になると、レイズしてもポット比で後戻りできず、中途半端なベットは意味をなさなくなるため、コールやスモールレイズを排して押すか降りるかに単純化します。どのハンドでどのポジションからプッシュ／フォールドすべきかは、ICMやチップ量に基づき数学的に最適化されており（プッシュフォールドチャート）、ショートスタックでの正しい立ち回りはトーナメントの生存率を大きく左右する、終盤戦の必須スキルです。","ex":"「10BBを切ったので、もうプッシュオアフォールドのモードに切り替える。」"},{"n":406,"ja":"プライス","lv":3,"en":"Price","kana":"プライス","alias":["価格","コールの値段","オッズ","コール額"],"desc":"あるアクション、特にコールやドローの続行に対して支払うべき「対価・値段」を、得られるリターン（ポット）との兼ね合いで捉えた概念です。「良いプライスが付いている」と言えば、少ない投資で大きなポットを狙える、すなわちポットオッズが有利な状況を意味します。例えば、ドローを完成させる確率に対して、コール額がポットに比べて十分に安ければ「プライスが合っている（コールに値する）」と判断できます。逆に、相手が大きく打ってプライスを悪くすれば、ドロー側は割に合わずに降りざるを得ません。ベットサイズを通じて相手に与える「プライス」を操作することは、戦略の根幹をなす考え方です。","ex":"「フラッシュドローに対して相手が小さく打ってきたので、十分なプライスでコールできる。」"},{"n":407,"ja":"プライズ","lv":3,"en":"Prize","kana":"プライズ","alias":["賞金","賞品"],"desc":"トーナメントにおいて、入賞したプレイヤーに順位に応じて分配される賞金や賞品のことです。参加費（バイイン）から手数料を除いたものがプライズプールとして積み立てられ、上位数％〜十数％のプレイヤーにのみ支払われます。大規模な大会では優勝者に莫大なプライズが贈られ、一攫千金のチャンスがあることがポーカーの大きな魅力です。プライズの分配構造（ペイアウト構造）を把握し、一つでも上の順位を目指して戦うことが、トーナメント戦略の基本となります。","ex":"「プライズ圏内まであと一人。ここを耐え抜けば賞金獲得が確定する。」"},{"n":408,"ja":"ブラインド","lv":1,"en":"Blind","kana":"ブラインド","alias":["強制参加費"],"desc":"カードが配られる前に、特定のポジション（SBとBB）のプレイヤーが支払わなければならない強制的な賭け金です。これがポットの種銭となり、ゲームにアクションを促す役割を果たすとされています。ブラインドを巡る攻防（スチールとディフェンス）はポーカーの最も基本的な戦略的要素であり、自分のスタックを守り抜くための生命線となります。","ex":"「ブラインドレベルが上昇し、スタックに余裕がなくなってきたので攻めに転じる。」"},{"n":409,"ja":"ブラインドレベル","lv":2,"en":"Blind Level","kana":"ブラインド・レベル","alias":["ブラインド段階"],"desc":"トーナメントの進行に応じて、強制参加費（SB/BB）が上昇していく段階のことを指します。一定の時間が経過するごとにレベルが上がり、プレイヤーは自分のスタック（持ちチップ）が相対的に減少していくプレッシャーの中で決断を迫られます。レベルが上がるほど、スチールやオールインといったアグレッシブな立ち回りが必要になり、戦略の重要度が増していきます。現在のレベルと次のレベルへの上昇タイミングを正確に把握しておくことは、トーナメントプレイヤーにとって生き残るための不可欠な管理スキルです。","ex":"「ブラインドレベルが上がり、もはやフォールドして待つ余裕はなくなった。」"},{"n":410,"ja":"フラッシュ","lv":1,"en":"Flush","kana":"フラッシュ","alias":["5枚同じスート"],"desc":"5枚全てのカードのマーク（スート）が同じである役です。ストレートよりも強く、フルハウスよりも弱い位置づけです。手元に同じスートのカードが2枚ある「スーテッドハンド」から狙うのが一般的です。フラッシュ同士の勝負では、構成するカードの中で最も高いランク（ハイカード）を持つプレイヤーが勝利するため、Aを含んだ「ナッツフラッシュ」は非常に強力な武器となります。","ex":"「リバーで待望のスペードが落ち、私のフラッシュが完成した。」"},{"n":411,"ja":"フラッシュドロー","lv":2,"en":"Flush Draw","kana":"フラッシュ・ドロー","alias":["フラドロ"],"desc":"あと1枚同じマーク（スート）が配られれば「フラッシュ」が完成する、未完成の強力なハンド状態を指します。通常、自分の手札2枚とボードの2枚、または手札1枚とボードの3枚で合計4枚の同じマークが揃っている状況です。完成させるためのアウツはデッキに9枚残っており、ターンまたはリバーまでに完成する確率は約35%あります。完成すればそのハンドでの勝利が濃厚となるため、攻撃的にベットして主導権を握る「セミブラフ」の絶好の材料となります。逆に相手に持たれている場合は非常に警戒すべき「ウェットな」状況を生み出します。","ex":"「フロップでフラッシュドローになった。ここは強気にレイズで返そう。」"},{"n":412,"ja":"フラットコール","lv":3,"en":"Flat Call","kana":"フラット・コール","alias":["ジャストコール","スムースコール"],"desc":"本来ならレイズ（またはリレイズ）することが考えられる強いハンドを持っていても、あえて追加のチップを乗せずに「コール」だけに留める戦略的アクションです。自分の手の強さを隠して相手のブラフを誘い込む「トラップ（罠）」としてや、後ろに控えるプレイヤーにリレイズ（スクイズ）の機会を与えないためのリスク管理として行われます。相手に手の内を読ませず、後のストリートで劇的な利益を引き出すための高等な「潜伏」戦術であり、上級者同士の高度な読み合いの中で非常に重要な役割を果たします。","ex":"「最強のハンドを持っていたが、相手を逃さないためにフラットコールを選択した。」"},{"n":413,"ja":"ブラフ","lv":1,"en":"Bluff","kana":"ブラフ","alias":["はったり"],"desc":"自分のハンドが弱いにもかかわらず、強い役を持っているように装ってベットやレイズを行い、相手をフォールドさせてポットを獲得しようとする攻撃的な戦法です。成功すれば本来勝てない勝負でチップを得られますが、見破られてコールされると大きな損失を招く諸刃の剣でもあります。全く価値のない手で行う「ピュアブラフ（エアー）」と、将来の逆転の可能性を残して行う「セミブラフ」に分けられます。相手のプレイスタイルや場の状況を読み、数学的な頻度を考慮しながら適切なタイミングで繰り出すことが求められます。","ex":"相手が弱気なチェックをしたので、ブラフベットで降ろしにいった。"},{"n":414,"ja":"ブラフキャッチ","lv":4,"en":"Bluff Catch","kana":"ブラフ・キャッチ","alias":["ブラフキャッチャー"],"desc":"相手のベットがブラフ（はったり）であると読み、自分もそれほど強くはないが相手のブラフハンドには勝っている手でコールし、ポットを獲得するプレイです。相手のベットサイズやこれまでのアクションの一貫性（ストーリー）の矛盾を突く高度な洞察力が必要になります。成功すれば本来負けているような局面で大きなポットを奪えますが、読みを誤って相手が本物の手（バリュー）を持っていた場合は大きな損失となります。プレイヤーのハンドリーディング能力が最も試されるエキサイティングな局面の一つです。","ex":"「リバーでの不自然な特大ベットに対し、Aハイでブラフキャッチを成功させた。」"},{"n":415,"ja":"ブラフライン","lv":5,"en":"Bluff Line","kana":"ブラフ・ライン","alias":["ブラフストーリー","ブラフの組み立て"],"desc":"実際には強いハンドを持っていないにもかかわらず、一連のベットやレイズの「流れ（ライン）」によって、あたかも強いハンドを持っているかのように相手に思わせるアクションの組み立てを指します。ポーカーにおける「ライン」とは各ストリートで取った行動の連なりであり、説得力のあるブラフラインとは、自分のレンジに実際に存在しうる強いハンドの動きと矛盾しない、一貫したストーリーを描くことを意味します。場当たり的にベットするのではなく、フロップからリバーまでを見据え、相手にとって「降りるのが正しい」と思わせる筋の通ったラインを引けるかどうかが、ブラフ成功の鍵を握ります。","ex":"「彼のブラフラインは一貫していて、こちらは降りざるを得なかった。」"},{"n":416,"ja":"ブラフレイズ","lv":4,"en":"Bluff Raise","kana":"ブラフ・レイズ","alias":["セミブラフレイズ"],"desc":"自分のハンドが現時点で相手に勝っていない、あるいは完成していない状態でありながら、相手を降ろすことを主な目的としてレイズを仕掛けるプレイを指します。単にコールやフォールドするのではなく、より強い圧力をかけて相手の弱いハンドや中途半端なハンドを降ろし、ポットを獲得することを狙います。フラッシュドローやストレートドローなど、降ろせなくてもアウツが残っている状態でのブラフレイズは特に「セミブラフレイズ」と呼ばれ、降ろせる（フォールドエクイティ）か当たって勝てる（ショーダウンバリュー）かの二段構えで期待値を確保できる、非常に強力な攻めの一手となります。","ex":"「フラッシュドローでブラフレイズ。降りてくれなくても捲るアウツがある。」"},{"n":417,"ja":"ブランク","lv":3,"en":"Blank","kana":"ブランク","alias":["ブリック","無意味なカード"],"desc":"新たに開かれたコミュニティカードが、誰のドローも完成させず、戦況や役のパワーバランスにほとんど影響を与えないと思われる状態です。例えば、フロップが「A-K-Q」のスーテッドボードである時に、ターンでスートの異なる「2」が落ちた場合などが該当します。別名「ブリック」とも呼ばれます。ブランクが出たストリートでは、前のストリートで主導権を握っていた側が、引き続きレンジのアドバンテージを維持したまま、有利に攻撃を継続できる展開が多くなります。","ex":"「ターンは完全なブランクだったので、主導権を渡さずにベットを継続した。」"},{"n":418,"ja":"フリーカード","lv":3,"en":"Free Card","kana":"フリー・カード","alias":["無料の1枚"],"desc":"ベッティングラウンドにおいて、全員がチェックを選択したことで、誰も追加のチップを賭けることなく「無料」で次のコミュニティカード（ターンやリバー）を見ることができる状況、またはそのカード自体を指します。特にドローハンドを持っているプレイヤーにとって、リスクを冒さずに役を完成させるチャンスを得られるため、非常に幸運な展開となります。逆に、強いメイドハンドを持っているプレイヤーにとっては、相手に無料で逆転の機会（アウツ）を与えてしまう「失敗」を意味するため、適切なベットを行ってこのフリーカードを与えないように立ち回ることが重要です。","ex":"「全員チェックで回ってきたので、運良くフリーカードを引くことができた。」"},{"n":419,"ja":"フリーカードベット","lv":5,"en":"Free Card","kana":"フリー・カード・ベット","alias":["無料のカード","チェックバック"],"desc":"全員がチェックしてラウンドを終えることで、誰もチップを追加することなく次のコミュニティカード（またはショーダウン）が見られる状況です。「フリーカード」と言われることもあります。ドローハンドを持っている側にとっては、リスクなしで役を完成させるチャンスを得られる非常にありがたい展開であり、逆に強い手を持っている側はこれを阻止するためにベット（プロテクト）を行う必要があります。","ex":"「お互いにチェックで回し、幸運にもフリーカードでリバーを見ることができた。」"},{"n":420,"ja":"フリーショット","lv":3,"en":"Free Shot","kana":"フリー・ショット","alias":["低リスクな挑戦"],"desc":"一般的に、サテライトなどで安価に高額トーナメントの権利を得る機会や、リスクを最小限に抑えつつ大きなポットを狙えるシチュエーションを指します。また、フリーロールのように「負けても失うものがないが、勝てば利益がある」という、プレイヤーにとって極めて有利なボーナス的な局面を指す際にも使われる、ポジティブな意味合いの強い用語です。","ex":"「フリーショットのつもりでサテライトに参加したら、見事に本戦の権利を獲得した。」"},{"n":421,"ja":"フリーロール","lv":1,"en":"Freeroll","kana":"フリー・ロール","alias":["参加費無料","リスクなし"],"desc":"参加費が無料で賞金が出るトーナメント、または勝負中に「自分は負ける可能性がゼロで、勝つか引き分けしかない」極めて有利な状況を指します。例えば、お互いに同じストレートを完成させているが、自分だけがフラッシュドローも持っているような場面です。リスクを一切負わずに一方的に利益（ポットの独占）を狙える、ポーカーにおいて最も精神的に楽で、かつ収益性の高いラッキーな状態です。","ex":"「最強の役を共有しているが、私にはフラッシュの目もある。完璧なフリーロールだ。」"},{"n":422,"ja":"フリップ","lv":2,"en":"Flip","kana":"フリップ","alias":["コインフリップ","五分五分","二分の一"],"desc":"勝率が約50:50（五分五分）の勝負のことで、まるでコインを投げて結果を待つような状態を指します。「コインフリップ」と同義として紹介されています。典型例は、ポケットペア対オーバーカード2枚（例：QQ対AK）のオールイン対決です。トーナメントを勝ち抜くには、どこかでこの「運のフリップ」を制してダブルアップすることが避けて通れない関門となります。","ex":"「スタックが削られたので、AKでフリップ（五分五分）の勝負に出ることにした。」"},{"n":423,"ja":"プリフロップ","lv":1,"en":"Pre-flop","kana":"プリ・フロップ","alias":["フロップ前"],"desc":"プレイヤーに2枚のホールカードが配られ、テーブル中央にコミュニティカードが1枚も開かれていない最初のベッティングラウンドのことです。全ての戦略の出発点であり、自分のハンドの強さ、ポジション、スタック量、そして相手の傾向を考慮して、参加するかフォールドするかを決定します。この段階で正しい判断（スターティングハンドの選択）を下すことが、ポーカーで長期的に勝つための土台となります。ブラインドが強制的に支払われているため、それを巡るレイズや3ベットなどの激しい攻防が行われ、情報の少なさと推測の重要性が最も高いストリートと言えます。","ex":"「プリフロップで大きなレイズが入ったので、リスクを避けて降りた。」"},{"n":424,"ja":"フルハウス","lv":1,"en":"Full House","kana":"フルハウス","alias":["ボート"],"desc":"スリー・オブ・ア・カインド（同じ数字3枚）とワンペアを同時に持っている合計5枚の組み合わせです。フラッシュやストレートよりも強く、実戦で大きなポットが動く際によく見られる非常に強力な役です。テキサスホールデムにおいては、ボードにペア以上の共通カードが出ていない限り成立しません。同じ役同士の勝負では、まず3枚揃っている部分の数字のランクを比較し、それが同じならペア部分の強さで勝敗が決まります。ボートという別名でも親しまれます。","ex":"セットから発展してフルハウスになり、相手のフラッシュを逆転した。"},{"n":425,"ja":"フルリング","lv":2,"en":"Full Ring","kana":"フル・リング","alias":["9人盤","10人盤"],"desc":"通常9人から10人のプレイヤーが着席している、満席状態のテーブルのことです。UTGやアーリーポジションなどの役割を解説する際の基準として「9人〜10人テーブル」と言及されています。少人数の「ショートハンド」に比べ、ブラインドが回ってくるのが遅いため、より慎重にハンドを厳選する「タイト」な戦略が基本とされる、ポーカーの最も伝統的な形式です。","ex":"「フルリングのゲームは展開が落ち着いており、じっくりと相手を観察できる。」"},{"n":426,"ja":"プレイスタイル","lv":2,"en":"Play Style","kana":"プレイ・スタイル","alias":["戦略の傾向"],"desc":"プレイヤーがどのような基準で参加し、チップを賭けるかという「行動の癖や傾向」のことです。タイト、ルース、アグレッシブ、パッシブといった要素の組み合わせで表現されています。相手のスタイルをいち早く見抜き、それに合わせて自分の戦略を調整（アジャスト）することが、ポーカーで継続的に利益を上げるための最も根本的な技術となります。","ex":"「彼のプレイスタイルは極端にタイトだ。彼がレイズしてきたら即座に降りるべきだ。」"},{"n":427,"ja":"プレイライン","lv":4,"en":"Line","kana":"プレイ・ライン","alias":["アクションの流れ"],"desc":"プリフロップからリバーまでの一連のベッティングアクション（チェック、コール、レイズ等）の組み立て方のことです。「ハンドリーディング」において、相手のこの「ライン」に矛盾がないかを確認することが、ブラフを見抜く重要な鍵になります。自分のアクションが一貫した物語（ストーリー）として成立しているかは、ブラフを成功させる上での最も重要な戦略的要素となります。","ex":"「リバーでの特大ベットは、これまでのプレイラインと整合性が取れていない。」"},{"n":428,"ja":"プレミアムハンド","lv":2,"en":"Premium Hand","kana":"プレミアム・ハンド","alias":["モンスターハンド"],"desc":"プリフロップの時点で、他の多くのハンドに対して統計的に高い勝率（エクイティ）を持っている最強クラスの手札のことです。一般的に「AA」「KK」「QQ」「JJ」といった高いランクのポケットペアや、「AKs（スーテッド）」などがこれに含まれます。モンスターハンドと呼ばれることもあります。アンダーザガンのような不利なポジションからでも自信を持って参加できるハンドであり、鉄の規律を持ってこれらのハンドでのみ勝負することが、ポーカーで負けないための基本戦略となります。","ex":"プレミアムハンドのAAが来たので、迷わず3ベットを打った。"},{"n":429,"ja":"フローティング","lv":6,"en":"Floating","kana":"フローティング","alias":["フロート","コールブラフ","浮き"],"desc":"フロップなどで、現時点では弱い手やドローしか持っていないにもかかわらず、相手のベットにあえてコールし、後のストリートでポットを奪いに行くことを狙う高度なブラフ戦術です。すぐに降りずに「浮いて（フロートして）」様子を見るイメージです。多くの場合、ポジションが有利な側が、アグレッサーのCベットに対して用います。次のターンで相手がチェックして弱気を見せたら、そこでベットを打って降ろす、というプランが基本です。相手のCベットが必ずしも強い手とは限らないという読みに基づく攻めであり、相手のタイプやボードの状況を見極める力が問われます。","ex":"「相手のCベットは怪しいと見て、ポジションを活かしてフローティングで様子を見た。」"},{"n":430,"ja":"フロート","lv":6,"en":"Float","kana":"フロート","alias":["フローティング","浮かせコール"],"desc":"フロップなどで相手のベットに対し、その場では役が弱くてもあえてコールだけしておき、次のストリートで相手が弱気になった隙にブラフで奪い取る戦術です。相手の継続ベットが信用できないと読んだ際に、一旦コールで様子を見て後から仕掛けます。ポジションを活かして行う、駆け引きの効いた上級者向けプレイです。","ex":"「相手のCベットが怪しかったので、フロートで一旦コールし、ターンで奪いにいった。」"},{"n":431,"ja":"ブロードウェイ","lv":3,"en":"Broadway","kana":"ブロードウェイ","alias":["最強のストレート"],"desc":"A、K、Q、J、10の5枚で構成される、数字が連続した最強のストレートのことです。役のランクとしては最高位のストレートであり、通常のストレート勝負では負けることはありません。また、これらのAから10までのカードを「ブロードウェイ・カード」と呼び、プリフロップで2枚ともこれらのカードであれば、非常に強力なスターティングハンドと見なされます。華やかな繁華街に例えられる通り、多くのチップを惹きつけるポテンシャルの高いハンドですが、スートが揃うとロイヤルフラッシュへと進化します。","ex":"「ターンでブロードウェイが完成。ナッツなので最大バリューを狙いにいく。」"},{"n":432,"ja":"ブロードウェイハンド","lv":3,"en":"Broadway Hand","kana":"ブロードウェイ・ハンド","alias":["ブロードウェイ","ハイカードハンド"],"desc":"10（テン）からエースまでの、いわゆる「ブロードウェイカード（T・J・Q・K・A）」のみで構成されたスターティングハンドの総称です。AK・AQ・KQ・JTといった、2枚とも10以上の高いカードで構成されるハンドがこれにあたります。これらのハンドは、トップペアになれば高いキッカーを伴って強く、A・K・Q・J・Tの5枚で構成される最強のストレート「ブロードウェイストレート」を狙える点でも価値があります。プリフロップではオープンや3ベットの主力となる強力なレンジですが、特にAKやAQはペアになっていない「ドローイングハンド」である点を忘れず、フロップでミスした際の引き際も意識する必要があります。","ex":"「ブロードウェイハンドが揃ったから、ここは積極的に3ベットで勝負だ。」"},{"n":433,"ja":"ブロードウェイライン","lv":4,"en":"Broadway Line","kana":"ブロードウェイ・ライン","alias":["ハイカードライン"],"desc":"ブロードウェイカード（T〜A）が絡む盤面において、ブロードウェイストレートやトップペア＋強キッカーといった上位のブロードウェイ系ハンドを表現する、一連のベットの流れ（ライン）を指します。例えばK・Q・Jのように高いカードが連なったボードで、自分が強いブロードウェイハンドを持っているかのように見せかけてベットを重ねたり、実際の強さを活かして相手のブロードウェイ系ハンドからバリューを引き出したりするラインがこれにあたります。このようなボードでは双方が高いカードのハンドを持ちやすいため、どちらがより上位のブロードウェイをレンジとして表現できるか、その説得力が勝敗を左右します。ブラフとバリューの両面で機能する、ハイカード系ボード特有のライン構築の考え方です。","ex":"「ブロードウェイなボードで強気に打ち続ける彼のブロードウェイラインに、降りるしかなかった。」"},{"n":434,"ja":"プローブベット","lv":6,"en":"Probe Bet","kana":"プローブ・ベット","alias":["探りベット"],"desc":"前のラウンドでアグレッサー（攻撃者）がベットする機会があったにも関わらずチェックで回してきた際、その相手のハンドの強さを探る（probe）ために行うベットです。相手が本当に強い手を持っているのか、それともミスヒットしているのかを確認する情報の収集を目的とします。比較的小さなサイズで打たれることが多く、相手がフォールドすればポットを獲得でき、コールされれば相手に一定の強さがあることを把握できます。状況を有利に進めるための戦術的な偵察手段として、ポストフロップで頻繁に用いられます。","ex":"「ターンで相手がチェックしたのを見て、プローブベットを打って反応を伺った。」"},{"n":435,"ja":"ブロッカー","lv":5,"en":"Blocker","kana":"ブロッカー","alias":["阻止カード","ブロック"],"desc":"自分が持っているカードが原因で、相手が特定の強力な役（ナッツなど）を持っている可能性を数学的に低く、あるいはゼロにしている状態、またはそのカード自体を指します。例えば、ボードにフラッシュの可能性がある際、自分がそのスートの「A」を1枚持っていれば、相手が最強の「Aハイフラッシュ」を持っていることはあり得ないため、自分は強気に振る舞えます。相手のハンドレンジを絞り込み、効果的なブラフを仕掛けたり、相手の大きなベットをコール（ブラフキャッチ）したりする際の重要な論理的根拠となります。","ex":"「自分がQのブロッカーを持っているので、相手にフルハウスはないと判断した。」"},{"n":436,"ja":"ブロック","lv":4,"en":"Block","kana":"ブロック","alias":["阻止","被り"],"desc":"自分が持っているカードが、相手が特定の役（特にストレートやフラッシュ、セット）を完成させるために必要なカードと重なっている（被っている）状態を指します。例えば、ボードにストレートの可能性がある際、自分がそのキーとなる数字を1枚持っていれば、相手がそのストレートを完成させるために使えるカードの残枚数が減るため、相手がその役を持っている数学的な確率を低下（ブロック）させることができます。この情報は、相手の強力なベットをコールすべきか、あるいは自分がブラフを仕掛けるべきかを判断する際の極めて重要な論理的根拠となります。","ex":"「自分がJを1枚ブロックしているので、相手がナッツを持っている確率は低い。」"},{"n":437,"ja":"ブロックベット","lv":5,"en":"Block Bet","kana":"ブロック・ベット","alias":["阻止ベット"],"desc":"相手から大きなベットをされるのを未然に防ぐ（ブロックする）ために、自分から先手を打って比較的小さな額（ポットの20〜30%程度）をベットする戦術です。特にアウトオブポジション（先に動く位置）で、自分の手が「ショーダウンすれば勝てそうだが、相手の大きなレイズには耐えられない」という微妙な強さの時に使われます。安い金額で相手をコールに留めさせ、比較的安全にショーダウンまで辿り着くことが目的です。相手の出方を探る意味でも有効ですが、経験豊富なプレイヤーには意図を見透かされ、大きなレイズを返される隙になることもあります。","ex":"OOPで不利なので、リバーでブロックベットを打って相手の出方を伺った。"},{"n":438,"ja":"フロップ","lv":1,"en":"Flop","kana":"フロップ","alias":["第2ラウンド"],"desc":"プリフロップの後に、テーブル中央に最初に表向きで開かれる3枚のコミュニティカード、またはそのラウンド全体を指します。これにより各プレイヤーは全7枚中5枚のカードが判明することになり、役が完成する確率は格段に高まります。テキサスホールデムにおいて、フロップは戦略の方向性が決まる極めて重要なターニングポイントです。ここで自分のハンドがボードとどのように絡んだか（ヒットしたか、ドローになったか）を確認し、それまでのアグレッサーが継続してベットする「CB（コンティニュエーションベット）」を打つかどうかの激しい駆け引きが始まります。情報の露出が多いため、より正確な状況判断が求められます。","ex":"フロップで自分のハンドが全く絡まなかったので、チェックで様子を見た。"},{"n":439,"ja":"フロップドロー","lv":3,"en":"Flop Draw","kana":"フロップ・ドロー","alias":["フロップ時点での未完成役"],"desc":"フロップが開いた3枚の時点で、あと1枚または2枚で役が完成する「ドロー（待ち）」の状態にあることです。フロップ時点でフラッシュドローやストレートドローになっている確率が高い状態です。この段階で役の将来性（アウツ）を見極め、適切なオッズで勝負を継続するかどうかの判断が、ポーカーにおける収支の分岐点となります。","ex":"「フロップドローの状況。アウツは9枚あるので、ポットオッズ的にはコールできる。」"},{"n":440,"ja":"プロテクト","lv":3,"en":"Protect","kana":"プロテクト","alias":["ハンドを守る"],"desc":"相手が次のカードでストレートやフラッシュなどのドローを完成させて逆転するのを防ぐために、あらかじめベットやレイズを行ってハンドを守る（保護する）行為です。相手に「逆転を狙うならそれなりの代償（チップ）を支払わせる」という数学的な圧力をかけることが目的です。特にウェットなボード（数字が繋がっているなど）で、現時点の自分のメイドハンドが捲られないように主導権を握る際に重要となります。適切にプロテクトを行わないと、相手に無料でカードを引かせてしまい、バッドビートを招くリスクが高まります。","ex":"「フラッシュドローが濃厚なボードだったので、大きく打ってハンドをプロテクトした。」"},{"n":441,"ja":"プロテクトハンド","lv":3,"en":"Protect","kana":"プロテクト・ハンド","alias":["ハンドの保護"],"desc":"自分の強いハンドを、相手の逆転ドロー（捲り）から守るためにベットやレイズを行うことです。略して「プロテクト」と言われることもあります。相手に「無料で次のカードを見せない」ために高いプライスを提示し、ドローを追うことへの代償（数学的な損）を強いることが目的です。役が完成していても、守るべき時に守らなければ、リバーでの不運な逆転負けを招くことになります。","ex":"「フラッシュドローがあるボードなので、プロテクトハンドとして大きくベットした。」"},{"n":442,"ja":"分散（ぶんさん）","lv":4,"en":"Variance","kana":"ブンサン","alias":["バリアンス","揺らぎ"],"desc":"短期的な結果が、本来の期待値（EV）からどれだけ大きく外れて上下するかという「数学的な揺らぎ」のことを指します。ポーカーにおいて、どんなに正しいプレイをしていても負けが続くこと（下振れ）や、逆に出来過ぎの結果が出ること（上振れ）があるのは、この分散が存在するためです。分散は運の要素を象徴する言葉ですが、十分な回数をこなすことで（収束）、最終的な結果は実力通りの期待値へと近づいていきます。プロプレイヤーは、この分散をあらかじめ考慮し、一時的な不運で破産しないよう余裕を持った「バンクロール管理」を徹底します。","ex":"「一晩でスタックの半分を失ったが、これは単なる分散の範囲内だと自分に言い聞かせた。」"},{"n":443,"ja":"ペア","lv":1,"en":"Pair","kana":"ペア","alias":["ワンペア"],"desc":"同じ数字（ランク）のカードが2枚揃っているポーカーの最も基本的な役です。テキサスホールデムでは、手札自体がペアである「ポケットペア」と、手札の1枚がボードの1枚と重なる「ヒット」により形成されます。全ハンドの約44%という高い確率で誰かが完成させる役であり、ゲーム進行の主役となります。同じペア同士の勝負では、ペアの数字のランクが高い方が勝利し、それも同じなら残りの3枚のカード（キッカー）の強さで勝敗を決します。役としては低い部類ですが、キッカーの強弱が決定的な差を生むため、扱いには高度なスキルが求められます。","ex":"「フロップで待望のペアがヒット。ここから慎重に利益を最大化させたい。」"},{"n":444,"ja":"ペイオフ","lv":3,"en":"Pay off","kana":"ペイ・オフ","alias":["支払い","期待値コール"],"desc":"相手が勝っている可能性が高いと自覚しつつも、ポットオッズがあまりに良いため、数学的にコールせざるを得ない状況、あるいはそのコールのことです。一般的に「負けているかもしれないが、このオッズなら支払う（ペイオフする）価値がある」といった文脈で使われます。相手のバリューベットに対して、渋々ながらもチップを支払う際の心理的なニュアンスも含まれる、中上級者の実戦的な用語です。","ex":"「相手のフラッシュは濃厚だが、このポットオッズならペイオフするしかない。」"},{"n":445,"ja":"ヘッズアップ","lv":2,"en":"Heads-up","kana":"ヘッズ・アップ","alias":["HU","サシ勝負","1対1"],"desc":"プレイヤーが1対1（サシ）で対戦している状態、またはその形式のゲームそのものを指します。トーナメントの最後の一人を決める優勝決定戦や、多人数テーブルで他の全員がフォールドして二人だけが残った局面がこれに当たります。ポジションが毎ハンド入れ替わり、参加するハンドレンジが劇的に広くなるため、ポーカーの中で最も攻撃的で純粋な心理戦が展開される局面です。相手の癖を見抜き、戦略を瞬時にアジャストさせる能力が、ポットを一人占めするための鍵となります。","ex":"「長い戦いの末、ついにヘッズアップまで辿り着いた。最後の心理戦の始まりだ。」"},{"n":446,"ja":"ベッティングツリー","lv":7,"en":"Betting Tree","kana":"ベッティング・ツリー","alias":["ベットツリー","意思決定の木"],"desc":"ポーカーのある局面から、各プレイヤーが取りうるすべてのアクション（ベット・チェック・コール・レイズ・フォールド）と、それに続く展開を、木が枝分かれしていくように体系的に図式化したものです。GTOソルバーなどの解析ツールでは、このベッティングツリーをあらかじめ設定し（どのサイズのベットを許可するかなどを決め）、その枝の中での最適な戦略を計算します。また、プレイヤーが自分の意思決定を整理し、「この場面でベットしたら相手はどう反応し、その後どう展開していくのか」を先読みするための思考の枠組みとしても役立ちます。複雑に絡み合う局面を構造的に捉えるための、現代ポーカー理論の基礎をなす概念です。","ex":"「ソルバーのベッティングツリーを確認すれば、この場面の最適なベットサイズが分かる。」"},{"n":447,"ja":"ベッティングラウンド","lv":3,"en":"Betting Round","kana":"ベッティング・ラウンド","alias":["ストリート"],"desc":"プレイヤーがベット、チェック、レイズ、フォールドなどのアクションを行う一連の区切りのことです。テキサスホールデムでは、プリフロップ、フロップ、ターン、リバーの計4回のベッティングラウンドが存在します。それぞれのラウンドで新しいコミュニティカードが開かれる（または手札が配られる）たびに、新たな情報に基づいた賭けの応酬が行われ、全員のベット額が一致するか、一人を除いて全員がフォールドした時点でそのラウンドは終了します。ゲームの構造を理解するための最も基本的な単位です。","ex":"「このベッティングラウンドで、相手のハンドを正確に絞り込む必要がある。」"},{"n":448,"ja":"ベット","lv":1,"en":"Bet","kana":"ベット","alias":["賭け","第一投"],"desc":"そのベッティングラウンドにおいて、まだ誰もチップを賭けていない状態の時に、最初にチップをポットへ投じるアクションのことです。自分のハンドの強さを主張し、相手にコール（同額支払う）か、レイズ（吊り上げる）か、フォールド（降りる）かの選択を迫る、ポーカーの最も基本的かつ能動的な攻撃手段です。適切なサイズでベットすることは、バリューの獲得やブラフの成功に直結するため、状況に応じた「ベット額のコントロール」は、全てのプレイヤーが磨くべき最重要技術です。","ex":"「フロップで強い役が完成したので、主導権を握るために適切な額をベットした。」"},{"n":449,"ja":"ベットチップ","lv":2,"en":"Betting Chips","kana":"ベット・チップ","alias":["賭けチップ"],"desc":"ポーカーゲームで使用される、現金（キャッシュゲーム）やポイント（トーナメント）の代わりとなる円盤状の札のことです。プレイヤーはこれをポットに投入することでアクションを行います。スタックの深さやベットサイズを表現する際の最小単位であり、これを取り合うことがポーカーの直接的な目的となります。視認性の高いデノミネーション（単位）の管理は、スムーズなゲーム進行に不可欠です。","ex":"「ベットチップを中央へ押し出し、相手に大きなプレッシャーをかける。」"},{"n":450,"ja":"ベットラウンド","lv":1,"en":"Betting Round","kana":"ベット・ラウンド","alias":["ラウンド","ストリート"],"desc":"プレイヤーがベット、チェック、レイズ、フォールドなどのアクションを行う一連の区切りのことです。テキサスホールデムでは「プリフロップ」「フロップ」「ターン」「リバー」の合計4回のベットラウンドが存在します。各ラウンドで新しい情報（コミュニティカード）が追加されるたびに、プレイヤーはハンドの価値を再評価し、次のアクションを決定する必要があります。","ex":"「第3のベットラウンドであるターンで、一気にポットが膨れ上がった。」"},{"n":451,"ja":"ベリー","lv":4,"en":"Belly","kana":"ベリー","alias":["ベリーバスター","ガットショット"],"desc":"ストレートドローのうち、連続する数字の「間」の1枚を待つ状態である「ガットショット」の別称です。「ベリーバスター」として、間の1枚が出れば完成する状況のことを言います。通常のオープンエンド（両面待ち）に比べて完成確率が低い（アウツ4枚）ため、隠れた役として相手を欺く力は強いですが、追う際のリスクも高いドローの形態です。","ex":"「ベリー（ベリーバスター）がリバーで刺さり、相手のトップペアを逆転した。」"},{"n":452,"ja":"ホイール","lv":3,"en":"Wheel","kana":"ホイール","alias":["A to 5","車輪"],"desc":"A 2 3 4 5の5枚で構成される、ポーカーにおける最も低い（弱い）ランクのストレートのことです。この状況においてのみ、A（エース）は最強の14ではなく、最低の「1」として機能します。数字が循環して繋がる車輪のような形状をイメージしてこう呼ばれます。ハイローゲームにおいては最強のローハンド（ナッツロー）として極めて重要な価値を持ちますが、ハイのみのゲームでは他の全てのストレートに負けてしまうため、注意が必要です。完成した際のインパクトは大きいものの、役の序列を正しく把握しておくべき特殊なストレートです。","ex":"「5ハイストレート、通称ホイールが完成した。相手のペアには楽勝だ。」"},{"n":453,"ja":"ポーカーチェイス","lv":1,"en":"Poker Chase","kana":"ポーカー・チェイス","alias":["ポカチェ"],"desc":"株式会社C-betが2021年8月にリリースした、日本の基本無料オンラインポーカー（テキサスホールデム）アプリです。「バトルロワイヤル系ポーカー」を掲げ、6人卓のシット＆ゴー（順位を競う短期トーナメント）を中心とした、横画面・エンタメ性重視の設計が特徴です。獲得点数ではなく1位〜6位の順位でランクポイントが増減する仕組みで、麻雀の「ラス回避」に近い立ち回りが求められます。ゲーム内広告はなく、キャラクターのガチャや衣装スキンの課金で収益化しており、キャラの好感度を上げる育成要素も人気です。PCブラウザ版にも対応。累計250万ダウンロードを超え（2025年発表）、エムホールデムと並ぶ国産二大ポーカーアプリの一つとされます。","ex":"「ポーカーチェイスは順位制だから、無理なオールインを避けて手堅く上位を狙うのが基本だ。」"},{"n":454,"ja":"ポーカーフェイス","lv":1,"en":"Poker Face","kana":"ポーカー・フェイス","alias":["無表情","鉄面皮"],"desc":"手札の良し悪しや感情を一切顔に出さず、一定の表情を保つ技術のことです。自分の無意識な仕草や表情の変化が「テル（癖）」となって相手に情報を漏らすのを防ぐための、ライブポーカーにおける基本的な防御策です。ただし、単に無表情でいるだけでなく、常に同じ呼吸や動作を維持する（一貫性を持たせる）ことが、上級者にとっての本当の意味でのポーカーフェイスとされます。心理戦の根幹をなす要素であり、相手に何も読み取らせない静寂こそが最大の武器となります。","ex":"「ポーカーフェイスを貫き、ブラフを仕掛けている時の緊張を相手に悟らせなかった。」"},{"n":455,"ja":"ボード","lv":1,"en":"Board","kana":"ボード","alias":["コミュニティカード全体","共有札"],"desc":"テーブルの中央に表向きに置かれ、プレイヤー全員が自分の手札と組み合わせて使用できる5枚の共有カード（コミュニティカード）全体を指します。テキサスホールデムではフロップ（3枚）、ターン（1枚）、リバー（1枚）の順で公開されます。ボードがどのように絡み合っているか（ウェットかドライか、ペアがあるか等）を分析することは、相手がどのような役を完成させているかを推測する上で最も重要なステップです。ボード自体がペアになる「ペアボード」などは、戦略が劇的に変化する警戒すべき状況となります。","ex":"「ボードが非常にウェットな状態なので、セットを持っていても楽観はできない。」"},{"n":456,"ja":"ボードでプレイ","lv":2,"en":"Play the Board","kana":"ボードでプレイ","alias":["プレイザボード","場で勝負","ボード役","ボード役共有"],"desc":"自分のホールカード2枚を一切使わず、場に開かれた5枚のコミュニティカード（ボード）だけで構成される役が、自分の最強の手になっている状態を指します。例えばボードにストレートやフラッシュが完成しており、自分の手札がそれを上回れない場合、「ボードでプレイする」ことになります。この場合、自分の役は全員と共通であるため、他の誰も手札で役を上回れなければ、ショーダウンに残った全員でポットを分け合う（スプリット）ことになります。自分の手札が役に貢献していない＝勝ち目が薄いことを意味するため、相手がボードを上回る手を持っていそうな場面では、ベットせず安く見せ合うのが基本です。","ex":"「手札が全く絡まず、結局ボードでプレイしてポットを全員でスプリットした。」"},{"n":457,"ja":"ホールカード","lv":1,"en":"Hole Card","kana":"ホール・カード","alias":["ハンド","自分のカード"],"desc":"ゲーム開始時に各プレイヤーに伏せられた状態で配られる、自分だけが見ることができる手札のことです。テキサスホールデムでは2枚配られ、これをスターティングハンドとも呼びます。このカードと、全員で共有するコミュニティカード（ボード）を組み合わせて役を作ります。プレイヤーが行う全ての意思決定の出発点となる最も重要な情報です。相手には見えない情報であるため、いかに自分のホールカードを悟られずに主導権を握るかが戦略の核心となります。","ex":"配られたホールカードを確認し、ポジションとの兼ね合いで戦略を練った。"},{"n":458,"ja":"ポケットエイト","lv":1,"en":"Pocket Eights","kana":"ポケット・エイト","alias":["8ポケ","88","スノーメン","ハチポケ","はちぽけ"],"desc":"ホールカードが両方とも8のハンドで、ミドルからロウポケットペアへの移行点に位置するハンドです。プリフロップでは多くのポジションでオープンレイズできる強さを持ちますが、オーバーカードが6種類に増えるため、フロップでオーバーカードが落ちる確率が非常に高く、ペアのまま勝ち切るのは難しくなります。したがって、このハンドの主な収益源はセット（スリーカード）の完成にあり、深いスタックの相手に対してはセットマイニングを狙ったコールが有効です。プリフロップの強さを過信せず、フロップ以降は相手のアクションとボードの状況を冷静に読む規律が、勝敗を分ける鍵となります。","ex":"「ポケットエイト、オーバーカードだらけのフロップ。ここは無理せず撤退だ。」"},{"n":459,"ja":"ポケットエース","lv":1,"en":"Pocket Aces","kana":"ポケット・エース","alias":["AA","ポケットロケット","アメリカンエアライン","エーシーズ","とんがりコーン","えーしーず"],"desc":"配られた2枚のホールカードが両方ともエース（A）であるハンドで、プリフロップにおける最強のスターティングハンドです。あらゆるハンドに対して優位（フェイバリット）に立っており、ヘッズアップではおよそ8割以上の勝率を誇ります。基本的にはオープンレイズや3ベット、4ベットでアグレッシブにバリューを取りに行くべきハンドですが、強すぎるがゆえに多人数で見られると相対的な勝率が下がり、フロップ以降のオーバーペアとしてのプレイで失点しやすい点に注意が必要です。「絶対に負けないハンド」ではなく、いかに大きく勝ち、危険な場面でいかに傷を浅く抑えるかが腕の見せ所となる、奥深い一手です。","ex":"「ポケットエースでオールインしたのに、まさかのセットに捲られてしまった。」"},{"n":460,"ja":"ポケットキング","lv":1,"en":"Pocket Kings","kana":"ポケット・キング","alias":["KK","カウボーイズ","キングス","きんぐす"],"desc":"ホールカードが両方ともキング（K）のハンドで、ポケットエースに次ぐ二番目に強いスターティングハンドです。プリフロップではほぼ全ての状況でアグレッシブにレイズ・リレイズして良い強力なハンドですが、唯一の天敵であるエースがボードに落ちた瞬間に評価が一変するという宿命を背負っています。相手が4ベットやオールインを返してきた際、その相手のレンジがポケットエースだけに絞られているなら降りる判断もありますが、現実にはAKやQQ、ブラフも含まれるため、安易に降りるのは大きな機会損失です。エースを過度に恐れず、しかしフロップのエースには冷静に対応する規律の両立が求められます。","ex":"「ポケットキングで4ベットしたら、相手が長考の末にオールイン。エースが怖い。」"},{"n":461,"ja":"ポケットクィーン","lv":1,"en":"Pocket Queens","kana":"ポケット・クィーン","alias":["QQ","レディース","ヒルトンシスターズ","クィーンズ"],"desc":"ホールカードが両方ともクイーン（Q）のハンドで、AA・KKに次ぐ三番目に強いプリフロップハンドです。それ自体は非常に強力ですが、エースとキングという2種類のオーバーカードが存在するため、KKと比べてフロップでオーバーカードが落ちる確率が高く、扱いの難しいハンドとして知られます。プリフロップでは積極的にレイズや3ベットを行うべきですが、相手からの4ベットに直面した際、コールするか・5ベットでコミットするか・降りるかの判断は、相手のレンジやスタックによって大きく変わります。「QQをどうプレイするか」はプレイヤーの実力を測る試金石とも言われる、判断の難しい一手です。","ex":"「ポケットクィーンで4ベットを受けた。コールか、それともここで勝負か。」"},{"n":463,"ja":"ポケットジャック","lv":1,"en":"Pocket Jacks","kana":"ポケット・ジャック","alias":["JJ","フックス","ジャックス","じゃっくす"],"desc":"ホールカードが両方ともジャック（J）のハンドで、強力なポケットペアでありながら「世界一プレイの難しいハンド」と揶揄されることもある悩ましい一手です。A・K・Qという3種類のオーバーカードが存在するため、フロップでこれらが落ちる確率が高く、プリフロップで強気に勝負したくても、ポストフロップで主導権を握りにくい局面が頻発します。プリフロップではオープンや3ベットの十分な価値を持つハンドですが、相手の4ベットに対しては、無闇にコミットせず相手のタイプを見極めることが肝心です。本来は期待値の高いハンドなので、難しさを理由に過度に弱気になるのもまた禁物だという、バランス感覚が問われます。","ex":"「ポケットジャック、フロップにキングが落ちた。打つべきか引くべきか。」"},{"n":465,"ja":"ポケットセブン","lv":1,"en":"Pocket Sevens","kana":"ポケット・セブン","alias":["7ポケ","77","ナナポケ","ななぽけ"],"desc":"ホールカードが両方とも7のハンドで、ミドルポケットペアの下限付近に位置するハンドです。プリフロップではポジションが良ければオープンレイズの価値がありますが、オーバーカードが7種類と多く、フロップでペアより高いカードが落ちることがほとんどであるため、ワンペアのまま大きく勝負するのは危険です。このクラスのポケットペアは、セット（スリーカード）を引いた時の爆発力に価値の多くを依存しており、スタックが深く、当たった時に大きく払ってくれそうな相手に対してコールするセットマイニングが基本戦略となります。引き際の判断と、当たった時の最大化の両立が、収益の差を生みます。","ex":"「ポケットセブンでコール、セットを狙う。当たれば相手のスタックを頂く。」"},{"n":467,"ja":"ポケットテン","lv":1,"en":"Pocket Tens","kana":"ポケット・テン","alias":["10ポケ","TT","ダイムス","テンズ","てんず"],"desc":"ホールカードが両方とも10（T）のハンドで、ハイポケットペアとミドルポケットペアの境界に位置する、価値の高いスターティングハンドです。プリフロップでは十分にオープンや3ベットを行える強さを持ちますが、A・K・Q・Jという4種類ものオーバーカードが存在するため、フロップでオーバーカードが落ちやすく、その後のプレイでは慎重な状況判断が求められます。セット（スリーカード）を狙ってコールするセットマイニングの価値も高く、相手のレンジやスタックの深さによって、アグレッシブに攻めるか・安くフロップを見るかを使い分ける柔軟さが、長期的な収益に直結するハンドです。","ex":"「ポケットテンでコール。セットになればスタックを取れる相手だ。」"},{"n":468,"ja":"ポケットナイン","lv":1,"en":"Pocket Nines","kana":"ポケット・ナイン","alias":["9ポケ","99","キュウポケ","きゅうぽけ"],"desc":"ホールカードが両方とも9のハンドで、ミドルポケットペアの代表格です。プリフロップではオープンレイズや、状況によっては3ベットも可能な十分な強さを持ちますが、オーバーカードが5種類存在するため、フロップで自分のペアより高いカードが落ちる確率がかなり高くなります。そのため、強気に攻める価値と、セットを狙って安くフロップを見る（セットマイニング）価値の両面を併せ持つハンドです。相手のオープンに対してコールで応じ、9がもう1枚落ちる「セット」を引ければ大きくスタックを得るチャンスとなる一方、オーバーカードが並んだボードでは引き際の見極めも同じくらい重要になります。","ex":"「ポケットナインでフロップを見たら、見事に9が落ちてセット完成だ。」"},{"n":471,"ja":"ポケットペア","lv":1,"en":"Pocket Pair","kana":"ポケット・ペア","alias":["ポケット"],"desc":"最初に配られた2枚の手札（ホールカード）が、同じランクの数字で揃っている状態のことです。略して「ポケット」とも呼ばれます。プリフロップの時点で既にワンペアが完成しているため非常に有利な状況であり、特に「AA」や「KK」は最強のハンドとされます。フロップで3枚目が落ちて「セット」になる確率は約12%（約8回に1回）であり、完成した際には相手に悟られにくく、大きなポットを獲得できる強力な武器になります。","ex":"8のポケットペアが入ったので、フロップでセットになるのを期待した。"},{"n":472,"ja":"ポケットエース","lv":1,"en":"Pocket Aces","kana":"ポケット・エース","alias":["AA","ポケット","ロケット","エーシーズ","とんがりコーン"],"desc":"2枚のホールカードが両方ともエース（A）であるハンド、すなわちポケットエース（AA）を指す俗語です。英語の「ポケットロケット（Pocket Rockets）」に由来し、最強ハンドの爆発力をロケットになぞらえた呼び名です。プリフロップで最も強いスターティングハンドであり、アグレッシブにバリューを取りに行くべき一手ですが、強さゆえに過信は禁物で、多人数で見られたり、危険なボードで深追いしたりすると思わぬ敗北を喫することもあります。「ロケッツが入った」という言葉には、最高のハンドを引いた高揚感と、いかに大きく勝つかという期待が込められています。","ex":"「ボタンでロケッツ、最高の場面だ。ここはしっかりバリューを取りに行こう。」"},{"n":473,"ja":"ポジション","lv":1,"en":"Position","kana":"ポジション","alias":["座席位置"],"desc":"テーブルにおける自分の座る位置のことで、ディーラーボタン（BTN）からの距離によってアクションの順番が決まります。ポーカーにおいて最も重要な戦略的要素の一つであり、後にアクションできる「レイトポジション」は相手の情報を得た上で判断できるため、圧倒的に有利とされます。逆に先に動く「アーリーポジション」は情報不足の中での決断を強いられるため、非常に不利な立場となります。","ex":"「ポーカーはカードをプレイする前に、まず自分のポジションをプレイせよと言われる。」"},{"n":474,"ja":"ポスト","lv":2,"en":"Post","kana":"ポスト","alias":["ブラインドを出す"],"desc":"強制参加費（ブラインド）やアンティなどのチップをテーブルに出す行為そのものを指します。特にキャッシュゲームにおいて、ブラインドポジションではないタイミングで途中参加したプレイヤーが、次のBBまで待たずに即座に参加したい場合、BBと同額のチップを出すことを「ブラインドをポストする」と言います。また、離席していたプレイヤーが復帰した際にも必要になることがあります。チップを自分の前に置くという物理的な動作を指すこともありますが、戦略用語としては「参加権を得るための支払い」という意味合いが強く、ゲームの進行をスムーズにするための基本ルールの一部です。","ex":"「新しく席に着いたので、1BBをポストしてすぐにゲームに参加した。」"},{"n":475,"ja":"ポストフロップ","lv":2,"en":"Post-flop","kana":"ポスト・フロップ","alias":["フロップ以降"],"desc":"フロップ、ターン、リバーといった、コミュニティカードが開かれた後に行われる全てのベッティングラウンドを総称した言葉です。プリフロップでの「推測」中心の戦いから、共通の情報を基にした「分析と駆け引き」の戦いへと移行します。ボードとの絡みによってハンドの価値が劇的に変化するため、Cベットやチェックレイズといった高度な戦術が駆使されます。情報の露出が増える分、相手のハンドレンジを絞り込む技術や、期待値（EV）の計算、心理的なテル（癖）の読み合いが勝敗を分ける決定的な要因となります。プレイヤーの実力が最も顕著に反映されるフェーズです。","ex":"「プリフロップは互角だったが、ポストフロップでの技術差で勝利した。」"},{"n":476,"ja":"ボタン","lv":1,"en":"Button","kana":"ボタン","alias":["BTN"],"desc":"ディーラーボタンが置かれた位置で、ポーカーにおいて「王座」とも称される最も収益性の高い最強のポジションです。プリフロップを除き、全てのラウンドにおいて常に最後にアクションを行える特権を持ちます。全員の動きを観察してから、ポットの大きさをコントロールしたり、ブラフを仕掛けて主導権を握ったりと、変幻自在な戦術を展開できます。情報の面で常に優位に立てるため、他のポジションよりも遥かに幅広いハンドで参加して利益を上げることが可能です。プロプレイヤーはこのボタンポジションでのプレイを最大化し、不利なポジションでの損失をここで補うことで、長期的な勝利を確立します。","ex":"ボタンという有利なポジションを活かして、積極的に場を支配していこう。"},{"n":477,"ja":"ボタンストラドル","lv":4,"en":"Button Straddle","kana":"ボタン・ストラドル","alias":["BTNストラドル"],"desc":"ミシシッピストラドルの代表的な形で、ディーラーボタンのプレイヤーが任意で置くストラドル（追加ブラインド）を指します。通常、ストラドルはUTGから置かれますが、ボタンストラドルでは最も有利なポジションであるボタンが、ブラインドの2倍額などを先んじて賭けます。これにより、プリフロップでボタンが最後に行動する権利を持ちつつポットを膨らませられるため、ポジションの優位を最大限に活かせる強力な仕掛けです。ただし、ブラインドのアクション順などが通常と変わり、ゲームへの影響が大きいため、採用するかどうかはハウスルールによって定められています。アクションを増やしたい卓で好まれます。","ex":"「ボタンストラドルを置けば、ポジション有利のままポットを大きくできる。」"},{"n":478,"ja":"ポット","lv":1,"en":"Pot","kana":"ポット","alias":["チップ総額"],"desc":"各プレイヤーがベットしたチップが集められ、そのハンドの勝者が獲得する賞金総額のことです。テーブルの中央に置かれます。参加者全員が争う権利を持つ「メインポット」のほか、オールインが発生した際にチップ量に差があるプレイヤー間で作られる「サイドポット」に分かれることがあります。自分の投資額（コール額）に対してどれだけの報酬が見込めるかを考える「ポットオッズ」の計算において、常に正確に把握しておくべき基準値です。","ex":"ポットが大きくなってきたいので、無理なブラフは控えることにした。"},{"n":479,"ja":"ポット・コミット","lv":4,"en":"Pot Committed","kana":"ポット・コミット","alias":["コミット"],"desc":"ポットにすでに多額のチップを投入してしまったため、数学的な期待値（ポットオッズ）の計算上、もはやどのようなカードが来てもフォールドすることが「損」になり、コールやオールインを選択せざるを得ない状態のことです。スタックに対するポットの比率が大きくなった時に発生し、これを「ポットにコミットしている」と表現します。この状態を意識することは重要で、中途半端なベットで自らコミットを招き、不利な状況で降りられなくなる事態を避けるための「スタックプラン」を立てる上で欠かせない概念です。","ex":"すでにスタックの半分をポットに入れたので、完全にポット・コミットしている。"},{"n":480,"ja":"ポットオッズ","lv":4,"en":"Pot Odds","kana":"ポット・オッズ","alias":["ポイントオッズ","オッズ"],"desc":"ポットに溜まっているチップ総額と、自分がコールするために必要な金額の比率のことです。自分が勝負に乗るための「コスト」と「リターン」を天秤にかけ、ハンドが勝つ確率（エクイティ）がこのオッズを上回っていれば、数学的にコールが正当化されます。感情を排して正しい判断を下すための、ポーカーにおける最も基本的かつ重要な数学的ツールです。","ex":"「現在のポットオッズは4倍。20%以上の勝率があれば理論上コールが正解だ。」"},{"n":481,"ja":"ポットコントロール","lv":4,"en":"Pot Control","kana":"ポット・コントロール","alias":["ポット管理"],"desc":"自分のハンドの強さに合わせて、ポットのサイズが大きくなりすぎないように調整することです。例えば、中程度の強さのハンド（マージナルハンド）を持っている際、チェックやコールを多用して相手の大きなレイズを避け、安い金額でショーダウンを目指す動きを指します。「情報の優位性（IP）」を持つプレイヤーが、このポットコントロールを自在に行えると説かれています。","ex":"「トップペアだがキッカーが弱い。チェックを混ぜてポットコントロールに徹しよう。」"},{"n":482,"ja":"ポットサイズ","lv":3,"en":"Pot Size","kana":"ポット・サイズ","alias":["ポット総額"],"desc":"現時点でポットに溜まっているチップの総額のことです。プレイヤーはこのポットサイズを基準に、どれくらいの額をベットすべきか（ポットの50%など）を決定します。ポットが大きくなればなるほど、プレイヤーに与える数学的なプレッシャーが増大するため、現在の正確なポット額を把握し続けることは、あらゆるベッティング戦略の起点となります。","ex":"「リバーでの決断において、現在のポットサイズと相手の残りスタックを計算する。」"},{"n":483,"ja":"ポットリミット","lv":2,"en":"Pot Limit","kana":"ポット・リミット","alias":["PL"],"desc":"1回のアクションでベットまたはレイズできる最大額が、その時点でのポット総額までに制限されているルール形式です。主にオマハ（PLO）で採用されることが多く、ノーリミットほどの爆発的なベットはできませんが、計算に基づいた緻密な攻防が楽しめます。ポットが大きくなるにつれてベット可能額も幾何学的に増えていくため、後半のストリートでは実質的にオールインに近い巨大な賭けが行われることもあります。ノーリミットと固定リミットの中間的な性質を持ち、数学的なオッズ計算が非常に重視される形式です。","ex":"「ポットリミットオマハは、ホールデムよりもさらに数学的な計算が重要になる。」"},{"n":484,"ja":"ボトムヒット","lv":2,"en":"Bottom Hit","kana":"ボトム・ヒット","alias":["ボトムペア完成"],"desc":"ボード（コミュニティカード）に開かれた複数のカードの中で、最もランク（数字）が低いカードと、自分の手元のホールカード1枚でペアを完成させた状態です。これにより形成されたペアを「ボトムペア」と呼びます。役としてはワンペアの中では最も弱く、相手のトップペアやミドルペアに負けている可能性が非常に高いため、深追いは禁物です。しかし、相手のブラフをキャッチするための最低限の役として機能したり、将来的にスリーカード（トリップス）に発展する芽を残したりすることもあります。","ex":"「フロップでボトムヒットしたが、キッカーも弱いので慎重にチェックした。」"},{"n":485,"ja":"ボトムペア","lv":2,"en":"Bottom Pair","kana":"ボトム・ペア","alias":["最下位ペア"],"desc":"自分の手札の1枚と、ボード上で最も低い数字のカードで構成されたワンペアのこと、あるいはボード上の全てのカードよりも数字が低いポケットペアを指すこともあります。実戦で最も頻繁に遭遇する弱い完成役であり、相手のより高いペアやキッカーに負けてしまうリスクが極めて高いハンドです。特に多人数参加のポットでは価値がほとんどなく、通常は早々にフォールドを検討すべきですが、ヘッズアップなどの特殊な状況では、相手のブラフを見抜くための「ブラフキャッチャー」として辛うじて役割を果たすことがあります。","ex":"「ボトムペアでは相手の強い継続ベットに耐えられないと判断し、降りた。」"},{"n":486,"ja":"ボトムレンジ","lv":5,"en":"Bottom Range","kana":"ボトム・レンジ","alias":["レンジの下限","最弱部分","弱いハンド群","レンジの底","弱い層"],"desc":"あるアクションを取れるハンドの集合（レンジ）の中で、最も弱い部分・下限にあたるハンド群を指します。例えば、あるポジションでオープンできるレンジの中で、ギリギリ参加できるかどうかの一番弱いハンドが「ボトムレンジ」です。このボトム付近のハンドは、相手からの強い抵抗（3ベットなど）に直面した際に、最初に手放す（降りる）対象となります。自分のレンジのどこが頂点（トップ）でどこが下限（ボトム）かを把握しておくことは、相手のアクションに応じてどのハンドを続行し、どこから降りるかを整理し、レンジ全体をバランス良く運用する上で欠かせない感覚です。","ex":"「3ベットを受けたので、レンジのボトムにあたるこのハンドは潔く降りる。」"},{"n":487,"ja":"ポラライズ","lv":6,"en":"Polarize","kana":"ポラライズ","alias":["両極化"],"desc":"ハンドレンジが「非常に強いハンド」と「ブラフに適した非常に弱いハンド」の二極に分かれている状態、またはそのように見せる戦略のことです。日本語では「ポラライズドレンジ」とも呼ばれます。例えば、巨大なオーバーベットを打つ場合、相手は「ナッツ級の最強の手」か「完全なエアー（ブラフ）」のどちらかであると推測し、中間の強さの手は含まれていないと判断します。これにより相手に難しい二択を迫ることができ、自分の強い手でバリューを最大化したり、ブラフで大きなポットを奪ったりすることが可能になります。レンジのバランスを保つための高度な概念です。","ex":"「リバーでの特大ベットにより、私のレンジは完全にポラライズされた。」"},{"n":488,"ja":"マージナルハンド","lv":4,"en":"Marginal Hand","kana":"マージナル・ハンド","alias":["微妙な手"],"desc":"「強いとも弱いとも言い切れない」中程度の強さを持つハンドのことです。具体的には、低いランクのペアや、キッカーの弱いトップペア、中程度のドローなどが該当します。これらのハンドは、相手の弱いアクションに対しては勝っていますが、強いベットに対しては負けている可能性が高いため、非常に扱いが難しいのが特徴です。マージナルハンドでいかに損失を最小限に抑え、あるいは適切なチェックやコールでショーダウンまで辿り着けるかが、プレイヤーの実力を分けるポイントとなります。ポットを大きくしすぎない「ポットコントロール」が基本戦略となる場面が多いです。","ex":"「マージナルハンドなので、深追いはせずにチェックで様子を見た。」"},{"n":489,"ja":"マキシマイズ","lv":4,"en":"Maximize","kana":"マキシマイズ","alias":["最大化","バリューマキシマイズ"],"desc":"自分が有利な状況において、得られる利益（バリュー）や期待値（EV）を可能な限り最大化することを指します。強いハンドを持っている時に、相手から最大限のチップを引き出せる最適なベットサイズを選ぶこと（バリューの最大化）が典型例です。大きすぎるベットは相手を降ろしてしまい、小さすぎるベットは取れたはずの利益を逃します。相手のレンジやコールできる上限を見極め、「相手が払える最大限」を引き出すサイズを設計する技術が問われます。勝てる時にいかに大きく勝つかは、負ける時の損失を抑えること（ミニマイズ）と並んで、長期的な収支を左右する重要な考え方です。","ex":"「ナッツだから、相手が払える限界を狙ってバリューをマキシマイズしたい。」"},{"n":490,"ja":"マック","lv":2,"en":"Muck","kana":"マック","alias":["伏せ捨て"],"desc":"自分のハンドを公開せずに伏せたまま、プレイを放棄したりショーダウンで負けを認めて捨てたりすることです。相手に自分のハンドレンジの情報を与えないための防御的なマナーとしてライブポーカーで一般的です。また、フォールドされたカードやバーンカード（捨て札）が置かれるテーブル上の特定の領域そのものをマックと呼ぶこともあります。一度マックされたカードは死んだカードとなり、そのハンドで再び有効になることはありません。","ex":"ブラフを見破られてコールされたので、自分のハンドをマックした。"},{"n":491,"ja":"マックスバリュー","lv":4,"en":"Max Value","kana":"マックス・バリュー","alias":["最大バリュー","バリュー最大化","最大利益","全取り"],"desc":"自分が有利なハンドを持っている状況で、相手から引き出せる利益（バリュー）を可能な限り「最大」にすることを指します。強い手を持っている時に、相手がぎりぎりコールしてくれる上限を見極め、最も多くのチップを払わせる最適なベットサイズやライン（ベットの組み立て）を選ぶことを意味します。大きすぎれば相手は降りてしまい、小さすぎれば取れたはずの利益を逃すため、相手のレンジと心理を読んだサイジングが要求されます。勝てる場面でいかに大きく勝つかは、長期的な収支を左右する最重要テーマであり、「マックスバリューを取る」ことは、強いハンドを最大限に活かすための腕の見せ所です。","ex":"「ナッツだから、相手が払える限界を狙ってマックスバリューを取りに行きたい。」"},{"n":492,"ja":"マニアック","lv":3,"en":"Maniac","kana":"マニアック","alias":["狂人","超アグレッシブ"],"desc":"極端に「ルース（参加率が高い）」で、かつ「アグレッシブ（攻撃的）」なプレイヤーを指します。ハンドの強弱に関係なくほとんどのゲームに参加し、レイズやリレイズ、巨大なブラフを躊躇なく繰り返します。テーブルのダイナミクスを破壊し、他のプレイヤーを困惑させますが、その無謀さゆえに一度のミスで大きなスタックを失うことも多いスタイルです。彼らの暴走を冷静に受け流し、強いハンドで待ち構えて一気にスタックを奪うのが基本の対策となります。","ex":"「あのマニアックなプレイヤーのせいで、テーブルのレートが実質3倍になっている。」"},{"n":493,"ja":"マルチウェイ","lv":2,"en":"Multiway","kana":"マルチ・ウェイ","alias":["多人数ポット"],"desc":"3人以上のプレイヤーがフロップに進み、ポットを争っている状態のことです。ヘッズアップ（2人対戦）に比べ、誰かが強い役を持っている確率が格段に上がるため、ハンドの価値が相対的に低下します。ブラフが通りにくく、ナッツ級の役を完成させることがより重要になるため、戦略をタイトに切り替える必要がある複雑な局面です。","ex":"「マルチウェイのポットでは、中途半端なペアで勝負するのは非常に危険だ。」"},{"n":494,"ja":"マルチウェイポット","lv":2,"en":"Multiway Pot","kana":"マルチウェイ・ポット","alias":["多人数参加ポット"],"desc":"3人以上のプレイヤーがフロップ以降のベッティングラウンドに参加しているポットの状態を指します。1対1（ヘッズアップ）に比べて、自分のハンドがポットを獲得できる確率（エクイティ）が分散されるため、ワンペアのような平凡な役の価値が大幅に低下します。逆に、ストレートやフラッシュ、セットといった強力な「ナッツ級の役」を完成させたプレイヤーが、複数の相手から同時に利益を得られる爆発力を持ちます。戦略的には、よりタイトで慎重なハンド選択が求められ、ブラフを通す難易度も格段に高まる複雑な局面です。","ex":"「マルチウェイポットになったため、不用意なブラフは控えてチェックで回した。」"},{"n":495,"ja":"マルチテーブルトーナメント","lv":2,"en":"MTT","kana":"エム・ティー・ティー","alias":["大規模大会"],"desc":"複数のテーブルで同時に進行し、プレイヤーが脱落するたびにテーブルが統合されていく大規模なトーナメント形式です。数千人規模になることもあり、優勝するためには長時間の集中力と、変化するブラインド構造への適応が求められます。高額な賞金（プライズプール）が魅力であり、ポーカーの最も華やかで挑戦的なゲーム形式として知られています。","ex":"「今回のMTT（マルチテーブルトーナメント）は、過去最大のエントリー数となった。」"},{"n":496,"ja":"ミシシッピストラドル","lv":5,"en":"Mississippi Straddle","kana":"ミシシッピ・ストラドル","alias":["特殊ストラドル"],"desc":"ストラドル（任意の追加ブラインド）の一種で、通常のUTG（アンダーザガン）からではなく、ボタンやその他のポジションから任意に置くことができる特殊なストラドルです。アメリカ南部のミシシッピ地域で広まったとされることからこの名で呼ばれます。ストラドルを置くと、その額は実質的にブラインドとして扱われ、プリフロップのアクション順や最後に行動できる権利が変化します。特にボタンからのミシシッピストラドルは、ポジションの有利さと相まって強力なため、ハウスルールで認められていない、あるいは制限されている場合も多くあります。ゲームを荒らし、ポットを大きくする刺激的なルールです。","ex":"「この卓はミシシッピストラドルOKだから、ボタンから打ってポットを膨らませよう。」"},{"n":497,"ja":"ミドルペア","lv":2,"en":"Middle Pair","kana":"ミドル・ペア","alias":["中位のペア","セカンドペア"],"desc":"ボードに開かれたカードの中で、2番目または3番目に高いランクのカードと自分の手札でペアを作っている状態です。「セカンドペア」と同義として扱われます。トップペアには負けますが、ブラフキャッチャーとしては機能する可能性があり、勝負を継続するか、あるいは潔く降りるかの判断が非常に難しい、プレイヤーの技量が試される中途半端な強さの役です。","ex":"「フロップでミドルペアがヒット。相手のCベットに対して、一度はコールで様子を見る。」"},{"n":498,"ja":"ミドルポジション","lv":2,"en":"Middle Position","kana":"ミドル・ポジション","alias":["MP","ゲートウェイ"],"desc":"アーリーポジションとレイトポジションの中間に位置する座席の総称です。9〜10人テーブルでは一般的にUTGから数えて4〜6番目の席（HJやLJなど）を指します。前のプレイヤーのアクションが見えるためアーリーよりは有利ですが、後ろに最強のレイトポジションが控えているため、依然として注意深くレンジを調整する必要がある「関所」のような役割を担います。","ex":"「ミドルポジションからは、アーリーよりも少し広いレンジでオープンすることが可能だ。」"},{"n":499,"ja":"ミニマムベット","lv":3,"en":"Minimum Bet","kana":"ミニマム・ベット","alias":["ミニマム","Minベット"],"desc":"そのベッティングラウンドにおいてルール上認められている「最小のベット額」を指します。通常、ビッグブラインド（BB）の額と同等、あるいは前のプレイヤーが行ったベット（またはレイズ）の増加分と同等と定められています。極端に小さな額をベットするアクションは、相手に安価なオッズを与えてしまうため戦略的に不利になることが多いですが、相手の反応を探ったり、安いコストでブラフを試みたりする意図で使われることもあります。マナーとしては、チップを正確に数え、ルールを遵守してミニマム以上の額を提示することが基本です。","ex":"「相手の強さを測るために、まずはミニマムベットを打って様子を伺った。」"},{"n":500,"ja":"ミニマムレイズ","lv":2,"en":"Minimum Raise","kana":"ミニマム・レイズ","alias":["ミニレイズ","最小吊り上げ"],"desc":"ルール上、許容されている最小の額で行うレイズのことです。通常、直前のベット額やレイズ額と同じ増額分が最小となります。ポットを大きくしたくないが、相手にプレッシャーを与えたい、あるいは安価な情報収集を行いたいといった意図で使われますが、相手に非常に良いポットオッズを与えてしまうため、現代の戦略では限定的な状況（特にトーナメント）で用いられます。","ex":"「相手のオープンに対し、あえてミニマムレイズを被せて反応を伺う。」"},{"n":501,"ja":"ミニレイズ","lv":2,"en":"Min-raise","kana":"ミニ・レイズ","alias":["ミニマムレイズ","最小レイズ"],"desc":"そのルール上で許される「最小限の額」で行うレイズを指します。「ミニマムレイズ」の略です。一般的なノーリミットでは、直前のベットやレイズと同額を上乗せした額（例：相手が100ベットならレイズは合計200）が最小レイズとなります。小さい投資で主導権を握ったり、相手に安いオッズを与えてコールを誘ったりする狙いがある一方、相手にとってもコールやリレイズが安くなるため降ろす力は弱く、ポットだけが膨らんで難しい状況を招くこともあります。特にプリフロップでのミニレイズの多用はレンジが読まれやすく弱点になりがちなため、使いどころを選ぶ必要があります。","ex":"「ターンでミニレイズを返されて、安いけど厄介な選択を迫られた。」"},{"n":502,"ja":"メイク","lv":2,"en":"Make","kana":"メイク","alias":["総額の宣言"],"desc":"レイズやベットを行う際、現在のポット額や前のベット額に「いくらを上乗せして、合計いくらにするか」を宣言する際の言葉です。例えば、前のベットが100の時に「メイク・400」と言えば、自分のベット総額を400にすることを意味します。口頭での宣言はポーカーにおいて最も優先される確定事項であるため、間違いのないように明確に発声することが求められます。特にライブポーカーでは、チップを置く前にこのメイク（宣言）をすることで、ストリングベット（反則）を未然に防ぐ効果的な防御手段となります。","ex":"「落ち着いた声で『メイク・500』と宣言し、相手にプレッシャーを与えた。」"},{"n":503,"ja":"メイクハンド","lv":2,"en":"Made Hand","kana":"メイド・ハンド","alias":["完成役","Maid hand","メイドハンド"],"desc":"ストレートやフラッシュ、あるいはワンペアなど、次のカードを待たなくても現時点で既に役が成立しているハンドのことです。「メイドハンド」と言われることもあります。カードを引けば強くなる「ドローハンド」と対比して使われ、主導権を握ってポットを大きくするための主要な武器となります。ただし、完成していても相手がより上位の完成役を持っている可能性（クーラー）には注意が必要です。","ex":"「フロップで既に強力なメイクハンド（メイドハンド）ができているので、バリューを取る。」"},{"n":504,"ja":"メインイベント","lv":2,"en":"Main Event","kana":"メイン・イベント","alias":["本戦","最上位のトーナメント"],"desc":"一連のポーカー大会シリーズの中で最も重要かつバイインが高額な、看板となるトーナメントのことです。WSOP（ワールドシリーズオブポーカー）のメインイベントなどがその象徴です。優勝者には最も権威あるタイトルと巨額の賞金が与えられ、全プレイヤーが最終的な目標とする、ポーカー界の頂点を決める戦いを指します。","ex":"「いつかはWSOPのメインイベントのファイナルテーブルに立つのが夢だ。」"},{"n":505,"ja":"メインポット","lv":2,"en":"Main Pot","kana":"メイン・ポット","alias":["全員参加ポット"],"desc":"そのハンドに参加している全てのプレイヤーが獲得する権利を持っている、最も基本的なポットのことです。誰かがオールインし、他のプレイヤーがそれ以上のチップを持って勝負を続けても、オールインしたプレイヤーが勝った場合に受け取れるのは、自分が投資した額に見合うこのメインポットまでとなります。追加で賭けられた分は「サイドポット」に分けられ、オールインしていないプレイヤー間だけで争われます。自分の全スタックを賭けたとしても、ポットの全てを貰えるわけではないというオールインルールの核心を成す重要な概念です。","ex":"「三人がかりの激戦となったが、私のフラッシュがメインポットを総取りした。」"},{"n":506,"ja":"メンタルゲーム","lv":3,"en":"Mental Game","kana":"メンタル・ゲーム","alias":["精神戦","心理管理"],"desc":"技術や確率計算を超えた、プレイヤーの精神状態のコントロールや心理的な戦略全般を指します。バッドビートによるティルト（感情的な乱れ）を防ぎ、常に冷静な「Aゲーム」を維持し続ける能力は、ポーカーの収支を長期的に安定させるために不可欠なスキルです。集中力の維持、モチベーション管理、そして相手の心理的な隙を突く駆け引きなど、ポーカーが「最も知的な格闘技」と呼ばれる理由はこのメンタルゲームの奥深さにあります。技術と同等、あるいはそれ以上に重要なトレーニング対象です。","ex":"「ポーカーの腕は確かだが、彼はメンタルゲームに弱く、一度の負けで崩れやすい。」"},{"n":507,"ja":"モノトーン","lv":4,"en":"Monotone","kana":"モノトーン","alias":["単色ボード"],"desc":"フロップで開いた3枚のコミュニティカードが、すべて同じスート（マーク）であることを指します。例えば、3枚ともスペードであれば「モノトーンボード」と呼ばれます。この状況では、すでに誰かがフラッシュを完成させている可能性が物理的に存在するため、非常に警戒が必要な危険なボードとなります。もしフラッシュを持っていないプレイヤーにとっては、1枚のカードで逆転されるプレッシャーが強く、ブラフが通りにくくなる一方で、1枚でフラッシュが完成するドロー（Aを持っている場合など）の価値も劇的に変化します。アクションの選択肢が制限されやすい局面です。","ex":"「フロップがモノトーンだったので、セットを持っていても慎重になった。」"},{"n":508,"ja":"モノトーンボード","lv":4,"en":"Monotone Board","kana":"モノトーン・ボード","alias":["同スートボード"],"desc":"フロップで開かれた3枚のコミュニティカードが、すべて同じマーク（スート）である状態、またはそのボードのことです。誰かが既にフラッシュを完成させている可能性や、多くのプレイヤーがフラッシュドローになっている可能性があり、極めて危険なボードテクスチャとされます。戦略が極端に制限され、一歩間違えれば致命傷になりかねない、高い警戒が必要な状況です。","ex":"「モノトーンボードが出現。フラッシュへの警戒から、全員が慎重なアクションになった。」"},{"n":509,"ja":"モンスターアンダーザベッド","lv":6,"en":"Monster Under the Bed","kana":"モンスター・アンダー・ザ・ベッド","alias":["モンスターアンダーザベッドシンドローム","弱気"],"desc":"対戦相手が常に最強級のハンド（モンスターハンド）を持っているのではないかと過度に恐れてしまい、本来は勝負すべき場面でも弱気に降りてしまう心理的な傾向や症状を指す俗語です。子供がベッドの下に潜む怪物を怖がる様子になぞらえた表現で、英語では「monster under the bed syndrome」と呼ばれます。実際に相手が最強ハンドを持っている確率は限られているにもかかわらず、最悪のケースばかりを想定することで、取れるはずのバリューを逃したり、本来コールすべき場面で降りてしまったりと、長期的に大きな機会損失を生みます。「相手は本当にそのハンドを持っているのか」と確率的に冷静に問い直し、見えない亡霊に怯えず根拠に基づいて判断する姿勢が、この症状を克服する鍵となります。","ex":"「強いハンドなのに降りてばかりだ。完全にモンスターアンダーザベッドに陥っているな。」"},{"n":510,"ja":"モンスタードロー","lv":4,"en":"Monster Draw","kana":"モンスター・ドロー","alias":["ストドロとフラドロなど複数の強い役があるハンド"],"desc":"ストレートドローとフラッシュドローが同時に成立しており、かつアウツ（役が完成するカード）の枚数が非常に多い、極めて強力なドローハンドのことです。「モンスタードロー」として紹介されています。完成すればほぼ確実にナッツ（最強の手）になるだけでなく、フロップ時点でも強力なメイドハンド（ワンペアなど）を勝率で上回ることがあるほど、攻撃的なセミブラフの最強の材料となります。","ex":"「フラッシュと両面待ちが重なるモンスタードロー。ここはオールインまで打ち切る。」"},{"n":511,"ja":"モンスターハンド","lv":2,"en":"Monster Hand","kana":"モンスター・ハンド","alias":["モンスター","強力な手"],"desc":"フルハウス、フォーカード、ストレートフラッシュといった、そのボードにおいてほぼ負けることがない最強クラスの非常に強力な役のことです。ナッツ級の強さを持ち、完成した際にはいかに相手をフォールドさせずに、最大限のチップをポットに引き出すか（バリューの最大化）が戦略の核心となります。プレミアムハンド（AA KKなど）がプリフロップでの強さを指すのに対し、モンスターハンドは完成した役の破壊力を指すことが多いです。滅多に現れない幸運な状況ですが、それだけに慎重かつ大胆にプレイし、一撃で勝負を決定づける可能性を秘めたハンドです。","ex":"「モンスターハンドが完成したので、相手のオールインを誘うように打った。」"},{"n":512,"ja":"ライト3ベット","lv":6,"en":"Light 3-bet","kana":"ライト・スリー・ベット","alias":["3ベットブラフ","軽い3ベット"],"desc":"プリフロップで、AAやKKのような強いバリューハンドではなく、相手を降ろすこと（あるいはバランスを取ること）を主目的に、比較的弱い・広いレンジで行う3ベット（リレイズ）を指します。「ライト（light＝軽い）」3ベットと呼ばれ、ブラフ寄りの3ベットです。相手のオープンレンジが広く、3ベットにフォールドしやすいと読んだ際に有効で、A5sやスーテッドコネクターのように、ブロッカー効果やコールされた場合のポストフロップでの戦いやすさを持つハンドが選ばれやすいのが特徴です。バリュー3ベットだけでなくライト3ベットを適切に混ぜることで、相手は「強い手だけ」と決め打ちできなくなり、こちらの3ベットレンジ全体が守られます。","ex":"「相手はオープンが広くてフォールドも多いから、A5sでライト3ベットを仕掛けた。」"},{"n":513,"ja":"ラギッド","lv":3,"en":"Ragged","kana":"ラギッド","alias":["ラグ","ドライボード","バラバラのボード","価値のないボード"],"desc":"コミュニティカードが互いに繋がりがなく、低めでバラバラな、強い役やドローが生まれにくいボードの状態を指します。例えば「K・7・2」のスート（マーク）も数字も噛み合っていないフロップは「ラギッドなボード」と表現されます。こうした盤面は、ストレートやフラッシュの可能性が乏しく、どちらのプレイヤーにとっても強い手が当たりにくいため、ボードに絡んでいなくてもCベット（継続ベット）が通りやすい傾向があります。価値のない低いカードを「ラグ（rag）」と呼ぶことに由来し、ウェット（湿った）なボードと対をなす、ドライな盤面を表す言葉として使われます。","ex":"「ラギッドなボードだから、相手もヒットしにくい。ここはCベットが効きやすい。」"},{"n":514,"ja":"ラグ","lv":3,"en":"Rag","kana":"ラグ","alias":["ブリック","価値のないカード"],"desc":"ボードに出たカードの中で、数字の繋がりがなく、誰の役にもほとんど影響を与えないような価値の低い「弱いカード」のことです。別名「ブリック」とも呼ばれます。例えば、フロップが「A-K-J」のハイカードボードである時に、ターンでスートの異なる「2」が落ちた場合、それはラグカードと見なされます。戦況を大きく変えることがないため、アグレッサー（主導権を持つ側）が継続してプレッシャーをかけ続けるのに適したカードとなります。逆に、ドローを追っている側にとっては、逆転のチャンスを逃したことを意味する、好ましくないカードとして扱われます。","ex":"「ターンは完全なラグだったので、ブラフを継続して相手を降ろしにいった。」"},{"n":515,"ja":"ラストアグレッサー","lv":4,"en":"Last Aggressor","kana":"ラスト・アグレッサー","alias":["最後のアグレッサー"],"desc":"直前のベッティングラウンドにおいて、最後にレイズ（またはベット）という攻撃的アクションを行ったプレイヤーを指します。ポーカーには「アグレッションの継続」という概念があるため、前のラウンドで最後に攻めた人が、次のラウンドでも先にチェックした相手に対してコンティニュエーションベット（Cベット）を打つのが定石とされています。ラストアグレッサーを特定することは、ポットの主導権が誰の手にあるのか、そして次に誰が行動の起点を作るべきかを理解するために、一ハンドを通じて極めて重要な情報の整理となります。","ex":"「自分がラストアグレッサーなので、フロップでも強気にベットを打ち込んだ。」"},{"n":516,"ja":"ラビット","lv":2,"en":"Rabbit Hunt","kana":"ラビット","alias":["ラビットハント","見せ札","フォックスハント","後悔"],"desc":"ハンドが途中で終わった（全員が降りた、あるいはオールインで決着した）後に、「もしそのまま続けていたら次にどんなカードが出ていたか」を確認のためにめくって見ることを指します。「ラビットハント」とも呼ばれます。例えば、フラッシュドローで降りた後に「次のカードでフラッシュが完成していたか」を見たい、といった好奇心から行われます。多くのカジノでは、ゲームの進行を遅らせることや、伏せられていた情報が露見する可能性があることから禁止・非推奨とされています。結果を知っても勝敗は変わらず、むしろ「引けていた」と知ってメンタルを乱す原因にもなるため、注意が必要です。","ex":"「降りた後にラビットしたら、次のカードでフラッシュが完成していて悔しかった。」"},{"n":517,"ja":"ランイットワンス","lv":3,"en":"Run it Once","kana":"ラン・イット・ワンス","alias":["ワンス","1回ラン","通常進行","通常の一回めくり"],"desc":"オールイン後に残りのコミュニティカードを通常通り「1回だけ」配って勝敗を決める、標準的な進行方法を指します。「ランイットトゥワイス（2回配る）」と対比して使われる言葉です。1回しか配らないため、結果は一発勝負となり、運（分散）の振れ幅は大きくなりますが、その分シンプルで決着も早く、勝てば一度に全額を獲得できます。ランイットトゥワイスを採用できる卓で、あえて「ワンスで」と宣言すれば、分散を恐れず一回の勝負に賭けることを意味します。分散をどう扱うかはプレイヤーの資金管理やメンタルの考え方次第であり、ワンスかトゥワイスかの選択にもその姿勢が表れます。","ex":"「分散は気にしないタイプなので、ここはランイットワンスで一発勝負を選んだ。」"},{"n":518,"ja":"ランク","lv":1,"en":"Rank","kana":"ランク","alias":["数字の強さ","序列"],"desc":"カードに書かれた「数字」や「文字（A K Q J）」の強さの序列のことです。ポーカーではAが最も強く、順にK Q J 10...と続き、2が最も弱いカードとなります。役自体の強さが同じ場合（ワンペア同士など）は、このランクを比較して勝者を決定します。また、ストレートにおいてAは最も低い「1」としても機能する特殊な役割を持ちます。ランクの優劣を正確に把握することは、キッカー勝負などの微細な判定において、命運を分ける極めて重要な基本知識となります。","ex":"「役は同じツーペアだったが、上のペアのランクで勝っていたため勝利した。」"},{"n":519,"ja":"ランナーランナー","lv":3,"en":"Runner Runner","kana":"ランナー・ランナー","alias":["バックドア","連続引き"],"desc":"ターンとリバーの2枚のカードを連続して適切に引くことで、初めて役（フラッシュやストレートなど）が完成する状態、あるいはその逆転劇のことです。「バックドア」と同義です。フロップ時点では勝率が極めて低いですが、リバーでの「奇跡の引き」によって大逆転が起こるポーカーのドラマチックかつ残酷な側面を象徴する用語です。","ex":"「フロップでは絶望的だったが、ランナーランナーでフラッシュを引いて逆転した。」"},{"n":520,"ja":"リーディング","lv":4,"en":"Reading","kana":"リーディング","alias":["読み","推察"],"desc":"相手の仕草（テル）、ベットパターン、これまでのアクション履歴などから、相手が持っているハンドの範囲（レンジ）や心理状態を読み解く行為全般を指します。「ハンドリーディング」として、情報の断片からあり得ない組み合わせを消去していく高度な分析プロセスとして詳述されています。正確なリーディングは、ポーカーにおける全ての意思決定の質を劇的に向上させます。","ex":"「彼のこれまでのアクションからリーディングすると、ブラフの可能性が極めて高い。」"},{"n":521,"ja":"リード","lv":4,"en":"Lead","kana":"リード","alias":["主導権","先打ち"],"desc":"特定のベッティングラウンドにおいて、最初にベットを行ってゲームの「主導権（リード）」を握ること、あるいはそのアクション自体を指します。「ドンクベット（先打ち）」などは、本来の主導権（アグレッサー）を無視して強引にリードを奪いに行く動きの一例です。また、プリフロップのアグレッサーがフロップでもベットし続ける「Cベット」も、リードを維持するための代表的な戦略的行動です。","ex":"「フロップで意表を突くドンクベットを打ち、強引にゲームのリードを奪った。」"},{"n":522,"ja":"リエントリー","lv":2,"en":"Re-entry","kana":"リエントリー","alias":["再エントリー","再参加"],"desc":"トーナメントで一度敗退した後に、再度参加費を支払って新しいスタックを受け取り、最初からやり直すことができるルールです。フリーズアウト形式とは異なり、チャンスが複数回与えられるのが特徴です。リエントリー可能な期間（レイトレジスト終了まで）や回数は大会ごとに決まっています。強いプレイヤーにとっては、不運による脱落のリスクを資金力でカバーし、実力を発揮する機会を増やすメリットがありますが、無計画な再参加は収支を悪化させる原因にもなります。戦略的には、序盤にアグレッシブに攻めてダブルアップを狙い、失敗してもリエントリーするという選択肢が生まれます。","ex":"「リエントリーが可能な期間だったので、もう一度挑戦することにした。」"},{"n":523,"ja":"リスチール","lv":5,"en":"Re-steal","kana":"リ・スチール","alias":["スチールリレイズ","再スチール","盗み返し"],"desc":"後方のポジション（ボタンやカットオフなど）からのレイズが、ブラインドを盗もうとする「スチール（盗み）」の可能性が高いと読んだ際に、ブラインドなどから強気にリレイズ（3ベット）を返して、逆にそのポットを奪い返そうとするブラフ的なプレイを指します。スチールを仕掛けてきた相手は必ずしも強い手を持っていないことが多いため、そこに付け込んで降ろしを狙います。特にトーナメントでブラインドが高騰した局面で、ブラインドを守りつつチップを増やす手段として重要になります。ただし、相手に本物の強い手があれば手痛い反撃を受けるため、相手の傾向と自分のレンジを踏まえた見極めが必要です。","ex":"「ボタンのオープンはスチールくさいので、ビッグブラインドからリスチールを仕掛けた。」"},{"n":524,"ja":"リストラドル","lv":4,"en":"Re-straddle","kana":"リ・ストラドル","alias":["再ストラドル","ダブルストラドル","倍々ストラドル"],"desc":"すでに置かれたストラドルに対して、さらにその後ろのプレイヤーが上乗せして置く、2段目以降のストラドル（追加ブラインド）を指します。例えばUTGがストラドルを置いた後、その隣のプレイヤーがその倍額をストラドルとして置く、といった形です。ストラドルが重なるほどブラインドの実質額が跳ね上がり、ポットが一気に大きくなるため、ゲームはハイリスク・ハイリターンで荒れた展開になります。スタックの深さ（実効スタックがブラインドの何倍あるか）が相対的に浅くなり、戦略も大きく変化します。射幸性が高い分、卓やハウスによって可否や上限回数が定められていることが一般的です。","ex":"「UTGのストラドルにリストラドルが重なって、プリフロップから大荒れになった。」"},{"n":525,"ja":"リニアレンジ","lv":7,"en":"Linear Range","kana":"リニア・レンジ","alias":["直線的レンジ","デポラライズドレンジ","マージドレンジ","線形的な範囲","強い順のレンジ"],"desc":"最も強いハンドを頂点として、そこから強い順に隙間なく連続して構成された、上位に偏ったレンジのことを指します。ポラライズド（強い手とブラフの二極）レンジとは異なり、リニアレンジには弱いブラフ部分が含まれず、「強い〜そこそこ強い」ハンドが一直線（リニア）に並びます。主に、相手がこちらのベットにコールしてくれる見込みが高い場面（バリューを取りやすい状況）や、プリフロップでレンジ全体の優位を押し付けたい場面で用いられます。どのような構成のレンジでベットするかは、ベットの目的（バリューかブラフか）と相手の傾向に応じて使い分ける、戦略の根幹となる考え方です。","ex":"「相手が降りない相手なので、ブラフを混ぜずリニアレンジでバリューを押し付けたい。」"},{"n":526,"ja":"リバー","lv":1,"en":"River","kana":"リバー","alias":["ラストカード"],"desc":"5枚目（最後）に開かれるコミュニティカード、およびその最終ベットラウンドを指します。これが役を完成させる最後のチャンスであり、これ以上カードが追加されることはありません。リバーでのアクションはショーダウン前の最後の砦であり、ここで勝敗を決定づける大きなベットや、相手を降ろすための決死のブラフが展開されます。ここでの意思決定は過去の全てのストリートの情報を統合して行う必要があり、プレイヤーの実力や洞察力が最も色濃く反映される局面です。ここでアクションが完了すると、残ったプレイヤー同士が手札を公開する「ショーダウン」へと移り、ポットの勝者が決定します。","ex":"リバーで相手が大きなブラフを仕掛けてきたが、勇気を持ってコールした。"},{"n":527,"ja":"リバースインプライドオッズ","lv":6,"en":"Reverse Implied Odds","kana":"リバース・インプライド・オッズ","alias":["逆潜在オッズ"],"desc":"インプライドオッズ（潜在的利益）の逆で、自分がドローを完成させたにもかかわらず、相手がさらに強い役を持っていたために、将来的に大きな損失を被ってしまう「負の潜在的リスク」のことです。例えば、低い数字のフラッシュドローを追いかけ、首尾よく完成したとしても、相手にさらに高いランクのフラッシュを持たれていた場合、逃げられずにスタックをすべて失う可能性があります。このように「完成しても負けているかもしれない」というリスクが高い場合、オッズが合っていてもドローを追うことは危険であり、慎重な判断が求められます。","ex":"そのドローは完成しても負ける可能性があるので、リバースインプライドオッズが高い。"},{"n":528,"ja":"リバーブラフ","lv":4,"en":"River Bluff","kana":"リバー・ブラフ","alias":["最終ブラフ","土壇場のはったり"],"desc":"すべてのコミュニティカードが開かれた最終ラウンド（リバー）において、役が完成しなかった際に相手をフォールドさせるためだけに打つ、捨て身のブラフです。もはや「次のカードによる逆転（アウツ）」が存在しないため、失敗すれば100%負け、成功すればポット総額を独占できるという、ポーカーにおいて最もアドレナリンが出る究極の心理戦術の一つです。","ex":"「最後のリバーでエースが出た。これを自分のレンジに見せてリバーブラフを撃つ。」"},{"n":529,"ja":"リバーベット","lv":2,"en":"River Bet","kana":"リバー・ベット","alias":["最終ベット","締め"],"desc":"リバーのラウンドにおいて、自分からチップをポットに投じるアクションです。これが最後のベット機会となるため、バリューを獲得するための「バリューベット」と、相手を降ろすための「ブラフ」の意図が最も明確にポラライズ（両極化）される局面です。ポットが最大になっている状況での決断であり、一つのミスがセッションの損益を大きく左右する重要なアクションです。","ex":"「最強のナッツを完成させ、迷わず大きなサイズのリバーベットを打ち込んだ。」"},{"n":530,"ja":"リバイ","lv":2,"en":"Re-buy","kana":"リ・バイ","alias":["チップの再購入"],"desc":"キャッシュゲームや特定のトーナメントにおいて、スタックが減少または消失した際に、その場でチップを買い足してプレイを継続することです。トーナメントでは、開始から数レベルの間だけリバイが認められる「リバイトーナメント」が多く存在します。リエントリーが一度退席して新しい席に座り直すのに対し、リバイはその場に留まってチップを補給する違いがあります。キャッシュゲームでは、常にエフェクティブスタックを最大（100BBなど）に保つために、減るたびにリバイを繰り返すのがプロの標準的なプレイスタイルです。不運な一撃を受けても戦線を維持するための重要なシステムです。","ex":"「スタックが半分になったので、MAXまでリバイして次の勝負に備えた。」"},{"n":531,"ja":"リバイチップ","lv":2,"en":"Rebuy Chips","kana":"リバイ・チップ","alias":["買い増しチップ","再購入"],"desc":"トーナメントでチップを全て失った際、または規定量以下になった際に、再度参加費を支払って受け取る追加のチップのことです。「リバイ（Rebuy）」と同じ意味になります。リバイ期間中は非常にアグレッシブなプレイが許容される特有のダイナミクスが生まれます。失ったスタックを瞬時に回復し、戦線に復帰するための「第2のチャンス」を象徴するチップです。","ex":"「リバイ期間中なので、果敢に攻めてリバイチップを最大限に活用する戦略をとる。」"},{"n":532,"ja":"リミット","lv":2,"en":"Limit","kana":"リミット","alias":["固定ベット","制限付き"],"desc":"ベットやレイズの金額、および一つのラウンドで行えるレイズの回数があらかじめ厳格に固定されているポーカーの形式です。ノーリミット（NL）とは異なり、いきなり全スタックを賭けるようなことはできず、着実に計算されたチップのやり取りが行われます。一回のミスで全財産を失うリスクが低いため、純粋に数学的な確率論やオッズに基づいた戦いが展開されやすく、かつてはポーカーの標準的な形式でした。現代ではノーリミットの方が人気ですが、オマハハイローなどの特定の種目では現在もリミット形式が主流として残っています。","ex":"「リミットポーカーは一撃がない分、数学的な正しさが長期的な収支に直結する。」"},{"n":533,"ja":"リリレイズ","lv":3,"en":"Re-re-raise","kana":"リ・リ・レイズ","alias":["4ベット以上","多重レイズ"],"desc":"相手の「リレイズ（3ベット）」に対して、さらに上乗せしてレイズを仕返すアクションです。ベッティングのカウントでは「4ベット（4-bet）」以上に該当します。互いのハンドが極めて強い（AAやKKなど）、あるいは極限のブラフ合戦であることを示唆する、ポーカーにおいて最も激しい攻防の末に発生する最大級の攻撃アクションです。","ex":"「彼の3ベットに対し、最強の手を確信して渾身のリリレイズを放った。」"},{"n":534,"ja":"リレイズ","lv":2,"en":"Re-raise","kana":"リ・レイズ","alias":["3ベット","4ベット"],"desc":"他のプレイヤーが行ったレイズに対して、さらに上乗せしてチップを賭ける攻撃的なアクションを指します。プリフロップにおける最初のオープンレイズ（2ベット）に対するリレイズは「3ベット」と呼ばれ、非常に強力なハンドを持っていることを示す強力な意思表示となります。相手に大きなプレッシャーを与えてポットを奪う、あるいは自分の強い手でバリューを最大化することが目的です。リレイズされた側は、さらにリレイズ（4ベット）するか、コールするか、あるいはフォールドするかの難しい選択を迫られます。","ex":"「相手のオープンレイズに対し、ボタンから強力なリレイズを仕掛けた。」"},{"n":535,"ja":"リングゲーム","lv":2,"en":"Ring Game","kana":"リング・ゲーム","alias":["キャッシュゲーム"],"desc":"テーブルのチップを現金と直接交換してプレイし、いつでも自由に参加・退席ができるゲーム形式です。日本国内では賭博に関与していないことを示すための名称として定着しています。ブラインド額が一定で、チップが減れば随時アドオン（補充）が可能なため、トーナメントのようなサバイバル性よりも、一ハンドごとの期待値（EV）を重視した地道な「グラインド」が主体となる形式です。","ex":"「今日はトーナメントではなく、リングゲームでじっくりと実力を試すことにした。」"},{"n":536,"ja":"リンパー","lv":2,"en":"Limper","kana":"リンパー","alias":["リンプ参加者"],"desc":"プリフロップにおいて、自分からレイズせずビッグブラインドの額をコール（リンプイン）して参加したプレイヤーのことです。一般的に「弱気」または「初心者」のサインと見なされることが多く、後ろのポジションの上級者から狙い撃ち（アイソレート）される対象になりやすいです。しかし、わざとリンプして相手のレイズを誘い、巨大なリレイズを返す「ニューヨークバックレイズ」のような罠を仕掛けている変則的なリンパーも存在するため、安易な判断は禁物です。","ex":"「前のリンパーに対し、ボタンからレイズを被せて二人だけの勝負に持ち込んだ。」"},{"n":537,"ja":"リンプイン","lv":2,"en":"Limp In","kana":"リンプ・イン","alias":["リンプ","のろのろ進む","弱いハンド"],"desc":"プリフロップにおいて、前のプレイヤーが誰もレイズしていない状態で、ビッグブラインド（BB）の額と同額をコールしてゲームに参加する消極的なアクションです。略して「リンプ」と呼ばれます。通常、ポーカーでは自分からレイズして主導権を握ることが推奨されるため、リンプは「弱さ」を露呈するプレイと見なされがちです。しかし、後ろのプレイヤーからレイズ（アイソレート）されるリスクがあり、ポットを安く抑えられてしまうため、戦略的には不利になることが多いです。例外として、スモールブラインドからの特殊な戦略や、特定の多人数ポットを狙う場合に使われることもあります。","ex":"「全員がリンプインして回ってきたので、BBの私はチェックで回した。」"},{"n":538,"ja":"ルース","lv":2,"en":"Loose","kana":"ルース / ルーズ","alias":["積極参加","手広い"],"desc":"ハンドレンジをあまり絞らず、幅広い種類のハンドで積極的にゲームに参加するプレイスタイルのことです。タイト（慎重）の対義語です。ルースなプレイヤーは多くのポットを奪うチャンスを持ちますが、同時に弱い手で大きな勝負に巻き込まれるリスクも高くなります。相手がルースであれば、自分のバリューベットにコールをもらいやすくなるといった、戦略のアジャストにおける重要な指標です。","ex":"「彼は非常にルースなプレイヤーなので、私のタイトな戦略とは相性が良い。」"},{"n":539,"ja":"ルースパッシブ","lv":4,"en":"Loose Passive","kana":"ルース・パッシブ","alias":["コーリングステーション","コーラー"],"desc":"幅広いハンドで安易にゲームに参加し（ルース）、かつ自分から攻撃を仕掛けることはなく、ひたすらコールで付いていく（パッシブ）プレイスタイルです。別名「コーリングステーション」とも呼ばれ、典型的な「フィッシュ（弱いプレイヤー）」の代表格とされます。ブラフが全く通用しない一方で、自分が強いハンドを持っている時にはどんな額でもコールしてくれるため、最大のバリューを引き出せる絶好のターゲットとなります。ポーカー界の食物連鎖においては、チップを供出する側に位置することが多いスタイルです。","ex":"「相手はルースパッシブ。ブラフは厳禁だが、バリューベットは強気に打とう。」"},{"n":540,"ja":"レイク","lv":2,"en":"Rake","kana":"レイク","alias":["レーキ","手数料"],"desc":"カジノやポーカールームがゲームを運営する対価として、各ポットから徴収する手数料のことです。通常、ポットの数パーセント（例：5%）が徴収され、ハウスの主な収益源となります。プレイヤーにとっては勝敗とは別にかかるコストであり、レイクが高い環境ではよりタイトにプレイして「割に合う」勝負だけを選択する高度なバンクロール管理が求められます。","ex":"「ポットが大きくなったが、レイクのキャップ（上限）があるため実質的な利益は大きい。」"},{"n":541,"ja":"レイザー","lv":1,"en":"Raiser","kana":"レイザー","alias":["レイズした人","アグレッサー"],"desc":"ベットに対してさらに金額を吊り上げる「レイズ」を行ったプレイヤーのことです。特にプリフロップで最初にオープンした人は「オリジナルレイザー」と呼ばれます。レイザーはゲームの主導権（アグレッション）を握っており、相手にフォールドを強いる権利を一時的に独占しているため、ポーカー戦略を分析する上での「起点となる人物」として常に注目されます。","ex":"「レイザーである彼のハンドレンジを推測し、防御的なコールを選択した。」"},{"n":542,"ja":"レイズ","lv":1,"en":"Raise","kana":"レイズ","alias":["吊り上げ","2ベット以上"],"desc":"他のプレイヤーがしたベットに対して、さらに上乗せしてチップを賭けるアクションです。自分のハンドの強さを主張し、ポットを大きく育てる「バリュー」目的のほか、相手をゲームから降ろさせる「ブラフ」目的でも使われます。レイズされた相手は「コール」「フォールド」「さらなるレイズ（リレイズ）」の苦しい選択を迫られることになります。","ex":"「相手の弱気なベットに対し、主導権を奪うための大きなレイズを仕掛けた。」"},{"n":543,"ja":"レイトポジション","lv":2,"en":"Late Position","kana":"レイト・ポジション","alias":["LP","王座"],"desc":"ディーラーボタン（BTN）やカットオフ（CO）など、各ラウンドでアクションの順番が最後の方になる有利な座席の総称です。他の全プレイヤーのアクションを観察した上で自分の決断を下せるため、情報の優位性が極めて高く、ブラフの成功率やバリューの獲得効率が格段に向上します。ポーカーの収益の大部分はこのポジションから生まれる「最強の席」です。","ex":"「レイトポジションにいる時は、カードが弱くてもポジションの力でポットを奪える。」"},{"n":544,"ja":"レインボーボード","lv":3,"en":"Rainbow Board","kana":"レインボー・ボード","alias":["レインボー","異なるマーク","オフスート","オフスーツ"],"desc":"フロップで開いた3枚のコミュニティカードのスート（マーク）が、すべて異なっている状態を指します。このボード状況では、ターンカード1枚でフラッシュが完成する可能性が物理的にゼロであるため、比較的「安全なボード」と見なされます。ストレートドローなどは存在し得ますが、スートの重なりによるプレッシャーが少ない分、トップペアなどのメイドハンドの価値が相対的に維持されやすいのが特徴です。レインボーボードという呼び名で広く浸透しています。","ex":"フロップがレインボーだったので、トップペアの価値が相対的に上がった。"},{"n":545,"ja":"レーキ","lv":2,"en":"Rake","kana":"レーキ","alias":["手数料"],"desc":"カジノやポーカールーム、オンラインサイトといったゲームの主催者が、運営費用や手数料として各ポットから徴収する取り分のことです。通常、ポット総額の一定割合（例：5%）が差し引かれ、その上限（キャップ）が設定されています。特にキャッシュゲームにおいては、このレーキの存在が長期的な収支に大きな影響を与えるため、レーキを考慮したハンド選択（タイトなプレイなど）が重要になります。また、一定条件で支払ったレーキの一部が返還される「レーキバック」という仕組みもあり、プロプレイヤーにとって重要な収入源となります。","ex":"このテーブルはレーキが5%なので、早めに勝負を決めるのが得策だ。"},{"n":546,"ja":"レーキキャップ","lv":3,"en":"Rake Cap","kana":"レーキ・キャップ","alias":["手数料上限"],"desc":"カジノ側が各ポットから徴収する手数料（レーキ）の「最大上限額」のことです。通常、レーキはポット総額の一定割合（例：5%）と決められていますが、ポットが巨大になった場合にプレイヤーの負担が過大にならないよう、「1ハンドにつき最大$5まで」といった具合に上限（キャップ）が設定されています。このキャップの金額は、プレイするステークス（レート）が高いほど高額に設定されるのが一般的です。プレイヤーにとっては、キャップに達するような大きなポットを争う際の方が、実質的な手数料負担率が下がるため有利になります。","ex":"「このテーブルはレーキキャップが低いので、長期的な収支に非常に優しい。」"},{"n":547,"ja":"レーキバック","lv":3,"en":"Rakeback","kana":"レーキ・バック","alias":["還元","手数料還元"],"desc":"ポーカールームがポットから徴収する手数料「レーキ」の一部を、プレイヤーに払い戻す還元の仕組みを指します。主にオンラインポーカーで、プレイ量（支払ったレーキの総額）に応じて、その何割かをキャッシュバックやポイントとして受け取れる制度として提供されます。プレイ量の多いプレイヤーほど還元額が大きくなるため、収支を改善する重要な要素となり、これを主な収益源とするプレイヤーは「レーキバックプロ」と呼ばれることもあります。同じ実力でプレイするなら、レーキバックの条件が良い環境を選ぶことが、長期的な期待値を底上げすることにつながります。","ex":"「レーキバックを含めて計算すると、トントンの成績でも実質はプラス収支になる。」"},{"n":548,"ja":"レクリエーショナルプレイヤー","lv":2,"en":"Recreational Player","kana":"レクリエーショナル・プレイヤー","alias":["フィッシュ","エンジョイ勢"],"desc":"ポーカーを職業や収益目的ではなく、純粋に楽しみ（レクリエーション）としてプレイする人々のことです。プロや上級者（レギュラー）と対比して使われる用語であり、理論的なプレイよりも直感や楽しさを優先する傾向があります。彼らはテーブルに活気と利益をもたらす貴重な存在であり、ポーカーコミュニティの広がりを支える基盤となっています。マナー良く接することは全てのプレイヤーの義務であり、彼らから「楽しい対戦相手」と思われることは、長期的に良好なゲーム環境を維持する上でも重要です。","ex":"「彼は典型的なレクリエーショナルプレイヤーで、どんなカードでも楽しそうにプレイする。」"},{"n":549,"ja":"レディース","lv":2,"en":"Ladies","kana":"レディース","alias":["QQ","クイーンズ","ポケットクィーン"],"desc":"2枚のホールカードが両方ともクイーン（Q）であるハンド、すなわちポケットクィーン（QQ）を指す俗語です。クイーン＝女王（淑女）から「レディース（Ladies）」と呼ばれ、「クイーンズ」「ヒルトンシスターズ」なども同義の愛称です。AA・KKに次ぐ三番目に強いプリフロップハンドであり、積極的に勝負すべき強力な一手ですが、エースとキングという2枚のオーバーカードが存在するため、フロップでそれらが落ちた際の対応が悩ましい、扱いに技術を要するハンドでもあります。プリフロップでの強さを活かしつつ、ポストフロップで深追いしすぎない冷静さが求められます。","ex":"「レディースが入った。強いけど、エースかキングが落ちたら慎重にいきたい。」"},{"n":550,"ja":"レプリゼント","lv":4,"en":"Represent","kana":"レプリゼント","alias":["主張する","偽装する"],"desc":"自分のアクションを通じて、特定の強力なハンド（例：ナッツやフラッシュ）を「持っているかのように見せる（主張する）」ことです。ブラフ戦略の根幹をなす概念です。例えば、スケアカードが落ちた際に大きくベットすることで、そのカードが自分にとって好都合であることを「レプリゼント」し、相手をフォールドに追い込みます。ストーリーの一貫性が、レプリゼントの説得力を左右します。","ex":"「このボードでエースをレプリゼントすれば、彼はマージナルな手で降りるはずだ。」"},{"n":551,"ja":"レベル思考","lv":5,"en":"Level Thinking","kana":"レベル・シコウ","alias":["レベリング","多階層思考","読み合いの階層"],"desc":"「相手が何を考えているか」をどの深さまで読むか、という思考の階層（レベル）を表す概念です。レベル0は自分の手だけを見るプレイ、レベル1は「相手の手は何か」、レベル2は「相手は自分の手を何だと思っているか」、レベル3は「相手は自分が相手の手をどう読んでいると考えているか」…と、入れ子状に深まっていきます。重要なのは、深く読むほど良いわけではなく、相手の思考レベルより「一段だけ上」を取るのが最も効果的だという点です。考えない相手に高度な読み合いを仕掛けても空回り（オーバーシンキング）するため、相手のレベルを見極めて自分の階層を合わせることが、エクスプロイトの要となります。","ex":"「あの相手は深く読まないタイプだから、レベル思考を上げすぎず素直に打つのが正解だ。」"},{"n":552,"ja":"レンジ","lv":4,"en":"Range","kana":"レンジ","alias":["ハンドの範囲"],"desc":"特定の状況下において、プレイヤーが持っている可能性のある全ハンドの組み合わせ（集合体）のことです。「ハンドレンジ」として、相手の手を「この1枚」と特定するのではなく、可能性のある「範囲」で考えることがポーカーのセオリーであると説かれています。自分のレンジと相手のレンジを比較し、どちらが有利かを分析することが現代ポーカーの基本動作です。","ex":"「彼のオープンレンジは非常にタイトだ。ナッツ級の手を多く含んでいると予測される。」"},{"n":553,"ja":"レンジアドバンテージ","lv":6,"en":"Range Advantage","kana":"レンジ・アドバンテージ","alias":["範囲の優位性"],"desc":"特定のコミュニティカード（ボード）において、自分のハンドレンジ全体が相手のレンジ全体よりも「平均的に強い、または有利である」状態のことです。例えば、プリフロップでレイズした側のレンジにはAAやKKなどのプレミアムハンドが含まれますが、コールした側のレンジにはそれらが少ないため、ハイカードが多いボードではレイザー側に強力なレンジアドバンテージが生じます。このアドバンテージを持っている側は、より頻繁にブラフを仕掛けたり、大きなベットで主導権を握ったりすることが正当化されるため、戦略構築の根幹となる概念です。","ex":"このボードは私のレンジに合っているので、レンジアドバンテージがある。"},{"n":554,"ja":"レンジを守る","lv":6,"en":"Range Protection","kana":"レンジ・プロテクション","alias":["レンジプロテクション","バランスを取る"],"desc":"特定のアクション（ベット・チェック・コールなど）を取る際に、強いハンドと弱いハンドの双方を適切に混ぜることで、自分のレンジが相手に読まれて一方的に攻略されるのを防ぐ概念です。例えば、強いハンドの時だけベットし弱い時は常にチェックするようなプレイは、相手にレンジを丸裸にされ、チェックした瞬間に攻め込まれてしまいます。これを避けるため、チェックのレンジにも時には強いハンドを残し、逆にベットレンジにもブラフを適切に含めることで、どのアクションを取っても付け込まれにくいバランスの取れた状態を維持します。GTO的な思考の根幹をなす、現代ポーカーの最重要概念の一つです。","ex":"「ここでチェックするのは、チェックレンジを守るためでもある。」"},{"n":555,"ja":"ロイヤルストレートフラッシュ","lv":1,"en":"Royal Straight Flush","kana":"ロイヤル・ストレート・フラッシュ","alias":["ロイヤルフラッシュ"],"desc":"ポーカーにおける絶対的な王者であり、最強の役です。同じスートで「A-K-Q-J-10」の5枚が揃った状態を指し、これがいかなる状況でも負けることはありません。出現確率はテキサスホールデムで約31000回に1回（0.0032%）と極めて低く、一生のうちに数回拝めるかどうかの奇跡的なハンドです。全てのプレイヤーにとっての究極の目標であり、完成した際にはその場に居合わせた全員がどよめくほどのインパクトを持ちます。数学的にはチョップ（引き分け）以外あり得ない、神聖なハンドと言えます。","ex":"「リバーのカードがスペードのAとなり、人生初のロイヤルストレートフラッシュが完成した。」"},{"n":556,"ja":"ロージャック","lv":3,"en":"Low Jack","kana":"ロー・ジャック","alias":["LJ","UTG+2"],"desc":"9人以上のテーブルにおいて、ハイジャック（HJ）の右隣に位置するミドルポジション（MP）の座席です。6人テーブルではアンダーザガン（UTG）と同義になります。アーリーポジションとレイトポジションを繋ぐ「ゲートウェイ（関所）」としての役割を持ち、ここから本格的な戦術的駆け引きが始まります。後ろにまだ有利なポジションのプレイヤーが複数控えているため、オープンレイズをした際にリレイズを返されるリスクもあり、慎重な立ち回りが要求される中間地点です。","ex":"ロージャックからレイズしたが、ボタンに3ベットを返されてしまった。"},{"n":557,"ja":"ローポケット","lv":2,"en":"Low Pocket Pair","kana":"ロー・ポケット","alias":["ローポケットペア","スモールポケット","小ポケット","低位ペア","スモールペア"],"desc":"ランクの低いポケットペア、一般的には2から6（22〜66）あたりの小さなポケットペアの総称です。「スモールポケット」とも呼ばれます。オーバーカードが多数存在するため、フロップでペアより高いカードが落ちることがほとんどで、ワンペアのまま大きく勝負するのは危険です。したがって、このクラスのハンドの価値の多くはセット（スリーカード）の完成にあり、スタックが深く、当たった時に大きく払ってくれそうな相手に対してコールするセットマイニングが基本戦略となります。安く引いて大きく当てる、引き際とリスク管理が問われるハンド群です。","ex":"「ローポケットはセットマイニング前提。安く入れなければ降りるのも一手だ。」"},{"n":558,"ja":"ロック","lv":3,"en":"Rock","kana":"ロック","alias":["岩","タイトパッシブ"],"desc":"「ニット」とほぼ同義、あるいはそれ以上に堅く、石（岩）のように動かないプレイヤーを指します。プレミアムハンドが来るまで何時間でもじっと待ち続け、自分のレンジに自信がある時のみプレイします。彼らがアクションを起こす際は常に「自分が勝っている」と確信しているため、相手にブラフを誘わせたり、逆にブラフで降ろしたりすることは極めて困難です。攻略法としては、彼らのブラインドを積極的にスチールし、彼らが打ってきたら迷わず逃げるのが鉄則とされています。","ex":"「彼は1時間もフォールドし続けている本物のロックだ。絶対にブラフではない。」"},{"n":559,"ja":"ロバスト","lv":6,"en":"Robust Equity","kana":"ロバスト","alias":["強固な勝率","実現しやすい期待値"],"desc":"将来のストリート（ターンやリバー）において、状況の変化（スケアカードの出現など）によって価値が損なわれにくい、強固なエクイティ（勝率）の状態を指します。「ロバストエクイティ」として、上級者向けの高度な概念として用いられます。例えば、ナッツ級の役を完成させる強力なドローや、ナッツそのものは、どんなカードが落ちても価値を保ちやすいため、ロバスト（強固）であると言えます。","ex":"「このドローハンドはロバストなエクイティを持っており、リバーまで自信を持って戦える。」"},{"n":560,"ja":"ロバストエクイティ","lv":9,"en":"Robust Equity","kana":"ロバスト・エクイティ","alias":["堅牢なエクイティ","崩れにくい勝率","頑健な勝率"],"desc":"ターンやリバーでどのようなカードが落ちても、勝率（エクイティ）が大きく損なわれにくい、安定して強い状態を指す言葉です。「ロバスト」は「頑健・堅牢」を意味します。例えば、強いオーバーペアやトップツーペアのように、多少のカード変化では優位が揺らがないハンドは「ロバストなエクイティを持つ」と表現されます。逆に、ドローハンドはヒットすれば一気に強くなるものの、外れれば価値を失うため、ロバストとは言えません。ロバストエクイティの高いハンドは、安心してポットを大きくしていけるため、ベットサイズを上げてバリューを最大化する判断につながりやすい、という戦略的な意味を持ちます。","ex":"「このハンドはロバストエクイティが高いから、安心して大きくバリューを取りに行ける。」"},{"n":561,"ja":"ワンギャップ","lv":3,"en":"One Gap / One Gapper","kana":"ワン・ギャップ","alias":["1ギャップ","ギャッパー"],"desc":"自分の手札（ホールカード）の2枚のランク（数字）が、1つだけ飛んでいる状態を指します（例：7と9、JとKなど）。「ギャッパー」とも言われます。完全に連続した「コネクター」に比べてストレートを作る難易度は少し上がりますが、その分、役が完成した際に相手から構成が読まれにくく、大きなバリューを引き出しやすいという戦略的な利点があります。","ex":"「7と9のワンギャップなので、ストレートが完成すれば相手の意表を突ける。」"},{"n":562,"ja":"ワンコ","lv":2,"en":"One-Coin Game","kana":"ワンコ","alias":["ワンコイン","500円トーナメント","格安卓","ワンコール"],"desc":"「ワンコイン」を略した俗語で、ワンコイン（多くは500円玉一枚程度）で気軽に参加できる、低価格のトーナメントやリングゲームを指すとされます。アミューズメントカジノなどで、初心者や練習目的のプレイヤーが手軽に数をこなせるよう用意される格安の卓を指して使われます。低価格である分、参加者の層も幅広く、勝っても得られるものは小さいものの、実戦経験を積んだりライブの雰囲気に慣れたりする入り口として活用されます。費用を抑えてプレイ回数を確保したい層にとって、ポーカーを習慣化するための気軽な選択肢となっています。","ex":"「今日はワンコでサクッと回して、ライブの感覚を取り戻しておこう。」"},{"n":563,"ja":"ワンビッグ","lv":3,"en":"One Big","kana":"ワン・ビッグ","alias":["1BB","シングルビッグ"],"desc":"トーナメントにおいて、失格や欠席、あるいは特殊なルール（SB不在）により、ビッグブラインド（BB）一人分だけの強制参加費で進行するゲームの状態です。また、スタックサイズを表現する際に「残り1BB（1ビッグ）しかない」といった形で、生死の境目にある極限のショートスタックを指す際にも使われます。アンティの支払いも困難なこの状態では、もはやフォールドという選択肢はなく、配られたカードの強さに関わらず自動的に運を天に任せるオールイン勝負が強制される運命的な局面です。","ex":"「ワンビッグまで追い詰められたが、そこから3連続でダブルアップし奇跡的に復活した。」"},{"n":564,"ja":"ワンペア","lv":1,"en":"One-Pair","kana":"ワン・ペア","alias":["1P","一対"],"desc":"同じ数字（ランク）のカードが2枚揃った、ポーカーで最も基本的かつ頻繁に成立する役です。手札が最初からペアである「ポケットペア」や、手札の1枚がボードのカードと重なることで完成します。テキサスホールデムでは約44%という非常に高い確率で誰かが完成させるため、これ単体では勝負が決まらないことも多いです。同じ役同士では、まずペアの数字を比較し、それが同じなら残りの3枚のカード（キッカー）の強さで勝敗が決まります。","ex":"ワンペアでは心もとないが、キッカーのAを信じてコールした。"}];
const $=id=>document.getElementById(id);
const state={q:"",band:"all",view:"dict",bookmarks:new Set(),openIdx:-1,filtered:[],sortOrder:"asc",sheetMode:"term"};
function norm(s){return(s||"").toLowerCase().replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60))}
function bandOf(lv){return lv<=2?"sho":lv<=4?"nami":lv<=6?"nan":"goku"}
function bandKanji(lv){return lv<=2?"初":lv<=4?"並":lv<=6?"難":"極"}
function sameAsJa(kana,ja){return (kana||"").replace(/[・･]/g,"")===(ja||"").replace(/[・･]/g,"")}
function matches(t){
  if(state.band!=="all"&&bandOf(t.lv)!==state.band)return false;
  if(state.view==="bookmark"&&!state.bookmarks.has(t.n))return false;
  if(!state.q)return true;
  const q=norm(state.q);return[t.ja,t.kana,t.en,...(t.alias||[])].map(norm).join("¶").includes(q);
}
function sealClass(lv){return"rank-seal b-"+bandOf(lv)}
function bmIconHTML(on){
  return `<svg viewBox="0 0 24 24" width="18" height="18" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3.8A1.8 1.8 0 0 1 7.8 2h8.4A1.8 1.8 0 0 1 18 3.8V21l-6-4.2L6 21z"/></svg>`;
}
function renderList(){
  const area=$("listArea");
  if(state.view==="today"){renderToday(area);return}
  state.filtered=TERMS.filter(matches).sort((a,b)=>{
    const diff=state.sortOrder==="asc"?(a.lv-b.lv):(b.lv-a.lv);
    return diff!==0?diff:a.n-b.n;
  });
  if(!state.filtered.length){
    const msg=state.view==="bookmark"&&!state.q?"しおりはまだありません。<br>用語を開いて栞アイコンを押すと、ここに集まります。":"該当する用語が見つかりません。<br>カタカナ・英語・別名でも検索できます。";
    area.innerHTML=`<div class="empty-state"><div class="es-glyph">無</div><p>${msg}</p></div>`;return;
  }
  const label=state.view==="bookmark"?"BOOKMARKED":"TERMS";
  const sortLabel=state.sortOrder==="asc"?"昇順":"降順";
  const sortIcon=state.sortOrder==="asc"?"↑":"↓";
  const AD_EVERY=5;
  const cardsHTML=state.filtered.map((t,i)=>{
    const card=`
    <div class="term-card" role="button" tabindex="0" data-i="${i}">
      <div class="${sealClass(t.lv)}">${t.lv}</div>
      <div class="term-main"><div class="term-en">${t.en}</div><div class="term-ja${sameAsJa(t.kana,t.ja)?" term-ja-lg":""}">${t.ja}</div>${sameAsJa(t.kana,t.ja)?"":`<div class="term-kana">${t.kana}</div>`}</div>
      <button class="bm-btn ${state.bookmarks.has(t.n)?"on":""}" data-bm="${t.n}" aria-label="しおり">${bmIconHTML(state.bookmarks.has(t.n))}</button>
    </div>`;
    const ad=(i>0&&(i+1)%AD_EVERY===0)?`<div class="ad-slot"><span class="ad-tag">AD</span>広告スペース（バナー枠）</div>`:"";
    return card+ad;
  }).join("");
  area.innerHTML=`<div class="list-header"><div class="count-label">${state.filtered.length} / ${TERMS.length} ${label}</div><button class="sort-toggle" id="sortToggle">${sortLabel} ${sortIcon}</button></div><div class="term-grid">${cardsHTML}</div>`;
  $("sortToggle").addEventListener("click",()=>{state.sortOrder=state.sortOrder==="asc"?"desc":"asc";renderList()});
  area.querySelectorAll(".term-card").forEach(el=>{
    el.addEventListener("click",()=>openSheet(+el.dataset.i));
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSheet(+el.dataset.i)}});
  });
  area.querySelectorAll(".bm-btn").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      toggleBm(+btn.dataset.bm);
      renderList();
    });
  });
}
function renderToday(area){
  const day=Math.floor(Date.now()/86400000),t=TERMS[day%TERMS.length],d=new Date();
  state.filtered=[t];
  area.innerHTML=`<div class="today-wrap"><div class="today-eyebrow">TODAY ─ ${d.getMonth()+1}月${d.getDate()}日の一語</div>
    <div class="today-card" role="button" tabindex="0" id="todayCard"><div class="term-en">${t.en}</div><h2${sameAsJa(t.kana,t.ja)?' style="margin-bottom:14px"':''}>${t.ja}</h2>${sameAsJa(t.kana,t.ja)?"":`<div class="term-kana">${t.kana}</div>`}<p>${t.desc}</p><div class="today-more">全文と塾長の一言を読む →</div></div></div>`;
  $("todayCard").addEventListener("click",()=>openSheet(0));
}
function openSheet(i){
  state.sheetMode="term";state.openIdx=i;const t=state.filtered[i];if(!t)return;const bm=state.bookmarks.has(t.n);
  $("sheetBody").innerHTML=`<div class="d-top"><div style="min-width:0"><div class="d-en">${t.en}</div><div class="d-term${sameAsJa(t.kana,t.ja)?" d-term-lg":""}">${t.ja}</div>${sameAsJa(t.kana,t.ja)?"":`<div class="d-kana">${t.kana}</div>`}</div>
    <div class="d-seal-col"><div class="${sealClass(t.lv)}">${t.lv}</div><button class="d-bm ${bm?"on":""}" id="dBm">${bm?"栞済み":"栞を挟む"}</button></div></div>
    ${(()=>{const uniq=(t.alias||[]).filter(a=>!sameAsJa(a,t.ja)&&!sameAsJa(a,t.kana));return uniq.length?`<div class="d-alias">${uniq.map(a=>`<span>${a}</span>`).join("")}</div>`:"";})()}
    <hr class="d-divider"><div class="d-label">解説 ─ COMMENTARY</div><p class="d-desc">${t.desc}</p>
    <div class="d-quote"><p>${t.ex}</p></div>
    <div class="d-nav"><button id="dPrev" ${i<=0?"disabled":""}><span class="arrow">←</span> 前の語</button><button id="dNext" ${i>=state.filtered.length-1?"disabled":""}>次の語 <span class="arrow">→</span></button></div>`;
  $("dBm").addEventListener("click",()=>{toggleBm(t.n);openSheet(i);renderList()});
  $("dPrev").addEventListener("click",()=>openSheet(i-1));
  $("dNext").addEventListener("click",()=>openSheet(i+1));
  $("sheet").classList.add("open");$("backdrop").classList.add("open");$("sheetBody").scrollTop=0;
}
function closeSheet(){$("sheet").classList.remove("open");$("backdrop").classList.remove("open")}
function toggleBm(n){state.bookmarks.has(n)?state.bookmarks.delete(n):state.bookmarks.add(n)}
$("backdrop").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
let sx=0,sy=0;
$("sheet").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("sheet").addEventListener("touchend",e=>{
  if(state.sheetMode!=="term")return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
