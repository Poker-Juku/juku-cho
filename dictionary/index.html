<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ポーカー塾 用語辞典 — UI/UXプロトタイプ</title>
<style>
:root{
  --font-serif:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Times New Roman',serif;
  --font-sans:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP','Segoe UI',sans-serif;
  --font-mono:'SF Mono','SFMono-Regular','Menlo','Consolas','Roboto Mono',monospace;
  --paper:#25100A;--card:#251009;--card-border:rgba(255,255,255,.1);
  --ink:#F6EEE3;--ink-soft:rgba(246,238,227,.6);
  --line:rgba(255,255,255,.12);--seal:#C0392B;--seal-ink:#FFF6EE;
  --sheet-shadow:0 -12px 40px rgba(0,0,0,.5);--chip:rgba(255,255,255,.06);
  --correct:#7FD68A;--correct-bg:rgba(61,122,66,.22);--wrong:#FF8F72;--wrong-bg:rgba(178,58,43,.22);
  --hero-1:#7A2216;--hero-2:#3C0D08;--hero-3:#1B0503;
  --on-dark:#F6EEE3;--on-dark-soft:rgba(246,238,227,.6);
  --accent:#FF8A63;
  --band-sho-1:#5C9CE6;--band-sho-2:#2E5FA3;
  --band-nami-1:#57B473;--band-nami-2:#2C7A46;
  --band-nan-1:#DE5A42;--band-nan-2:#8E2417;
  --band-goku-1:#9169D6;--band-goku-2:#4E3591;
}
[data-theme="dark"]{
  --hero-1:#200905;--hero-2:#0D0301;--hero-3:#000000;
  --paper:#160805;--card:#180804;
  --accent:#FF9B78;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
body{background:#150402;font-family:var(--font-sans);color:var(--ink);display:flex;justify-content:center;transition:background .3s}
.phone{width:100%;max-width:430px;height:100dvh;max-height:940px;background:linear-gradient(165deg, var(--hero-1) 0%, var(--hero-2) 55%, var(--hero-3) 100%);background-image:radial-gradient(circle at 12% 6%, rgba(255,255,255,.05) 0, transparent 40%),radial-gradient(circle at 90% 96%, rgba(255,255,255,.04) 0, transparent 40%),linear-gradient(165deg, var(--hero-1) 0%, var(--hero-2) 55%, var(--hero-3) 100%);display:flex;flex-direction:column;position:relative;overflow:hidden;transition:background .3s}
@media(min-width:480px){body{align-items:center;padding:24px 0}.phone{height:calc(100dvh - 48px);border-radius:36px;box-shadow:0 24px 80px rgba(10,2,1,.5);border:1px solid rgba(0,0,0,.3)}}
@media(min-width:900px){
  .phone{max-width:760px}
  .list-area{display:block}
  .list-area .term-card{max-width:none}
  .term-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .term-grid .term-card{margin-bottom:0}
  .term-grid .ad-slot{grid-column:1 / -1;margin-bottom:0}
}

.rotate-lock{display:none;position:fixed;inset:0;z-index:9999;background:#0B0201;color:#F6EEE3;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;font-family:var(--font-sans)}
.rotate-lock .rl-icon{font-size:44px;margin-bottom:18px;opacity:.8;animation:rlSpin 2.2s linear infinite}
.rotate-lock p{font-size:15px;line-height:1.8;max-width:280px}
.rotate-lock .rl-en{margin-top:10px;font-size:11px;font-family:var(--font-mono);letter-spacing:.05em;color:rgba(246,238,227,.55)}
@keyframes rlSpin{0%{transform:rotate(0)}45%{transform:rotate(-90deg)}55%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
@media (orientation:landscape) and (max-width:899px){
  .rotate-lock{display:flex}
  .phone{display:none}
}



header{padding:calc(env(safe-area-inset-top) + 16px) 20px 14px;display:flex;align-items:center;justify-content:space-between}
.header-rule{height:1px;margin:0 20px 14px;background:linear-gradient(to right, var(--accent) 0, var(--accent) 36px, rgba(255,255,255,.14) 36px, rgba(255,255,255,.14) 100%);opacity:.7;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px}
.brand-seal{flex-shrink:0;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 32% 26%, #D6543F, #7E2A1C 85%);color:var(--seal-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 0 0 3px rgba(255,255,255,.92), 0 4px 12px rgba(0,0,0,.4);border:none;padding:0;cursor:pointer;transition:transform .12s}
.brand-seal:active{transform:scale(.92)}
.brand-seal .bs-top{font-family:var(--font-serif);font-weight:800;font-size:16px;line-height:1;position:relative}
.brand-seal .bs-bottom{font-family:var(--font-mono);font-weight:500;font-size:6.5px;line-height:1;opacity:.9;margin-top:3px;position:relative;letter-spacing:.05em}
.brand-text h1{font-family:var(--font-serif);font-size:17px;font-weight:800;letter-spacing:.05em;color:var(--on-dark)}
.brand-text h1 .brand-accent{color:var(--accent)}
.brand-text small{display:block;font-family:var(--font-mono);font-size:9px;color:var(--on-dark-soft);letter-spacing:.22em;font-weight:400;margin-top:3px}
.theme-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:var(--on-dark);width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.theme-btn:active{transform:scale(.92)}

.search-wrap{padding:4px 20px 10px}
.search-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:13px 16px;transition:box-shadow .2s;box-shadow:0 8px 22px rgba(10,2,1,.28)}
.search-box:focus-within{border-color:var(--seal)}
.search-box svg{flex-shrink:0;opacity:.45}
.search-box input{flex:1;border:none;background:none;outline:none;font-size:16px;color:var(--ink);font-family:var(--font-sans)}
.search-box input::placeholder{color:var(--ink-soft);opacity:.7}
.clear-btn{background:none;border:none;color:var(--ink-soft);font-size:18px;cursor:pointer;padding:0 2px;display:none}
.search-box.has-text .clear-btn{display:block}

.chips{display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:2px solid transparent;background:var(--dot);color:#fff;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;display:inline-flex;align-items:center;opacity:.62;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.chip.active{opacity:1;border-color:rgba(255,255,255,.75);box-shadow:0 0 0 3px rgba(255,255,255,.14),0 3px 8px rgba(0,0,0,.3)}
.chip[data-band="all"]{color:#241209}

.list-area{flex:1;overflow-y:auto;padding:0 20px calc(env(safe-area-inset-bottom) + 86px);overscroll-behavior:contain}
.list-header{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px}
.count-label{font-family:var(--font-mono);font-size:10.5px;color:var(--on-dark-soft);letter-spacing:.15em;padding:0}
.sort-toggle{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--on-dark);border-radius:999px;padding:5px 12px;font-size:11px;font-family:var(--font-mono);letter-spacing:.05em;cursor:pointer;transition:.15s}
.sort-toggle:active{transform:scale(.94)}
.term-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:15px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:transform .12s, box-shadow .2s;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.term-card:active{transform:scale(.985)}
.rank-seal{flex-shrink:0;width:42px;height:42px;border-radius:14px;background:radial-gradient(circle at 30% 24%, var(--band-nan-1), var(--band-nan-2) 88%);color:var(--seal-ink);font-family:var(--font-mono);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;position:relative;border:2px solid var(--band-nan-1);box-shadow:0 0 0 3px rgba(222,90,66,.28),0 4px 10px rgba(0,0,0,.35)}
.rank-seal.b-sho{background:radial-gradient(circle at 30% 24%, var(--band-sho-1), var(--band-sho-2) 88%);border-color:var(--band-sho-1);box-shadow:0 0 0 3px rgba(92,156,230,.3),0 4px 10px rgba(0,0,0,.35)}
.rank-seal.b-nami{background:radial-gradient(circle at 30% 24%, var(--band-nami-1), var(--band-nami-2) 88%);border-color:var(--band-nami-1);box-shadow:0 0 0 3px rgba(87,180,115,.32),0 4px 10px rgba(0,0,0,.35)}
.rank-seal.b-nan{background:radial-gradient(circle at 30% 24%, var(--band-nan-1), var(--band-nan-2) 88%);border-color:var(--band-nan-1);box-shadow:0 0 0 3px rgba(222,90,66,.28),0 4px 10px rgba(0,0,0,.35)}
.rank-seal.b-goku{background:radial-gradient(circle at 30% 24%, var(--band-goku-1), var(--band-goku-2) 88%);border-color:var(--band-goku-1);box-shadow:0 0 0 3px rgba(145,105,214,.32),0 4px 10px rgba(0,0,0,.35)}
.term-main{flex:1;min-width:0}
.term-en{font-family:var(--font-mono);font-size:10px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term-ja{font-family:var(--font-serif);font-size:17.5px;font-weight:700;letter-spacing:.02em;line-height:1.3}
.term-ja-lg{font-size:21px}
.term-kana{font-size:11px;color:var(--ink-soft);margin-top:2px}
.bm-btn{flex-shrink:0;background:none;border:none;padding:6px;cursor:pointer;color:rgba(255,138,99,.55);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.bm-btn:active{transform:scale(.85)}
.bm-btn.on{color:var(--accent)}
.bm-btn svg{pointer-events:none}
.empty-state{text-align:center;padding:60px 20px;color:var(--on-dark-soft)}
.ad-slot{margin-bottom:10px;border:1px dashed rgba(255,255,255,.2);border-radius:16px;padding:22px 16px;text-align:center;font-size:11.5px;color:var(--ink-soft);letter-spacing:.05em;position:relative;background:rgba(255,255,255,.03)}
.ad-tag{display:inline-block;background:rgba(255,255,255,.1);color:var(--on-dark-soft);font-family:var(--font-mono);font-size:9px;letter-spacing:.15em;padding:2px 8px;border-radius:999px;margin-right:8px;vertical-align:middle}
.empty-state .es-glyph{font-family:var(--font-serif);font-size:40px;opacity:.3;margin-bottom:12px;color:var(--on-dark)}
.empty-state p{font-size:13.5px;line-height:1.8}

.today-wrap{padding:20px 4px}
.today-eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.25em;color:var(--accent);margin-bottom:14px}
.today-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(10,2,1,.25)}
.today-card::after{content:'♠';position:absolute;right:-18px;bottom:-30px;font-size:130px;color:var(--ink);opacity:.045;line-height:1}
.today-card .term-en{font-size:11px;margin-bottom:6px}
.today-card h2{font-family:var(--font-serif);font-size:30px;font-weight:800;line-height:1.25;margin-bottom:4px}
.today-card .term-kana{font-size:12.5px;margin-bottom:14px}
.today-card p{font-size:13.5px;line-height:1.9;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.today-more{margin-top:16px;font-size:12.5px;color:var(--accent);font-weight:700}

.to-top-btn{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 96px);width:44px;height:44px;border-radius:50%;background:var(--seal);color:#fff;border:none;box-shadow:0 6px 16px rgba(0,0,0,.4),0 0 0 3px rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;transition:opacity .2s,transform .2s;z-index:15}
.to-top-btn.visible{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.to-top-btn:active{transform:scale(.9)}

nav{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg, rgba(20,6,3,.4), var(--hero-3) 40%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.08);display:flex;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px)}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;color:var(--on-dark-soft);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;font-family:inherit;padding:7px 4px;border-radius:14px;transition:.15s}
.nav-btn svg{width:20px;height:20px}
.nav-btn.active{color:#fff;background:var(--seal)}

.sheet-backdrop{position:absolute;inset:0;background:rgba(10,3,2,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:24px 24px 0 0;box-shadow:var(--sheet-shadow);transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,.24,1);max-height:86%;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px;flex-shrink:0}
.sheet-body{overflow-y:auto;padding:8px 24px calc(env(safe-area-inset-bottom) + 20px);overscroll-behavior:contain}
.d-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.d-en{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:5px}
.d-term{font-family:var(--font-serif);font-size:28px;font-weight:800;line-height:1.25}
.d-term-lg{font-size:33px}
.d-kana{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.d-seal-col{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0}
.d-seal-col .rank-seal{width:52px;height:52px;font-size:24px;border-radius:16px}
.d-bm{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:11.5px;color:var(--ink-soft);cursor:pointer;font-family:inherit;font-weight:500;transition:.15s;white-space:nowrap}
.d-bm.on{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.d-alias{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.d-alias span{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:11px;color:var(--ink-soft)}
.d-divider{border:none;border-top:1px solid var(--line);margin:16px 0}
.d-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.25em;color:var(--accent);margin-bottom:8px}
.d-desc{font-size:14.5px;line-height:2.05;text-align:justify}
.d-quote{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative}
.d-quote::before{content:'塾長の一言';position:absolute;top:-9px;left:14px;background:var(--seal);color:var(--seal-ink);font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.1em}
.d-quote p{font-family:var(--font-serif);font-size:14px;line-height:1.95;font-weight:600;padding-top:4px}
.d-nav{display:flex;gap:10px;margin-top:22px}
.d-nav button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;color:var(--ink);cursor:pointer;font-family:inherit;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.d-nav button:active{transform:scale(.97)}
.d-nav button:disabled{opacity:.35;cursor:default}
.d-nav .arrow{color:var(--accent);font-weight:700}

/* ===== Quiz ===== */
.quiz-area{flex:1;overflow-y:auto;padding:0 20px calc(env(safe-area-inset-bottom) + 86px);overscroll-behavior:contain;display:none}
.quiz-area.visible{display:block}
.quiz-area.session{overflow:hidden;padding:0 20px calc(env(safe-area-inset-bottom) + 86px);display:none}
.quiz-area.session.visible{display:flex}

.quiz-mode-select{padding:20px 4px}
.quiz-mode-eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.25em;color:var(--accent);margin-bottom:16px}
.quiz-mode-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px;margin-bottom:12px;cursor:pointer;transition:transform .12s,border-color .15s;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(10,2,1,.22)}
.quiz-mode-card:active{transform:scale(.985)}
.quiz-mode-card:hover{border-color:var(--seal)}
.quiz-mode-card .qm-icon{font-family:var(--font-serif);font-size:28px;margin-bottom:8px;opacity:.7}
.quiz-mode-card h3{font-family:var(--font-serif);font-size:18px;font-weight:800;margin-bottom:5px}
.quiz-mode-card p{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:10px}
.quiz-mode-card::after{content:'→';position:absolute;right:20px;top:26px;font-size:18px;color:var(--accent);font-weight:700}
.qm-dots{display:flex;gap:6px}
.qm-dot{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:11px;font-weight:800;border:1.5px solid var(--line);color:var(--ink-soft)}
.qm-dot.done{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.qm-dot.locked{opacity:.4}

/* level select */
.level-back-row{display:flex;align-items:center;gap:10px;padding:6px 4px 18px}
.level-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:12px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform .12s,border-color .15s;box-shadow:0 6px 18px rgba(10,2,1,.22)}
.level-card:active{transform:scale(.985)}
.level-card.locked{cursor:default;opacity:.6}
.level-badge{flex-shrink:0;width:48px;height:48px;border-radius:11px;background:var(--seal);color:var(--seal-ink);font-family:var(--font-serif);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.level-badge.locked{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft)}
.level-main{flex:1;min-width:0}
.level-main h3{font-family:var(--font-serif);font-size:16px;font-weight:800;margin-bottom:3px}
.level-main p{font-size:12px;color:var(--ink-soft);line-height:1.6}
.level-arrow{font-size:16px;color:var(--accent);font-weight:700;flex-shrink:0}

/* ===== Quiz session: fixed 3-pane layout, no page scroll ===== */
.quiz-session{height:100%;display:flex;flex-direction:column;min-height:0}
.quiz-topbar{flex-shrink:0;padding:10px 0 8px}
.quiz-topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.quiz-hud-left{display:flex;align-items:center;gap:10px}
.quiz-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:var(--on-dark);width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.quiz-back:active{transform:scale(.92)}
.quiz-mode-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;color:var(--accent);line-height:1.5}
.quiz-mode-label small{display:block;color:var(--on-dark-soft);letter-spacing:.1em;font-size:9px}
.quiz-counter{font-family:var(--font-mono);font-size:13px;color:var(--on-dark-soft);display:flex;align-items:baseline;gap:2px}
.quiz-counter b{color:var(--on-dark);font-size:16px;font-weight:500}
.quiz-progress{width:100%;height:4px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
.quiz-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}

/* feedback bar sits at TOP, always reserves space */
.quiz-feedback-slot{flex-shrink:0;min-height:46px;display:flex;align-items:center;margin:8px 0}
.quiz-feedback-idle{width:100%;display:flex;align-items:center;justify-content:center;gap:18px;font-family:var(--font-mono);font-size:13px;padding:14px 0;border:1px dashed rgba(255,255,255,.18);border-radius:14px;color:var(--on-dark-soft)}
.quiz-feedback-idle b{font-size:16px;font-weight:600;margin-right:4px}
.quiz-feedback-idle .stat-ok b{color:var(--correct)}
.quiz-feedback-idle .stat-ng b{color:var(--wrong)}
.quiz-feedback-result{width:100%;border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;animation:fbSlide .25s ease}
.quiz-feedback-result.ok{background:var(--correct-bg);border:1px solid var(--correct)}
.quiz-feedback-result.ng{background:var(--wrong-bg);border:1px solid var(--wrong)}
.fb-msg{font-family:var(--font-serif);font-size:14.5px;font-weight:800;line-height:1.5}
.fb-msg.ok{color:var(--correct)}
.fb-msg.ng{color:var(--wrong)}
.fb-msg small{display:block;font-family:var(--font-sans);font-weight:500;font-size:11.5px;color:var(--ink);opacity:.75;margin-top:2px}
@keyframes fbSlide{0%{transform:translateY(-6px);opacity:0}100%{transform:translateY(0);opacity:1}}

.quiz-content-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;display:flex;flex-direction:column;justify-content:flex-start}
.quiz-content-scroll::-webkit-scrollbar{display:none}
.quiz-question-pane{flex-shrink:0;padding:0 0 12px}
.quiz-question-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 20px;position:relative;overflow-y:auto;max-height:32dvh;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.quiz-question-card::after{content:'♠';position:absolute;right:-14px;bottom:-24px;font-size:100px;color:var(--ink);opacity:.035;line-height:1}
.qq-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--accent);margin-bottom:10px}
.qq-text{font-size:13.5px;line-height:1.85;color:var(--ink)}
.qq-mask{color:var(--accent);letter-spacing:.02em}
.qq-term{font-family:var(--font-serif);font-size:24px;font-weight:800;text-align:center;line-height:1.4;padding:6px 0}

.quiz-choices-pane{flex-shrink:0;padding:0 0 4px}
.quiz-choices{display:flex;flex-direction:column;gap:7px}
.q-choice{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;font-size:12.5px;line-height:1.5;transition:border-color .15s,background .15s,transform .1s;text-align:left;font-family:inherit;color:var(--ink);display:flex;align-items:flex-start;gap:10px}
.q-choice:active{transform:scale(.985)}
.q-choice .q-marker{flex-shrink:0;width:23px;height:23px;border:1.5px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:var(--ink-soft);transition:.15s}
.q-choice .q-label{flex:1;padding-top:2px}
.q-choice.answered{pointer-events:none}
.q-choice.correct{border-color:var(--correct);background:var(--correct-bg)}
.q-choice.correct .q-marker{border-color:var(--correct);background:var(--correct);color:#fff}
.q-choice.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.q-choice.wrong .q-marker{border-color:var(--wrong);background:var(--wrong);color:#fff}
.q-choice.dimmed{opacity:.45}

.quiz-action-bar{flex-shrink:0;padding-top:10px;min-height:0;display:none}
.quiz-action-bar.visible{display:block}
.quiz-next-btn{width:100%;background:var(--seal);color:#fff;border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .1s}
.quiz-next-btn:active{transform:scale(.97)}

/* result */
.quiz-result{text-align:center;padding:40px 10px;overflow-y:auto}
.qr-unlock{margin:0 0 20px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:12.5px;line-height:1.7;color:var(--ink)}
.qr-unlock b{color:var(--accent)}
.qr-glyph{font-family:var(--font-serif);font-size:56px;opacity:.85;margin-bottom:12px;color:var(--on-dark)}
.qr-title{font-family:var(--font-serif);font-size:24px;font-weight:800;margin-bottom:6px;color:var(--on-dark)}
.qr-sub{font-size:13px;color:var(--on-dark-soft);margin-bottom:24px;line-height:1.7}
.qr-stats{display:flex;justify-content:center;gap:28px;margin-bottom:30px}
.qr-stat{text-align:center}
.qr-stat .num{font-family:var(--font-mono);font-size:32px;font-weight:500;color:var(--on-dark)}
.qr-stat .label{font-size:11px;color:var(--on-dark-soft);margin-top:2px}
.qr-stat .num.g{color:#7FD68A}.qr-stat .num.r{color:#FF8F72}
.qr-actions{display:flex;flex-direction:column;gap:10px}
.qr-actions button{width:100%;border-radius:14px;padding:15px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:.1s}
.qr-actions button:active{transform:scale(.97)}
.qr-retry{background:var(--seal);color:#fff;border:none}
.qr-back{background:rgba(255,255,255,.08);color:var(--on-dark);border:1px solid rgba(255,255,255,.22)}

/* ===== Settings menu ===== */
.settings-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.settings-row{display:flex;align-items:center;gap:14px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:.15s}
.settings-row:active{transform:scale(.985)}
.sr-icon{flex-shrink:0;width:38px;height:38px;border-radius:10px;background:var(--seal);color:var(--seal-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:800;font-size:16px}
.sr-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.sr-label{font-size:14px;font-weight:700}
.sr-desc{font-size:11.5px;color:var(--ink-soft)}
.sr-arrow{color:var(--accent);font-weight:700;flex-shrink:0}
.settings-sub-head{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.color-options{display:flex;flex-direction:column;gap:10px}
.color-opt{display:flex;align-items:center;gap:12px;background:var(--chip);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);font-weight:600;transition:.15s}
.color-opt.selected{border-color:var(--seal)}
.co-swatch{width:26px;height:26px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.15) inset}
.co-maroon{background:linear-gradient(135deg,#7A2216,#1B0503)}
.co-black{background:linear-gradient(135deg,#200905,#000000)}
.settings-note{font-size:12px;line-height:1.8;color:var(--ink-soft);margin-bottom:16px}
.form-field{margin-bottom:12px}
.form-field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.03em}
.form-field input,.form-field textarea{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink);font-family:inherit;resize:vertical}
.form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--seal)}
.manual-list{display:flex;flex-direction:column;gap:12px}
.manual-item{font-size:13px;line-height:1.8;color:var(--ink-soft);background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.manual-item b{color:var(--ink);font-weight:700}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const TERMS=[{"n":1,"ja":"1オーバー","lv":3,"en":"One Overcard","kana":"ワン・オーバー","alias":["ワンオーバー","ワンオーバーカード","オーバー1枚"],"desc":"自分の手札（または自分のペア）に対して、ボード上に自分より高いランクのカード（オーバーカード）が1枚だけ存在する状況を指します。例えば、ポケットのジャック（JJ）に対してフロップにクイーン（Q）が1枚落ちた状態が「1オーバー」です。オーバーカードが1枚あるということは、相手がそのカードでペアを作り、自分のペアを上回っている可能性が生まれることを意味します。1枚だけであれば相手がヒットしている確率は限定的ですが、相手のアクションやレンジと照らし合わせ、自分のペアがまだ勝っているのか負けているのかを慎重に見極める判断材料となります。","ex":"「JJに1オーバーのフロップ。相手がそのQを持っているかどうかが勝負の分かれ目だ。」"},{"n":2,"ja":"2オーバー","lv":3,"en":"Two Overcards","kana":"ツー・オーバー","alias":["ツーオーバーカード","オーバー2枚"],"desc":"自分の手札（または自分のペア）に対して、ボード上に自分より高いランクのカード（オーバーカード）が2枚存在する状況を指します。例えばポケットのテン（TT）に対し、フロップにエースとキングが落ちた状態が「2オーバー」です。オーバーカードが2枚あると、相手がそのいずれかでペアを作っている可能性が大きく高まるため、自分のミドルポケットペアなどが逆転されているリスクが高い、危険な状況とされます。また、自分がオーバーカード2枚を持つ側（例：AKでローボード）の場合は、ペアになれば一気に強くなる「2オーバー」のドローとして、状況次第で攻めの根拠にもなります。","ex":"「ポケットテンに2オーバーのボード。相手のレンジ的にもう負けている可能性が高い。」"},{"n":3,"ja":"3ベット","lv":4,"en":"3-bet","kana":"スリーベット","alias":["スリーベット","リレイズ"],"desc":"プリフロップにおいて、BBの強制ベット（1回目）、それに対するオープンレイズ（2回目）に続く、3番目のレイズアクションを指します。非常に強力なハンドを持っていることを示す強い意思表示であり、相手に大きなプレッシャーを与えてフォールドを誘う「スチール」や、複数のプレイヤーを追い出す「スクイズ」の際にも多用されます。一方で、自分のレンジをバランスさせるためのブラフとして活用されることもあり、現代ポーカーの戦略において非常に重要な役割を担います。3ベットが返された場合、相手はさらに4ベットを返すか、コールしてフロップを見るか、あるいはフォールドするかの難しい決断を迫られることになります。","ex":"ボタンから強力な3ベットを返し、相手にプレッシャーをかけた。"},{"n":4,"ja":"4ベットブラフ","lv":6,"en":"4-bet Bluff","kana":"フォー・ベット・ブラフ","alias":["ブラフ4ベット"],"desc":"プリフロップで、3ベット（リレイズ）に対してさらにレイズを被せる「4ベット」を、強いバリューハンドではなくブラフとして行うプレイを指します。相手の3ベットがブラフや中程度のハンドを含んでいると読んだ際に、こちらが最強クラスのハンドを持っているかのように見せかけ、相手を降ろすことを狙います。多くの場合、AAやKKでの「バリュー4ベット」と頻度のバランスを取るために、A5sのようにブロッカー（相手のAAやAKの組み合わせを減らす効果）を持つハンドが選ばれます。降ろせなくてもエース絡みで挽回が利く点も、ブラフ4ベットのハンド選択で重視されます。","ex":"「相手の3ベットが軽いと見て、A5sでブラフの4ベットを返した。」"},{"n":5,"ja":"5ベット","lv":5,"en":"5-bet","kana":"ファイブ・ベット","alias":["5bet","ファイブベット"],"desc":"プリフロップにおいて、4ベット（3ベットへの再レイズ）に対して、さらにもう一段レイズを被せる5番目のベットアクションを指します。ブラインド（1ベット）→オープン（2ベット）→3ベット→4ベット→5ベットと数えた、非常に高額な攻防の最終段階です。スタックが深くない限り5ベットは事実上オールインになることが多く、極めて強いバリューハンド（AA・KKなど）か、相手の4ベットがブラフだと読み切ったブラフのどちらかに、レンジが二極化（ポラライズ）します。ここまでチップが積み上がると後戻りは難しく、相手のレンジと傾向を正確に読み切る判断力が問われる、ハイステークスな局面です。","ex":"「4ベットにさらに5ベットでオールイン。ここまで来たらAAを信じるしかない。」"},{"n":6,"ja":"ABCポーカー","lv":3,"en":"ABC Poker","kana":"エー・ビー・シー・ポーカー","alias":["標準的なプレイ","教科書ポーカー","セオリー通りのプレイ","ストレートフォワード"],"desc":"複雑な裏をかいた戦略やトリッキーなプレイを避け、ポーカーの基本セオリーに忠実かつ真面目に立ち回るプレイスタイルの総称です。強いハンドではバリューを狙ってしっかりとベットし、弱いハンドでは潔くフォールドするという、期待値（EV）に基づいた教科書通りのプレイを指します。特にローステークスやフィッシュ（弱いプレイヤー）が多いテーブルでは、余計なブラフをせずこのスタイルを貫くことが、最も安定して利益を上げられる堅実な手法であるとされています。","ex":"「相手が極端にルースなので、あえてABCポーカーに徹して堅実に勝った。」"},{"n":7,"ja":"ATS","lv":7,"en":"Attempt To Steal","kana":"エー・ティー・エス","alias":["スチール試行率","アテンプトトゥスチール"],"desc":"「Attempt To Steal」の略で、そのプレイヤーが、後方のポジション（ボタン・カットオフ・スモールブラインド）から、ブラインドを奪おうとするスチール目的のオープンレイズを仕掛ける頻度を示す、HUDの統計指標（スタッツ）です。値が高いほど、広いレンジで積極的にブラインドを盗みに来るルースなプレイヤーであることを意味します。適正値の目安は40%弱とされ、極端に高い相手にはリスチール（3ベットで奪い返す）が有効になり、逆に低い相手のレイトポジションからのレイズは本物の強い手である可能性が高い、と読めます。相手のスチール頻度を把握することは、ブラインド周りの攻防を有利に進める鍵となります。","ex":"「相手のATSが高いから、ブラインドからのリスチールでチップを奪い返したい。」"},{"n":8,"ja":"Aゲーム","lv":3,"en":"A-Game","kana":"エー・ゲーム","alias":["最高の状態"],"desc":"プレイヤーが肉体的にも精神的にも最高のコンディションにあり、一切の感情的な乱れ（ティルト）なく、持てる技術を100%発揮して完璧な判断ができている状態を指します。長期的に勝ち越すためには、このAゲームをいかに長時間維持し、不運なバッドビートに直面しても平静を保てるかが重要です。自分のプレイがAゲームから外れ始めた（BやCに落ちた）と気づいた瞬間に、速やかに離席して休憩を取ることがプロのバンクロール管理の基本となります。","ex":"「今日は体調も良く、常にAゲームを維持できているので収支が非常に安定している。」"},{"n":9,"ja":"BB","lv":1,"en":"Big Blind","kana":"ビッグ・ブラインド","alias":["ビッグブラインド","大ブラインド"],"desc":"二つの意味で使われます。一つはポジションとしての「ビッグブラインド」で、ボタンから見て2つ左、スモールブラインドの隣に座り、プリフロップで最も大きい強制ベットを置く席を指します。プリフロップでは最後に行動できますが、ポストフロップ以降は最も早く行動する不利なポジションです。もう一つは金額の単位としての用法で、ブラインドやベット額、スタックの大きさを「○○BB」と表現します（例：100BBスタック）。これは異なるレートでも戦略を比較しやすくするための共通の物差しであり、スタックの深さやベットサイズを語る上での基本単位となっています。","ex":"「100BB持っているから、深いスタックを前提とした戦略を組み立てられる。」"},{"n":10,"ja":"BBアンティ","lv":1,"en":"Big Blind Ante","kana":"ビー・ビー・アンティ","alias":["Ante","アンティ"],"desc":"トーナメントにおいて、全プレイヤーが支払うべきアンティ（参加料）を、ビッグブラインド（BB）の座席のプレイヤーが全員分まとめて一括で支払うルールです。従来の一人ずつ徴収する方式に比べ、ディーラーのチップ回収の手間が省け、ゲームの進行が劇的に早まるため、現代の主要な大会では標準的に採用されています。BBのプレイヤーは一度に大きな額（通常2BB分）を支払うことになりますが、1周につき1回のみであり、長期的な負担は変わりません。ポットが最初から大きいため、アクションを促す効果があります。","ex":"「マージナルなドローハンドだったが、相手のベットに対してCCで付いて行った結果、リバーでフラッシュが完成した。」"},{"n":11,"ja":"BMCB","lv":7,"en":"Bet to Missed C-Bet","kana":"ビー・エム・シー・ビー","alias":["ミスドCBへのベット","プローブベット類似"],"desc":"「Bet to Missed C-Bet（ベット・トゥ・ミスド・シーベット）」の略で、プリフロップのアグレッサー（オリジナルレイザー）がフロップでCベットを打たずにチェックで回した後、それに対して後ろのプレイヤーがベットすることを指します。アグレッサーがCベットを「し損ねた（ミスした）」隙を突くアクションです。アグレッサーがチェックしたということは、ボードにヒットしていない弱いレンジである可能性が高いため、ここでベットを打つことは比較的安全に主導権を奪い、ポットを獲得しに行く有効な手段とされます。アグレッサーより先に打つドンクベットとは状況が異なる、ポジションを活かした攻めの一手です。","ex":"「相手がCベットを打たなかったので、BMCBでこちらから主導権を奪いに行った。」"},{"n":12,"ja":"Bゲーム","lv":3,"en":"B-Game","kana":"ビー・ゲーム","alias":["二次的な状態"],"desc":"Aゲームほど完璧ではないが、依然として大崩れはしておらず、標準的なセオリーに沿ったプレイができている状態です。メンタルゲーム」の文脈で示唆されますが、少しの疲れや集中力の欠如により、薄いバリューの取り逃しや、わずかな判断ミスが発生し始める段階を指します。この段階で踏みとどまれれば致命傷にはなりませんが、さらなる悪化（Cゲームへの移行）を防ぐための自制心が、セッションの最終的な利益を守る鍵となります。","ex":"「少し疲れが出てBゲームに落ちた気がするので、欲張らずに早めに切り上げよう。」"},{"n":13,"ja":"CC","lv":4,"en":"Continuation Call","kana":"シーシー","alias":["継続コール"],"desc":"相手のベットに対して引き続きコールで付いていくことを言います。プリフロップにおいて最後にレイズを行い、攻撃的な主導権（アグレッション）を握ったプレイヤーに対しては、プレッシャーをかけることができますが、ハンドによって上手く使い分けることで、相手のアグレッションを弱め、こちらの優位性を保つことができる場合があります。","ex":""},{"n":14,"ja":"CCB","lv":7,"en":"Call C-Bet","kana":"シー・シー・ビー","alias":["コールCベット","CBコール率"],"desc":"「Call C-Bet」の略で、フロップのCベット（継続ベット）に対して、そのプレイヤーがコールで応じる頻度を示すHUDの統計指標です。Cベットへの反応を表すFCB（フォールド）・CCB（コール）・RCB（レイズ）のうちの一つです。CCBが高い相手は、Cベットに対してレイズもフォールドもせず、とりあえずコールで様子を見る「コーリングステーション（受け身）」な傾向があると読めます。こうした相手には、ターンやリバーでもバリューベットを重ねて（バレルを続けて）チップを引き出す戦略が有効です。一方でブラフは降りてくれないため通りにくく、相手のCCBの高さは、攻め方をバリュー寄りに調整する判断材料となります。","ex":"「相手のCCBが高いので、コールされる前提でバリューを厚く取りにいく。」"},{"n":15,"ja":"Cゲーム","lv":3,"en":"C-Game","kana":"シー・ゲーム","alias":["最悪の状態","ティルト"],"desc":"感情的な苛立ち（ティルト）や極度の疲労により、論理的な思考が停止し、自暴自棄なブラフや無謀なコールを繰り返している最悪のプレイ状態です。期待値（EV）を完全に無視したギャンブルとなっており、この状態でのプレイ続行はバンクロールの破滅を招く最大の要因となります。状態としては「ティルト」として強く戒められており、Cゲームに陥ったことを自覚したならば、一刻も早くテーブルを離れることが生存への唯一の道です。","ex":"「バッドビートで頭に血が上り、完全にCゲームになってスタックを溶かしてしまった。」"},{"n":16,"ja":"EV（期待値）","lv":4,"en":"Expected Value","kana":"イー・ヴィー / イーブイ","alias":["期待値","期待収益"],"desc":"あるアクションを選択した際に、長期的な視点で平均してどれくらいの利益または損失が見込めるかを示す数学的な数値です。ポーカーにおける全ての意思決定は、このEVがプラス（+EV）になる行動を選択し、マイナス（-EV）になる行動を避けることが基本原則となります。例えば、勝率とポットオッズを計算し、期待値がプラスのアクションであれば、たとえその一回で負けたとしても、何百回、何千回と繰り返すことで着実に利益が積み重なっていくことを意味します。プロプレイヤーは目先の結果に一喜一憂せず、常にこの期待値を最大化する論理的なプレイを徹底することで、運の要素を排除し、実力で勝利を収めることを目指します。","ex":"コールするのは数学的にEVがマイナスだと判断し、フォールドを選んだ。"},{"n":17,"ja":"FCB","lv":5,"en":"Fold to C-Bet","kana":"エフ・シー・ビー","alias":["フォールドトゥCベット","CBフォールド率"],"desc":"「Fold to C-Bet」の略で、プリフロップのアグレッサーが打ってきたフロップのCベット（継続ベット）に対して、そのプレイヤーがフォールドする頻度を示すHUDの統計指標です。FCB・CCB（コール）・RCB（レイズ）は、Cベットに対する「フォールド／コール／レイズ」の三つの反応をセットで表します。FCBの値が高い相手は、Cベットに簡単に降りてしまうため、こちらは手が弱くても積極的にCベットを打つブラフが効きやすいと判断できます。逆にFCBが低い（＝降りない）相手には、安易なブラフCベットは通用せず、バリュー重視で打つべきだと分かる、ポストフロップ戦略の重要な指標です。","ex":"「相手のFCBが高いから、フロップは手を選ばずCベットで降ろしにいける。」"},{"n":18,"ja":"FLO","lv":5,"en":"Fixed Limit Omaha","kana":"エフ・エル・オー","alias":["フィックスドリミットオマハ","リミットオマハ"],"desc":"「Fixed Limit Omaha（フィックスド・リミット・オマハ）」の略称で、オマハポーカーをフィックスドリミット（固定額の賭け）ルールで行う形式を指します。オマハは各プレイヤーに4枚のホールカードが配られ、そのうち必ず2枚と、コミュニティカード3枚を組み合わせて役を作るゲームです。FLOでは、各ベッティングラウンドで賭けられる額があらかじめ決まっているため、ノーリミットのような一撃でスタックを失う展開は起きにくく、より緻密で計算的なプレイが求められます。役が強くなりやすいオマハの特性と、リミット特有の堅実さが組み合わさった、上級者向けのゲーム形式の一つです。","ex":"「FLOはオマハのドローの計算と、リミット特有の我慢が問われるゲームだ。」"},{"n":19,"ja":"GTO","lv":4,"en":"Game Theory Optimal","kana":"ジー・ティー・オー","alias":["ゲーム理論最適戦略"],"desc":"相手がどのような戦略や対策を取ってきたとしても、長期的には決して搾取される（損をさせられる）ことのない理論上の完璧な打ち方のことです。自分のハンドレンジの中にバリューベットとブラフを適切な頻度で混ぜ合わせることで、相手に読みの的を絞らせず、数学的な隙を作らない状態を維持します。非常に複雑な計算を必要とするため、主に最新のポーカーソフトやAIを用いた研究対象となっており、現代のハイステークスやプロの世界では必須の知識となっています。GTOは相手を負かすための攻撃的な武器というよりは、自分が絶対に負けないための「最強の盾」としての性質を持っており、あらゆるプレイの基準点となる考え方です。","ex":"最近はGTOに基づいた、バランスの取れたレンジ構成を学習している。"},{"n":20,"ja":"HUD","lv":4,"en":"Head-up Display","kana":"エイチ・ユー・ディー / ハッド / ヘッドアップディスプレイ","alias":["統計ツール"],"desc":"オンラインポーカーにおいて、対戦相手の過去のアクション統計（VPIP、PFR、AFなど）を、テーブル上のプレイヤー名の横にリアルタイムで数値表示する補助ツールのことです。情報の少ない「アンノウン」な相手を即座に客観的なデータでプロファイリングし、相手の傾向を瞬時に把握することを可能にします。膨大なプレイログを基にしたこのデータは、現代のオンラインポーカーにおける「最強の武器」の一つであり、データに基づいた論理的なエクスプロイト戦略を立てる上での必須アイテムとなっています。","ex":"「HUDの数値を確認したところ、相手は3ベットに対してほぼ100%フォールドしている。」"},{"n":21,"ja":"ICM","lv":7,"en":"Independent Chip Model","kana":"アイ・シー・エム","alias":["独立チップモデル"],"desc":"トーナメントにおいて、手持ちの「チップ量」を「実際の賞金額の価値」に換算する数学的モデルのことです。トーナメントの最終盤やファイナルテーブルでは、チップを失うリスクが賞金獲得額に直結するため、通常の期待値計算（cEV）とは異なるICMを意識した戦略が必要になります。これにより、無理な勝負を避けて入賞順位を上げるべきか、あるいは優勝を狙ってリスクを取るべきかという、賞金差を考慮した高度な意思決定が可能になります。","ex":"「ファイナルテーブルではICMの影響が強いため、普段よりもタイトに立ち回る必要がある。」"},{"n":22,"ja":"IP","lv":1,"en":"In Position","kana":"イン・ポジション","alias":["アイピー"],"desc":"特定の相手に対して、ベッティングラウンドで「後にアクションを行える」有利な位置関係のことです。相手のチェック、ベット、フォールドといった行動を全て観察した上で自分の意思決定ができるため、情報の面で圧倒的な優位性を誇ります。情報の非対称性を利用してポットの大きさをコントロールしたり、相手の弱気なサインを見て効果的なブラフを仕掛けたりすることが容易になります。ポーカーでは「情報の差が利益の差」に直結するため、インポジションでプレイできる頻度を増やすことが収益性を高める鍵となります。特にボタン（BTN）ポジションは、プリフロップ以外の全てのラウンドで常にインポジションとなるため、最強の座として君臨します。","ex":"ボタンは常にIPで戦えるため、最も収益性が高いポジションだ。"},{"n":23,"ja":"ITM","lv":2,"en":"In The Money","kana":"アイ・ティー・エム","alias":["インマネ"],"desc":"「In The Money」の略称で、日本語では「インマネ（入賞）」と呼ばれます。トーナメントにおいて、参加者の上位数％に入り、賞金獲得が確定した状態を指します。このITMが確定する直前の、あと一人で誰かが敗退すれば賞金圏内に入るという局面を「バブル」と呼び、プレイヤー間の駆け引きが最も激しくなる時間帯です。ITMに到達することは、トーナメントプレイヤーにとって最初の大きな目標であり、ここを突破することで初めてリスクを恐れない攻撃的なプレイが可能になります。長期的な戦績を安定させるために非常に重要な指標の一つです。","ex":"ようやくITMが決まったので、ここからは優勝を狙って積極的に打つ。"},{"n":24,"ja":"JCSホールデム","lv":2,"en":"JCS Hold'em","kana":"ジェイ・シー・エス・ホールデム","alias":["日本カジノスクール","カジノカフェ"],"desc":"「日本カジノスクール（Japan Casino School）」が運営する、東京・新宿エリアにあるアミューズメントポーカーの教室・施設です。ディーラー養成機関が母体であるため、本場ラスベガス式のディーリングと、追加料金なしで受けられる充実した初心者講習が大きな特徴とされています。日本では金銭を賭けるポーカーが認められていないため、参加費（施設利用料）を支払って受け取ったチップでリングゲームやトーナメントを楽しむ形式を取ります。マナーや進行がしっかり管理されており、初心者でも安心して基礎から学べる環境として、これからポーカーを始める層の入り口としてよく名前が挙がる施設です。","ex":"「ポーカーを始めるなら、まずJCSホールデムの初心者講習を受けてみるといいよ。」"},{"n":25,"ja":"JOPT","lv":1,"en":"Japan Open Poker Tour","kana":"ジェーオーピーティー","alias":["ジャパンオープンポーカーツアー","プライズパスポート","ジャパン・オープン・ポーカー・トーナメント"],"desc":"「Japan Open Poker Tour（ジャパンオープンポーカーツアー）」の略称で、2011年から続く日本最大級のポーカートーナメントシリーズです。東京・大阪・札幌などで大型大会が開催され、メインイベントには千人を超えるプレイヤーが集まることもあります。日本では金銭を賭けるポーカーが認められていないため、上位入賞者には現金ではなく、WSOPなど海外の主要大会への参加費・渡航費を支援する「選手契約（プライズパスポート）」がオファーされる独自の仕組みを採用しています。全国のポーカールームで行われる予選（サテライト）やオンライン予選を勝ち抜いて本戦を目指すのが基本的な流れで、日本から世界へ挑戦する登竜門的な大会です。","ex":"「サテライトを勝ち抜いて、今年こそJOPTのメインイベントに出るのが目標だ。」"},{"n":26,"ja":"K.O.バウンティ","lv":3,"en":"K.O. Bounty","kana":"ケー・オー・バウンティ","alias":["ノックアウト賞金"],"desc":"トーナメントにおいて、対戦相手を敗退（ノックアウト）させた際、そのプレイヤーの賞金首（バウンティ）としてあらかじめ設定されていた賞金を即座に、または入賞時に獲得できる特別なルールです。通常、参加費の一部がこのバウンティプールに充てられます。相手を飛ばすこと自体に直接的な現金価値が発生するため、通常のトーナメントよりも遥かにアグレッシブなプレイが展開されます。特にバウンティが付いているショートスタックのプレイヤーに対しては、普段なら降りるような広いレンジでコールされることが多く、独特の戦術的ダイナミクスが生まれます。","ex":"「チップリーダーをバストさせ、高額なK.O.バウンティを獲得して軍資金を潤した。」"},{"n":27,"ja":"ブラフオールイン","lv":5,"en":"Bluff All-in","kana":"ブラフオールイン","alias":["オールインブラフ","シャブ（Shove）ブラフ","ムーブイン"],"desc":"自分のハンドが弱い、またはまだ完成していない状態で、相手を降ろす（フォールドさせる）ことを目的に全チップを賭けるオールインを行うプレイのことです。成功すれば相手が持つより強いハンドからでもポットを奪えますが、コールされた場合はトーナメントなら敗退、キャッシュゲームならスタック全額を失う大きなリスクを伴います。単なる度胸試しではなく、相手のレンジ（持ち得るハンドの範囲）、ボードの構成、これまでのベット経緯に「強いハンドを持っている」という一貫したストーリーがあるかどうかが成否を分けます。フラッシュドローやストレートドローなど、コールされても勝ちの目が残る「セミブラフ」としてのオールインは、純粋なブラフよりも合理的な選択とされることが多いです。","ex":"「リバーでフラッシュが完成した盤面を利用して、ブラフオールインを仕掛けたら相手はツーペアを降りてくれた。」"},{"n":28,"ja":"LAG（ルースアグレッシブ）","lv":4,"en":"Loose Aggressive","kana":"ラグ / ルース・アグレッシブ","alias":["攻撃的な広域プレイヤー"],"desc":"比較的幅広いハンドでゲームに参加し（ルース）、かつ積極的にベットやレイズを仕掛けて主導権を握る（アグレッシブ）、非常に攻撃的で予測が難しいプレイスタイルです。ハンドのランクに関わらずプレッシャーをかけ続けるため、相手はフォールドせざるを得ない場面が増え、多くのポットを奪うことができます。ただし、自分も弱い手で勝負していることが多いため、カウンター（逆襲）に遭うリスクも高く、高いポストフロップの技術とメンタルの強さが要求される、ハイリスク・ハイリターンの上級者向けスタイルです。","ex":"「LAGスタイルのプレイヤーが隣にいると、常に難しい判断を迫られることになる。」"},{"n":29,"ja":"MDF","lv":9,"en":"Minimum Defense Frequency","kana":"エム・ディー・エフ","alias":["最小ディフェンス頻度"],"desc":"「Minimum Defense Frequency」の略で、日本語では「最小ディフェンス頻度」と呼ばれます。相手のベットに対し、相手がブラフだけで利益を上げられないようにするために、自分が最低限ディフェンス（コールまたはレイズ）しなければならない割合を示す理論上の数値です。例えば、相手がポットと同額をベットしてきた場合、理論上は50%以上の頻度で守らなければ、相手は適当な手でベットするだけで得をすることになります。GTO戦略の基礎となる重要な概念であり、自分のハンドが弱くても、レンジ全体を守るためにコールすべきか否かを判断する基準となります。","ex":"相手の大きなベットに対し、MDFを意識して一部のマージナルハンドでコールした。"},{"n":30,"ja":"MTT","lv":1,"en":"Multi Table Tournament","kana":"エム・ティー・ティー","alias":["マルチテーブルトーナメント"],"desc":"複数のテーブルにまたがって数百人、時には数千人のプレイヤーが同時に参加する大規模なトーナメント形式です。プレイヤーが脱落するたびにテーブルが統合（ブレイク）され、最後の一人になるまで戦いが続きます。参加人数が多い分、優勝者に支払われるプライズ（賞金）は非常に高額になり、夢のあるエキサイティングな競技体験が可能です。世界的なポーカー大会のメインイベントはほぼすべてこの形式であり、数日間にわたる持久力、集中力、そして一瞬の運を味方につける戦略が必要となります。","ex":"「世界最大規模のMTTであるWSOPメインイベントに出場するのが、全プレイヤーの夢だ。」"},{"n":31,"ja":"M値","lv":6,"en":"M-Ratio","kana":"エムチ","alias":["Mゾーン"],"desc":"トーナメントで、自分のスタックが1周分のブラインドとアンティの合計の何倍あるかを示す指標です。プロのダン・ハリントンが提唱したもので、M値が小さいほどブラインドに圧迫されて余裕がない危機的な状況を意味します。この数値を基準に「まだ待てるか」「もう勝負すべきか」を判断し、プッシュ・フォールド戦略を組み立てます。","ex":"「M値が5を切ってきたので、もう待っている余裕はなく勝負を仕掛けるしかない。」"},{"n":32,"ja":"NLHE","lv":2,"en":"No-Limit Hold'em","kana":"エヌ・エル・エイチ・イー","alias":["テキサスホールデム"],"desc":"「No-Limit Hold'em（ノーリミット・テキサスホールデム）」の略称です。現在、世界中で最も普及しており、テレビ中継や大規模トーナメントのメイン種目となっているポーカーの形式です。その名の通り、自分の順番であればスタックにあるチップ全額（オールイン）まで、上限なくいつでもベットできるのが最大の特徴です。戦略性が極めて高く、数学的な確率計算に加えて、心理的な駆け引きや度胸、ポジションの活用など、あらゆるスキルを駆使して競われる「ポーカーの王道」とされています。","ex":"今夜のメインイベントは、最も人気のあるNLHE形式で行われる。"},{"n":33,"ja":"PFR","lv":5,"en":"Pre-Flop Raise","kana":"ピー・エフ・アール","alias":["プリフロップレイズ率"],"desc":"プリフロップにおいて、自分からレイズをしてポットに参加した頻度を示す統計指標です。この数値が高いほど攻撃的（アグレッシブ）であり、逆に低いほど消極的であると判断されます。オンラインポーカーのHUD（ヘッドアップディスプレイ）でVPIPと並んで最も重視されるデータであり、相手が「強い手でのみ打ってくるのか」あるいは「広い範囲で仕掛けてくるのか」をプロファイリングする際の客観的な基準となります。","ex":"「彼のPFRは非常に低いので、レイズしてきた時はモンスターハンドを警戒すべきだ。」"},{"n":34,"ja":"PLO","lv":3,"en":"Pot Limit Omaha","kana":"ピー・エル・オー","alias":["ポットリミットオマハ"],"desc":"4枚のホールカード（手札）が配られ、そのうちの2枚とボードの3枚を組み合わせて役を作る「オマハ」を、ポットリミット形式でプレイするルールです。テキサスホールデムに次いで世界中で非常に人気のある種目です。手札が多いため強力な役が成立しやすく、常にナッツ（最強）を目指す戦略が求められます。ベット上限がポット額に制限されているため、数学的なオッズ計算が極めて重要視され、アクションが非常に活発で大きなポットが動きやすい、エキサイティングな形式です。","ex":"「ホールデムに飽きたプレイヤーの間で、最近はPLOの熱狂的なファンが増えている。」"},{"n":35,"ja":"RCB","lv":5,"en":"Raise C-Bet","kana":"アール・シー・ビー","alias":["レイズCベット","CBレイズ率"],"desc":"「Raise C-Bet」の略で、フロップのCベット（継続ベット）に対して、そのプレイヤーがレイズで反撃する頻度を示すHUDの統計指標です。Cベットへの反応を表すFCB（フォールド）・CCB（コール）・RCB（レイズ）のうちの一つです。RCBが高い相手は、Cベットに対して積極的にレイズを返してくるアグレッシブなタイプで、その中にはブラフのレイズも多く含まれると考えられます。そのため、こちらの弱いCベットは降ろされやすい一方、強いハンドを持っている時はレイズを誘って大きなポットを狙えます。逆にRCBが極端に低い相手のレイズは、本物の強い手である可能性が高い、と読めます。相手のレイズにどう対応するかを決める重要な手掛かりです。","ex":"「相手のRCBが高い。Cベットにレイズを返してきても、ブラフを疑ってよさそうだ。」"},{"n":36,"ja":"ROI","lv":4,"en":"Return on Investment","kana":"アール・オー・アイ","alias":["投資収益率"],"desc":"支払った参加費（バイイン）に対し、平均してどの程度の利益（賞金）を得られたかを示す、トーナメントプレイヤーの実力を測るための重要指標です。計算式は「（獲得賞金総額 － 参加費総額） ÷ 参加費総額」で算出されます。ROIがプラスであれば、長期的に見てそのレートや形式のトーナメントで勝ち越していることを意味します。運の要素が大きい短期的な結果に惑わされず、数千ハンド、数百トーナメント単位でのROIを分析することで、自分の真の実力を客観的に把握できます。","ex":"「1年間のROIを算出したところ、20%を維持できており順調に収支が伸びている。」"},{"n":37,"ja":"SB","lv":1,"en":"Small Blind","kana":"スモール・ブラインド","alias":["スモールブラインド","小ブラインド"],"desc":"ボタンの左隣に座り、プリフロップでビッグブラインドの半額（一般的）の強制ベットを置くポジションを指します。すでにブラインドとしてチップを投じているため割安に参加したくなりますが、ポストフロップでは最も早く行動しなければならない最も不利なポジションの一つであり、扱いの難しい席です。多人数では「コンプリート（ビッグブラインドとの差額を払って参加）」するか、3ベットするか、降りるかの判断が重要になります。位置的不利を踏まえ、参加ハンドを慎重に選ぶ規律が求められます。","ex":"「SBは位置が悪いので、安易にコンプリートせず降りることも多い。」"},{"n":38,"ja":"SHC","lv":3,"en":"Starting Hand Chart","kana":"エス・エイチ・シー","alias":["スターティングハンドチャート","ハンドレンジ表","プリフロップチャート"],"desc":"「Starting Hand Chart（スターティングハンドチャート）」の略で、プリフロップにおいて、各ポジションからどのスターティングハンドで・どうアクションすべきか（レイズ・コール・フォールド）を、一覧表にまとめたものです。ポーカーの土台となるプリフロップの判断を、感覚ではなく基準に沿って行えるようにする学習ツールで、特に初心者が最初に身につけるべき指針として重宝されます。ポジションが良くなるほど参加できるハンドの範囲が広がる、といった基本原則を視覚的に理解できます。あくまで標準的な出発点であり、相手や状況に応じてここから調整（エクスプロイト）していくのが上達の道筋です。","ex":"「まずはSHCを覚えて、プリフロップの参加基準を安定させるところから始めよう。」"},{"n":39,"ja":"SPR","lv":6,"en":"Stack-to-Pot Ratio","kana":"エス・ピー・アール","alias":["スタック・ポット比"],"desc":"「Stack-to-Pot Ratio」の略で、スタックとポットの比率を指します。計算式は「有効スタック ÷ フロップ時点のポット額」です。この数値は、そのハンドにおいてプレイヤーがどれだけ簡単にポットにコミット（全額投入）するかを決定づける指標となります。SPRが低い（例：3以下）ほど、トップペアなどの強いメイドハンドで早々にオールインすべき状況になり、逆にSPRが高い（例：15以上）ほど、ドローハンドの価値が高まり、リバーまでの深い戦略が必要になります。今どの程度の深さで戦っているかを瞬時に把握するための必須概念です。","ex":"SPRが極めて低いため、トップペアでもコミットしたと判断して勝負した。"},{"n":40,"ja":"STT","lv":3,"en":"Single Table Tournament","kana":"エス・ティー・ティー","alias":["シングルテーブルトーナメント"],"desc":"その名の通り、1つのテーブル（通常9人〜10人）のみで行われ、その中での順位を決定する小規模なトーナメント形式です。人数が最初から固定されており、テーブルが埋まり次第すぐに開始されることが多いため「シットアンドゴー（SNG）」の形態でよく行われます。大規模な大会（MTT）に比べて短時間（通常1時間程度）で決着がつき、トーナメント特有のバブル付近の攻防や、賞金獲得の達成感を効率よく体験できるため、初心者から上級者まで幅広く親しまれています。","ex":"「空き時間にSTTに参加して、ショートスタックでのプッシュ戦略を練習した。」"},{"n":41,"ja":"TAF","lv":7,"en":"True Aggression Factor","kana":"ティー・エー・エフ","alias":["アグレッションファクター","AF","攻撃性指標"],"desc":"そのプレイヤーのポストフロップでの攻撃性（アグレッション）を数値化したHUDの統計指標で、GGポーカーのスマートHUDなどで用いられます。基本的な考え方は、ベットやレイズといった「攻めのアクション」が、コールなどの「受けのアクション」に対してどれだけ多いかを表すもので、値が大きいほどアグレッシブ、小さいほどパッシブ（受け身）なプレイヤーであることを意味します。アグレッションファクター（AF）の一種で、ベット・レイズを多用する相手か、コール中心の相手かを一目で把握できます。相手のTAFが高ければブラフを疑って受けやすくなり、低ければそのベットを額面通り強い手と信じやすい、という調整の指標になります。","ex":"「相手のTAFがかなり高いから、リバーの大きなベットもブラフを含むと見てコールできる。」"},{"n":42,"ja":"TAG（タイトアグレッシブ）","lv":4,"en":"Tight Aggressive","kana":"タグ / タイト・アグレッシブ","alias":["堅実的なプレイヤー"],"desc":"参加するハンドを厳選して無駄なチップを失わず（タイト）、一度参加すると決めたらベットやレイズを多用して積極的にポットを奪いに行く（アグレッシブ）、非常に堅実で強力なプレイスタイルです。現代ポーカーにおいて最も安定して収益を上げられる模範的なスタイルとされており、多くのプロや中上級者がこのスタイルを基本としています。TAGを装いつつ、要所でブラフを混ぜることで、相手に読みづらい強力なプレッシャーを与えることが可能になります。","ex":"「彼は典型的なTAGプレイヤー。彼がレイズしてきた時は相応の強さを警戒する。」"},{"n":43,"ja":"UTG","lv":1,"en":"Under the Gun","kana":"アンダー・ザ・ガン","alias":["アンダーザガン","一番手"],"desc":"ビッグブラインドの左隣、すなわちプリフロップで最初に行動しなければならない、最も早いポジションを指します。「銃を突きつけられた（追い詰められた）」状態になぞらえた呼び名です。自分の後ろに行動するプレイヤーが最も多く残っているため、後から強いハンドで3ベットされるリスクが高く、最も不利なポジションとされます。そのためUTGから参加する際は、どんな相手に見られても戦える強いハンド（プレミアム中心）に絞った、タイトな（狭い）レンジでのオープンが基本です。ポジションが後ろになるほど参加レンジを広げられる、という原則の出発点となる席です。","ex":"「UTGからのオープンはレンジが強い。安易に軽いハンドでコールするのは危険だ。」"},{"n":44,"ja":"VPIP","lv":5,"en":"Voluntarily Put In Pot","kana":"ブイ・ピー・アイ・ピー","alias":["参加率"],"desc":"「Voluntarily Put In Pot」の略で、プリフロップにおいて、ブラインド以外に自分から進んでチップをポットに入れた割合（参加率）を示すスタッツ用語です。オープンレイズやコールでの参加が含まれますが、フォールドやチェックは含まれません。この数値が高いプレイヤー（30%以上など）は「ルース」と判断され、多くの弱いハンドで参加していることが分かります。逆に数値が低いプレイヤーは「タイト」であり、強力なハンドを厳選していると推測できます。オンラインポーカーなどで相手の傾向を客観的に数値化して分析するための最も基本的なデータです。","ex":"彼のVPIPは40%を超えており、かなりルースなプレイスタイルだ。"},{"n":45,"ja":"WMSD","lv":6,"en":"Won Money at Showdown","kana":"ダブリュー・マネー・エス・ディー","alias":["W$SD","WSD","ショーダウン勝率"],"desc":"「Won Money at Showdown」の略（WSD／WMSDとも表記）で、ショーダウン（手の見せ合い）まで到達したハンドのうち、そのプレイヤーがポットを獲得できた割合を示すHUDの統計指標です。「ショーダウン勝率」とも呼ばれます。適正値の目安は49〜54%前後とされますが、この数値は単独ではなく、必ずショーダウン到達率（WTSD／WT）とセットで見る必要があります。というのも、滅多にショーダウンまで行かない（WTSDが低い）プレイヤーは、強い手でしか見せ合いに来ないため勝率が自然と高くなるからです。逆にW$SDが極端に低い場合は、弱い手でコールしすぎているか、ブラフが多すぎる傾向を疑えます。相手がどんな手で見せ合いに来るかを推測する材料となります。","ex":"「相手はWTSDが低いのにW$SDも低い。かなり無理なコールが多いと読める。」"},{"n":46,"ja":"WSD","lv":6,"en":"Won at Showdown","kana":"ダブリュー・エス・ディー","alias":["ショーダウン勝率"],"desc":"ショーダウンにまで至ったハンドのうち、実際にポットを獲得して勝利した割合のことです。WTSD（到達率）とセットで分析されることが多く、WTSDが高くWSDが低いプレイヤーは、弱い手で無理にコールしすぎていることが推測されます。逆にどちらも高い場合は、非常に強いハンドだけを持ってショーダウンに挑んでいることを示します。自分のプレイを振り返る際、適切なハンドで最後まで戦えているかを測るための、ポストフロップにおける収益性のバロメーターです。","ex":"「最近WSDが低下しているので、リバーでの無謀なコールがないか見直す必要がある。」"},{"n":47,"ja":"WSOP","lv":2,"en":"World Series of Poker","kana":"ダブリュー・エス・オー・ピー","alias":["ワールドシリーズオブポーカー","メインイベント"],"desc":"毎年アメリカのラスベガスで開催される、世界最大かつ最も権威のあるポーカーのトーナメントシリーズです。1970年に始まり、数十種目に及ぶ多彩なイベントが行われ、各種目の優勝者には栄誉の象徴である「ブレスレット」が授与されます。中でも最高峰の「メインイベント」は、参加費1万ドルのノーリミットホールデムで、優勝すれば莫大な賞金と「世界チャンピオン」の称号を手にできることから、世界中のプロ・アマチュアプレイヤーが憧れる大舞台です。ポーカーを競技として捉えるプレイヤーにとって、WSOPでの結果は実力を証明する最高の勲章とされています。","ex":"「いつかWSOPのメインイベントで、あのブレスレットを腕に巻きたい。」"},{"n":48,"ja":"WT","lv":6,"en":"Went to Showdown","kana":"ダブリュー・ティー","alias":["WTSD","ウェントトゥショーダウン","ショーダウン到達率"],"desc":"「Went to Showdown」の略（WTSDとも表記）で、フロップまで進んだハンドのうち、そのプレイヤーが最終的にショーダウン（手の見せ合い）まで到達した割合を示すHUDの統計指標です。GGポーカーのスマートHUDなどでは「WT」と表示されます。値が高いプレイヤーは、弱い手でも簡単には降りず最後まで勝負を見に来るタイプで、ブラフが通じにくいと判断できます。逆に値が低いプレイヤーは、強い手でなければ途中で降りるタイトなタイプなので、ブラフを仕掛けるチャンスが多いと読めます。適正値の目安は20〜30%前後とされ、ショーダウン勝率（WSD／WMSD）とセットで見ることで、相手のプレイスタイルをより正確に評価できます。","ex":"「相手のWTが低いから、ショーダウンまで行かないうちにブラフで降ろしやすい。」"},{"n":49,"ja":"WTSD","lv":6,"en":"Went to Showdown","kana":"ダブリュー・ティー・エス・ディー","alias":["ショーダウン到達率"],"desc":"フロップを見たプレイヤーが、最終的に「ショーダウン」まで辿り着いた割合を示す統計データです。この数値が高いプレイヤーは「コーリングステーション」の傾向があり、逆に低いプレイヤーは「慎重すぎる」か「ブラフで降ろされやすい」可能性があります。相手がどれだけ粘り強く勝負に残るタイプかを判断する材料となり、相手のWTSDが高い場合には、薄いバリュー（シンバリュー）を狙ったベットがより収益性の高いアクションとなります。","ex":"「相手のWTSDが異常に高いため、中途半端なブラフはせず、強い手でバリューを狙う。」"},{"n":50,"ja":"WWSF","lv":6,"en":"Won When Saw Flop","kana":"ダブリュー・ダブリュー・エス・エフ","alias":["フロップ後獲得率","フロップを見て勝った割合","WWSF%"],"desc":"フロップを見たハンドのうち、最終的にポットを獲得した割合を示す指標です。この数値が高いプレイヤーは、たとえ役ができていなくてもブラフやアグレッション（攻撃性）を駆使してポットを奪い取る能力が高いことを示唆します。ショーダウンまで行かずに相手を降ろして勝つ頻度が含まれるため、プレイヤーの「技術的な積極性」が最も顕著に現れるデータです。GTOに基づいたバランスの取れたプレイヤーは、この数値が一定の適正範囲に収まる傾向があります。","ex":"「彼のWWSFは50%を超えており、ポストフロップで非常に積極的に仕掛けてくる。」"},{"n":51,"ja":"アーリーポジション","lv":1,"en":"Early Position","kana":"アーリー・ポジション","alias":["UTG","アンダーザガン","UTG+1"],"desc":"相手のベットサイズ、アクションの速度、ポジション、およびボードとの関連性などのあらゆる情報を統合し、相手が現在持っている可能性のある手札の範囲（レンジ）を論理的に推測する高度な知的作業です。ポーカーにおける最強の技術の一つであり、正確なリーディングができれば、相手のブラフを見抜いてコール（ブラフキャッチ）したり、自分の弱い手で適切にフォールドしたりすることが可能になります。相手の手を特定の1枚に断定するのではなく、常に「可能性のある範囲」で考えることが基本とされています。","ex":"「アーリーポジションからはハンドを絞り、無駄なチップの放出を徹底して避ける。」"},{"n":52,"ja":"アイソレート","lv":4,"en":"Isolate / Isolation","kana":"アイソレート / アイソレーション","alias":["アイソレーション"],"desc":"プリフロップにおいて、先にコール（リンプ）で参加したプレイヤーに対し、強めのレイズを被せて他のプレイヤーをフォールドさせ、特定の相手と1対1（ヘッズアップ）の状況を意図的に作り出す戦略です。主に「弱いプレイヤー」を孤立させ、自分のポジションの優位性を活かして効率よくチップを奪うために行われます。マルチウェイ（多人数参加）では自分の勝率が下がるため、強いハンドを持っている時や、特定の相手をターゲットにする際にポットを支配しやすくするための有効なテクニックとして知られています。","ex":"フィッシュがリンプしたので、アイソレートして1対1に持ち込んだ。"},{"n":53,"ja":"アウツ","lv":1,"en":"Outs","kana":"アウツ","alias":["まくり目","逆転カード"],"desc":"現状では負けているハンドを、強力なハンドに発展させて逆転させるために必要なカード、またはその枚数を指します。例えば、あと1枚でフラッシュが完成する状態なら、デッキに残っている同じスートのカード（通常9枚）がアウツとなります。アウツの枚数を正確に把握することは、オッズ計算の基礎となり、その勝負を継続すべきか、あるいはフォールドすべきかを論理的に判断するための最も重要なステップです。","ex":"「フラッシュドローのアウツは9枚。ポットオッズに合うのでコールを選択した。」"},{"n":54,"ja":"アウトオブターン","lv":3,"en":"Out of turn","kana":"アウト・オブ・ターン","alias":["OOT","フライング","順番違い"],"desc":"ポーカーにおいて、本来自分のアクションの順番ではない時に、誤って先にアクション（チェックやフォールド、ベットなど）をしてしまう反則行為、またはその状態を指します。通称「OOT」と呼ばれます。ポーカーは情報の非対称性を利用するゲームであるため、順番を飛ばして意図を漏らすことは、他のプレイヤーに不当な情報の優位性を与えてしまい、ゲームの公平性を著しく損なう行為です。故意・過失を問わず厳禁であり、アミューズメントカジノやトーナメントでは、頻発すると警告や数ハンドの出場停止などのペナルティ対象となることがあります。","ex":"隣のプレイヤーがアウトオブターンで先にフォールドしてしまい、場が混乱した。"},{"n":55,"ja":"アウトオブポジション（OOP）","lv":1,"en":"Out of Position","kana":"アウト・オブ・ポジション","alias":["OOP","先のアクション","ノットインポジション"],"desc":"ポストフロップにおいて、特定の対戦相手よりも「先に」アクションを行わなければならない不利な順番や位置のことです。相手のアクションを見てから決断できる「インポジション（IP）」に対し、相手に情報を与えてから行動を待つ必要があるため、戦略の構築が極めて難しくなります。情報の非対称性により、同じハンドの強さでもOOPにいるだけで勝率（エクイティ）の実現が困難になるため、よりタイトで慎重なプレイが要求される座席です。","ex":"「アウトオブポジションでの戦いは常に不利なので、できるだけポットを小さく保ちたい。」"},{"n":56,"ja":"アウトサイドストレートドロー","lv":3,"en":"Outside Straight Draw","kana":"アウトサイド・ストレート・ドロー","alias":["両面待ち","オープンエンド"],"desc":"4枚の連続した数字があり、その「外側（アウトサイド）」のどちらか1枚が来ればストレートが完成する状態です（例：7 8 9 10に対し、6またはJ待ち）。一般的には「オープンエンド・ストレートドロー」という呼び名で知られています。完成させるためのカード（アウツ）が8枚存在するため、内側の1枚を待つインサイド（ガットショット）に比べて2倍の完成確率を誇り、非常に強力なドローハンドと見なされます。攻撃的なセミブラフを仕掛ける上での、最も信頼できるバックアッププランの一つです。","ex":"「フロップで完璧なアウトサイドストレートドロー。強気にベットして主導権を握る。」"},{"n":57,"ja":"アクション","lv":1,"en":"Action","kana":"アクション","alias":["行動","選択"],"desc":"自分の番が回ってきた際に選択できる、チェック、ベット、コール、レイズ、フォールドといったすべての「行動」の総称です。また、大きな賭けが行われ、ゲームが激しく動いている様子を「アクションがある」と表現することもあります。誰がどのアクションをどのタイミングで、どのサイズで行ったかを正確に把握することは、相手のハンドを絞り込む（ハンドリーディング）ための情報の断片となります。","ex":"「君の番だ、早くアクションを決めてくれ。」"},{"n":58,"ja":"アクティブハンド","lv":2,"en":"Active Hand","kana":"アクティブ・ハンド","alias":["参加中のハンド","アクティブ・プレイヤー"],"desc":"そのハンドにおいて、まだフォールド（棄権）しておらず、ポットを獲得する権利を保持したまま勝負に参加している状態の手、あるいはそのプレイヤーを指します。ショーダウンまで辿り着く可能性があり、ベッティングラウンドの意思決定に直接関与しているプレイヤーたちのアクションのみが、その後のポットの推移に影響を与えます。テーブル上で誰が「アクティブ」であるかを常に視認しておくことは、戦略の混乱を防ぐための基本動作です。","ex":"「アクティブハンドがまだ3人いるので、ここでのブラフはリスクが高い。」"},{"n":59,"ja":"アグレッシブ","lv":1,"en":"Aggressive","kana":"アグレッシブ","alias":["アグレ","攻撃的","アグロ","攻め"],"desc":"ベットやレイズ、リレイズを多用し、積極的に主導権（アグレッション）を握ろうとするプレイスタイルのことです。相手に常に決断を迫り、プレッシャーをかけ続けることで、ショーダウンまで行かずに相手をフォールドさせてポットを獲得する確率を高めることができます。対義語は受動的な「パッシブ」であり、長期的に勝ち越しているプレイヤーの多くは、このアグレッシブな姿勢を基本としています。ハンドを絞る「タイトアグレッシブ」や、広めに参加する「ルースアグレッシブ」など、状況やポジションによって攻撃の度合いを使い分けることが求められます。","ex":"彼は非常にアグレッシブなプレイヤーなので、ブラフに注意が必要だ。"},{"n":60,"ja":"アグレッション","lv":1,"en":"Aggression","kana":"アグレッション","alias":["攻撃性","攻撃的","威圧的","好戦的"],"desc":"チェックやコールといった消極的なプレイではなく、ベットやレイズを多用して自分から主導権を握ろうとする「攻撃的な姿勢」のことです。ポーカーにおいてアグレッションは強力な武器であり、相手にフォールドさせるチャンス（フォールドエクイティ）を生み出し、長期的な収益を向上させます。アグレッションの度合いを示す「アグレッションファクター（AF）」などの統計数値は、そのプレイヤーがどれほど攻撃的かを分析する際の重要な指標となります。","ex":"「彼のアグレッションは非常に高く、常にこちらに難しい決断を強いてくる。」"},{"n":61,"ja":"アグレッションファクター","lv":6,"en":"Aggression Factor","kana":"アグレッション・ファクター","alias":["AF"],"desc":"プレイヤーの攻撃性を数値化した指標で、「（ベット回数 ＋ レイズ回数） ÷ コール回数」という計算式で算出されます。この数値が高いほど、チェックやコールといった受動的なプレイを嫌い、自ら進んで主導権を握ろうとする攻撃的なプレイヤーであることを示します。オンラインポーカーのスタッツ分析において、対戦相手がどの程度アグレッシブなのかを客観的に判断するための最も基本的なデータの一つです。AFが極端に低いプレイヤーがベットしてきた際は、非常に強い役を持っている可能性が高いと推測できます。","ex":"「彼のアグレッションファクターは極めて高く、常にプレッシャーをかけてくる。」"},{"n":62,"ja":"アジャスト","lv":5,"en":"Adjust","kana":"アジャスト","alias":["エクスプロイト","調整","適応"],"desc":"対戦相手の特定のプレイスタイルや癖、弱点、あるいはその時のテーブルの雰囲気に合わせて、自分の標準的な戦略やベットサイズを柔軟に修正・変更することです。理論上の最適戦略（GTO）を基準としつつ、そこから外れたプレイをする相手から最大限の利益を奪う「エクスプロイト」の実践的な呼び名でもあります。例えば、相手がフォールドしすぎるならブラフを増やし、コールしすぎるなら強い手で大きく打つといった調整を指します。相手をよく観察し、その変化に素早く対応（アジャスト）できる能力は、勝ち続けるために不可欠な高等技術です。","ex":"相手がタイトすぎるので、ブラフの頻度を増やして戦略をアジャストした。"},{"n":63,"ja":"アップスイング","lv":4,"en":"Upswing","kana":"アップ・スイング","alias":["上振れ"],"desc":"自分のプレイの質とは関係なく、確率的に良いカードが頻繁に来たり、際どい勝負（フリップ）に連続して勝ったりすることで、スタックが急激に増え続ける好調な時期のことです。いわゆる「ツキ」がある状態で、短期間に大きな利益を上げることができます。しかし、これを自分の実力と勘違いして過信してしまうと、後の「揺り戻し」の際に致命的なミスを犯す原因にもなります。プロプレイヤーは、このアップスイングを冷静に「一時的な確率の偏り」と捉え、自身のバンクロールを堅実に管理する機会として活用します。","ex":"「最近はアップスイングが続いており、何もしなくてもチップが増えていく。」"},{"n":64,"ja":"アドオン","lv":1,"en":"Add-on","kana":"アドオン","alias":["買い増し"],"desc":"トーナメントに参加するために支払う手数料や参加費全体のことです。通常、トーナメントのバイインは「賞金プールに充てられる額」と、ポーカールームやカジノといった主催者が運営費として受け取る「エントリーフィー（またはレイク）」に分かれています。例えば、「$100 + 10」と表記されている場合、100が賞金になり、$10が手数料となります。プレイヤーにとっては、獲得できる賞金に対してどれだけの手数料がかかっているかを知る指標となり、このコストを上回る利益（ROI）を上げることが、長期的なトーナメント戦績における目標となります。","ex":"トーナメントの休憩時間に、有利に進めるためアドオンを申請した。"},{"n":65,"ja":"アドバタイズ","lv":6,"en":"Advertise","kana":"アドバタイズ","alias":["宣伝","印象付け"],"desc":"自分のプレイスタイルやレンジをわざと相手に見せることで、将来のハンドで利益を得るための「宣伝（広告）」行為です。一般的にポーカーでは、あえて派手なブラフを見せて「自分はルースだ」と印象付け、後に本物の強い手が入った際に大きなコールを引き出すために行われます。目先のポットを失うリスクを払ってでも、将来の大きなバリュー（インプライドオッズ）を最大化させるための投資的な心理戦術です。","ex":"「序盤に軽いブラフを見せておいたのは、後の大きな勝負のためのアドバタイズだ。」"},{"n":66,"ja":"アマリロ・スリム","lv":5,"en":"Amarillo Slim","kana":"アマリロ・スリム","alias":["トーマス・オースティン・プレストン"],"desc":"本名トーマス・オースティン・プレストン・ジュニア、アメリカの伝説的なプロポーカープレイヤーであり、ギャンブラーです。1972年のWSOP（ワールドシリーズオブポーカー）メインイベントを制した名手として知られ、その後のポーカーの大衆化・人気拡大に大きく貢献した立役者の一人です。痩せ型で長身、カウボーイハットがトレードマークの陽気なキャラクターと、数々の破天荒な逸話・名言（プロップベットの名人としても有名）で、ポーカーをテレビや一般大衆に広めるアイコン的存在となりました。ポーカーの歴史を語る上で欠かせない、レジェンドとして記憶されている人物です。","ex":"「アマリロ・スリムの逸話を読むと、昔のポーカーがいかに豪快だったかがよく分かる。」"},{"n":67,"ja":"アミューズメントカジノ","lv":1,"en":"Amusement Casino","kana":"アミューズメントカジノ / ポーカー店舗","alias":["アミューズ","ポーカーアミューズ","現金を賭けないポーカー","ポーカー店舗"],"desc":"金銭を賭けずにポーカーなどのカジノゲームを楽しめる、日本独自の遊技施設のことです。日本では現金を賭けるギャンブルが法律で認められていないため、プレイヤーは入場料や施設利用料（時間制・1日制など）を支払い、その対価として受け取ったチップでゲームを楽しみます。獲得したチップを現金に換金することはできず、あくまで技術の研鑽や交流、エンターテインメントとして運営されているのが特徴です。本場さながらのディーラーやテーブルで実戦感覚を養えるため、オンラインだけでは得られないライブポーカーの経験を積む場として、初心者から競技志向のプレイヤーまで幅広く利用されています。","ex":"「オンラインで練習したら、次はアミューズメントカジノで生のライブポーカーを体験しよう。」"},{"n":68,"ja":"アンダーカード","lv":2,"en":"Undercard","kana":"アンダー・カード","alias":["アンダー"],"desc":"ボードに現在開かれているどのカードよりも、自分の手札（ホールカード）のランク（数字）が低い状態を指します。例えば、ボードの最低ランクが「5」の時に、自分が「2」や「3」を持っている状況です。現時点ではペアになっておらず、オーバーカードのような「次のカードでトップペアになれる」という逆転の可能性（アウツ）もほとんど期待できないため、戦略的に非常に弱い立場と見なされます。自分の手が「アンダー」であるということは、ボード上のあらゆるヒットに対して負けている可能性が高いことを意味し、通常は慎重な撤退が推奨される状況です。","ex":"「自分の手札は完全にアンダーカード。逆転の目も薄いので、ここは素直に降りよう。」"},{"n":69,"ja":"アンダーザガン","lv":1,"en":"Under the Gun","kana":"アンダー・ザ・ガン","alias":["UTG","ザガン"],"desc":"プリフロップにおいて、ブラインドを除いて最初にアクションを行わなければならない最も不利なポジションのことです。ポジションの名称として「UTG」と略されます。「銃口を突きつけられている」と比喩される通り、後に多くのアクティブプレイヤーが控えており、極度の情報不足の中で決断を迫られるため、非常に強いプレミアムハンドでなければ参加は難しいとされています。人数によって不利の度合いは変わりますが、常に鉄の規律が求められる座席です。","ex":"UTGからのオープンだったので、相手は相当強いレンジを持っているはずだ。"},{"n":70,"ja":"アンダーザガンストラドル","lv":4,"en":"Under the Gun Straddle","kana":"アンダー・ザ・ガン・ストラドル","alias":["UTGストラドル","通常ストラドル"],"desc":"最も一般的で標準的なストラドルの形で、ビッグブラインドの左隣、すなわちアンダーザガン（UTG）のポジションのプレイヤーが、自分のカードを見る前に任意でビッグブラインドの2倍額を賭ける行為を指します。これにより実質的な「3つ目のブラインド」が生まれ、ポットが大きくなるとともに、プリフロップのアクション順にも影響します。多くのカジノやポーカールームで認められている標準的なストラドルがこれにあたり、ミシシッピストラドルやボタンストラドルといった変則的なものと区別する際に「UTGストラドル」と呼ばれます。ゲームに刺激を加え、アクションを活発にする目的で用いられます。","ex":"「アンダーザガンストラドルを置いたので、いつもよりポットが大きくなりそうだ。」"},{"n":71,"ja":"アンダードッグ","lv":3,"en":"Underdog","kana":"アンダー・ドッグ","alias":["負けている側"],"desc":"特定のハンド同士の対決や状況において、数学的な勝率（エクイティ）が低い方のプレイヤー、またはハンドのことを指します。日本語では「格下」や「劣勢」といったニュアンスで使われます。対義語は、勝率が高い側の「フェイバリット」です。例えば、AA（ポケットエース）対 22（ポケットデューシズ）の戦いでは、22側が約20%の勝率しか持たないため、明確にアンダードッグとなります。しかし、ポーカーは不完全情報ゲームであるため、アンダードッグであってもショーダウンで逆転して勝利を収めることがあり、その意外性がゲームの面白さを生んでいます。","ex":"フロップ時点ではアンダードッグだったが、リバーで劇的な逆転を果たした。"},{"n":72,"ja":"アンダーベット","lv":4,"en":"Underbet","kana":"アンダー・ベット","alias":["スモールベット"],"desc":"ポットに対して非常に小さな額（通常33%以下など）をベットすることです。アンダーベットは相手に安価なオッズを与えつつも、自分のマージナルな手で薄いバリューを取ったり、相手に難しい決断をさせたりするために現代戦略では多用されます。特にナッツの可能性が低い状況でポットをコントロールしたい際や、相手のブラフを誘発したい時に、精緻なサイズ調整として用いられる技術です。","ex":"「リバーでアンダーベットを打ち、相手のセカンドペアから何とかコールを引き出した。」"},{"n":73,"ja":"アンティ","lv":1,"en":"Ante","kana":"アンティ","alias":["強制参加費","参加料","強制ベット"],"desc":"ゲーム開始時に、ブラインドとは別にプレイヤー全員が支払わなくてはならない最低限の強制参加費です。ポーカーにおける参加料に相当し、ポットを最初から大きくすることでプレイヤーの参加を促し、アクションを活発にする効果があります。通常、トーナメントの中盤から終盤にかけて導入されることが多く、近年ではスピードアップのためにビッグブラインド（BB）が一括で全員分を支払う「BBアンティ制」も普及しています。ラテン語で「前に」という意味がある通り、カードが配られる前に徴収される、戦略上無視できないコストとなります。","ex":"アンティが導入されてから、ポットの奪い合いが激しくなった。"},{"n":74,"ja":"アンノウン","lv":3,"en":"Unknown","kana":"アンノウン","alias":["未知の相手","初対面"],"desc":"プレイスタイルや実力、癖に関する情報が全くない、初めて対戦する相手のことです。情報が重要なポーカーにおいて、相手がどのようなレンジで参加し、どの程度アグレッシブなのかが分からない状態は一つのリスクとなります。アンノウンの相手に対しては、まずはセオリー通りの標準的なプレイ（GTO寄り）で対応しながら、数ハンドから数時間のプレイを通じて情報を収集し、相手の傾向をプロファイリングしていくのが定石です。相手も自分をアンノウンだと思っている場合、情報の探り合いから戦略がスタートします。","ex":"相手がアンノウンなので、まずはスタンダードなGTO戦略で様子を見る。"},{"n":75,"ja":"イーブイ（EV）","lv":2,"en":"EV","kana":"イー・ブイ","alias":["期待値","期待収益"],"desc":"「Expected Value」の略で、あるアクションを長年繰り返した際に、1回あたり平均してどれくらいの利益（または損失）が出るかを示す数学的数値です。ポーカーの正解とは常に「EVが最大（+EV）」になる選択をすることであり、短期的な結果ではなく、この期待値の積み重ねがプロの収益を決定づけます。感情的な「ツキ」ではなく、確率と報酬のバランスを冷静に数値化した、ポーカーにおける最も神聖な判断基準です。","ex":"「あのコールは負けたけれど、数学的に見れば十分にイーブイ（EV）がプラスの判断だった。」"},{"n":76,"ja":"イニシアチブ","lv":4,"en":"Initiative","kana":"イニシアチブ","alias":["主導権","アグレッション","攻めの権利"],"desc":"そのハンドにおける「攻めの主導権」、すなわち最後にベットやレイズを行ってアグレッションを示しているプレイヤーが握る優位性を指します。一般的に、プリフロップで最後にレイズしたプレイヤー（アグレッサー）がイニシアチブを持ち、フロップ以降もCベットなどで攻め続けることが期待されます。イニシアチブを持つ側は、相手にプレッシャーをかけてポットを奪いやすく、たとえ手が弱くてもブラフで降ろせる可能性を持つため、有利に立ち回れます。誰がイニシアチブを握っているかを把握し、それを奪うか・委ねるかを判断することは、ポストフロップの戦略を組み立てる上での重要な軸となります。","ex":"「プリフロップでレイズしてイニシアチブを握ったから、フロップは積極的に打っていく。」"},{"n":77,"ja":"イマジナリー","lv":6,"en":"Imaginary","kana":"イマジナリー","alias":["仮想の","想定の"],"desc":"相手の持っている「想定されるハンドの範囲（レンジ）」や、将来的に動くであろう「仮想のチップ量」などを思考の中でシミュレーションする際に使われる言葉です。特に「イマジナリーポット（将来的に大きくなるはずのポット）」などを意識して、現在のオッズを判断する際の上級者向け概念です。今見えている情報だけでなく、相手の心理や将来のカード展開を脳内で仮想化し、論理的な裏付けとして活用する高度な推論プロセスを指します。","ex":"「イマジナリーなレンジ構成を考えれば、ここで彼がナッツを持っている確率は極めて低い。」"},{"n":78,"ja":"インサイドストレートドロー","lv":2,"en":"Inside Straight Draw","kana":"インサイド・ストレート・ドロー","alias":["ガットショット"],"desc":"ストレートを完成させるために、連続する5枚の数字の中間の1枚だけが欠けている状態のことです。一般的には「ガットショット」という呼び名で広く親しまれています。例えば、手元に「7・8」があり、ボードに「5・9」が出ている場合、間の「6」が出ればストレートになります。この状態を完成させるカード（アウツ）はデッキに4枚しか存在しないため、両端のどちらでも完成する「オープンエンド（アウツ8枚）」に比べて確率は半分と低くなります。しかしその分、相手から役の完成を読まれにくいため、不意を突いて大きな利益を得るチャンスもあります。","ex":"インサイドストレートドローだったので、オッズが合う時だけコールした。"},{"n":79,"ja":"インザマネー","lv":2,"en":"In the Money","kana":"イン・ザ・マネー","alias":["ITM","インマネ","賞金圏"],"desc":"トーナメントにおいて、賞金が支払われる順位に入ること、またその状態を指します。「ITM」「インマネ」とも略されます。例えば参加者の上位15%に賞金が出る大会なら、その順位内に残ればインザマネーです。賞金圏に入る直前の緊張した局面は「バブル」と呼ばれ、ここを越えてインザマネーを確定させると、最低限の賞金が保証されます。トーナメントの収支は、いかに高い頻度でインザマネーに入り、かつ上位（特に優勝）を狙えるかで決まります。賞金圏が近づくと、各プレイヤーの戦略はチップの期待値だけでなく、賞金額を加味したICMの影響を強く受けるようになります。","ex":"「バブルを乗り切ってインザマネー。これで最低限の賞金は確保できた。」"},{"n":80,"ja":"インスタントコール","lv":3,"en":"Instant Call","kana":"インスタント・コール","alias":["スナップコール","即コール"],"desc":"相手のベットに対して、全く迷うことなく瞬時に（インスタントに）コールするアクションです。一般的には「絶対に負けないナッツ級の手を持っている」際や、逆に「相手のブラフを100%見抜いていて迷う必要がない」場合に見られます。演出としてわざと早くコールすることで、相手を威圧したり、自分の強さを誇示したりする心理的意図が含まれることもあります。何も考えずに反射的にコールしてしまう初心者のミスと混同されないよう、上級者はあえてタイミングをズラすこともあります。","ex":"「オールインに対しインスタントコールを返し、相手のブラフを完全に粉砕した。」"},{"n":81,"ja":"インディファレント","lv":8,"en":"Indifferent","kana":"インディファレント","alias":["無差別","どっちでもいい"],"desc":"ゲーム理論（GTO）において、あるアクション（コールかフォールドかなど）の期待値（EV）が全く同じになり、どちらを選択しても長期的結果が変わらない「無差別点」の状態を指します。「GTO」の文脈で示唆されますが、相手に最適な戦略をとられた結果、こちらが何をしても利益が増えない絶妙なバランス状態です。この状態を維持することで、相手に付け入る隙を与えない（搾取されない）盤石な防御が完成します。","ex":"「彼のベットサイズは完璧で、私のレンジはここでインディファレント（無差別）にされている。」"},{"n":82,"ja":"インプライドオッズ","lv":4,"en":"Implied Odds","kana":"インプライド・オッズ","alias":["潜在的オッズ","含み益"],"desc":"現在のポットにあるチップだけでなく、将来のストリートで役が完成した際に相手からさらに引き出せるであろう「見込み利益」を加味したオッズ計算のことです。特にセット狙いのポケットペアやドローハンドにおいて、現在の直接的なポットオッズが合っていなくても、将来の大勝（逆転）を期待してコールを正当化する際に用いられます。ディープスタックの状況で真価を発揮する、中上級者必須の「夢の計算書」です。","ex":"「インプライドオッズは十分にあるので、このスモールペアでセットを引きにいく。」"},{"n":83,"ja":"インプライドポットオッズ","lv":5,"en":"Implied Pot Odds","kana":"インプライド・ポット・オッズ","alias":["潜在的ポットオッズ"],"desc":"今現在ポットに入っているチップの額だけでなく、自分の役が完成した際に「将来のストリート（ターンやリバー）で相手からさらに引き出せるであろう利益」を加味したポットオッズの考え方です。特に深いスタックでの戦いや、スーテッドコネクターやポケットペアなど、完成すれば爆発的なバリューが取れるハンドをプレイする際に極めて重要です。現時点での直接的なオッズが少し足りなくても、将来的に大きなリターンが期待できるのであれば、ドローを追ってコールすることが数学的に正当化される、という戦略的な判断材料となります。","ex":"現在のオッズは厳しいが、インプライドポットオッズが高いのでドローを追う。"},{"n":84,"ja":"インポジション（IP）","lv":1,"en":"In Position","kana":"イン・ポジション","alias":["IP","後のアクション"],"desc":"ポストフロップにおいて、特定の相手に対して「後に」アクションを行える非常に有利な位置取りのことです。相手のアクション（チェックやベットの有無）をすべて観察してから自分の決断を下せるため、情報の優位性を独占できます。同じハンドでもIPにいるだけでブラフは通りやすく、バリューは最大限に引き出せるため、ポーカーの収益の大部分はこのインポジションでのプレイから生まれると言っても過言ではありません。","ex":"「ボタンという最強のインポジションを活かし、有利にポットをコントロールした。」"},{"n":85,"ja":"ヴィリアン","lv":3,"en":"Villain","kana":"ヴィリアン","alias":["対戦相手","悪役"],"desc":"ポーカーのハンド分析や戦略を解説する際、自分（ヒーロー）と対峙している「対戦相手」を指す言葉です。本来は物語の「悪役」を意味する言葉ですが、ポーカーの文脈では単なる中立的な対戦相手の呼称として定着しています。ヴィリアンのポジション、スタッツ、プレイスタイルを客観的にプロファイリングし、それに対してヒーローがどのような期待値（EV）の高い決断を下すべきかを論理的に導き出すのが、ポーカー学習の基本的な姿勢です。相手を「敵」としてではなく、解くべき「戦略的な課題」として捉えるための用語です 。","ex":"「この局面で、ヴィリアンのレンジにブラフがどれだけ含まれるかが焦点だ。」"},{"n":86,"ja":"ウィンザボタン","lv":3,"en":"Win The Button","kana":"ウィン・ザ・ボタン","alias":["勝者ボタン制","ウィンザボタンルール"],"desc":"ポットを獲得したプレイヤーが、次のハンドで強制的にボタン（BTN）のポジションをプレイできるという、特殊なゲームレギュレーション（ハウスルール）のことです。通常のルールではボタンは時計回りに一つずつ移動しますが、このルールでは勝者が常に最強のポジションを維持できるため、連続してポットを獲ればずっと有利な立場で戦い続けることができます。アクションが非常に活発になりやすく、特定のプレイヤーが独走する可能性もあるため、通常のポーカーとは異なるアグレッシブな立ち回りと、ボタンを奪いに行くための高度な戦術が求められます。","ex":"ウィンザボタンのルールでは、連続してポットを獲ればずっと有利な位置に座れる。"},{"n":87,"ja":"ウィンレート","lv":3,"en":"Winrate","kana":"ウィン・レート","alias":["勝率","収益率"],"desc":"キャッシュゲームにおいて、一定期間や一定のハンド数（通常100ハンド単位）あたりで、どれだけの利益を上げたかを示す指標です。一般的に「bb/100（100ハンドあたりのビッグブラインド獲得数）」という単位で表されます。この数値が高いほど、そのレートにおいて実力で勝ち越していることを意味し、自分のスキルレベルやバンクロール管理の正しさを測るための最も重要なデータとなります。短期的な結果に左右されず、数万ハンドに及ぶ長期的なウィンレートを分析することで、自分の真の実力を客観的に把握することが可能になります。","ex":"「高いウィンレートを維持できているので、そろそろ上のステークスに挑戦したい。」"},{"n":88,"ja":"ウェイティングテーブル","lv":2,"en":"Waiting List","kana":"ウェイティング・テーブル","alias":["順番待ちリスト"],"desc":"満席のポーカールームにおいて、テーブルに空きが出るのを待つプレイヤーが名前を登録するリストのことです。カジノでは「ウェイティングリスト」と呼ばれ、空席（シートオープン）が発生した際に順番に呼び出されます。人気のあるカジノや時間帯では、このリストに並ぶことがポーカーセッションの最初のアクションとなります。自分のレベルに合った良い（利益の出そうな）テーブルが空くのを待つ「テーブルセレクション」の第一歩でもあります。","ex":"「カジノに到着し、まずは1/2NLのウェイティングテーブルに名前を載せた。」"},{"n":89,"ja":"ウェイティングリスト","lv":2,"en":"Waiting List","kana":"ウェイティング・リスト","alias":["キャンセル待ち","ウェイティング","順番待ちリスト","WL"],"desc":"キャッシュゲームにおいて、満席のテーブルに空きが出るのを待つプレイヤーの名前を登録した順番待ちのリストのことです。カジノやポーカールームのカウンターでスタッフに希望のステークスを伝えて登録します。席が空くと「シートオープン」の掛け声と共に名前が呼ばれ、優先的に着席できます。人気のテーブルや高レートのゲームでは長いリストができることもあります。オンラインポーカーでも同様のシステムがあり、ボタン一つで登録可能です。効率よくプレイするために、入店後まずリストを確認し、自分がプレイしたい環境を確保するための重要な手続きです。","ex":"「お目当てのテーブルが満席だったので、ウェイティングリストに名前を入れた。」"},{"n":90,"ja":"ウェットボード","lv":4,"en":"Wet Board","kana":"ウェット・ボード","alias":["危険なボード","スーコネ","ドロー"],"desc":"ストレートやフラッシュが完成しやすい、スートや数字の繋がりが非常に強いコミュニティカード（ボード）の状態です。例えば「8♠・9♠・10♥」のような並びが該当します。誰かが既に大きな役を完成させている可能性や、強力なドローハンドを持っているプレイヤーが多いことが推測されるため、非常に「危険なボード」とされます。この状況ではメイドハンドを持っていても慎重に立ち回る必要があり、相手のハンドレンジを正確に読む高度なスキルが試されます。","ex":"ボードが非常にウェットだったので、慎重にチェックを選んだ。"},{"n":91,"ja":"エアー","lv":2,"en":"Air / No Pair","kana":"エアー","alias":["ノーペア","ピュアブラフ","空気","完全な役なし","ブタ","役なし","ハイカード"],"desc":"役が全く成立しておらず、ドローの可能性もほとんどない、ショーダウンでは絶対に勝つことができない極めて弱い手札（役なしの状態）を指すスラング（造語）です。ピュアブラフを行う際のハンドの状態を指すことが多く、この手で勝つためには相手をフォールドさせる以外に道はありません。ボードとの絡みが全くない「スカスカの状態」をイメージした言葉です。また、これに近い意味で、相手に全く影響を与えない無意味なコミュニティカードを「ブランク」や「ラグ」と呼ぶこともあります。","ex":"エアーでリバーまでチェックしたが、最後にブラフを仕掛けてポットを奪った。"},{"n":92,"ja":"エアーブラフ","lv":4,"en":"Air Bluff","kana":"エアー・ブラフ","alias":["ピュアブラフ","ブラフ"],"desc":"まったく役がなく、逆転の目（アウツ）すらほとんどない「エアー（空気）」の状態で、相手をフォールドさせるためだけに打つ純粋なブラフです。「ピュアブラフ」とも言われます。コールされれば100%負けという極限のリスクを背負いますが、ボードの状況が自分に有利に見える際や、相手が弱気な時に、情報の空白を突いてポットを強奪するポーカーの最もスリリングな技術の一つです。","ex":"「最後のリバーで何も引けなかったので、覚悟を決めてエアーブラフを撃ち込んだ。」"},{"n":93,"ja":"エイトオアベター","lv":5,"en":"Eight or Better","kana":"エイト・オア・ベター","alias":["8オアベター","ロー条件","ハイロー","8ロー条件"],"desc":"ハイロースプリット（ポットをハイ役とロー役で分け合う形式）のポーカーで、ロー（弱い方）のハンドとして認められるための条件を指します。「8以下の異なる5枚のカード」、すなわち最も高いカードが8以下のローハンドを作れた場合にのみ、ロー側のポットを獲得する権利が生まれる、という規定です。この条件を満たすことを「クオリファイする」と言い、満たすローハンドが誰もいない場合は、ハイ役のプレイヤーがポット全額を獲得します。オマハハイローやスタッドハイローなどで採用され、ハイとローの両方を狙える「スクープ」を意識した戦略が、勝敗を大きく左右します。","ex":"「エイトオアベターの条件を満たすローができたから、ポットの半分は確保できそうだ。」"},{"n":94,"ja":"エースハイ","lv":1,"en":"Ace High","kana":"エース・ハイ","alias":["Aハイ"],"desc":"ハンドにA（エース）が含まれているが、ペアやストレート、フラッシュなどの役が一切成立していない「ハイカード」の状態を指します。役なしの中では最強の組み合わせであり、ショーダウンでお互いに役がなかった場合にはキッカー勝負で勝利することができます。しかし、どのようなワンペア（例：2のペア）に対しても負けてしまうため、これだけで大きなベットに付いていくのは危険です。フロップでヒットしなかった「AK」などは典型的なエースハイであり、強いハイカードを武器にブラフキャッチを狙うか、諦めて降りるかの難しい判断が迫られます。","ex":"お互いに役がなく、エースハイのキッカー勝負で辛うじて勝利した。"},{"n":95,"ja":"エクイティ","lv":2,"en":"Equity","kana":"エクイティ","alias":["ポット保有権","勝率"],"desc":"ある特定の状況において、自分のハンドがポットを獲得できる確率（勝率）のことです。プレイ考察においては、ポットの中にあるチップのうち、その時点で自分の手が保有している「理論上の取り分」を指します。例えば、AAはプリフロップ時点で他の多くのハンドに対して約80%以上の圧倒的なエクイティを持っています。自分のアクションが正しいかどうかを判断する際、ポットオッズとこのエクイティを比較し、期待値がプラスになるかどうかを数学的に評価するのがポーカー戦略の核心です。ポジションや相手の戦略によって、このエクイティをどれだけ実現できるかが変化します。","ex":"相手のレイズに対して、自分のハンドのエクイティが十分にあるか計算した。"},{"n":96,"ja":"エクイティリアライゼーション","lv":7,"en":"Equity Realization","kana":"エクイティ・リアライゼーション","alias":["勝率の実現"],"desc":"自分のハンドが持つ本来の勝率（エクイティ）を、実際のプレイを通じてどの程度「実現（回収）」できるかという概念です。ポジションの不利さや相手からの激しいプレッシャー、あるいは自分のプレイスキル不足によって、本来勝てるはずのハンドを途中でフォールドさせられてしまうと、エクイティを100%実現できていないことになります。逆に、有利なポジション（IP）にいれば、より高い割合でエクイティを実現しやすくなります。勝率の高さだけでなく、その「実現しやすさ」を考慮したハンド選択が重要です。","ex":"「ドローハンドでもIPであればエクイティリアライゼーションが高まり、有利に戦える。」"},{"n":97,"ja":"エクスプロイト","lv":5,"en":"Exploit","kana":"エクスプロイト","alias":["搾取","弱点を突く"],"desc":"理論上の最適戦略（GTO）から外れたプレイをしている対戦相手の「弱点」や「偏り」を見つけ出し、意図的にそこを突いて利益を最大化する戦略的なアプローチです。例えば、相手がフォールドしすぎる傾向にあればブラフの頻度を増やし、コールしすぎる相手には強い手でバリューベットを厚く打つ、といった調整（アジャスト）を指します。ポーカーAIのような完璧な相手ではなく、癖やミスを持つ生身の人間と対戦する際に極めて有効であり、相手をよく観察してその攻略法（アジャストメント）を素早く構築する能力は、上級プレイヤーの証とされます。","ex":"相手がフォールドしすぎる傾向にあるので、ブラフでエクスプロイトした。"},{"n":98,"ja":"エクスポーズ","lv":2,"en":"Expose","kana":"エクスポーズカード","alias":["見えたカード","露出カード"],"desc":"ディール（配牌）の際やフォールドする時に、誤って表を向いて他のプレイヤーに見えてしまったカードのことです。これによりゲームの公平性が損なわれる可能性があるため、通常は全プレイヤーにそのカードの内容が公開され、ルールによっては配り直し（ミスディール）となったり、そのまま「デッドカード」として処理されたりします。意図的にカードを見せる行為は、不正な情報伝達やテルに繋がるためマナー違反とされることも多く、物理的なカードの扱いの慎重さがプレイヤーには求められます。","ex":"「ディーラーのミスでエクスポーズカードが発生し、全プレイヤーに周知された。」"},{"n":99,"ja":"エッジ","lv":4,"en":"Edge","kana":"エッジ","alias":["優位性"],"desc":"対戦相手に対する技術的、戦略的、またはポジション上の優位性のことです。ポーカーにおいて「エッジがある」とは、自分の方がスキルレベルで上回っており、長期的には数学的に利益を上げられる状況を指します。優れたハンドを持っている場合だけでなく、優れた技術や有利なポジションを持っているプレイヤーもエッジを保持していると見なされます。プロや上級者は、自分にエッジがある相手を特定し、その相手に対して積極的に勝負を仕掛けることで期待値（EV）を積み重ねていきます。逆にエッジがない状況では、リスクを最小限に抑える立ち回りが求められます。","ex":"彼に対しては技術的なエッジがあるので、積極的に勝負を仕掛けていく。"},{"n":100,"ja":"エニー トゥー","lv":4,"en":"Any Two","kana":"エニー・トゥー","alias":["どんな2枚でも"],"desc":"カードの強弱やマークに関わらず、配られた「どんな2枚のカードでも」プレイ可能である、という極めてアグレッシブな、あるいは投げやりな状況を指す言葉です。一般的には、ブラインドが極端に大きくオールインを迫られているショートスタック時や、相手が100%降りると確信しているブラインドスチールの際に、「エニートゥー（どんな手でも）でレイズする」といった文脈で使われます。カードではなく「状況」をプレイするポーカーの本質を表すフレーズです。","ex":"「相手がフォールドしすぎているので、今はエニートゥーでスチールを狙える状況だ。」"},{"n":101,"ja":"エフェクティブスタック","lv":4,"en":"Effective Stack","kana":"エフェクティブ・スタック","alias":["有効スタック"],"desc":"あるハンドにおいて、実際に対戦しているプレイヤー同士の中で「勝負に使用できる最大チップ量」のことです。例えば、自分が1000持っていて相手が300しか持っていない場合、実際に奪い合えるのは300までとなるため、エフェクティブスタックは「300」となります。自分のスタックがいくら多くても、相手が少なければ戦略は相手のサイズに合わせる必要があり、逆に相手が多ければ自分のサイズが限界値となります。ポットの大きさやコミットの判断を行う際、常にこの「実効的なスタック量」を基準に計算することが不可欠です。","ex":"相手の方がチップが少ないため、エフェクティブスタックを基準にベットを考えた。"},{"n":102,"ja":"エムホールデム","lv":1,"en":"m HOLD'EM","kana":"エム・ホールデム","alias":["エムホ","m HOLD'EM"],"desc":"サミー株式会社（セガサミーグループ）が2021年7月にリリースした、日本の基本無料オンラインポーカー（テキサスホールデム）アプリです。片手で操作しやすい縦画面を採用し、ポーカーを「マインドスポーツ」と位置づけて競技性を重視しているのが特徴です。いつでも参加・退席できるリングゲーム中心のランクマッチや、各種トーナメント、友人と卓を立てられるクラブ機能に加え、20章以上に及ぶ初心者向けの「レッスンモード」が充実しており、ルールやセオリーを学びながら遊べる導線が整っています。有名声優・イラストレーターによるキャラクター演出も魅力です。リアルのアミューズメント店舗「m HOLD'EM 目黒」も展開。累計250万ダウンロードを達成した、国産二大ポーカーアプリの一つです。","ex":"「エムホールデムはレッスンモードが手厚いから、まったくの初心者の入門におすすめだ。」"},{"n":103,"ja":"エントリーフィー","lv":2,"en":"Entry Fee","kana":"エントリー・フィー","alias":["参加費","登録料"],"desc":"トーナメントに参加するために支払う総額のうち、賞金プール（プライズプール）に充てられる額と、主催者が運営費として徴収する額の合計、または手数料部分そのものを指します。一般的に「100+10」のように表記され、後の小額の方がエントリーフィー（手数料）に当たります。これを支払うことでプレイヤーはスターティングチップを受け取り、競技に参加する権利を得ます。キャッシュゲームの「レーキ」に相当するもので、トーナメントプレイヤーはこのコストを上回る期待値を稼ぐことが長期的な目標となります。","ex":"「この大会はエントリーフィーが安く、プレイヤーにとって非常に還元率が高い。」"},{"n":104,"ja":"オーシャン","lv":2,"en":"Ocean","kana":"オーシャン","alias":["6枚目のカード"],"desc":"テキサスホールデムにおいて、本来は5枚（リバー）までで終了するコミュニティカードの「6枚目」が開いた状態、あるいはそのカード自体を指す俗称です。5枚目のカードである「River（川）」に対して、そのさらに先にあるものとして「Ocean（海）」と名付けられた説があります。ただし、標準的なルールにおいて6枚目のカードが配られることはなく、主にホームゲームや仲間内での冗談、あるいは特殊なローカルルールにおいて使われるスラング（造語）に近い言葉です。公式なカジノやトーナメントでこの用語が実用的に使われることはほとんどなく、国外で通じるかどうかも不明な用語です。","ex":"仲間内の冗談で、リバーの後にオーシャンを開こうなんて盛り上がった。"},{"n":105,"ja":"オーバーカード","lv":2,"en":"Overcard","kana":"オーバー・カード","alias":["上位カード","コミュニティカードの上のカード"],"desc":"ボードに現在開かれているどのカードよりも、自分の手札（ホールカード）のランクが高い状態のカードを指します。例えば、ボードが「J-8-3」で自分が「A-K」を持っていれば、AとKの両方がオーバーカードです。現時点では役がありませんが、ターンやリバーでこれらのカードがヒットすれば「トップペア」という強力な役を完成させて逆転できるポテンシャル（アウツ）を秘めています。アグレッションを継続する際の論理的な裏付けとして非常に重要な要素となります。","ex":"「フロップは外したが、オーバーカードが2枚あるのでCベットを打った。」"},{"n":106,"ja":"オーバーコール","lv":3,"en":"Overcall","kana":"オーバー・コール","alias":["被せコール"],"desc":"既に一人以上のプレイヤーがベットに対しコールしている状況で、さらに自分もそれに続いてコールすることです。「コールドコール」と近い状況ですが、特に「既にコールが入っているポットに3人目、4人目として参加する」ことを強調する際に使われます。マルチウェイポットになるため、ナッツ級の役を完成させるための高いポテンシャルが必要となり、中途半端なペアでのオーバーコールは、自分がドミネイト（圧倒的劣勢）されているリスクを孕みます。","ex":"「一人のベットと一人目のコールに対し、ドローのオッズが良いのでオーバーコールした。」"},{"n":107,"ja":"オーバーペア","lv":2,"en":"Overpair","kana":"オーバー・ペア","alias":["コミュニティカードよりも上位のポケットペア"],"desc":"自分の手元のポケットペアが、ボードに出ているどのコミュニティカードよりも高い数字である状態を指します。例えば、ボードが「10-7-2」の時に自分が「QQ（クイーンズ）」を持っていれば、それはオーバーペアとなります。トップペアよりも上位に位置する極めて強力なハンドであり、多くの場合で自信を持って強気にベットし、バリューを取りに行くべき状況です。ただし、ボードにペアができたり、スートが重なったりすると、フルハウスやフラッシュに逆転されるリスクには注意が必要です。","ex":"「オーバーペアなので、相手のトップペアから最大限のチップを引き出しにいく。」"},{"n":108,"ja":"オーバーベット","lv":5,"en":"Overbet","kana":"オーバー・ベット","alias":["特大ベット"],"desc":"ポットに入っている総額を超える、極端に大きな金額（ポットの1.2倍や2倍など）を一度にベットすることです。このアクションは、自分が絶対的な最強ハンド（ナッツ）を持っていて、相手から最大の利益を引き出したい時、あるいは相手に「絶対にコールできない」と思わせるような強烈なブラフを仕掛ける時に極めて有効です。GTO（最適戦略）においても、特定のボード状況でレンジの優位性がある際に取り入れられる高度な戦術です。相手に究極の二択を迫るため、受け手側は数学的・心理的に非常に苦しい判断を強いられることになります。","ex":"リバーでポットの1.5倍のオーバーベットを打ち、相手に究極の選択を迫った。"},{"n":109,"ja":"オーバーリリット","lv":3,"en":"Over-limp","kana":"オーバー・リリット","alias":["オーバーリンプ","追随リンプ"],"desc":"自分の前に既にリンプ（コールで参加）したプレイヤーがいる状況で、自分もそれに続いてレイズせずにリンプで入ることです。ポーカーでは自分から入る際はレイズ（オープン）が基本ですが、マルチウェイで安くフロップを見たいハンド（スモールペアやスーテッドコネクターなど）では、このオーバーリンプが戦略的に正当化されることもあります。ただし、ポットが膨らみにくく、ポジションの優位性を活かしにくい「消極的な選択」と見なされることも多いです。","ex":"「前の3人がリンプしていたので、オッズに合うスーテッドハンドでオーバーリリットした。」"},{"n":110,"ja":"オーバーリンプ","lv":2,"en":"Over Limp","kana":"オーバー・リンプ","alias":["追いリンプ"],"desc":"プリフロップにおいて、既に自分より前のプレイヤーがリンプ（ビッグブラインドと同額をコール）している状態で、自分もそれに続いてリンプして参加するアクションです。一般的にリンプは弱いアクションと見なされますが、マルチウェイポット（多人数参加）で安くフロップを見に行きたい投機的なハンド（スモールペアやスーテッドコネクターなど）を持っている場合に戦略的に選択されることがあります。ただし、後ろのプレイヤーから大きなレイズ（スクイズ）を受けるリスクがあるため、自分のポジションや後ろのプレイヤーの傾向を慎重に見極める必要があります。強いハンドであれば、通常はレイズで主導権を握ることが推奨されます。","ex":"ボタンからオーバーリンプして、安くフロップを見に行くことにした。"},{"n":111,"ja":"オープン","lv":1,"en":"Open","kana":"オープン","alias":["オープンレイズ","先付け","レイザー"],"desc":"そのベッティングラウンドにおいて、まだ誰もベットやレイズを行っていない状態で最初にチップを賭けるアクションを指します。プリフロップにおいては、ブラインド以外のプレイヤーが最初に行うレイズ（オープンレイズ）がこれに該当します。オープンすることで主導権（アグレッション）を握り、後ろのプレイヤーにプレッシャーを与えることができます。GTOや標準的な戦略では、参加する場合はコール（リンプ）ではなくオープンレイズすることが基本とされており、ポジションが良くなるほど、より広い範囲のハンドでオープンを仕掛けることが収益性の向上に繋がります。","ex":"「ボタンからオープンして、ブラインドの二人にプレッシャーをかけた。」"},{"n":112,"ja":"オープンエンドストレートドロー","lv":1,"en":"Open Ended Straight Draw","kana":"オープン・エンド・ストレート・ドロー","alias":["OESD"],"desc":"ストレートドローのうち、連続した4枚の数字の両端（例：「5-6-7-8」における「4」または「9」）のどちらかが来れば役が完成する状態を指します。正式にはオープンエンド・ストレートドロー（OESD）と呼ばれます。逆転に必要なカード（アウツ）が8枚存在するため、間の1枚を待つガットショット（4枚）に比べて完成確率が2倍高く、非常に強力なドローハンドと見なされます。フロップ時点でこれを持っていれば、攻撃的にベット（セミブラフ）して主導権を握る価値が十分にあります。","ex":"フロップでオープンエンドになったので、強気に勝負を続けた。"},{"n":113,"ja":"オープンリンプ","lv":3,"en":"Open Limp","kana":"オープン・リンプ","alias":["最初からリンプ"],"desc":"プリフロップにおいて、自分より前のプレイヤーが全員フォールドしており、自分が最初にアクションする番でレイズをせずに、ビッグブラインド（BB）の額をコールして参加することです。ポーカーの定石では、参加する際はレイズして主導権を握ることが基本（オープンレイズ）とされるため、オープンリンプは一般的に「弱いプレイ」や「初心者のサイン」と見なされることが多いです。しかし、意図的にレンジを隠したり、後ろのプレイヤーの反応を見たりするための特殊な戦略として用いられる場合も稀にあります。","ex":"「オープンリンプは弱さを露呈するため、通常は避けるべきアクションとされる。」"},{"n":114,"ja":"オープンレイズ","lv":2,"en":"Open Raise","kana":"オープン・レイズ","alias":["先付け","レイザー"],"desc":"そのベッティングラウンドにおいて、まだ誰もベットやレイズを行っていない状態で最初にチップを賭けるアクションを指します。プリフロップにおいては、ブラインド以外のプレイヤーが最初に行うレイズ（オープンレイズ）がこれに該当します。オープンすることで主導権（アグレッション）を握り、後ろのプレイヤーにプレッシャーを与えることができます。GTOや標準的な戦略では、参加する場合はコール（リンプ）ではなくオープンレイズすることが基本とされており、ポジションが良くなるほど、より広い範囲のハンドでオープンを仕掛けることが収益性の向上に繋がります。","ex":"「ボタンからオープンして、ブラインドの二人にプレッシャーをかけた。」"},{"n":115,"ja":"オールイン","lv":1,"en":"All-in","kana":"オールイン","alias":["全額ベット"],"desc":"自分の持っているチップをすべて一度にポットへ投入する、非常に強力なアクションです。勝利を確信している時や、チップが少なくなってこれ以上のアクションに耐えられない場合、あるいは相手に最大のプレッシャーを与えたい時に行われます。一度オールインを宣言すると、そのプレイヤーはそれ以降のアクション（ベット、コール、フォールド）をすることができず、自動的にショーダウンまで残ります。もし複数のプレイヤーが残っていて自分より多くのチップを持っている場合、追加のベットはサイドポットに分けられ、自分は自分が賭けた分に対応するメインポットのみを争う権利を持ちます。","ex":"最強の役が完成したので、迷わずオールインした。"},{"n":116,"ja":"オールインコール","lv":1,"en":"All-in Call","kana":"オール・イン・コール","alias":["全賭け受け","全掛けコール"],"desc":"相手のオールイン（全スタックを賭けたアクション）に対して、自分もそれに応じる「コール」をすることです。これにより、そのハンドでのチップの移動額が確定し、基本的には次のカードが自動的に捲られて勝敗が決まる「ショーダウン」へと向かいます。自分のスタックの運命を決定づける最終的な決断であり、数学的な期待値（EV）と、残りのアウツによる逆転の可能性を冷静に計算して下すべき、ポーカーで最も緊張感のある瞬間です。","ex":"「相手のブラフを確信し、Aハイで勇気あるオールインコールを返した。」"},{"n":117,"ja":"オールインフォールド","lv":4,"en":"All-in or Fold","kana":"エー・オー・エフ","alias":["AOF","オールインオアフォールド","プッシュフォールド"],"desc":"配られたハンドに対して、プレイヤーが選べるアクションが「オールイン（全賭け）」か「フォールド（降りる）」の2つしかない、スピーディーなポーカーのゲーム形式です。コールやレイズといった中間のアクションが存在しないため、1ハンドが短時間で決着し、テンポよく多くのハンドをこなせるのが特徴です。最大4人程度で行われ、ゲームによってはクワッズ（フォーカード）以上の強い役が完成するとジャックポットが当たるなど、射幸性の高い演出が加えられていることもあります。プッシュかフォールドかの判断に特化するため、ハンドの強さとポジションの基本を学ぶ入門としても遊ばれます。","ex":"「AOFはオールインかフォールドだけだから、サクサク回せて手軽に楽しめる。」"},{"n":118,"ja":"オプション","lv":2,"en":"Option","kana":"オプション","alias":["選択権"],"desc":"プリフロップにおいて、自分より前のプレイヤーが誰もレイズせず、ビッグブラインド（BB）の順番まで回ってきた際に、BBのプレイヤーに与えられる「チェック」または「レイズ」を選択できる権利のことです。BBは既に強制ベットを支払っているため、他の全員がコールで回してきた場合、追加チップなしでチェックしてフロップを見るか、自らレイズしてポットを大きくするかを選ぶことができます。ディーラーから「オプションです」と促されることが一般的です。この権利を行使してレイズすることは、ポットに溜まったチップを奪うスチールや、主導権を奪い返す戦略的な手段となります。","ex":"全員が降りてきたので、BBの私はオプションでレイズを返した。"},{"n":119,"ja":"オフスート","lv":1,"en":"Offsuit","kana":"オフ・スート","alias":["オフスーツ","オフ","異なるマーク"],"desc":"配られた2枚の手札のマーク（スート）が異なっている状態を指します。フラッシュを作るためにはボード上に4枚の同じマークが必要となるため、スーテッドハンドに比べて役の完成難易度が大幅に上がります。ハンドレンジ表では「o」の記号で表記され（例：AKo）、スーテッド（s）よりも低い評価となります。しかし、AKやAQといったハイカードのオフスートは、ストレートやトップペアの強さだけでも十分に戦える強力なスターティングハンドとして、戦略の中心を担います。","ex":"「スートが異なるオフスートだったが、ランクが高いためレイズで参加した。」"},{"n":120,"ja":"オマハ","lv":1,"en":"Omaha","kana":"オマハ","alias":["PLO"],"desc":"各プレイヤーに4枚のホールカード（手札）が配られるポーカーの形式で、テキサスホールデムに次いで人気があります。5枚のコミュニティカードのうち、必ず手札の2枚とボードの3枚を組み合わせて役を作らなければならないというルールが最大の特徴です。ホールデムに比べて作れる役の組み合わせが格段に多くなるため、より強い役（ストレートやフラッシュ以上）が頻繁に完成し、激しいベットの応酬が繰り広げられます。主に「ポットリミット」形式で行われることが多く（PLO）、役の完成率の高さからくる数学的な深みとスリルが魅力のゲームです。","ex":"オマハではホールカード4枚から2枚を必ず使うルールを忘れてはいけない。"},{"n":121,"ja":"オリジナルレイザー","lv":1,"en":"Original Raiser","kana":"オリジナル・レイザー","alias":["最初のレイザー","オープンレイザー"],"desc":"プリフロップにおいて、まだ誰もレイズしていない状態で、最初にオープンレイズ（2ベット）を行ったプレイヤーのことです。そのハンドにおける「主導権（アグレッション）」の起点となったプレイヤーであり、フロップ以降も継続してベット（Cベット）を打つことが期待される役割を担います。誰がオリジナルレイザーであるかを正確に把握しておくことは、ポストフロップでのハンドリーディングや状況判断において、物語の出発点を理解するために極めて重要です。","ex":"「オリジナルレイザーである彼がチェックした。ハンドを外した可能性がある。」"},{"n":122,"ja":"カウンターフィット","lv":5,"en":"Counterfeit","kana":"カウンター・フィット","alias":["偽造","役殺し"],"desc":"自分の持っていた役が、ボードに共通のカードが出現したことによって、その価値が激減したり無効になったりする現象です。一般的には「2-2-5-5のツーペアを持っていたが、ボードにA-Aが出てしまい、自分の2のペアが共通のAのペアによって上書き（カウンターフィット）され、弱くなってしまう」状況などを指します。これにより、一転して勝っていたハンドが負けハンドへと転落する不運な展開となり、ポーカーの予測不能な怖さを象徴する言葉です。","ex":"「最強のツーペアだと思っていたが、リバーでボードが重なりカウンターフィットされた。」"},{"n":123,"ja":"肩（かた）","lv":4,"en":"Run Good / Heater","kana":"カタ","alias":["肩が強い","引きが強い","ツキ","運"],"desc":"主に「肩が強い」という形で使われ、ツキや引きが強く、運良く良いカードを引き続けている好調な状態を指す俗語です。なぜ「肩」と表現するのかは諸説あり明確ではありませんが、日本のポーカー界隈で「あの人は今日肩が強いね」のように、運勢の良さを表す言葉として定着しています。ポーカーは技術のゲームであると同時に、短期的には運（分散）の影響を強く受けるため、こうした好不調の波を表す言い回しが生まれました。ただし、肩の強さはあくまで一時的な運に過ぎず、長期的な勝敗を決めるのは確率に基づいた正しい判断であることを忘れてはなりません。","ex":"「今日は肩が強いな、引きたいカードが面白いように落ちてくる。」"},{"n":124,"ja":"カットオフ","lv":1,"en":"Cut Off","kana":"カット・オフ","alias":["CO"],"desc":"ディーラーボタン（BTN）のすぐ右隣に位置する、2番目に有利なレイトポジションです。フロップ以降の各ラウンドにおいてボタンに次いで最後の方でアクションできるため、多くのプレイヤーの動きを見てから判断を下せる情報の優位性があります。もしボタンのプレイヤーがタイトで慎重なタイプであれば、実質的にテーブルで最も有利な「最後のアクション権」を握るプレイヤーとして振る舞うことが可能です。ここからオープンレイズしてブラインドのチップを奪いに行く「スチール」を仕掛ける絶好の起点となり、ハイジャック（HJ）から有利な権限を「切り落とす（カットオフする）」ポジションとしての役割も持ちます。","ex":"カットオフからスチールを狙って、広めのレンジでオープンレイズした。"},{"n":125,"ja":"ガットショット","lv":1,"en":"Gutshot","kana":"ガットショット","alias":["間の1枚待ち","1枚待ち状態","ベリー"],"desc":"ストレートドローの一種で、連続する5枚の数字のうち、中間の1枚だけが欠けている状態を指します。例えば「8-9-J-Q」を持っていて「10」を待つような「中空き待ち」の状態です。完成させるためのアウツ（必要なカード）が4枚しか存在しないため、オープンエンド（両端待ち）に比べて完成確率が低く、戦略的に難しい状況です。しかし、完成した際には相手から非常に読まれにくいため、不意を突いて大きなバリューを取れる強烈な一撃になることから、英語で「腹への一撃（Gutshot）」と呼ばれます。","ex":"フロップでガットショットのドローになり、奇跡的にリバーで完成した。"},{"n":126,"ja":"カムハンド","lv":5,"en":"Come Hand","kana":"カム・ハンド","alias":["呼び込みハンド","ドロー"],"desc":"「カードよ来い（Come）」と願う必要がある、未完成のドローハンドの古い呼び名です。一般的には、あと1枚でストレートやフラッシュが完成する、現在は弱いが将来性のある手を指します。現在では単に「ドロー」や「ドローハンド」と呼ばれることが一般的ですが、歴史的な文脈や海外の古い戦略書などでは、幸運を呼び込むための未完成の手を指す情緒的な言葉として使われていました。","ex":"「このカムハンドがリバーで完成すれば、今日の負け分をすべて取り返せるはずだ。」"},{"n":127,"ja":"カモ","lv":1,"en":"Fish / Sucker","kana":"カモ","alias":["フィッシュ","ドンキー","鴨","弱い人"],"desc":"技術が未熟で、簡単にチップを奪える「与しやすい相手」を指す俗語です。英語の「フィッシュ（魚）」や「ドンキー」と同じ意味合いで、漢字では「鴨」と書き、捕まえやすい獲物になぞらえた表現です。弱点の多いプレイ（弱いハンドで参加しすぎる、不利な状況で降りられないなど）をするプレイヤーが該当し、テーブルにカモがいるかどうかは、その卓の期待値を大きく左右します。一方で、「自分がカモにされていないか」を常に意識することも重要で、明確に格上のプレイヤーが揃った卓では、無理に勝負せず席を変える判断（テーブルセレクション）も立派な戦略です。","ex":"「あのテーブルはカモが多いから、長く座っていれば勝ちやすいはずだ。」"},{"n":128,"ja":"カラーアップ","lv":3,"en":"Color Up","kana":"カラー・アップ","alias":["カラーリングアップ","チップ交換","レースオフ"],"desc":"手元に溜まった少額（低デノミネーション）のチップを、より高額なチップにまとめて交換することを指します。「色を上げる」という言葉通り、たくさんの小さなチップを少数の大きなチップに置き換える作業です。主にトーナメントでブラインドが上がり、小さな額面のチップが不要になったタイミングで行われ、チップの枚数を減らしてカウントやベットをしやすくし、ゲーム進行をスムーズにする目的があります。交換の際、端数のチップをどう処理するか（レースと呼ばれる抽選で決めるなど）にもルールがあり、トーナメントの中盤以降で定期的に行われる運営手続きです。","ex":"「ブラインドが上がったから、細かいチップをカラーアップしてスッキリさせよう。」"},{"n":129,"ja":"期待値（きたいち）","lv":4,"en":"Expected Value","kana":"キ・タイ・チ","alias":["EV","イーブイ"],"desc":"あるアクションが長期的にもたらす「平均的な損益」を数値化したものです。「EV（イーブイ）」として、ポーカーの意思決定の絶対的指標として定義されています。あらゆるベット、コール、フォールドはこの期待値が最大になるように計算（あるいは推測）されるべきです。短期的な運の要素を排除し、数学的な正しさだけを追求する「勝つための唯一の羅針盤」であり、この概念の理解が初心者と中級者を分ける最大の壁となります。","ex":"「この局面でコールすることの期待値（EV）はプラス100ドル。数学的に降りる理由はない。」"},{"n":130,"ja":"キッカー","lv":1,"en":"Kicker","kana":"キッカー","alias":["控えカード","メイン以外のカード"],"desc":"役を構成する主要なカード以外の、勝敗判定に用いられる控えのカードのことです。例えば、両者が共に「Aのワンペア」を持っていた場合、ペア以外のカード（キッカー）が強い方のプレイヤーが勝利となります。同じ役同士の勝負になった際、役のランクが同一であればこのキッカーの強さが決定的な差を生むため、非常に重要な要素です。もし5枚すべてのカードを比較しても全く同じ強さであれば引き分け（チョップ）となります。弱いキッカーで強いペアを作ってしまうと、相手に同じペアでより強いキッカーを持たれている「ドミネイト」の状態に陥り、大きな損失を招くリスクがあるため、常に意識すべき要素です。","ex":"Aのワンペアを作ったが、キッカー負けして大きなポットを失った。"},{"n":131,"ja":"キャッシュアウト","lv":2,"en":"Cash-out","kana":"キャッシュアウト","alias":["利確","退席","ゲーム終了"],"desc":"キャッシュゲーム（リングゲーム）において、持っているチップを現金や施設内通貨に換算し、ゲームから退席することを指します。いつでも好きな時に利益を確定して終了できるのがキャッシュゲームの最大の特徴です。また、近年の一部のオン
