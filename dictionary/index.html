ラインポーカーでは、オールイン対決の際、その時点での勝率（エクイティ）に応じた金額を、結果が出る前に即座に受け取って降りる機能も「キャッシュアウト」と呼ばれます。不運な逆転（分散）を避け、確実に収益を確保するための選択肢です。","ex":"「目標金額に達したので、今日のセッションはここでキャッシュアウトする。」"},{"n":132,"ja":"キャッシュゲーム","lv":1,"en":"Cash Game","kana":"キャッシュ・ゲーム","alias":["リングゲーム"],"desc":"チップをお金そのものとして扱い、一定のレートで進行するゲーム形式です。プレイヤーは自分の好きなタイミングで自由に参加・退席（キャッシュアウト）することが可能で、チップが不足した際も随時補充（バイイン）できる点が最大の特徴です。日本国内では「リングゲーム」と呼ばれることが一般的ですが、海外のカジノ等ではこの形式が主流です。ブラインド額は常に一定に保たれるため、トーナメントのように時間が経つにつれて焦らされることがなく、じっくり腰を据えて数学的・戦略的なプレイを楽しむのに適した環境といえます。","ex":"今日はキャッシュゲームでじっくり腰を据えてプレイするつもりだ。"},{"n":133,"ja":"ギャッパー","lv":3,"en":"Gapper","kana":"ギャッパー","alias":["ランクの開き"],"desc":"「8と10」や「Jと9」のように、ホールカード2枚の数字（ランク）が1つまたは複数飛び、連続していない状態のハンドを指します。1つ飛んでいるものを「ワンギャッパー」、2つ飛んでいるものを「ツーギャッパー」と呼びます。連続したコネクターに比べてストレートを完成させる難易度は上がりますが、その分、完成した際には相手から非常に読まれにくく、不意を突いて大きなバリューを獲得できる可能性があります。特にスーテッド（同じマーク）のギャッパーは、ストレートとフラッシュの両方を狙える投機的なハンドとして活用されます。","ex":"「このギャッパーは扱いが難しいが、セット狙いの相手をまくるチャンスはある。」"},{"n":134,"ja":"キャップ","lv":4,"en":"Cap","kana":"キャップ","alias":["上限","キャップする","回数制限","上限額"],"desc":"主に二つの意味で使われます。一つはリミットポーカーにおいて、1ベッティングラウンドでのレイズ回数が上限に達し、それ以上レイズできなくなった状態を「キャップ」と呼びます。もう一つは現代のノーリミット戦略で頻出する用法で、あるアクションによってプレイヤーの持ちうる最強クラスのハンドが否定された（レンジに上限がついた）状態を指します。例えば、強いボードでレイズせず単にコールに留まると、ナッツ級のハンドが「キャップされた」と読まれやすくなります。自分のレンジがキャップされていないかを意識することは、相手からの大きなベットに対する防御力を保ち、一方的に搾取されるのを防ぐ上で極めて重要です。","ex":"「彼のコールでレンジがキャップされた。リバーで大きく打てば降ろせるはずだ。」"},{"n":135,"ja":"ギャップコンセプト","lv":5,"en":"Gap Concept","kana":"ギャップ・コンセプト","alias":["ギャップ理論","スクランスキーのギャップ"],"desc":"「あるハンドで自らレイズして参加する（オープンする）よりも、すでに誰かがレイズした後にコールやリレイズで参加する方が、より強いハンドを必要とする」という、デビッド・スクランスキーが提唱したプリフロップ戦略の概念です。先にレイズした相手は強いハンドを持っている可能性が高いため、それに立ち向かうには相応の強さが要る、という考え方で、オープンできる範囲と、レイズに対して参加できる範囲との間に生じる「差（ギャップ）」を指します。この概念を理解すると、安易に他人のレイズに乗ってしまう失敗を防ぎ、状況に応じた適切なハンド選択ができるようになります。","ex":"「ギャップコンセプトを考えれば、このハンドはオープンはできてもコールはできない。」"},{"n":136,"ja":"キャップされたレンジ","lv":6,"en":"Capped Range","kana":"キャップト・レンジ","alias":["上限付きレンジ","弱いレンジ"],"desc":"取りうるアクションの中に、最強クラス（ナッツやそれに近いハンド）が含まれていないレンジのことを指します。例えば、強いボードでレイズを選ばずにコールやチェックで応じた場合、そのプレイヤーのレンジからは「最強の組み合わせ」が抜け落ちていると推測でき、その状態を「レンジがキャップされている」と表現します。キャップされたレンジを持つプレイヤーは、相手から大きなオーバーベットやポラライズされたベットを受けると、降りるか不利なコールを強いられるため、非常に脆弱です。逆に、相手のレンジがキャップされていると読めた場面は、こちらがブラフを仕掛ける絶好の機会となり、ハンドリーディングの精度がそのまま収益に直結します。","ex":"「ターンでチェックした時点で、こちらのレンジはキャップされてしまった。」"},{"n":137,"ja":"キャップレンジ","lv":6,"en":"Capped Range","kana":"キャップされているレンジ","alias":["上限が制限された範囲"],"desc":"特定のプレイヤーのアクション（チェックやコールのみを選択するなど）により、その手札の範囲（レンジ）の中にAAやKKといった最強クラスのハンドが含まれていないことが判明した状態を指します。例えば、プリフロップでレイズせずコールに留まった場合、非常に強い手ならレイズしているはずなので、そのプレイヤーのレンジは「キャップされている」と見なされます。この情報を得た攻撃側のプレイヤーは、相手が最強の役を持っていないことを確信し、大きなオーバーベットやブラフを仕掛けてポットを奪いやすくなります。","ex":"「相手のレンジはキャップされている。ナッツはあり得ないので、ブラフを敢行した。」"},{"n":138,"ja":"キングハイ","lv":1,"en":"King High","kana":"キング・ハイ","alias":["Kハイ"],"desc":"役が一切完成していない（ハイカード）状態の中で、自分の手持ちの最強ランクのカードが「K（キング）」である状態を指します。エースハイ（Aハイ）には負けますが、クイーンハイ（Qハイ）以下には勝てます。お互いに何も引けなかったショーダウンにおいて、稀に勝利をもたらすことがありますが、基本的には非常に弱い手です。ただし、相手のブラフをキャッチするには十分な強さを持つこともあり、状況次第でその価値が大きく変動する境界線上のハンドです。","ex":"「お互い役なしだったが、私のキングハイがギリギリでポットを拾ってくれた。」"},{"n":139,"ja":"クアッズ（クワッズ）","lv":1,"en":"Quads","kana":"クワッズ","alias":["フォー・オブ・ア・カインド","フォーカード"],"desc":"同じ数字が4枚揃う最強クラスの役「フォーカード」の一般的な愛称です。デッキに4枚しかない同じ数字をすべて集めることで完成し、めったにお目にかかれない非常に強力な手です。完成すればほぼ無敵であり、相手のフルハウスなどの強力な手を「粉砕（クラック）」してスタックを丸ごと奪う破壊力を持ちます。出現確率は極めて低い（テキサスホールデムで約0.16%）ですが、一度出ればテーブルがどよめくポーカーの華です。","ex":"「フロップでセット、リバーでついに4枚目のKが落ちて、クワッズが完成した。」"},{"n":140,"ja":"クイーンズ","lv":1,"en":"Queens","kana":"クイーンズ","alias":["QQ","レディース","ポケットクィーン"],"desc":"2枚のホールカードが両方ともクイーン（Q）であるハンド、すなわちポケットクィーン（QQ）を指す呼び名です。「レディース」「ヒルトンシスターズ」などと同じハンドを指し、英語の「Queens」をそのまま用いた表現です。AA・KKに次ぐ強力なポケットペアで、プリフロップではレイズや3ベットで主導権を握るべきハンドですが、相手からの4ベットに対してコミットするか降りるかの判断が難しく、プレイヤーの実力が問われる場面が多いことで知られます。オーバーカードが2種類しかない点でJJ以下より扱いやすい一方、過信は禁物という、強さと難しさを併せ持つ一手です。","ex":"「クイーンズで4ベットを受けた。相手のレンジ次第ではコミットしてもいい。」"},{"n":141,"ja":"クーラー","lv":4,"en":"Cooler","kana":"クーラー","alias":["避けられない不運","重大事故"],"desc":"自分も相手も非常に強力なハンド（例：Kのフルハウス vs Aのフルハウス）を持っており、数学的にも戦略的にもどちらもフォールドすることが理論上不可能で、そのままぶつかり合って負けてしまう極めて不運な状況です。これはプレイングミス（下手なプレイ）ではなく、確率的に避けられない「事故」として扱われます。負けた側のプレイヤーは巨額のスタックを失いますが、正しいプレイをした結果であれば、冷静に受け止めて精神的な動揺（ティルト）を防ぐことが長期的な勝利に繋がります。","ex":"「AAでKKにリバーで逆転された。これは典型的なクーラーで、どうしようもない。」"},{"n":142,"ja":"グラインダー","lv":3,"en":"Grinder","kana":"グラインダー","alias":["職人","ラウンダー"],"desc":"大きなリスクを避け、地道に正しいプレイを積み重ねて、コツコツと一定の利益を出し続ける「堅実な職人」のようなプレイヤーを指します。「グラインド（Grind）」する人として記載されています。爆発的な勝利を狙うギャンブラーとは対照的に、期待値（EV）に基づいた「勝てるポーカー」を延々と繰り返し、生活費を稼ぎ出すプロの実態を表す言葉です。忍耐力、規律、そして鋼のメンタルを兼ね備えた、ポーカー界の長距離走者です。","ex":"「彼は派手なプレイはしないが、グラインダーとして毎月安定した利益を出している。」"},{"n":143,"ja":"グラインド","lv":3,"en":"Grind","kana":"グラインド","alias":["地道な収益","グラインダー"],"desc":"大きなリスクを避け、自分の実力よりも少し低いレートや、安定した期待値（EV）が見込める環境で、地道かつ継続的にプレイして利益を積み重ねていく行為です。こうしたスタイルを貫くプレイヤーを「グラインダー」と呼びます。派手なブラフや巨額のオールイン対決を好まず、冷静な確率計算と忍耐強いハンド選択によって、確実に「仕事」としてポーカーから収入を得るプロプレイヤーの日常を象徴する言葉です。精神的な安定と、揺らぎ（分散）を最小限に抑える管理能力が求められるシビアな世界です。","ex":"「今月はグラインドに徹し、無駄な負けを排除して目標利益を達成した。」"},{"n":144,"ja":"クラッキングエーシズ","lv":3,"en":"Cracking Aces","kana":"クラッキング・エーシズ","alias":["エースクラック","AAを割る","ロケッツクラック"],"desc":"プリフロップ最強のハンドであるポケットエース（AA）を、格下のはずのハンドが打ち破る（クラックする＝割る）ことを指します。AAは非常に強いものの絶対ではなく、相手がセットやツーペア、ストレート、フラッシュなどを完成させて逆転するケースは珍しくありません。AAを持つ側からすれば手痛い敗北（しばしばバッドビート）ですが、AAを割った側にとっては痛快な大金星です。アミューズメント施設などでは、AAが負けた際に特典が出る「エースクラック」キャンペーンが行われることもあります。最強ハンドですら確実ではないという、ポーカーの奥深さと残酷さを象徴する言葉です。","ex":"「セットを引いて相手のロケッツをクラッキングエーシズ、大きなポットを頂いた。」"},{"n":145,"ja":"クラック","lv":3,"en":"Crack","kana":"クラック","alias":["割る"],"desc":"AA（ポケットエース）などの極めて強力なプレミアムハンドが、格下の弱いハンドに逆転負けを喫することを指します。日本語では「エースが割られた」という表現がよく使われます。例えば、プリフロップでAAを持っていたプレイヤーが、適当なハンドでコールした相手にフロップでツーペアやセットを作られて負けるような状況が典型例です。最強のハンドであっても100%の勝率はなく、時には不運な逆転が起こるポーカーの厳しさと面白さを象徴する言葉です。クラックされた際に冷静さを失い、「ティルト」に陥らないようなメンタルコントロールがプレイヤーには求められます。","ex":"せっかくのAAが、相手の適当な2ペアによってクラックされてしまった。"},{"n":146,"ja":"クリエイティブライン","lv":6,"en":"Creative Line","kana":"クリエイティブ・ライン","alias":["独創的なライン","非標準ライン"],"desc":"標準的・定石的なプレイの流れ（ライン）から意図的に外れ、相手の予測を裏切るような独創的で意外性のあるアクションの組み立てを指します。例えば、通常ならベットする場面であえてチェックして罠を張ったり、降りるべきとされる場面で大胆にレイズを返したりするようなプレイです。定石通りのプレイは読まれやすく搾取されやすいため、相手の傾向を見極めた上で時折クリエイティブなラインを織り交ぜることで、相手のハンドリードを困難にし優位を築けます。ただし独創性は確かな基礎と状況判断に裏打ちされて初めて武器となるものであり、根拠のない奇抜なプレイは単なる悪手になりかねない点に注意が必要です。","ex":"「彼のクリエイティブなラインに翻弄されて、最後まで手を読めなかった。」"},{"n":147,"ja":"クリップル","lv":5,"en":"Cripple","kana":"クリップル","alias":["クリップルザデッキ","デッキを潰す","致命傷","虫の息"],"desc":"自分のハンドが、相手が強い役を作る可能性をほぼ完全に奪っている状態を指します。「デッキを不自由にする（クリップルする）」というイメージです。典型例として、自分がポケットエース（AA）を持っていれば、残りのエースは2枚しかなく、相手がAAやAでトップヒットする組み合わせが大幅に減るため、「デッキをクリップルしている」と言えます。相手が強い手を持ちにくい＝コールやアクションを得にくいことを意味するため、バリューを取りづらいというジレンマも生じます。自分のハンドがどれだけ相手のレンジを縛っているか（ブロッカー効果）を理解することは、ベット戦略を考える上で重要です。","ex":"「こちらがエースを2枚持っているから、相手が強い手を作る目はかなりクリップルされている。」"},{"n":148,"ja":"ケース","lv":5,"en":"Case Card","kana":"ケース","alias":["ケースカード","最後の1枚"],"desc":"あるランクのカードのうち、すでに3枚が見えていて（使われていて）、デッキに残っている「最後の1枚」を指します。例えば、エースが3枚すでに場やハンドに見えている状態で残る4枚目のエースを「ケースエース」と呼びます。確率的に極めて出にくいその1枚を引いて逆転や役の完成が起こると、劇的な展開として強く印象に残ります。「まさかのケースカードを引かれた」という形で、確率的にほぼあり得ない不運（あるいは幸運）を語る際によく使われる言葉です。残り枚数（アウツ）を数える上でも、ケースカードという概念は、その1枚の希少さを表す表現として用いられます。","ex":"「リバーでまさかのケースエースを引かれて、完成していたセットが捲られた。」"},{"n":149,"ja":"ゲームダイナミクス","lv":6,"en":"Game Dynamics","kana":"ゲーム・ダイナミクス","alias":["テーブルダイナミクス","卓の流れ"],"desc":"そのテーブルで起きている心理・力関係・流れといった、刻一刻と変化する「場の力学」全体を指す言葉です。誰が勝って誰が負けているか、誰がアグレッシブで誰が弱気になっているか、特定のプレイヤー同士に因縁が生まれていないか、といった要素が含まれます。GTO的な理論値だけでは捉えきれない、生きた状況の変化を読み取る概念であり、大負けして熱くなっている（ティルト気味の）相手には広くバリューを取りに行く、堅くなっている相手には積極的にブラフを仕掛ける、といったエクスプロイト（搾取）の判断材料となります。卓の空気を読む力は、ライブポーカーで特に重要です。","ex":"「あの2人がぶつかってから、卓のゲームダイナミクスが一気に荒れてきた。」"},{"n":150,"ja":"コインフリップ","lv":1,"en":"Coin Flip","kana":"コイン・フリップ","alias":["フリップ","五分五分"],"desc":"勝率が約50対50（五分五分）の勝負のことで、まるでコインを投げた結果を待つような運否天賦の状態を指します。典型的な例は、ポケットペア（例：QQ）対オーバーカード（例：AK）のオールイン対決です。トーナメントの中盤以降では、このフリップを制することがダブルアップ（スタック倍増）のために避けて通れない関門となります。技術を超えた「運の勝負」であることを認めつつ、期待値のバランスで勝負に挑む覚悟が必要です。","ex":"「トーナメントを勝ち抜くには、どこかでこのコインフリップを制さなければならない。」"},{"n":151,"ja":"コーラー","lv":1,"en":"Caller","kana":"コーラー","alias":["コールする人"],"desc":"相手のベットに対してレイズやフォールドをせず、「コール」を選択したプレイヤーを指します。特にどんなベットにも付いてくる粘り強いプレイヤーを「コーリングステーション」と呼び、ブラフが効かない反面、強い手を持っている時のバリューの供給源となります。自分がアグレッサー（攻撃者）である時、相手がどのようなタイプのコーラーであるかを見極めることは、ベットサイズを決定する上での最重要事項となります。","ex":"「彼は非常にルースなコーラーなので、ブラフは控えて強い手で打ち続けよう。」"},{"n":152,"ja":"コーリングステーション","lv":2,"en":"Calling Station","kana":"コーリング・ステーション","alias":["ウィーク・パッシブ","ルースパッシブ","コーラー"],"desc":"自分のハンドの強さに関わらず、相手のベットに対して非常に高い頻度でコールを選択し、レイズやフォールドをあまりしないプレイスタイルのプレイヤーを揶揄する言葉です。基本的に「ウィーク・パッシブ（弱くて受け身）」なタイプに分類されます。彼らに対してはブラフが全く通用しないため、はったりを仕掛けるのは禁物ですが、逆に自分が強いハンドを持っている時には、どのようなベット額でも付いてきてくれる「格好のターゲット（バリューの提供源）」として利益の源泉となります。","ex":"相手はコーリングステーションなので、ブラフは控えてバリューを狙う。"},{"n":153,"ja":"コール","lv":1,"en":"Call","kana":"コール","alias":["同額ベット"],"desc":"他のプレイヤーが提示したベット額に対し、同額のチップを支払ってゲームに継続参加するアクションです。誰かがベットやレイズをした後、そのゲームから降りたくはないが、さらに金額を釣り上げてリスクを負いたくもない場合に行われます。コールを選択することで、追加のカードを見たり、最終的なショーダウンで役の強さを比べたりする権利を維持できます。全員が同じ額のチップを出し合うことで、一つのベッティングラウンドが終了し、次のストリートへと進行します。状況に応じて戦略的に選ぶべき、ポーカーの最も基本的な行動の一つです。","ex":"ハンドレンジが広く何にでもコールしてしまう癖を早く直さないと上達しないんだよな"},{"n":154,"ja":"コールダウン","lv":3,"en":"Call Down","kana":"コール・ダウン","alias":["受け切る","ブラフキャッチ","完走コール"],"desc":"複数のストリート（ターン・リバーなど）にわたって、レイズはせずにコールだけを続け、ショーダウンまで持ち込むプレイを指します。中途半端な強さのハンドや、相手のブラフを捕まえたい（ブラフキャッチ）場面で用いられます。自分から攻めて相手を降ろすのではなく、相手のベットを受け止め続けることで、相手のブラフからバリューを得ることを狙います。相手のベットが一貫したストーリーになっているか、ブラフの頻度はどうかを読み切る必要があり、勇気と精緻な読みが要求されます。降りるには惜しく、レイズするには弱い、という微妙なハンドの価値を最大限に引き出すための、受けの技術です。","ex":"「相手はブラフが多いと読んで、ミドルペアでリバーまでコールダウンして受け切った。」"},{"n":155,"ja":"コールド4ベット","lv":6,"en":"Cold 4-bet","kana":"コールド・フォー・ベット","alias":["いきなり4ベット"],"desc":"自分よりも前のポジションでオープンレイズ（2ベット）とそれに対する3ベット（リレイズ）が行われた際、そのどちらにも関与していなかったプレイヤーが、いきなりさらに被せて4ベット（さらなるリレイズ）を仕掛ける強烈なアクションです。通常の4ベットよりも遥かに強い、レンジの頂点にあるプレミアムハンド（AAやKKなど）を保持していることが期待され、相手に対してフォールドするか、心中するかの極限の二択を迫ります。ポーカーにおいて最も「強さ」を誇示する、冷徹で破壊力のあるアクションの一つです。","ex":"「二人の激しいやり取りに対し、BTNからコールド4ベットで冷水を浴びせた。」"},{"n":156,"ja":"コールド5ベット","lv":7,"en":"Cold 5-bet","kana":"コールド・ファイブ・ベット","alias":["コールド5bet"],"desc":"それまでそのハンドに自らチップを投じていなかったプレイヤーが、オープン→3ベット→4ベットと攻防が進んだ状況に対し、いきなり5ベットを被せて参加することを指します。「コールド（cold＝それまで関与していない）」状態からの5ベットという意味で、コールドコールやコールド4ベットの延長線上にある概念です。すでに4ベットまで積み上がった非常に強い応酬に後出しで最強クラスの圧力をかける形になるため、原則としてAAなどのごく一部のナッツ級か、相手のレンジを否定し切ったブラフに限られます。出現頻度は極めて低く、強烈な強さを表明する稀なアクションです。","ex":"「オープンと4ベットの2人に、ブラインドからコールド5ベットでオールインを被せた。」"},{"n":157,"ja":"コールドコール","lv":4,"en":"Cold Call","kana":"コールドコール","alias":["コールドコーリング","直接コール"],"desc":"自分がまだ1チップも入れていない状態で、前のプレイヤーのレイズに対していきなりコールすることを指します。すでにコールしている人がさらにコールする「オーバーコール」とは区別され、リンプやコールを経ずに直接レイズへ応じる点が特徴です。レイズに冷たく(コールド)応じることから名付けられました。","ex":"「アンダー・ザ・ガンのレイズに、自分はノーアクションからいきなりコールドコールした。」"},{"n":158,"ja":"コールドデッキ","lv":4,"en":"Cold Deck","kana":"コールド・デッキ","alias":["クーラー","事故","仕組まれたデッキ","冷えたデッキ","セットアップ"],"desc":"双方が非常に強い役を完成させ、どちらも降りられずに大きなチップが動いてしまう、避けようのない不運な状況を指します。「クーラー」とほぼ同義で用いられます。例えば、フルハウス対より上のフルハウス、セットオーバーセットなどがその典型で、負けた側に明確なミスはなく、ただ運悪く役がぶつかってしまっただけ、というのがコールドデッキの本質です。元々はイカサマで「あらかじめ仕込まれた（冷えた）デッキ」を指す言葉でしたが、現在では主に「実力ではどうにもならない事故的な負け」を表す表現として使われます。技術的に正しくプレイしても起こり得るため、結果に引きずられないメンタルが大切です。","ex":"「フルハウス同士でスタックが飛んだけど、これは完全なコールドデッキで仕方ない。」"},{"n":159,"ja":"コネクター","lv":2,"en":"Connector","kana":"コネクター","alias":["連続したカード"],"desc":"配られた2枚の手札（ホールカード）が「8と9」や「JとQ」のように連続したランクの数字であることを指します。ストレートという強力な役を完成させる可能性が高いため、戦略的な価値が非常に高いスターティングハンドとされます。特に、2枚のマーク（スート）も同じである「スーテッドコネクター」は、フラッシュのドローになる可能性も加わるため、さらに高いポテンシャルを秘めています。これらのハンドは、インプライドオッズが高い状況、つまりスタックが深い時に、相手のプレミアムハンドを逆転して大きなポットを奪うための有力な武器として活用されます。","ex":"コネクターが入ったので、ストレートを期待してゲームに参加した。"},{"n":160,"ja":"コネクト","lv":2,"en":"Connect / Connector","kana":"コネクト","alias":["コネクター","連続数字"],"desc":"手札の2枚の数字が「7と8」や「JとQ」のように連続している状態、あるいはそのハンド（コネクター）を指します。ストレートを完成させるポテンシャルが高く、特にマークが同じ「スーテッドコネクター」は、フラッシュの可能性も加わるため非常に価値の高い投機的ハンドとして重宝されます。マルチウェイポットにおいて、大きな役を作ってスタックを奪うための代表的なハンドです。","ex":"「コネクト（コネクター）ハンドなので、安くフロップを見に行けるなら参加したい。」"},{"n":161,"ja":"コミッション","lv":2,"en":"Commission","kana":"コミッション","alias":["手数料"],"desc":"カジノやポーカールーム、オンラインサイトといったゲームの主催者が、場の提供や運営費用として各ポットから徴収する手数料のことです。主に「レーキ」と同じ意味で使われます。一般的には、ポット総額の一定割合（例：5%）が差し引かれ、その上限額（キャップ）が設定されています。この手数料の存在により、プレイヤーが長期的に利益を出すためには、単純な勝敗だけでなく、差し引かれるコミッション分を上回る期待値を稼ぐ必要があります。そのため、コミッションが高い環境ほど、よりタイトで効率的なプレイが求められるという戦略的な影響を与えます。","ex":"このカジノはコミッションが高めなので、タイトなプレイを心がける。"},{"n":162,"ja":"コミュニティカード","lv":1,"en":"Community Card","kana":"コミュニティ・カード","alias":["ボード"],"desc":"テーブル中央に表向きに並べられ、参加プレイヤー全員が共通して自分の役を作るために使える共有カードのことです。テキサスホールデムでは、ゲーム進行に従ってフロップ（3枚）、ターン（1枚）、リバー（1枚）の合計5枚が順次開かれます。プレイヤーは自分に配られた2枚の手札と、これらの共通カード5枚を合わせた合計7枚の中から、最も強い役となる5枚を選択します。別名「ボード」とも呼ばれ、全員に見えている情報であるため、相手がどのような役を完成させたかを推測する上での最重要の判断材料となります。","ex":"コミュニティカードにAが出たことで、自分のハンドが一気に強くなった。"},{"n":163,"ja":"混合戦略（こんごうせんりゃく）","lv":8,"en":"Mixed Strategy","kana":"コンゴウ・センリャク","alias":["ミックス戦略","ミックス","確率的戦略"],"desc":"ゲーム理論の用語で、同じ状況・同じハンドに対して、複数のアクションを一定の確率で混ぜて取る戦略を指します。「ミックス戦略」とも呼ばれ、常に一つの行動を取る「ピュア戦略（純粋戦略）」と対になる概念です。例えば「このハンドは70%ベット・30%チェック」のように頻度で分散させることで、相手にどのハンドを持っているか・どう動くかを読まれにくくし、一方的に搾取されるのを防ぎます。GTOの均衡解では、レンジのバランスを保つために多くのハンドでこの混合戦略が採用されます。一方、人間が実戦で正確な頻度を再現するのは難しく、明確な弱点を持つ相手にはあえて混合を崩してエクスプロイトする方が得な場面も多くあります。","ex":"「ソルバー上はこのハンドは混合戦略だが、実戦ではどちらか一方に寄せて運用している。」"},{"n":164,"ja":"コンティニュエーション・ベット","lv":4,"en":"Continuation Bet","kana":"コンティニュエーション・ベット","alias":["CB","シーベット","Cベット","継続ベット","バレル"],"desc":"前のラウンド（プリフロップ）で最後にレイズして主動権を握ったプレイヤーが、次のラウンド（フロップ）でも連続してベットすること。","ex":""},{"n":165,"ja":"コンデンスドレンジ","lv":7,"en":"Condensed Range","kana":"コンデンスド・レンジ","alias":["コンデンスレンジ","中位集中レンジ","凝縮された範囲"],"desc":"最強クラスのナッツ級ハンドと、まったく価値のないブラフ（エアー）の両極端が抜け落ち、中程度の強さのハンドに「凝縮（コンデンス）」されたレンジのことを指します。ポラライズド（二極化）レンジが「強い手」と「ブラフ」の両端に分かれているのとは対照的に、コンデンスドレンジは中間の手で構成されます。例えば、強いボードでレイズやオーバーベットをせずにコールに留まり続けたプレイヤーは、ナッツも完全なブラフも持たない中位のレンジに絞られていると読めます。このようなレンジは大きなプレッシャーに弱いため、相手のレンジがコンデンスしていると見抜ければ、攻め込む好機となります。","ex":"「コールを続けた彼のレンジはコンデンスしている。大きく打てば中位の手は降りる。」"},{"n":167,"ja":"コンプリートハンド","lv":3,"en":"Complete Hand","kana":"コンプリート・ハンド","alias":["完成役","メイドハンド","5枚役"],"desc":"リミットポーカーや特殊な状況において、不完全なベットを正規の金額まで補完することを指します。特に、前のプレイヤーがチップ不足でオールインし、その額が本来の最低レイズ額に満たなかった場合に、別のプレイヤーが不足分を支払ってそのラウンドのベット額を「完成（コンプリート）」させる行為を言います。また、スモールブラインド（SB）がプリフロップで、ビッグブラインド（BB）との差額分を支払ってコールすることをコンプリートと呼ぶこともあります。ゲームの進行上、ベット額の整合性を保つためのルールに基づくアクションであり、正確なチップ計算が求められます。","ex":"「ストレートというコンプリートハンドが完成したので、キッカー負けの心配なく勝負できる。」"},{"n":168,"ja":"コンボ","lv":4,"en":"Combo","kana":"コンボ","alias":["組み合わせ数"],"desc":"特定のハンドが数学的に何通りの組み合わせで存在するかという単位です。例えば、特定の数字のポケットペア（AAなど）は6通り、異なるスートの組み合わせ（AKoなど）は12通り存在します。相手のハンドレンジを推測する際、単に「AKを持っている」と考えるのではなく、「AKのコンボが残り何通りあるか」を計算することで、より精緻な確率に基づいた判断が可能になります。複数のドローが重なる「コンボドロー」を指す際にも使われる用語です。","ex":"相手のレンジにはAKのコンボが多く含まれていると推測した。"},{"n":169,"ja":"コンボドロー","lv":4,"en":"Combo Draw","kana":"コンボ・ドロー","alias":["モンスタードロー"],"desc":"ストレートドローとフラッシュドローが同時に成立しているなど、一つのハンドで複数の強力な役への発展性を兼ね備えた非常に有利な未完成ハンドの状態です。完成するためのアウツ（必要なカード）が非常に多く、状況によっては現時点でワンペアなどの完成役（メイドハンド）を持っている相手に対しても数学的な勝率で上回ることがあります。このため、ドローでありながらアグレッシブに攻めて、今すぐ相手を降ろすチャンスと完成して勝つチャンスの「二面待ち」で戦う、極めて収益性の高いハンドです。","ex":"「ストレートとフラッシュのコンボドローになったので、迷わずオールインした。」"},{"n":170,"ja":"サードストリート","lv":3,"en":"Third Street","kana":"サードストリート","alias":["3rd Street"],"desc":"スタッド系ポーカーで最初にカードが配られる段階を指し、各プレイヤーがフェイスダウン2枚とフェイスアップ1枚を受け取った時点でのベッティングラウンドです。テキサスホールデムのプリフロップに相当する位置付けで、アップカードの一番低いプレイヤーが強制ベット「ブリングイン」を行う義務を負います。スタッド系ではこのストリートでの初期ハンドの強さとアップカードの情報が、その後の展開を大きく左右します。","ex":"「セブンカードスタッドではサードストリートのアップカードを見て、相手のハンドを推測するんだ。」"},{"n":171,"ja":"サードペア","lv":2,"en":"Third Pair","kana":"サード・ペア","alias":["3番目のペア","ミドル下のペア","第3ペア"],"desc":"ボードに開かれたカードのうち、3番目に高いカードと自分の手札がペアになった状態を指します。最も高いカードとのペア（トップペア）、2番目とのペア（セカンドペア）に次ぐ強さで、ワンペアの中では弱い部類に入ります。一応ペアにはなっているものの、相手がトップペアやセカンドペアを持っていれば負けているため、これ単体で大きく勝負するのは危険です。多くの場合、ショーダウンバリュー（見せ合えば勝てることもある程度の価値）を持つ「中途半端な手」として扱われ、ポットを膨らませずに安く見せ合いに持ち込む、あるいは状況次第で降りるといった、慎重なポットコントロールが求められます。","ex":"「サードペアだと勝っているか微妙なので、ポットを大きくせず安く収めたい。」"},{"n":172,"ja":"サイドポット","lv":2,"en":"Side Pot","kana":"サイドポット","alias":["副ポット"],"desc":"あるプレイヤーがオールインした際、その後にさらにベットが続いた場合に作られる別建てのポットです。オールインしたプレイヤーは自分が貢献した分のメインポットのみ獲得権を持ち、それを超えるベット分は別のサイドポットとして残りのプレイヤーだけで争います。複数のプレイヤーが異なるスタック額でオールインすると、サイドポットが複数生まれることもあり、配当計算が複雑になります。","ex":"「彼はショートスタックだったから、メインポットしか取れず、サイドポットは他の二人で分けることになった。」"},{"n":173,"ja":"サテライト","lv":2,"en":"Satellite","kana":"サテライト","alias":["予選トーナメント"],"desc":"高額な参加費のメイントーナメントへの出場権(シート)を、より安い参加費で獲得することを目的とした予選トーナメントです。賞金が現金ではなく上位入賞者にメインイベントへのエントリー権として与えられるのが特徴で、少ない資金から大舞台を狙えるため多くのプレイヤーに人気があります。WSOPメインイベントなどもサテライト経由で参加するプレイヤーが数多くいます。","ex":"「直接エントリーする資金はないけど、サテライトを勝ち抜けばメインに出られる。」"},{"n":174,"ja":"サンドバガー","lv":4,"en":"Sandbagger","kana":"サンド・バガー","alias":["スロープレイヤー","潜伏者"],"desc":"非常に強いハンドを持ちながら、あえてチェックやコールで弱さを装い、相手のベットを誘い出すプレイヤーやその行為を指します。一般的に「スロープレイ」や「チェックレイズ」を多用する戦略的スタイルの俗称です。相手を罠（トラップ）にはめ、最終的に大きなポットを奪うことを目的としますが、無料でカードを見せてしまい逆転（捲り）を許すリスクも孕んでいます。","ex":"「彼はサンドバガーのように立ち回り、リバーで強烈なチェックレイズを仕掛けてきた。」"},{"n":175,"ja":"シートオープン","lv":2,"en":"Seat Open","kana":"シートオープン","alias":["席が空く"],"desc":"テーブルで空席が生じたことを指す用語で、カジノやポーカールームでフロアスタッフが新しいプレイヤーを案内する際に使われます。プレイヤーが離席したり、トーナメントでバストアウトしたりすることで席が空き、ウェイティングリストの次の人がその席に着くことができます。キャッシュゲームの運営における基本的な合図のひとつです。","ex":"「ディーラーが『シートオープン』と告げると、ウェイティングしていた客がテーブルに着いた。」"},{"n":176,"ja":"シートカード","lv":2,"en":"Seat Card","kana":"シートカード","alias":["席カード"],"desc":"トーナメント開始時に各プレイヤーに配られる、着席するテーブル番号と座席番号が記された札です。レジストレーション(登録)時に引くことで自分のスタート位置がランダムに決定され、公平な席決めの役割を果たします。テーブルバランスのためのリドロー時にも新しいシートカードが配られることがあります。","ex":"「受付でシートカードを引いたら、12番テーブルの5番シートだった。」"},{"n":177,"ja":"シートセレクション","lv":3,"en":"Seat Selection","kana":"シート・セレクション","alias":["席選び","シート選択"],"desc":"キャッシュゲームなどで、自分がどのテーブルの・どの席に座るかを戦略的に選ぶことを指します。テーブルセレクション（どの卓を選ぶか）と並ぶ、プレイ以前の重要な「準備の戦略」です。ポーカーではポジションが収益を大きく左右するため、カモ（弱い相手）の左隣（その相手より後に行動できる位置）に座れば、相手のアクションを見てから判断でき継続的に優位を取れます。逆に、アグレッシブな格上プレイヤーは自分の右側（先に行動する位置）に来るのが理想です。誰とどう対峙するかを座る前に設計するシートセレクションは、実力を発揮する前から勝率を高める、見落とされがちな技術です。","ex":"「カモの左に座れたから、今日はシートセレクションの時点で勝っている。」"},{"n":178,"ja":"シットアウト","lv":2,"en":"Sit Out","kana":"シット・アウト","alias":["離席","一時離脱","攻撃的な広域プレイヤー"],"desc":"自分の席を確保したまま、一時的にハンドへの参加を見合わせて卓を離れることを指します。オンラインポーカーでは、席を保持しつつ数ハンドを自動的に降りる「シットアウト」機能として実装されており、ライブでは食事や休憩で短時間席を外す行為を指します。席は残っているため、戻ればそのままプレイを再開できますが、その間もブラインドの支払い義務が発生する場合が多く、長時間のシットアウトはチップを無駄に失う原因になります。あくまで一時的な離席であり、状況に応じて適切なタイミングで使うことが大切です。","ex":"「少し休憩したいので、何ハンドかシットアウトして席を外すよ。」"},{"n":179,"ja":"シットアンドゴー","lv":2,"en":"Sit and Go","kana":"シットアンドゴー","alias":["SNG"],"desc":"事前の開始時刻が決まっておらず、規定の人数が集まり次第すぐに開始される小規模なトーナメント形式です。1卓だけで完結するものが多く、短時間で終わるため気軽に楽しめます。略して「SNG」と表記され、トーナメント終盤の駆け引きやプッシュ・フォールド戦略を練習する場としても人気があります。","ex":"「時間がない時は、人数が揃えばすぐ始まるシットアンドゴーをよくプレイする。」"},{"n":180,"ja":"シットイン","lv":3,"en":"Sit In","kana":"シット・イン","alias":["着席","復帰","参加","マルチテーブルトーナメント"],"desc":"シットアウト（一時離席）していたプレイヤーが席に戻り、再びハンドへの参加を再開することを指します。また、新たにテーブルの空席に着いてゲームに加わることを指す場合もあります。シットアウトの対義語にあたる言葉で、「着席して勝負に復帰する」というイメージです。オンラインポーカーでは、シットアウト状態を解除してアクティブに戻る操作を指します。離席から戻る際は、その間にブラインドを飛ばしていた場合、ルールによっては次のビッグブラインドまで待つ、あるいは不足分を支払って即座に参加するなどの規定があるため、復帰のタイミングにも一定の作法があります。","ex":"「休憩から戻ったのでシットインして、またゲームに加わった。」"},{"n":181,"ja":"シャーク","lv":3,"en":"Shark","kana":"シャーク","alias":["強豪プレイヤー"],"desc":"卓越した技術を持ち、弱いプレイヤーから着実に利益を上げる熟練プレイヤーを指す俗称です。獲物を狙うサメになぞらえた表現で、対義語は経験の浅いカモを意味する「フィッシュ」です。一見すると弱そうに振る舞いながら実は強豪である場合もあり、テーブルでシャークを見抜けるかどうかは収支に直結します。","ex":"「あの物静かな客は実はシャークで、気づいたときには大きく負けていた。」"},{"n":182,"ja":"ジャストコール","lv":2,"en":"Just Call","kana":"ジャストコール","alias":["コールのみ","フラットコール"],"desc":"レイズをせず、相手のベット額に必要最低限の額を合わせてコールだけする行為を指す和製的な表現です。強いハンドをあえてレイズせずにコールに留めて相手を油断させる場面や、ポットオッズが見合う際のシンプルな対応として使われます。英語圏では「フラットコール」と表現されることが多い概念です。","ex":"「ここでレイズすると相手が降りてしまうから、あえてジャストコールで様子を見た。」"},{"n":183,"ja":"ジャックポット","lv":3,"en":"Jackpot","kana":"ジャックポット","alias":["プログレッシブジャックポット","特賞","OOP","先のアクション","ノットインポジション"],"desc":"特定の条件を満たした際に支払われる、大きな特別賞金・特典のことを指します。ポーカールームでは、レーキ（場代）の一部を積み立てて原資とし、滅多に起こらない特定の状況が発生したプレイヤーに大きな配当を支払う仕組みが設けられていることがあります。代表例が、非常に強い役が逆転負けした際に支払われる「バッドビートジャックポット」です。また、AOFなどのゲームで強い役が完成した時に当たるものもあります。通常のポット争いとは別に、こうしたジャックポットが用意されていることで、ゲームに射幸性とエンターテインメント性が加わり、プレイヤーの関心を引きます。","ex":"「まさかの役同士の激突で、テーブル全員がジャックポットの恩恵にあずかった。」"},{"n":184,"ja":"シャロースタック","lv":3,"en":"Shallow Stack","kana":"シャロー・スタック","alias":["浅いスタック"],"desc":"ブラインドに対して持ちチップ（スタック）が比較的少ない「浅い」状態を指します。ディープスタック（深いスタック）の対義語で、一般に実効スタックが概ね40BB以下のような状況で使われます。スタックが浅いとポットに対してすぐコミットしやすく（SPRが低い）、ターンやリバーでの複雑な駆け引きが減るため、プリフロップとフロップでの判断、とりわけハンドの絶対的な強さが重要になります。深いスタックのようにインプライドオッズを期待した投機的なハンドの価値は下がり、プレミアムハンドを軸にした、よりシンプルでコミットを恐れない戦略が有効になります。","ex":"「シャロースタックになったから、もう複雑な勝負はせずシンプルにいく。」"},{"n":185,"ja":"ショーダウン","lv":1,"en":"Showdown","kana":"ショーダウン","alias":["見せ合い"],"desc":"最後のベッティングラウンドが終わり、残ったプレイヤーが手札を公開して勝敗を決める局面です。最後にベットまたはレイズしたプレイヤーから時計回りに手を見せ、最も強い役を作ったプレイヤーがポットを獲得します。誰もアグレッシブなアクションをしなかった場合は、最初のプレイヤーから順に公開していきます。","ex":"「リバーまでコールが続き、ショーダウンで彼のフラッシュが相手のストレートを上回った。」"},{"n":186,"ja":"ショーダウンバリュー","lv":4,"en":"Showdown Value","kana":"ショーダウン・バリュー","alias":["SDV","見せ合いの価値"],"desc":"ベットして相手を降ろさなくても、ショーダウン（手の見せ合い）まで進めば一定の確率で勝てる、というハンドが持つ価値を指します。「SDV」とも略されます。例えばミドルペアのように強くはないが弱くもない手は、ブラフでベットして強い相手を降ろすより、無駄に大きくせず安く見せ合いに持ち込んだ方が得な場合が多く、「ショーダウンバリューがある」と表現されます。逆に、まったく勝ち目のないハンド（ブタ）はショーダウンバリューがゼロなので、勝つにはブラフに頼るしかありません。自分の手にどれだけのSDVがあるかを見極めることは、ベットすべきかチェックで見せ合うべきかを判断する基礎となります。","ex":"「このミドルペアはショーダウンバリューがあるから、無理に打たず安く見せ合おう。」"},{"n":187,"ja":"ショートスタック","lv":2,"en":"Short Stack","kana":"ショート・スタック","alias":["浅いスタック"],"desc":"テーブルの平均やブラインド額に比べ、持ちチップ（スタック）が著しく少ない状態を指します。プレイの選択肢が「オールインかフォールドか」に狭められるなど、戦略が大きく制限されます。トーナメントではブラインド上昇により頻繁に発生し、生き残るために適切なプッシュタイミングを見極める高い数学的精度が求められる、過酷な状況です。","ex":"「ショートスタックになったので、プレミアムハンドが来たら迷わずオールインする。」"},{"n":188,"ja":"ショートハンド","lv":2,"en":"Short-Handed","kana":"ショートハンド","alias":["ショートテーブル"],"desc":"テーブルの人数が少ない状態、一般的に6人以下でのプレイを指します。参加人数が少ないぶん各プレイヤーにブラインドが回ってくる頻度が高く、より広いレンジでアグレッシブにプレイする必要があります。9〜10人のフルリングとは戦略が大きく異なり、ハンドの相対的な価値が上がるのが特徴です。","ex":"「フルリングからショートハンドに変わったら、もっと積極的にハンドを広げないと勝てない。」"},{"n":189,"ja":"シングルビッグ","lv":3,"en":"One Big","kana":"シングル・ビッグ","alias":["ワンビッグ","SB不在"],"desc":"トーナメントにおいて、スモールブラインド（SB）のプレイヤーが脱落した直後のゲームなどで、SBが存在せずビッグブラインド（BB）のみで進行する特殊な状態です。また、スタックサイズが1BB（1ビッグ）しかない極限の状態を指す際にも使われます。強制参加費が少なくなるため、ポットの期待値（EV）計算に微妙な変化が生じる、トーナメント運営上の過渡期的な局面です。","ex":"「SBが飛んでシングルビッグ（ワンビッグ）のハンドになったため、ポットが少し小さい。」"},{"n":190,"ja":"シングルレイズドポット","lv":4,"en":"Single Raised Pot","kana":"シングルレイズドポット","alias":["SRP","3ベットなし"],"desc":"プリフロップでレイズが1回だけ入り、リレイズ(3ベット)されずに進んだポットを指します。最も発生頻度の高い基本的な状況で、ポットがそれほど大きくなっていないぶん、関わるレンジも広くなります。リレイズ合戦で膨らんだポットとは戦略が異なり、ポストフロップの基礎を学ぶ上で最も重要な局面です。","ex":"「3ベットされずに進んだシングルレイズドポットなので、相手のレンジはかなり広いと読んだ。」"},{"n":191,"ja":"シンバリュー","lv":5,"en":"Thin Value","kana":"シンバリュー","alias":["薄いバリュー"],"desc":"相手より僅かに強い程度のハンドで、ぎりぎり利益が見込めるバリューベットを行うことを指します。相手が自分より弱いハンドでコールしてくれる可能性が低くはないが高くもない、微妙な状況で薄い価値を取りに行く高度なプレイです。リスクを伴いますが、こうした細かいバリューの積み重ねが長期的な勝率を高めます。","ex":"「トップペアの弱いキッカーでも、相手のレンジを読んでシンバリューを取りにいった。」"},{"n":192,"ja":"スーテッド","lv":1,"en":"Suited","kana":"スーテッド","alias":["スート","Suit","Suits"],"desc":"手札の2枚が同じスート(マーク)であることを指します。例えばハートのAとハートのKのような組み合わせで、表記では「AKs」のように末尾に小文字のsを付けます。同スートだとフラッシュが完成する可能性が生まれるため、異なるスートのオフスートよりもわずかにハンドの価値が高くなります。","ex":"「AKsはスーテッドだから、フラッシュの目も見込めて強気にプレイできる。」"},{"n":193,"ja":"スーテッドコネクター","lv":1,"en":"Suited Connector","kana":"スーテッドコネクター","alias":["スーコネ"],"desc":"同じスートで数字が連続している2枚の手札を指します。例えばハートの7とハートの8のような組み合わせで、フラッシュとストレートの両方を狙える伸びしろの大きいハンドです。プリフロップでは弱く見えますが、フロップ以降で大きな役に化ける可能性を秘めており、相手の強いハンドから大きなポットを奪うインプライドオッズに優れています。","ex":"「スーテッドコネクターでフロップを見たら、フラッシュドローとストレートドローが同時に付いた。」"},{"n":194,"ja":"スクイーズ","lv":5,"en":"Squeeze","kana":"スクイーズ","alias":["スクイーズプレイ"],"desc":"誰かがレイズし、さらに別のプレイヤーがコールした後に、大きくリレイズしてプレッシャーをかける戦術です。最初のレイザーとコーラーの両方を一度に降ろすことを狙ったプレイで、自分のハンドの強弱に関わらずポットを奪うブラフとしても有効です。間に挟まれたコーラーは弱いハンドであることが多く、その状況を「絞り上げる」ように利用します。","ex":"「リンパーとコーラーがいたから、大きめのスクイーズで一気に二人とも降ろした。」"},{"n":195,"ja":"スクイーズブラフ","lv":5,"en":"Squeeze Bluff","kana":"スクイーズ・ブラフ","alias":["スクイーズプレイ","スクイズ"],"desc":"プリフロップで、誰かのオープンレイズに対して1人以上のコーラー（コールしたプレイヤー）がいる状況で、後ろからブラフとして大きく3ベットを被せ、全員を一気に降ろしてポットを奪うプレイを指します。「スクイーズ（squeeze＝締め付ける）」の名の通り、オープンレイザーとコーラーを挟み撃ちで圧迫します。コールしたプレイヤーは飛び抜けて強くはない手であることが多く、オープンレイザーも後ろにコーラーがいる手前むやみに続行しづらいため、ブラフが通りやすいのが理屈です。すでに入っているチップが多く成功時のリターンが大きい一方、誰かに強い手があれば手痛い反撃を受ける、リスクとリターンの大きい一手です。","ex":"「オープンに2人コールが続いたので、スクイーズブラフで一気に全員を降ろした。」"},{"n":196,"ja":"スクープ","lv":3,"en":"Scoop","kana":"スクープ","alias":["総取り"],"desc":"ハイ・ロー方式のポーカーで、ハイ(最高位の役)とロー(最低位の役)の両方を同一プレイヤーが獲得し、ポットを総取りすることを指します。オマハハイローやスタッドハイローなどで、ポットが分割されず一人がすべてをさらう最も理想的な勝ち方です。スクープを狙えるハンドを選ぶことが、ハイロー系ゲームの戦略の核心となります。","ex":"「オマハハイローでナッツのハイとローを同時に作り、見事ポットをスクープした。」"},{"n":197,"ja":"スクープポット","lv":3,"en":"Scoop Pot","kana":"スクープ・ポット","alias":["総取りポット"],"desc":"オマハハイローなどのスプリットゲームにおいて、一人のプレイヤーが「最高のハイハンド」と「最強のローハンド」の両方を同時に獲得し、ポット全体を独占することです。ハイとローで半分ずつ分けるのが通常ですが、スクープを達成することで利益が倍増します。戦略的には、片方だけでなく両方での勝利（スクープ）を狙えるハンドを選択することが勝ち越すための鍵となります。","ex":"「リバーでナッツローとフラッシュが完成し、見事にスクープポットを達成した。」"},{"n":198,"ja":"スケアカード","lv":3,"en":"Scare Card","kana":"スケアカード","alias":["危険なカード","危ないカード","不利なカード"],"desc":"ボードに出ることで、相手に強い役が完成した可能性を感じさせ、警戒や恐怖を抱かせるカードを指します。例えばフラッシュやストレートが完成し得るカードや、ハイカードのオーバーカードなどが該当します。スケアカードが出た局面では、たとえ自分のハンドが変わっていなくても、それを利用してブラフを仕掛ける好機にもなります。","ex":"「リバーで3枚目のスペードというスケアカードが落ち、相手はフラッシュを恐れてフォールドした。」"},{"n":199,"ja":"スターティングハンド","lv":1,"en":"Starting Hand","kana":"スターティングハンド","alias":["初期手札","スタハン"],"desc":"ゲーム開始時に各プレイヤーに配られる最初の手札のことです。テキサスホールデムでは2枚のホールカードを指し、この組み合わせの強さによって参加すべきか降りるべきかの判断が決まります。どのスターティングハンドでどう動くかという基準(ハンドレンジ)を理解することは、勝つための最も基本的かつ重要な土台となります。","ex":"「強いスターティングハンドだけを選んで参加する『タイト』な戦略が、初心者にはおすすめだ。」"},{"n":200,"ja":"スタック","lv":1,"en":"Stack","kana":"スタック","alias":["持ちチップ"],"desc":"プレイヤーが現在手元に持っているチップの総量を指します。スタックが大きいほどプレッシャーをかけやすく戦略の幅が広がり、逆に少ない「ショートスタック」では取れる選択肢が限られます。自分と相手のスタックの大小(スタックサイズ)は、ベット額の決定やオールインの判断において常に意識すべき最重要の要素です。","ex":"「相手より大きなスタックを持っていると、いつでもオールインで脅せる優位がある。」"},{"n":201,"ja":"スタッツ","lv":4,"en":"Stats","kana":"スタッツ","alias":["統計データ","統計ツール"],"desc":"プレイヤーの傾向を数値化した統計データのことで、Statistics(統計)の略です。オンラインポーカーではHUD(ヘッズアップディスプレイ)を使い、VPIP(自発的に参加する頻度)やPFR(プリフロップでレイズする頻度)などのスタッツを画面に表示して相手の傾向を分析します。これらの数値から相手がタイトかルースか、アグレッシブかパッシブかを判断し、的確な対応を取るための重要な指標です。","ex":"「相手のスタッツを見るとVPIPが高くて、かなりルースなプレイヤーだとわかった。」"},{"n":202,"ja":"スティール","lv":4,"en":"Steal","kana":"スチール","alias":["スチール","ブラインドスチール"],"desc":"強いハンドを持っていないにもかかわらず、レイズによって相手を降ろし、ブラインドやアンティを奪い取ろうとするプレイです。特にボタンやカットオフなどの後方ポジションから、残りのプレイヤーが降りやすい状況を突いて仕掛けます。誰も参加していないポットを継続的にスチールすることは、長期的なチップ獲得に大きく貢献します。","ex":"「ボタンから弱いハンドでレイズして、相手のブラインドをスチールした。」"},{"n":203,"ja":"ステーキング","lv":4,"en":"Staking","kana":"ステーキング","alias":["バッキング","出資","馬","参加中のハンド"],"desc":"あるプレイヤー（ホース）の参加費（バイイン）を、出資者（バッカー／ステーカー）が肩代わりして提供し、その見返りとして、得られた利益を事前に決めた割合で分け合う取り決めを指します。高額なトーナメントに挑戦したいが資金が足りないプレイヤーや、自分の分散リスクを抑えたいプレイヤーが利用します。出資者側は、有望なプレイヤーに投資して利益の一部を得ることを狙います。利益配分の条件（マークアップや返済義務など）は契約によって様々で、信頼関係が前提となる一方、金銭が絡むためトラブルの種にもなりやすい、繊細な側面を持つ仕組みです。プロの世界では一般的に行われています。","ex":"「高額なメインイベントは、ステーキングを受けて挑戦することにした。」"},{"n":204,"ja":"ステークス","lv":2,"en":"Stakes","kana":"ステークス","alias":["レート"],"desc":"ゲームで賭けられる金額の水準、すなわちブラインドやベットの大きさを指します。マイクロステークス、ロウステークス、ミドルステークス、ハイステークスといった段階で表され、自分の資金力(バンクロール)に見合ったステークスを選ぶことが破産を避ける鉄則です。ステークスが上がるほど相手の技術も高くなる傾向があります。","ex":"「バンクロールが増えてきたから、そろそろ一つ上のステークスに挑戦してみよう。」"},{"n":205,"ja":"ストーンコールドブラフ","lv":4,"en":"Stone Cold Bluff","kana":"ストーン・コールド・ブラフ","alias":["ピュアブラフ","エアーブラフ"],"desc":"ドローの可能性すら一切ない、完全に価値のないハンド（エアー）で行う純粋なブラフです。「ピュアブラフ」とも言われています。コールされれば100%負けという極限のリスクを背負いますが、相手が「弱気である」と確信した際や、スケアカードを利用して強引にポットを奪いたい時に、情報の空白を突く最もスリリングで大胆な戦術となります。","ex":"「何も引けなかったので、覚悟を決めてストーンコールドブラフを撃ち込んだ。」"},{"n":206,"ja":"ストップ＆ゴー","lv":6,"en":"Stop and Go","kana":"ストップ・アンド・ゴー","alias":["ストップアンドゴー"],"desc":"主にトーナメントでスタックが浅い場面で使われる戦術で、プリフロップで相手のレイズに対しオールインで3ベットを返す代わりに、あえてコールだけしておき（ストップ）、フロップが開いた直後に自分から先にオールインを仕掛ける（ゴー）プレイを指します。プリフロップでオールインすると相手は数字上のオッズで広くコールできてしまいますが、フロップを挟むことで、相手が自分の手にヒットしなかった場合にフォールドさせる「フォールドエクイティ」を一段階多く得られるのが狙いです。降ろせなくても勝負にはなるため、浅いスタックで少しでも降ろす確率を高めたい局面で用いられる、上級者向けの一手です。","ex":"「プリフロップで押し返さず、ストップ＆ゴーでフロップから先にオールインした。」"},{"n":207,"ja":"ストラクチャー","lv":2,"en":"Structure","kana":"ストラクチャー","alias":["トーナメントストラクチャー"],"desc":"トーナメントの進行を定める構造的なルールの総称で、ブラインドの上昇スピード、各レベルの時間、スターティングスタックの量などを指します。ブラインドの上がり方が緩やかな「ディープストラクチャー」は技術が反映されやすく、急上昇する「ターボ」は運の要素が強まります。ストラクチャーを理解することは、その大会に適した戦略を立てる前提となります。","ex":"「このトーナメントはストラクチャーがゆっくりだから、じっくり腰を据えて戦える。」"},{"n":208,"ja":"ストラドル","lv":3,"en":"Straddle","kana":"ストラドル","alias":["ブラインドストラドル"],"desc":"ディールの前に、ビッグブラインドの左隣のプレイヤーが任意でビッグブラインドの2倍額を強制ベットとして置く特殊なアクションです。ストラドルを置いた人は実質的に2つ目のブラインドの役割を担い、プリフロップで最後に行動できる権利を得ます。ポットを大きくして場を活性化させる目的で使われますが、不利になりやすいため上級者向けのプレイとされます。","ex":"「アクションを荒らすために、彼はボタンの前からストラドルを置いた。」"},{"n":209,"ja":"ストリーク","lv":2,"en":"Streak","kana":"ストリーク","alias":["連勝","連敗"],"desc":"勝ちや負けが連続して続いている状態を指します。連勝はウィニングストリーク、連敗はルージングストリークと呼ばれます。ポーカーは短期的な運の振れ幅(バリアンス)が大きいため、ストリークに一喜一憂せず、長期的な期待値に基づいて冷静にプレイを続ける精神力が求められます。","ex":"「ひどいルージングストリークが続いても、正しいプレイを崩さないことが大切だ。」"},{"n":210,"ja":"ストリート","lv":2,"en":"Street","kana":"ストリート","alias":["ベッティングラウンド"],"desc":"新たなコミュニティカードが公開されるごとに区切られる、各ベッティングラウンドを指す呼称です。テキサスホールデムではフロップ・ターン・リバーがそれぞれのストリートにあたり、特にターンを4thストリート、リバーを5thストリートと呼ぶこともあります。ストリートが進むごとに情報が増え、ベット額も大きくなっていくのが一般的です。","ex":"「ターンのストリートで相手が大きくベットしてきたので、慎重に対応した。」"},{"n":211,"ja":"ストリングベット","lv":3,"en":"String Bet","kana":"ストリング・ベット","alias":["ストリングレイズ","分割ベット","EP"],"desc":"チップを一度の動作で出さず、何回かに分けて継ぎ足すように置く、ルール違反のベット行為を指します。例えば、最初に少量のチップを置いてから相手の反応を見て追加で足す、といった動きがこれにあたります。こうした行為は、相手の表情やリアクションを盗み見てベット額を後出しで調整する不正につながるため、禁止されています。レイズする際は、口頭で「レイズ」と宣言するか、必要なチップを一度の動作で出すのが正式なルールです。違反した場合、追加分は認められず最初に置いた額までのコール扱いになるなど、ペナルティの対象となります。","ex":"「チップを二度に分けて出したらストリングベットを取られ、追加分は無効になった。」"},{"n":212,"ja":"ストレート","lv":1,"en":"Straight","kana":"ストレート","alias":["5枚の並んだカードの役"],"desc":"数字が連続する5枚のカードで構成される役で、スートは問いません。例えば5・6・7・8・9のような並びが該当します。役の強さはスリー・オブ・ア・カインドより上、フラッシュより下に位置します。Aは最も高い数字としても、A・2・3・4・5の最も低い並び(ホイール)としても使える点が特徴です。","ex":"「フロップでオープンエンドのドローから、ターンで見事にストレートが完成した。」"},{"n":213,"ja":"ストレートドロー","lv":1,"en":"Straight Draw","kana":"ストレートドロー","alias":["ストレートの手前","ガット","オープンエンド","OESD"],"desc":"あと1枚カードが揃えばストレートが完成する、未完成の状態を指します。両端どちらが来ても完成する「オープンエンドストレートドロー」と、中の1枚だけを待つ「ガットショット(インサイドストレートドロー)」があり、前者の方が完成する確率が高くなります。ストレートドローはアウツを計算してプレイの判断を下す代表的なドローハンドです。","ex":"「オープンエンドのストレートドローなら、リバーまでに約3割の確率で完成する。」"},{"n":214,"ja":"ストレートフラッシュ","lv":1,"en":"Straight Flush","kana":"ストレートフラッシュ","alias":["ストフラ","SF"],"desc":"同じスートで数字が連続する5枚のカードという、非常に強力な役です。フォー・オブ・ア・カインドの上、ロイヤルフラッシュの下に位置し、ほぼ最強クラスの手といえます。中でもA・K・Q・J・10の最高位の並びは特別に「ロイヤルフラッシュ」と呼ばれ、ポーカーにおける究極の役とされています。","ex":"「リバーで揃ったハートのストレートフラッシュで、相手のフルハウスを打ち砕いた。」"},{"n":215,"ja":"スナップコール","lv":2,"en":"Snap Call","kana":"スナップ・コール","alias":["即コール","瞬コール","インスタントコール"],"desc":"相手のベットやオールインに対して、ほとんど考える間もなく、瞬時にコールすることを指します。「スナップ（指を鳴らすほど一瞬で）」のコールという意味です。即座にコールできるということは、自分のハンドが明確に強く、迷う余地がない（自信がある）ことを示す場合が多く、相手に強さを印象づける効果もあります。一方で、わざと素早くコールして余裕を見せる演出として使われることもあります。逆に、長考の末のコールは迷いや弱さを示すことがあり、コールまでの「速さ」そのものが、相手に手の強さを推測させる情報（テル）となり得ます。","ex":"「相手のオールインに対してナッツだったので、迷わずスナップコールした。」"},{"n":216,"ja":"スノウィング","lv":6,"en":"Snowing","kana":"スノウィング","alias":["スノー","ドローブラフ","パットブラフ","ドローポーカーのブラフ"],"desc":"主にローボール（弱い手を目指すドローポーカー、特に2-7系）で用いられるブラフ戦術で、実際には弱い手しか持っていないにもかかわらず、カードを引かずにそのまま勝負する（スタンドパットする）ことで、すでに強い手が完成しているかのように見せかける行為を指します。「雪で覆い隠す」イメージから「スノー」と呼ばれます。相手に「あの人は引かなかった＝もう良い手ができている」と思わせ、降ろすことを狙います。引き枚数が重要な情報となるドローゲームならではの高度なブラフであり、相手の心理を読み、いつ仕掛けるかの見極めが成功の鍵を握ります。","ex":"「弱い手だったが、あえてパットしてスノウィングを仕掛け、相手を降ろした。」"},{"n":217,"ja":"スプリット","lv":3,"en":"Split","kana":"スプリット","alias":["チョップ","引き分け"],"desc":"複数のプレイヤーがまったく同じ強さの役を作り、ポットを均等に分け合うことを指します。ボード上の5枚のカードで役が決まり、双方の手札が勝敗に影響しない場合などに起こります。チップが割り切れない場合は、ボタンに最も近いプレイヤーから余り分が配られるのが一般的なルールです。","ex":"「お互いボードのストレートが最高役になり、ポットはスプリットになった。」"},{"n":218,"ja":"スプリットツーペア","lv":3,"en":"Split Two Pair","kana":"スプリット・ツー・ペア","alias":["手札を使ったツーペア"],"desc":"手札（ホールカード）の2枚がそれぞれボードの異なるカードとペアを作り、ツーペアを形成している状態です。ボードにペアができているツーペアに比べ、フルハウスなどのより強力な役にまくられるリスクが低く、かつ自分の役の強さが相手から透けにくいため、バリューを取りやすい比較的強力なハンドとして重宝されます。キッカーの強さが勝敗を分けることもあるため注意が必要です。","ex":"「スプリットツーペアが完成。相手のトップペアからしっかりバリューを取りたい。」"},{"n":219,"ja":"スプリットポット","lv":3,"en":"Split Pot","kana":"スプリット・ポット","alias":["チョップポット","分割ポット"],"desc":"ショーダウンの結果、複数のプレイヤーが全く同じ強さの役を持っていた場合に、ポットのチップを均等に分けて分配することです。チョップ（Chop）と同義です。また、ハイ/ローゲームのように、あらかじめルールでポットが分割されることが決まっている形式そのものを指すこともあります。独占できない物足りなさはありますが、不運な逆転劇を免れた「引き分け」としての安堵感も伴う結果です。","ex":"「リバーでカードが重なり、お互い最強のストレートでスプリットポットになった。」"},{"n":220,"ja":"スプレッドリミット","lv":4,"en":"Spread Limit","kana":"スプレッド・リミット","alias":["スプレッドリミットベット","幅制限","範囲制限ルール"],"desc":"ベットやレイズの額を、定められた「最小〜最大」の範囲（スプレッド）内であれば自由に決められる、ベッティングの構造（リミット形式）の一つです。例えば「2〜10ドル」と定められた卓では、その範囲内なら好きな額を賭けられます。1ベットの額が完全に固定されているフィックスドリミットと、ポットや持ちチップまで賭けられるノーリミットの、中間に位置する形式と言えます。ノーリミットほど一撃のリスクは大きくない一方、フィックスドリミットよりはベット額で表現の幅を持たせられるため、初心者がライブで遊ぶ卓などで採用されることもある、バランスの取れたルールです。","ex":"「この卓はスプレッドリミットだから、状況に応じてベット額を調整できる。」"},{"n":221,"ja":"スムースコール","lv":3,"en":"Smooth Call","kana":"スムースコール","alias":["フラットコール"],"desc":"強いハンドを持っているにもかかわらず、あえてレイズせずにコールに留めることで手の強さを隠す戦術です。相手を油断させて次のストリートでより多くのチップを引き出したり、後ろのプレイヤーを参加させたままにしたりする狙いがあります。罠を仕掛けるスロープレイの一種として用いられる高度なプレイです。","ex":"「モンスターハンドだったが、相手を泳がせるためにあえてスムースコールに留めた。」"},{"n":222,"ja":"スモールブラインド","lv":1,"en":"Small Blind","kana":"スモールブラインド","alias":["SB"],"desc":"ディーラーボタンの左隣のプレイヤーが、カードが配られる前に強制的に支払う少額のブラインドベットです。通常はビッグブラインドの半額に設定されます。すでにいくらか支払っている状態のため割安に参加できる一方、ポストフロップでは最初に行動しなければならない不利なポジションでもあります。","ex":"「スモールブラインドはすでにチップを払っているが、ポジションが悪いので扱いが難しい。」"},{"n":223,"ja":"スリー・オブ・ア・カインド","lv":1,"en":"Three of a Kind","kana":"スリー・オブ・ア・カインド","alias":["トリップス","セット"],"desc":"同じ数字のカードが3枚揃った役です。手札のペアとボードの1枚で揃える場合を「セット」、手札の1枚とボードのペアで揃える場合を「トリップス」と区別して呼びます。特にセットは相手から気づかれにくく、大きなポットを獲得しやすい強力な状況を作り出します。","ex":"「ポケットペアがフロップでセットになり、スリー・オブ・ア・カインドで大勝ちした。」"},{"n":224,"ja":"スリーベットポット","lv":5,"en":"3-Bet Pot","kana":"スリー・ベット・ポット","alias":["3ベットポット","3betポット","リレイズポット","3BP"],"desc":"プリフロップにおいて、オープンレイズ（2ベット）に対して誰かが3ベット（リレイズ）を行い、それがコールされて成立したポットのことを指します。通常のシングルレイズポット（SRP）と比較してポットサイズが大きく、両プレイヤーのレンジが強く絞られている（キャップされている）のが特徴です。ポットに対するスタックの比率（SPR）が低くなるため、ポストフロップではコミットしやすく、トップペアやオーバーペアでもスタックを投入する判断が増えます。3ベットしたプレイヤー（アグレッサー）はレンジが強い一方、Cベットの頻度やサイズ設計が勝敗を分けるため、SRPとは異なる戦略の理解が求められる、現代ポーカーで頻出する重要なポット形態です。","ex":"「スリーベットポットだからSPRが浅い。トップペアでもコミットしていい場面だ。」"},{"n":225,"ja":"スローウォーク","lv":3,"en":"Slow Walk","kana":"スロー・ウォーク","alias":["牛歩","遅延行為"],"desc":"アクションの順番が来た際に、特に難しい判断が必要ないにもかかわらず、意図的に時間をかけてゆっくりと行動する行為です。「牛歩」として、嫌われる行為の一種です。相手の集中力を乱したり、トーナメントのブラインド上昇時間を削ったりする意図で行われることがありますが、マナー違反として厳しく注意されることが一般的です。戦略的長考（タンク）とは明確に区別されるべき不適切な行為です。","ex":"「勝敗が決している場面でのスローウォークは、マナーに欠ける行為として慎むべきだ。」"},{"n":226,"ja":"スロープレイ","lv":3,"en":"Slow Play","kana":"スロープレイ","alias":["スロー","罠"],"desc":"非常に強いハンドを持っているのに、わざと弱いふりをして消極的にプレイし、相手を油断させる戦術です。チェックやコールに留めることで相手にベットを促し、ポットを大きく育ててから一気に刈り取ることを狙います。ただし相手にフリーカードを与えて逆転を許すリスクもあるため、使いどころの見極めが重要です。","ex":"「ナッツを引いたのでスロープレイで罠を張り、相手のオールインを誘った。」"},{"n":227,"ja":"スローロール","lv":4,"en":"Slow Roll","kana":"スロー・ロール","alias":["遅延ショーダウン","マナー違反"],"desc":"ショーダウンの際、自分が勝っているハンド（ほぼ確実に勝てる強い手）を持っているにもかかわらず、わざと時間をかけてカードを見せ、相手に「勝ったかもしれない」と一瞬期待させてから手札を公開する行為を指します。明確なルール違反ではありませんが、相手を侮辱し精神的に弄ぶ行為とみなされ、ポーカーにおいて最も嫌われるマナー違反の一つとされています。勝負の結果は同じでも、相手への敬意を欠いた振る舞いはテーブル全体の雰囲気を損ない、信頼を失います。強いハンドほど潔く速やかに見せることが、品位あるプレイヤーの作法とされています。","ex":"「ナッツを持っていたのにわざとゆっくり見せて、完全なスローロールだと顰蹙を買った。」"},{"n":228,"ja":"セイムハンド","lv":2,"en":"Same Hand","kana":"セイムハンド","alias":["同役","タイ","チョップ"],"desc":"複数のプレイヤーが実質的に同じ強さの役を作っている状態を指します。多くの場合ボード上の5枚で役が完成し、双方の手札が勝敗に影響しないケースで起こり、結果としてポットを分け合うスプリット(チョップ)になります。キッカーまで含めて完全に同位であることが条件で、わずかでも差があればセイムハンドとはなりません。","ex":"「お互いの手札が絡まずボードのストレートが最高役となり、セイムハンドで引き分けた。」"},{"n":229,"ja":"セカンドナッツ","lv":1,"en":"Second Nuts","kana":"セカンドナッツ","alias":["2番目の最強手"],"desc":"その場面で考えうる最強の役「ナッツ」に次いで、2番目に強い役を指します。非常に強力なハンドである一方、たった一つだけ上の役が存在するため、相手がそのナッツを持っている可能性を常に警戒する必要があります。大きなポットでセカンドナッツをどこまで強気に押すかは、難しい判断を迫られる局面です。","ex":"「セカンドナッツで自信があったが、まさか相手がナッツを持っているとは思わなかった。」"},{"n":230,"ja":"セカンドペア","lv":1,"en":"Second Pair","kana":"セカンドペア","alias":["2番目のペア"],"desc":"ボードに出ているカードのうち、2番目に高いカードとペアになっている状態を指します。最も高いカードとのペア「トップペア」に次ぐ強さですが、相手がトップペアを持っていれば負けてしまうため、過信は禁物の中途半端なハンドです。ポットコントロールを意識し、大きく育てすぎないよう慎重に扱う必要があります。","ex":"「セカンドペアではトップペアに負ける可能性があるので、ベットは控えめにした。」"},{"n":231,"ja":"セット","lv":1,"en":"Set","kana":"セット","alias":["スリー・オブ・ア・カインド"],"desc":"自分の手札のポケットペア(同じ数字2枚)と、ボード上の同じ数字1枚を組み合わせて完成するスリー・オブ・ア・カインドを指します。ボードにペアが見えていないため相手から非常に気づかれにくく、強力ながら隠匿性が高いのが最大の魅力です。大きなポットを獲得しやすく、しばしば相手のスタックを丸ごと奪います。","ex":"「ポケットペアがフロップでセットになり、相手はトップペアのまま気づかず突っ込んできた。」"},{"n":232,"ja":"セットオーバーセット","lv":1,"en":"Set Over Set","kana":"セットオーバーセット","alias":["セットマイン対決"],"desc":"両者がともにセット(ポケットペアからのスリー・オブ・ア・カインド)を完成させ、数字の大きいセットが小さいセットを打ち負かす状況です。負ける側はほぼ降りようがないほど強い手のため、大きなスタックを失う「クーラー」の典型例とされます。確率的に稀ですが、起きた際の損失は甚大になりがちです。","ex":"「セットフロップで強気に攻めたら、相手はもっと上のセット。まさかのセットオーバーセットで沈んだ。」"},{"n":233,"ja":"セットポケット","lv":2,"en":"Set Pocket","kana":"セット・ポケット","alias":["ポケットセット","セット"],"desc":"自分の手元の「ポケットペア」と、ボード上の1枚のカードを組み合わせて作るスリー・オブ・ア・カインド（スリーカード）のことです。ボードにペアが出ていない状況で成立するため、相手からは役の完成が極端に読まれにくいという強力な隠匿性を持っています。その意外性から、相手のトップペアやオーバーペアを「クラック（破壊）」して大きなバリューを引き出す、ポーカーにおける最強の利益源の一つです。","ex":"「フロップでセットポケットが完成。相手にはバレていないので大きく稼ぎたい。」"},{"n":234,"ja":"セットマイン","lv":4,"en":"Set Mine","kana":"セット・マイン","alias":["セット狙いのコール"],"desc":"プリフロップにおいて「セット」を完成させることだけを目的に、スモールペア（22〜66など）でレイズにコールしてフロップを見に行く戦略です。セットが刺さる確率は約12%（8回に1回）と低いですが、完成した際には相手のプレミアムハンドから全スタックを奪えるほどの破壊力（インプライドオッズ）があります。スタックが十分に深く、相手のハンドが強いことが確信できる状況で威力を発揮する投資的なプレイです。","ex":"「インプライドオッズが十分にあるので、22でセットマインを試みる価値はある。」"},{"n":235,"ja":"セミブラフ","lv":2,"en":"Semi-Bluff","kana":"セミブラフ","alias":["セミブラ","半ブラフ"],"desc":"現時点では役が完成していないものの、将来強い役になる可能性を秘めたドローハンドでベットやレイズを仕掛けるブラフを指します。相手を降ろせれば即勝ち、降りなくてもドローが完成すれば勝てるという「二段構えの勝ち筋」を持つのが強みです。完全な空ブラフよりリスクが低く、攻撃的なプレイの要となります。","ex":"「フラッシュドローを持っていたので、降ろせなくても勝機があると見てセミブラフを打った。」"},{"n":236,"ja":"セル","lv":5,"en":"Sell","kana":"セル","alias":["売る","バリューベット"],"desc":"自分の強いハンドを「相手に買ってもらう（コールしてもらう）」ようにベットすることを指すスラング（造語）です。相手が「負けているかもしれないが、この価格（額）なら買ってもいい」と思わせる絶妙なサイズでベットし、最大限の利益（バリュー）を引き出す技術を指します。相手の心理を見抜き、適正な「売値」を提示できるかどうかが、プロのバリューベットの精度を決定づけます。","ex":"「リバーでナッツを完成させ、相手がコールしやすい絶妙な額でハンドをセルした。」"},{"n":237,"ja":"センターポット","lv":3,"en":"Center Pot","kana":"センター・ポット","alias":["メインポット","中央ポット"],"desc":"全プレイヤーが獲得権利を共有している、テーブル中央の基本的なポット（メインポット）のことです。誰かがオールインしてチップが不足した際に発生する「サイドポット」と区別して使われます。全員が平等に争うチップの山であり、ここを制することがポーカーの直接的な勝利目的となります。情報の透明性を保つため、ポットの中身は常にテーブルの中央（センター）にまとめられます。","ex":"「オールインが発生したが、私はセンターポット（メインポット）の獲得権利のみを持つ。」"},{"n":238,"ja":"ソフトプレイ","lv":3,"en":"Soft Play","kana":"ソフト・プレイ","alias":["手加減","不当な協力"],"desc":"本来の対等な競争をせず、友人や特定のプレイヤーに対して、チェックで回したりベットを控えたりして手加減をする不当な行為です。ポーカーでは厳禁とされる「不当な協力（コリュージョン）」の一種と見なされます。公平なゲーム環境を損なうため、発覚した場合はペナルティや追放の対象となります。自分に関係のないハンドであっても、常に「ベストを尽くす」ことが全プレイヤーに課せられた義務とされています。","ex":"「親しい友人と同卓しているが、ソフトプレイにならないよう厳格にプレイした。」"},{"n":239,"ja":"ソフトプレイテーブル","lv":3,"en":"Soft Play Table","kana":"ソフト・プレイ・テーブル","alias":["緩いテーブル","カモ卓"],"desc":"技術レベルが低く、多くのプレイヤーが戦略を無視した「緩い（ソフト）」プレイを繰り返しているテーブルのことです。一般的には「フィッシュ（カモ）」が多く、中上級者にとって非常に高い利益（期待値）が見込める絶好の狩場を指します。こうしたテーブルを見つけ出し、着席すること（テーブルセレクション）は、長期的なバンクロール管理において、自分の腕を磨くことと同じくらい重要な技術です。","ex":"「このソフトプレイテーブルは非常に収益性が高いので、しばらくここで稼ごう。」"},{"n":240,"ja":"ソルバー","lv":6,"en":"Solver","kana":"ソルバー","alias":["GTOソルバー","ピオソルバー"],"desc":"ポーカーのゲーム理論的最適（GTO）戦略を計算するための解析ソフトウェアの総称です。特定の局面（スタック、レンジ、ボードなど）を入力すると、双方が最善を尽くした場合の理論上最適なアクションの頻度やベットサイズを、膨大な計算によって導き出します。PioSOLVERやGTO Wizardなどが代表例です。現代ポーカーの研究に革命をもたらしたツールで、実戦中にリアルタイムで使うことはできませんが、自分のプレイをソルバーの解と照らし合わせて検証することで判断の精度を高められます。ソルバーで学んだ理論を、実戦の相手の傾向に合わせて調整（エクスプロイト）して落とし込むのが現代的な上達法です。","ex":"「この局面をソルバーで回したら、思っていたよりチェックの頻度が高かった。」"},{"n":241,"ja":"ターゲット","lv":3,"en":"Target","kana":"ターゲット","alias":["標的","フィッシュ"],"desc":"特定のプレイスタイルの偏りや弱点（リーク）を持っているため、そこを突くことで利益を得やすい対戦相手のことです。技術の低いプレイヤーを「フィッシュ」とし、熟練者がその利益を奪いに行く様子を「シャーク」の狩りに例えて言われています。相手の弱点を見抜き、そのプレイヤーを戦略的な「標的」としてエクスプロイト（搾取）することは、ポーカーにおける収支向上のための基本的な思考法です。","ex":"「彼はブラフをしすぎている。次のハンドでは彼をターゲットにカウンターを狙おう。」"},{"n":242,"ja":"ターボ","lv":2,"en":"Turbo","kana":"ターボ","alias":["高速トーナメント"],"desc":"ブラインドの上昇間隔が短く、ゲームが急速に進行するトーナメント形式です。各レベルの時間が通常より短いため、スタックがすぐに圧迫され、早い段階からアグレッシブな勝負を強いられます。技術よりも運やプッシュ・フォールドの判断が重視されやすく、さらに高速な「ハイパーターボ」も存在します。","ex":"「ターボはブラインドの上がりが速いから、早めに勝負を仕掛けないとスタックが溶けてしまう。」"},{"n":243,"ja":"ターン","lv":1,"en":"Turn","kana":"ターン","alias":["4thストリート"],"desc":"フロップに続いて4枚目に公開されるコミュニティカードのことです。これにより使えるカードが計6枚(手札2枚+ボード4枚)となり、ドローの完成やハンドの優劣がより明確になります。ベット額が大きくなり始める重要な局面で、ここでの判断がリバーでの大きな勝負を左右します。","ex":"「ターンでフラッシュドローが完成し、一気に強気のベットへ切り替えた。」"},{"n":244,"ja":"ターンカード","lv":1,"en":"Turn Card","kana":"ターン・カード","alias":["4枚目の共有札","フォースストリート"],"desc":"フロップの後に、4枚目のコミュニティカードとしてテーブル中央に開かれる共有札のことです。また、その際に発生するベッティングラウンドそのものも「ターン」と呼ばれます。ゲームが終盤に差し掛かり、ポットが大きく膨らむ重要な局面であり、この一枚によって新たなドローが生まれたり、役の強弱が逆転したりするため、より慎重かつ大胆な決断が求められるターニングポイントです。","ex":"「ターンカードでスペードが落ち、相手のフラッシュが完成した可能性を警戒した。」"},{"n":245,"ja":"ターンベット","lv":2,"en":"Turn Bet","kana":"ターン・ベット","alias":["ターンでの打ち込み","ダブルバレル"],"desc":"ターンのラウンドにおいて、自分からチップをポットに投じるアクションです。フロップでの継続ベット（Cベット）に続き、さらにターンでもベットを打ち込むことは「ダブルバレル」と呼ばれ、自分の手の強さをより強固に主張し、相手に最大限のプレッシャーをかける攻撃的な手段となります。逆にチェックで様子を見るなど、リバーに向けてのポットコントロールを行う上での核心的な決断の場です。","ex":"「フロップのベットがコールされたので、強気のターンベットで相手を降ろしにいく。」"},{"n":246,"ja":"タイト","lv":1,"en":"Tight","kana":"タイト","alias":["堅実"],"desc":"参加するハンドを厳選し、強い手札のときだけ勝負する慎重なプレイスタイルです。むやみにポットに参加しないため、ハンドを見せたときの信頼度が高く、ブラフも効きやすくなります。初心者がまず身につけるべき手堅い基本戦略とされますが、参加が少なすぎると読まれやすくなる側面もあります。","ex":"「タイトに強いハンドだけ選んで参加するのが、勝つための第一歩だ。」"},{"n":247,"ja":"タイトパッシブ","lv":4,"en":"Tight Passive","kana":"タイトパッシブ","alias":["岩","ロック"],"desc":"参加するハンドが少なく(タイト)、かつベットやレイズよりコールやチェックを好む消極的(パッシブ)なスタイルです。手堅い反面、強い手でも積極的に攻めないため利益を取りこぼしやすく、「岩(ロック)」とも呼ばれます。ベットしてきたときは本当に強いことが多く、相手から読まれやすい弱点を抱えています。","ex":"「あの人はタイトパッシブだから、レイズしてきたら本物だと思って降りるべきだ。」"},{"n":248,"ja":"タイム","lv":1,"en":"Time","kana":"タイム","alias":["長考の宣言","タンク"],"desc":"自分のアクションの順番が来た際、複雑な状況を整理するために「考える時間が欲しい」とディーラーや同卓者に宣言することです。ライブポーカーでの基本的なエチケットです。あまりに長い時間は「クロック（時間制限）」を要求される原因となりますが、重要な局面での正当な思考時間はプレイヤーの権利として認められています。決断を急がず、期待値（EV）を冷静に算出するための静寂を確保するために使われます。","ex":"「非常に難しい決断を迫られたので、『タイム』を要求してじっくりと考えた。」"},{"n":249,"ja":"タイム・テル","lv":4,"en":"Timing Tell","kana":"タイム・テル","alias":["タイミングテル","時間のテル"],"desc":"相手がアクションを起こすまでにかかった「時間」から、その手の強さや心理を推測する手掛かり（テル）のことを指します。例えば、即座にチェックやコールをした場合は迷いのない弱い手やドロー、長考の末のベットは強い手を演出している、逆に長考の末のコールは本当に迷っている中程度の手、といった具合に、行動の速さ・遅さに意味が表れることがあります。特にオンラインでは表情が見えないぶん、このタイミングが数少ない読みの材料となり重視されます。ただし、熟練者はわざと一定のテンポを保ったり逆のテンポで撹乱したりするため、絶対的な指標ではなく、他の情報と合わせて総合的に判断する必要があります。","ex":"「あの即ベットはタイム・テル的に、強いというより降ろしにきている感じだ。」"},{"n":250,"ja":"タイムチャージ","lv":3,"en":"Time Charge","kana":"タイム・チャージ","alias":["タイム","時間料金","タイムレーキ","対戦相手","悪役"],"desc":"主に日本のアミューズメントカジノやポーカールームで採用される、プレイした「時間」に応じて施設利用料を支払う料金システムのことです。「タイム」とも呼ばれます。1時間あたり〇〇円といった形で課金され、海外のカジノでポットから一定額を徴収する「レーキ」とは異なる仕組みです。プレイ時間が長くなるほど費用がかさむため、漫然と長居するのではなく、勝てる卓で集中して効率よくプレイする意識が、コストパフォーマンスを高める上で重要になります。自分の収支を考える際には、ゲームの勝ち負けだけでなく、このタイムチャージも含めて計算する必要があります。","ex":"「ここはタイムチャージ制だから、調子が悪い日は早めに切り上げた方が得だ。」"},{"n":251,"ja":"タイムバンク","lv":1,"en":"Time Bank","kana":"タイム・バンク","alias":["思考時間の貯金"],"desc":"オンラインポーカーにおいて、通常の制限時間（通常数秒〜十数秒）を使い切った後に追加で使用できる、各プレイヤーに与えられた「予備の思考時間」のことです。各トーナメントやセッションごとに一定の秒数が付与されており、ここぞという大勝負での長考を可能にします。使い切ると強制的にアクションが決定（フォールド等）されるため、ここ一番の判断のために戦略的に温存しておく必要があります。","ex":"「リバーでのオールインに対し、タイムバンクをフル活用して最適な判断を下した。」"},{"n":252,"ja":"ダウンスイング","lv":3,"en":"Downswing","kana":"ダウンスイング","alias":["負け期"],"desc":"正しいプレイをしていても、運の振れ幅によって負けが続いてしまう不調の期間を指します。ポーカーは短期的なバリアンスが大きいため、実力者でもダウンスイングは避けられません。重要なのは、結果に動揺してプレイを崩したり(ティルト)、無理にステークスを上げたりせず、バンクロール管理を徹底して耐えることです。","ex":"「長いダウンスイングが続いているが、データを見れば自分のプレイは間違っていない。」"},{"n":253,"ja":"ダックス","lv":3,"en":"Ducks","kana":"ダックス","alias":["22","ポケットツー","ディユース","勝率","収益率"],"desc":"2枚のホールカードが両方とも2であるハンド、すなわちポケットツー（22）を指す俗語です。数字の「2」の形がアヒル（duck）に似ていることから「ダックス（Ducks）」と呼ばれます。最も小さいポケットペアであり、それ自体は非常に弱いものの、ポケットペアである以上セット（スリーカード）を引く可能性を秘めている点に価値があります。オーバーカードだらけになりやすいため、ワンペアのまま勝負するのは危険で、基本的にはスタックが深い相手に対してセットを狙うセットマイニングが主戦略となります。小さくても侮れない、当たれば大きい「ロマンのある」ハンドです。","ex":"「ダックスでコール、セットになれば一気にスタックを取れるチャンスだ。」"},{"n":254,"ja":"多面打ち（ためんうち）","lv":3,"en":"Multi-tabling","kana":"タメンウチ","alias":["マルチタブレーリング"],"desc":"オンラインポーカーにおいて、同時に複数のテーブル（画面）を開いて並行してプレイする行為です。時間あたりのハンド数を劇的に増やすことができるため、高いウィンレートを持つプレイヤーが効率よく利益（時給）を最大化するために行います。しかし、同時に処理しなければならない情報量が増えるため、1ハンドあたりの集中力や分析の精度は低下しやすくなります。自分の実力と管理能力のバランスを見極め、適切なテーブル数を選択することが、長期的な収益を安定させるための高度な自己管理技術となります。","ex":"「効率を重視して多面打ちをしているが、集中力が切れるとケアレスミスが増える。」"},{"n":255,"ja":"タフコール","lv":3,"en":"Tough Call","kana":"タフ・コール","alias":["難しいコール","究極の選択","苦しいコール","難決断"],"desc":"勝っているか負けているかの判断が極めて難しく、コールすべきかフォールドすべきか苦悩する、際どい決断を指します。例えば、自分の手はそこそこ強いものの、相手のベットが本物の強い手なのかブラフなのか判断がつかず、コールすれば大きく失う恐れもあるが、降りればブラフに屈する可能性もある、といった状況です。ポットオッズ、相手のレンジ、これまでのアクション、相手のタイプなど、あらゆる情報を総動員して下す必要があり、こうした難しい局面で正しい判断を積み重ねられるかが、プレイヤーの実力差として表れます。結果がどうであれ、根拠に基づいた判断ができたかが重要です。","ex":"「リバーの大きなベットに対して、ブラフキャッチかどうか究極のタフコールを迫られた。」"},{"n":256,"ja":"ダブルアップ","lv":2,"en":"Double Up","kana":"ダブルアップ","alias":["倍プッシュ"],"desc":"オールインで勝利し、自分のスタックを一気に2倍に増やすことを指します。特にトーナメントでスタックが少なくなった際、ダブルアップは再び上位を狙うための起死回生の一手となります。リスクは大きいものの、ショートスタックから劇的に立場を逆転させる重要な戦術的目標です。","ex":"「ショートスタックだったが、ここぞのオールインでダブルアップに成功して息を吹き返した。」"},{"n":257,"ja":"ダブルチェックレイズ","lv":6,"en":"Double Check-Raise","kana":"ダブル・チェック・レイズ","alias":["連続チェックレイズ"],"desc":"同一のハンド内で、複数のストリートにわたって連続してチェックレイズを仕掛ける高度なプレイを指します。例えばフロップでチェックレイズし、続くターンでも再びチェックから相手のベットにレイズを被せるような形です。チェックレイズ自体が相手に強い圧力を与えるアクションであり、それを二度繰り返すラインは、ナッツ級の非常に強いハンドか、相手を完全に降ろしにいく大胆なブラフのいずれかを強く示唆します。極めて稀にしか現れないため相手に与えるインパクトは絶大ですが、自分のレンジがこのラインで偏らないよう、バリューとブラフのバランスを意識して用いる必要があります。","ex":"「フロップに続いてターンでもチェックレイズ。ダブルチェックレイズはほぼナッツだ。」"},{"n":258,"ja":"ダブルバレル","lv":5,"en":"Double Barrel","kana":"ダブルバレル","alias":["2連ベット"],"desc":"フロップでベット(コンティニュエーションベット)した後、ターンでも続けてベットを打ち込み、圧力をかけ続けるプレイです。1回のベットで降りなかった相手に対し、2発目の銃弾を撃ち込むイメージから名付けられました。相手のドローを潰したり、弱いペアを降ろさせたりする目的で使われる、攻撃的なブラフ戦術です。","ex":"「フロップで降りなかった相手に、ターンでもダブルバレルを打ち込んで降ろした。」"},{"n":259,"ja":"ダブルベリー","lv":5,"en":"Double Belly","kana":"ダブルベリー","alias":["ダブルガットショット"],"desc":"「ダブルベリーバスター」の略称で、2か所の異なる内側の隙間(ガットショット)のどちらが埋まってもストレートが完成するドローを指します。一見すると内側待ちですが、待ちのカードが実質8枚あるため、両端待ちのオープンエンドと同等の完成確率を持つ強力なドローです。見落としやすいため、相手も警戒しにくいのが利点です。","ex":"「一見ガットショットに見えたが、実はダブルベリーで完成の目は意外と多かった。」"},{"n":260,"ja":"ダブルベリーバスター","lv":5,"en":"Double Belly Buster","kana":"ダブルベリーバスター","alias":["ダブルガットショット"],"desc":"2か所の内側の隙間(ガットショット)を同時に持ち、そのどちらが埋まってもストレートが完成するドローの正式名称です。完成に必要なカードが合計8枚あり、両端待ちのオープンエンドストレートドローと同じ確率でストレートになります。構造が複雑で相手から読まれにくいため、ブラフと組み合わせると効果的です。","ex":"「ボードの構造上ダブルベリーバスターになっていて、完成のアウツは思ったより多かった。」"},{"n":261,"ja":"ダブルベリーバスターガットショットストレートドロー","lv":5,"en":"Double Belly Buster","kana":"ダブル・ベリー・バスター・ガットショット・ストレート・ドロー","alias":["二重ガットショット","ダブルガット"],"desc":"連続する5枚の数字の「間の1枚」を待つ「ガットショット（ベリーバスター）」が、一つのハンドで2種類同時に成立している特殊な状態です。例えば、手元が10・JでボードがA・Q・8の場合、9が出てもKが出てもストレートが完成します。完成させるアウツは「オープンエンド」と同じ8枚ありながら、ボードの見た目からは役の完成が読まれにくいため、不意を突いて巨大なポットを奪える強力な隠れドローとして重宝されます。","ex":"「フロップでダブルベリーバスターガットショットストレートドロー。強気で攻められる。」"},{"n":262,"ja":"チェイス","lv":3,"en":"Chase","kana":"チェイス","alias":["追いかけ"],"desc":"ドローを完成させることを期待して、不利なオッズを承知でコールを続けてしまう行為を指します。フラッシュやストレートを「追いかける」様子から名付けられ、多くの場合ポットオッズに見合わない不利なプレイとして戒められます。完成を願って深追いするチェイスは、長期的には資金を失う典型的な負けパターンです。","ex":"「割に合わないのにフラッシュをチェイスし続けて、結局リバーで外して大損した。」"},{"n":263,"ja":"チェック","lv":1,"en":"Check","kana":"チェック","alias":["確認","見送り"],"desc":"自分のターンで、ベットをせずに権利を次のプレイヤーへ回すアクションです。まだ誰もベットしていない場合に限り選択でき、チップを支払わずにそのストリートを進められます。様子見や、相手にベットを促してから反撃する罠(チェックレイズ)の布石など、攻守両面で使われる基本的な選択肢です。","ex":"「ここは情報が欲しかったので、まずチェックして相手の出方をうかがった。」"},{"n":264,"ja":"チェックアラウンド","lv":1,"en":"Check Around","kana":"チェック・アラウンド","alias":["チェックで回る","全員チェック","勝率の実現"],"desc":"あるベッティングラウンドで、参加している全てのプレイヤーが誰もベットせず、チェックのまま一周して次のストリートに進むことを指します。「チェックで回る」とも言います。誰もチップを賭けなかったため、ポットは大きくならずに次のカードが開かれます。全員がチェックしたという事実は、その場に強い手を持ったプレイヤーがいない（あるいは皆が弱さを隠して様子を見ている）可能性を示唆する情報となります。チェックアラウンドした後のストリートでは、それまで動かなかったポットの主導権を、誰かが先にベットして奪いに行く展開になりやすく、その後の流れを読む上での起点となります。","ex":"「フロップがチェックアラウンドで回ったので、ターンで誰がベットを打つか注目だ。」"},{"n":265,"ja":"チェックインザダーク","lv":4,"en":"Check in the Dark","kana":"チェック・イン・ザ・ダーク","alias":["ダークチェック","暗チェック","搾取","弱点を突く"],"desc":"次に開かれるコミュニティカードをまだ見ていない段階で、あらかじめ「チェック」を宣言しておくプレイを指します。「ダーク（暗闇の中で＝見ないで）」行うチェックという意味です。例えばフロップのアクション終了時に、ターンのカードを見る前に「ダークでチェック」と宣言します。これにより、自分はカードに反応しないという姿勢を見せ、相手に主導権を委ねたり、自分のレンジ全体をチェックで守ったり、あるいは相手を油断させて誘い込んだりといった効果を狙います。情報を見ずに先にアクションを固定する点で、心理的な駆け引きやレンジのバランスを意識した、やや上級者向けの一手です。","ex":"「ターンを見ずにチェックインザダークを宣言し、相手にプレッシャーを委ねた。」"},{"n":266,"ja":"チェックコール","lv":1,"en":"Check-Call","kana":"チェック・コール","alias":["待ちのコール"],"desc":"アウトオブポジションのプレイヤーが、まずは「チェック」をして様子を見、その後のインポジションの相手のベットに対して「コール」で応じる一連のアクションです。自分から攻撃（レイズ）はしないが、手を降りるほど弱くもない「ミドルレンジ」のハンドで行われることが多い守備的な戦略です。ポットの膨らみを抑えつつ、ショーダウンを目指す際の堅実な選択肢として多用されます。","ex":"「自分の手はそれほど強くないので、リバーまでチェックコールで粘ることにした。」"},{"n":267,"ja":"チェックチップ","lv":2,"en":"Check Chip","kana":"チェック・チップ","alias":["チェックの発声","合図"],"desc":"チップを賭けずに番をパスする際に行う、テーブルを指先で叩いたり、口頭で「チェック」と宣言したりする合図のことです。ライブポーカーでは、誤認を防ぐために明確なジェスチャーや発声が求められます。アクションを回すための基本的な意思表示であり、不用意な仕草がチェックと見なされてしまわないよう（アウトオブターンなど）、自分の動作に一貫性を持たせることがマナーとして重要です。","ex":"「ディーラーに分かるよう、テーブルを軽く2回叩いてチェックチップの合図を送った。」"},{"n":268,"ja":"チェックバック","lv":3,"en":"Check Back","kana":"チェック・バック","alias":["後攻のチェック"],"desc":"先に行動したプレイヤーがチェックしたのを受け、後のポジションのプレイヤーも続けて「チェック」を選択することです。これによりそのラウンドのベッティングは終了し、チップの追加なしで次のカードが開かれます（チェックアラウンド）。ポジションの優位性を活かして「無料で次のカードを見る（フリーカード）」ための、あるいは自分の弱さを見せたくない時の戦略的な消極策として使われます。","ex":"「相手が弱気なチェックをしたので、こちらも無理せずチェックバックで次へ回した。」"},{"n":269,"ja":"チェックフォールド","lv":3,"en":"Check-Fold","kana":"チェック・フォールド","alias":["諦めの一手","諦めのチェック"],"desc":"自分の手番でまずチェックし、その後に相手がベットしてきたら降りる（フォールドする）、という一連のプレイ、あるいはその意図を最初から持っている状態を指します。手が弱く、ベットしてバリューを取る見込みも、ブラフで降ろす見込みも乏しい場合に、これ以上チップを失わないために選ぶ消極的・防御的な選択です。無理に攻めて傷を広げるのではなく、安く諦めることで損失を最小限に抑えるという、規律ある撤退と言えます。ただし、常にチェックフォールドばかりしていると、弱いレンジを相手に見透かされて付け込まれるため、時にはチェックレイズなどの抵抗を混ぜてバランスを取ることも重要です。","ex":"「このハンドはもう見込みがないので、チェックして打たれたら降りるチェックフォールドだ。」"},{"n":270,"ja":"チェックレイズ","lv":3,"en":"Check-Raise","kana":"チェックレイズ","alias":["チェックレイズアップ","CR"],"desc":"最初に自分がチェックして相手にベットさせ、そのアクションが返ってきたところでレイズし返す強力な戦術です。弱さを装って相手を誘い込み、ポットを大きく育てたり相手を降ろしたりします。バリュー目的にもブラフにも使える高度なプレイで、決まれば相手に大きな心理的圧力を与えます。","ex":"「弱く見せかけてチェックし、相手がベットした瞬間にチェックレイズで一気に攻め返した。」"},{"n":271,"ja":"チェックレンジ","lv":5,"en":"Check Range","kana":"チェック・レンジ","alias":["チェックする手の範囲"],"desc":"特定の状況において、プレイヤーが「チェック」を選択する可能性のあるハンド全体の組み合わせ（レンジ）のことです。上級者は自分のチェックレンジの中に、わざと「非常に強いハンド」を混ぜてバランスを取ります（スロープレイ）。これにより、チェックした瞬間に「弱さ」を露呈するのを防ぎ、相手が不用意なブラフを仕掛けてきたところを罠にはめる（チェックレイズ）といった高度な守備戦略が可能になります。","ex":"「私のチェックレンジにはナッツも含まれているので、相手は安易にベットできないはずだ。」"},{"n":272,"ja":"チップ","lv":1,"en":"Chip","kana":"チップ","alias":["コイン","点棒"],"desc":"ポーカーで現金の代わりに賭けに用いる、円盤状の代用貨幣です。色や模様で金額が区別され、現金を直接扱う煩雑さや危険を避けつつ、スムーズなベッティングを可能にします。トーナメントでは現金価値を持たない競技用チップが使われ、その量がそのままプレイヤーの生存と順位を意味します。","ex":"「テーブルに着いたら、まず現金をチップに交換することから始まる。」"},{"n":273,"ja":"チップリーダー","lv":1,"en":"Chip Leader","kana":"チップリーダー","alias":["チップリ","トップスタック","CL"],"desc":"トーナメントやテーブルにおいて、最も多くのチップを保有しているプレイヤーを指します。豊富なスタックを背景に相手へオールインのプレッシャーをかけられるため、戦略的に非常に有利な立場です。ただし優位に油断して無謀な勝負を仕掛けると一気に転落することもあり、優位を保つ慎重さも求められます。","ex":"「終盤でチップリーダーに立ったので、ショートスタックを狙って積極的にプレッシャーをかけた。」"},{"n":274,"ja":"チョップ","lv":1,"en":"Chop","kana":"チョップ","alias":["スプリット","引き分け","セイムハンド"],"desc":"複数のプレイヤーが同じ強さの役となり、ポットを分け合うことを指します。スプリットとほぼ同義で、トーナメント終盤に残ったプレイヤー同士が合意のうえで賞金を分配する「ディールによるチョップ」を指す場合もあります。後者はバリアンスを抑えて確実に賞金を確保する手段として用いられます。","ex":"「ヘッズアップまで残った二人は、リスクを避けて賞金をチョップすることで合意した。」"},{"n":275,"ja":"チョップポット","lv":1,"en":"Chop Pot","kana":"チョップ・ポット","alias":["スプリットポット","分割ポット"],"desc":"ショーダウンの結果、勝敗がつかずポットのチップを均等に分けること（チョップ）を指します。また、トーナメントの最終局面でプレイヤー同士が合意し、賞金を分配して終了する「ディール」の結果生じるポットを指すこともあります。全員が共有するボードで最強の役が完成している場合などに頻発し、誰も損をしないが利益も出ない「公平な引き分け」の状態を象徴する言葉です。","ex":"「お互いAKを持っていたため、結局チョップポット（分割）で平和的に終わった。」"},{"n":276,"ja":"ツーペア","lv":1,"en":"Two Pair","kana":"ツーペア","alias":["2ペア","トゥーペア"],"desc":"2種類の異なるペアが同時に揃った役です。役の強さはワンペアより上、スリー・オブ・ア・カインドより下に位置します。2つのペアの数字が高いほど強く、同位の場合は5枚目のカード(キッカー)で勝敗が決まります。比較的作りやすく実戦で頻繁に登場する、扱いやすい中堅の役です。","ex":"「フロップで上下二段のツーペアが完成し、そのまま強気に押し切った。」"},{"n":277,"ja":"追加ブラインド（ついか）","lv":3,"en":"Posting a Blind","kana":"ツイカ・ブラインド","alias":["ポスト","途中参加ブラインド"],"desc":"キャッシュゲームにおいて、ブラインドポジションではない位置から新しくゲームに参加する際、BBと同額のチップを強制的に支払う（ポストする）ことです。次のBBの番が来るまで待たずに、すぐにハンドを受け取りたい場合に支払われます。また、休憩から戻った際などにブラインドを飛ばしてしまった場合にも、復帰のために「追加の支払い」を求められることがあります。ポットに最初から溜まる「デッドマネー」を増やす効果があります。","ex":"「BBまで待つのがもどかしいので、追加ブラインド（ポスト）を支払って即座に参加した。」"},{"n":278,"ja":"ツモ","lv":2,"en":"Hit / Get There","kana":"ツモ","alias":["つも","ツモる","引く","ヒット"],"desc":"麻雀由来の俗語で、自分が必要としていたカード（アウツ）を引き当てること、ドローが完成することを指します。「ツモった」「ツモる」のように動詞的に使われ、例えばフラッシュドローでリバーに欲しいスートのカードが落ちた状況を「フラッシュをツモった」と表現します。日本のポーカーコミュニティで広く使われる言い回しで、英語の「Hit（ヒット）」や「Get there」に相当します。狙ったカードを引いて逆転や役の完成が起きた瞬間の高揚感を伴う言葉である一方、相手に引かれた場合は「ツモられた」と、不運（バッドビート）を嘆く文脈でも使われます。","ex":"「リバーでドンピシャのカードをツモって、逆転のフラッシュが完成した。」"},{"n":279,"ja":"ディープスタック","lv":3,"en":"Deep Stack","kana":"ディープスタック","alias":["ディープ","厚いスタック"],"desc":"ブラインドの大きさに対して、各プレイヤーの持ちチップが非常に多い状態を指します。100BB以上が一般的な目安で、スタックに余裕があるぶん、ポストフロップでの駆け引きやブラフ、複雑な戦略が展開しやすくなります。短期的な運より総合的な技術が反映されやすく、上級者ほど力を発揮しやすい状況です。","ex":"「ディープスタックの卓では、じっくりとした読み合いの心理戦が勝敗を分ける。」"},{"n":280,"ja":"ディーラー","lv":1,"en":"Dealer","kana":"ディーラー","alias":["親","ボタン"],"desc":"カードを配り、ベットの進行やポットの管理を取り仕切る役割を担う人を指します。カジノでは専任のスタッフが務めますが、ホームゲームではプレイヤーが交代で担当します。なお、専任ディーラーがいる場合でも、ディーラーボタンを持つプレイヤーが名目上の「ディーラー(親)」とされ、最後に行動できる有利なポジションを得ます。","ex":"「カジノでは専任のディーラーが配るが、ボタンを持つプレイヤーが親の扱いになる。」"},{"n":281,"ja":"ディーラーチップ","lv":2,"en":"Toke / Dealer Tip","kana":"ディーラー・チップ","alias":["トーク","心付け","ディーラーへのチップ","追いリンプ"],"desc":"良いディーリングをしてくれたディーラーへの感謝の気持ちとして、プレイヤーが渡す心付け（チップ＝tip）のことを指します。英語では「トーク（Toke）」とも呼ばれます。海外のカジノでは、ポットを勝った際などに少額を渡す習慣が広く根付いています。日本のアミューズメント施設では文化や運営形態によって扱いが異なり、必須ではない場合も多いため、その場のルールや慣習に従うのが無難です。なお、ポーカーで使う「チップ（点棒）」とは別物である点に注意が必要で、文脈によって「チップ」がゲーム用の点棒を指すのか、心付けを指すのかを区別する必要があります。","ex":"「いいハンドで勝てたので、ディーラーチップを少し渡して感謝を伝えた。」"},{"n":282,"ja":"ディーラーボタン","lv":1,"en":"Dealer Button","kana":"ディーラーボタン","alias":["ボタン","BTN"],"desc":"名目上の親(ディーラー)の位置を示す円盤状のマーカーです。このボタンを持つプレイヤーは各ストリートで最後に行動できる最も有利なポジションとなり、1ハンドごとに時計回りに移動します。ボタンの位置を基準にブラインドの支払い順やアクションの順番が決まる、ゲーム進行の要となる目印です。","ex":"「ディーラーボタンが自分に回ってくると、最も有利なポジションで戦える。」"},{"n":283,"ja":"ディール","lv":1,"en":"Deal","kana":"ディール","alias":["配牌","合意分配"],"desc":"主に2つの意味で使われます。1つはカードを配る行為そのもの、すなわち「配牌」を指します。もう1つはトーナメント終盤で、残ったプレイヤー同士が合意のうえで賞金を分配する取り決めを指し、勝負のバリアンスを抑えて確実に賞金を確保する手段として用いられます。文脈によって意味が異なる用語です。","ex":"「ファイナルテーブルで運に左右されたくなかったので、賞金のディールを提案した。」"},{"n":284,"ja":"ディスカード","lv":2,"en":"Discard","kana":"ディス・カード","alias":["捨て札","交換"],"desc":"ドローポーカーにおいて、手札の中から不要なカードを捨て、新しいカードと交換するアクションを指します。テキサスホールデムでは直接のアクションとしては存在しませんが、フォールドしたカードがディーラーによって「マック（捨て札）」領域に置かれる様子を指すこともあります。情報の機密を保つため、捨てられたカードは決して表を向けてはならないのがポーカーの厳格なルールです。","ex":"「不要な3枚をディスカードし、ストレートフラッシュの奇跡を信じてドローした。」"},{"n":285,"ja":"ディフェンス","lv":3,"en":"Defense","kana":"ディフェンス","alias":["防御","ブラインド守備"],"desc":"相手のベットやレイズ、特に自分の支払ったブラインドを奪おうとする「スチール」に対し、フォールドせずに戦い続ける守備アクションです。自分の取り分（ポット）を守るために必要であり、GTO的には「最小ディフェンス頻度（MDF）」を維持することが搾取されないための基本とされます。安易に降りすぎると相手の思う壺（利益の源泉）になってしまうため、時にはマージナルな手でも勇気を持って「防衛」することが求められます。","ex":"「ボタンからのスチールに対し、BBとして広いレンジでしっかりとディフェンスした。」"},{"n":286,"ja":"ティルト","lv":2,"en":"Tilt","kana":"ティルト","alias":["熱くなる","メンタル崩壊"],"desc":"負けや不運な展開によって冷静さを失い、感情的で無謀なプレイに陥ってしまう精神状態を指します。バッドビートなどをきっかけに判断力が低下し、取り返そうとして傷を広げる悪循環に陥りがちです。ティルトの管理はメンタル面の最重要課題であり、コントロールできるかどうかが長期的な勝敗を大きく左右します。","ex":"「バッドビートでティルトしてしまい、次々と無茶な勝負をして負けを重ねた。」"},{"n":287,"ja":"ディレイCB","lv":5,"en":"Delayed C-bet","kana":"ディレイ・シー・ビー","alias":["遅れた継続ベット"],"desc":"プリフロップのアグレッサーが、フロップではあえてチェックし、ターンで初めて打ち込む継続ベット（Cベット）のことです。戦略的には「フロップでのチェックで弱さを見せた後、ターンで改めて強さを主張する」トリッキーなアクションです。相手に「フロップを外した」と誤認させてブラフを誘ったり、自分のハンドの正体を隠したりする高度なポットコントロール手法として中上級者に愛用されます。","ex":"「フロップは慎重にチェックし、ターンで強力なディレイCBを放ってポットを奪った。」"},{"n":288,"ja":"テーブルイメージ","lv":4,"en":"Table Image","kana":"テーブル・イメージ","alias":["印象","プレイヤーの評判"],"desc":"同卓しているプレイヤーたちから、自分が「どのようなスタイルの打ち手」であると思われているかという客観的な印象のことです。例えば、ずっとフォールドし続けていれば「タイト（慎重）」というイメージがつき、逆に暴れていれば「ルース（攻撃的）」と見られます。上級者はこの「イメージ」をあえて偽装し、タイトなイメージを植え付けた後で大きなブラフを仕掛けるなど、相手の心理的バイアスを戦略的に利用します。","ex":"「テーブルイメージがタイトだったので、ここでの大きなブラフは非常に効果的だった。」"},{"n":289,"ja":"テーブルキャプテン","lv":4,"en":"Table Captain","kana":"テーブル・キャプテン","alias":["卓の主導者"],"desc":"そのテーブルで最も頻繁にベットやレイズを仕掛け、アグレッションでゲームの流れを支配しているプレイヤーを指す俗語です。常に主導権を握って周囲にプレッシャーをかけ続けるため、他のプレイヤーは受け身に回りがちになります。多くのポットに自分から積極的に関与し、卓の「船長」のように振る舞う存在で、上手く機能していれば高い収益を上げますが、その攻撃性を逆手に取られ、強い手で待ち構えられて（トラップされて）手痛い反撃を受けるリスクも併せ持ちます。自分がテーブルキャプテンになるか、誰かがその役割を担っているなら、その攻撃性をどう利用・対処するかを考えることが重要です。","ex":"「彼が完全にテーブルキャプテンだから、強い手で一度待ち構えて反撃したい。」"},{"n":290,"ja":"テーブルステーク","lv":3,"en":"Table Stakes","kana":"テーブル・ステーク","alias":["卓上資金限定ルール"],"desc":"ゲームに参加している間は、テーブルの上にあるチップ量（スタック）の範囲内でしかベットや勝負ができず、ハンドの途中でポケットから現金を継ぎ足すことはできないという公平性のための基本ルールです。これにより、資金力の差で相手を強引に圧倒することを防ぎ、技術的な勝負を担保します。チップが不足した場合は「オールイン」として処理され、自分の持っている額の範囲内でポットを争う権利が保護されます。","ex":"「テーブルステークのルールに従い、手持ちの全スタックを賭けて勝負に挑んだ。」"},{"n":291,"ja":"テクスチャー","lv":4,"en":"Board Texture","kana":"テクスチャー","alias":["ボードテクスチャー","盤面の質"],"desc":"フロップ以降に場に開かれたコミュニティカード（ボード）が持つ性質や特徴を指す言葉です。カード同士が繋がっていてストレートやフラッシュが完成しやすい盤面を「ウェット（湿った）」、バラバラでドローが少なく強いハンドが限られる盤面を「ドライ（乾いた）」と表現します。このテクスチャーをどう読むかは、ベットするかチェックするか、ベットサイズをどう設定するか、Cベットの頻度をどうするかといった、ポストフロップのあらゆる判断の土台となります。同じハンドでもボードテクスチャー次第で最適なアクションは大きく変わるため、自分と相手のレンジがそのボードにどう噛み合うかを読み解く力が求められます。","ex":"「このウェットなテクスチャーなら、Cベットの頻度は下げた方がいい。」"},{"n":292,"ja":"デック","lv":1,"en":"Deck","kana":"デック","alias":["山札","トランプ一組"],"desc":"ジョーカーを除いた52枚一組のトランプ全体を指します。4つのスート×13の数字で構成され、ポーカーで使われる確率計算の母数となります。残りデックに自分の役を完成させるカード(アウツ)が何枚残っているかを考えることが、勝率やオッズを見積もる基礎となります。","ex":"「デックには52枚しかないから、残りのアウツの枚数から完成確率が計算できる。」"},{"n":293,"ja":"デッドマネー","lv":4,"en":"Dead Money","kana":"デッド・マネー","alias":["死に金","放棄されたチップ"],"desc":"プリフロップでフォールドしたプレイヤーが残したチップや、アンティ、ブラインドなど、現時点で特定のアクティブプレイヤーの所有物ではなく、ポットの中に「溜まっている」だけのチップのことです。一般的には「このポットにはデッドマネーが多いのでスチールが有効だ」といった形で使われます。これらを効率よく回収することは、ハンドの期待値（EV）を底上げし、スタックを維持するための極めて重要な戦略的目標となります。","ex":"「ポットにデッドマネーが溜まっているので、ここでレイズして一気に回収を狙う。」"},{"n":294,"ja":"デノミネーション","lv":2,"en":"Denomination","kana":"デノミネーション","alias":["デノミ","チップの額面","全額ベット"],"desc":"ポーカーチップ1枚あたりに割り当てられた価値、すなわちチップの「額面」のことを指します。「デノミ」と略されることもあります。例えば、白は10点、赤は50点、青は100点というように、色ごとに異なる額面が設定されているのが一般的です。プレイヤーは各チップのデノミネーションを正確に把握しておく必要があり、これを取り違えると、ベット額の認識やポットの計算を誤る原因となります。特に額面の種類が多い大会や、見慣れないチップを使う会場では、ゲーム開始前に各色のデノミネーションを確認しておくことが、ミスを防ぐ基本となります。","ex":"「このチップのデノミネーションを確認してから、ベット額を組み立てよう。」"},{"n":295,"ja":"デュース","lv":1,"en":"Deuce","kana":"デュース","alias":["2","ツー"],"desc":"数字の「2」のカードを指す呼び名です。最も小さい数字のカードで、デュースのペアは最弱のペアとなります。スラング的な表現として使われることが多く、A・2・3・4・5のストレート(ホイール)を構成する一枚としても登場します。","ex":"「ボードにデュースが落ちたが、自分のハンドにはほとんど影響しなかった。」"},{"n":296,"ja":"テル","lv":2,"en":"Tell","kana":"テル","alias":["しぐさ","癖","プレイヤーの情報"],"desc":"プレイヤーが無意識のうちに見せる、手の強弱を推測させる動作や態度のことです。手が震える、視線が泳ぐ、急に静かになるといった身体的なサインや、ベットの仕方の癖などが該当します。相手のテルを読み取り、また自分のテルを隠すことは、特にライブポーカーにおける重要な心理戦の要素です。","ex":"「強いハンドのときほど無口になるのが、彼のわかりやすいテルだった。」"},{"n":297,"ja":"テレグラフ","lv":4,"en":"Telegraph","kana":"テレグラフ","alias":["テル","手の漏洩","動作の癖","明白な予兆","電信"],"desc":"自分のハンドの強さや意図を、無意識の仕草・表情・ベットのテンポなどから相手に悟られてしまうことを指します。「電報で知らせる」ように、隠すべき情報を相手に送ってしまうイメージで、いわゆる「テル（tell）」を相手に与えてしまう状態です。例えば、強い手の時だけ妙に落ち着いていたり、ブラフの時に呼吸が浅くなったりといった癖が、相手に読まれる手掛かりとなります。自分のテレグラフを抑え、どんな手でも一貫した振る舞いを保つこと（情報を漏らさないこと）は、特にライブポーカーにおいて重要なスキルです。同時に、相手のテレグラフを見抜く観察眼も、勝率を高める武器になります。","ex":"「ブラフのとき無意識にチップを強く置く癖が、完全にテレグラフになっていた。」"},{"n":298,"ja":"トゥワイス","lv":3,"en":"Run it Twice","kana":"トゥワイス","alias":["ランイットトゥワイス","2回ラン","リスク分散","オフスーツ","オフ","異なるマーク"],"desc":"「ランイットトゥワイス（Run it Twice）」を略した言い方で、オールインで全員のアクションが終わった後、残りのコミュニティカードを2回に分けて配り、ポットを半分ずつ2回の勝負で分け合う取り決めを指します。例えば残りがターンとリバーなら、1回目のターン・リバーで半分、2回目の別のターン・リバーでもう半分を争います。これにより、一発勝負特有の大きな分散（運の振れ）を抑え、実力に近い結果に収束させやすくする効果があります。両者の合意があって初めて成立するルールで、主にハイステークスのキャッシュゲームで、大きな金額が動く際のリスク軽減策として用いられます。","ex":"「大きなポットでオールインになったので、お互い合意してトゥワイスで決着をつけた。」"},{"n":299,"ja":"トーク","lv":2,"en":"Table Talk","kana":"トーク","alias":["会話","心理的揺さぶり"],"desc":"ゲーム中に対戦相手と交わす会話のことです。「会話の幅を広げるための用語」として触れられています。戦略的には、相手から情報を引き出すための「揺さぶり（トークジャンキー）」や、逆に自分の情報を隠すための「雑談」など、心理戦の一部として活用されます。ただし、アクションの順番を守ることや不当な共謀を避けるなど、ポーカーマナーを遵守した紳士的な振る舞い（エチケット）が前提となります。","ex":"「リバーでの決断中、相手のトークに惑わされないよう冷静に状況を分析した。」"},{"n":300,"ja":"トーナメント","lv":1,"en":"Tournament","kana":"トーナメント","alias":["MTT"],"desc":"参加者が一定額を支払って同量のチップを受け取り、チップを失うと脱落していく勝ち抜き形式の競技です。最後まで生き残ったプレイヤーが優勝し、上位入賞者に賞金が配分されます。多卓で行う大規模なものは「MTT(マルチテーブルトーナメント)」と呼ばれ、少ない参加費で大きな賞金を狙える夢のある形式です。","ex":"「キャッシュゲームと違い、トーナメントは負けたら終わりの一発勝負の緊張感がある。」"},{"n":301,"ja":"トーナメントチップ","lv":1,"en":"Tournament Chips","kana":"トーナメント・チップ","alias":["競技用チップ","参加チップ"],"desc":"トーナメントに参加する際に、バイインと引き換えに受け取る競技専用のチップのことです。キャッシュゲームのチップとは異なり、現金価値を直接持たず、あくまでゲーム内の順位を決めるための「ポイント」として機能します。全員が同じ量を持ってスタートし、これを全て失うと敗退（シートオープン）となります。チップを増やすことは「生存確率」を高めることに直結する、トーナメントにおける唯一の生命線です。","ex":"「スターティングのトーナメントチップを受け取り、優勝を目指す戦いが始まった。」"},{"n":302,"ja":"ドッグ","lv":3,"en":"Underdog","kana":"ドッグ","alias":["アンダードッグ","劣勢"],"desc":"特定のハンド同士の対決において、数学的な勝率（エクイティ）が不利な方のプレイヤー、またはそのハンドの略称です。対義語は有利な「フェイバリット」です。例えば、AAに対してKKを持っているプレイヤーは、プリフロップ時点で約20%の勝率しかないため「ドッグ」となります。ポーカーの醍醐味は、こうした劣勢から低い確率のアウツを引いて逆転する「まくり（サックアウト）」のドラマにあります。","ex":"「現状は圧倒的なドッグ（アンダードッグ）だが、リバーの1枚に奇跡をかける。」"},{"n":303,"ja":"トップ＆ボトム","lv":3,"en":"Top and Bottom","kana":"トップ・アンド・ボトム","alias":["上下のツーペア","最強・最弱ペア","ツーペア"],"desc":"自分の2枚の手札が、ボードの一番高いカードと一番低いカードにそれぞれペアして、ツーペアを作っている状態を指します。「トップアンドボトム」と同じもので、特に4枚の手札を使うオマハなどでこの形を表現する際によく用いられます。ツーペアではあるものの、間のカード（ミドル）を使ったツーペアと比べると、相手が真ん中のカードを絡めたストレートやより強いツーペアを持っている可能性に注意が必要な場合があります。基本的には強い役でバリューを取りに行く場面ですが、ボードがさらに伸びてストレートやフラッシュ、フルハウスの目が出てきた際には、役の相対的な強さを再評価する慎重さも求められます。","ex":"「手札の2枚がボードの上と下にヒットして、トップ＆ボトムのツーペアが完成した。」"},{"n":304,"ja":"トップセット","lv":2,"en":"Top Set","kana":"トップ・セット","alias":["最上位セット","トップのスリーカード","最強のセット"],"desc":"ボードに開かれた中で最も高いカードと同じランクのポケットペアを持っており、それによって完成したセット（スリーカード）を指します。例えばフロップがK・8・3で、自分がポケットキング（KK）を持っていれば「トップセット」です。セットの中でも最強の形で、同じくセット同士がぶつかる「セットオーバーセット」の状況でも、トップセットであれば必ず勝てるという絶対的な安心感があります。隠れた強さ（相手から見えにくい）と圧倒的な勝率を兼ね備えているため、基本的にはスタックをすべて投入してでもバリューを最大化しに行く、最も理想的なハンドの一つです。","ex":"「フロップでトップセットが完成。セットオーバーセットの心配もない、最高の状況だ。」"},{"n":305,"ja":"トップツー","lv":3,"en":"Top Two","kana":"トップ・ツー","alias":["トップツーペア","上2枚のツーペア","最強のツーペア"],"desc":"自分の2枚の手札が、ボードの最も高い2枚のカードとそれぞれペアになり、上位2つのツーペアを作っている状態を指します。例えばフロップがA・K・5で、自分がAKを持っていれば「トップツー」です。ツーペアの中でも最も強い形で、トップペアやオーバーペアに対して優位に立てる、非常に強力な役です。基本的には積極的にバリューを取りに行くべきハンドですが、ボードによっては相手のセットや、伸びていくストレート・フラッシュに警戒が必要な場面もあります。強さに自信を持ちつつ、ボードの変化に応じてポットの大きさをコントロールする視点が、失点を防ぐ鍵となります。","ex":"「AKでトップツーが完成。相手のトップペアからしっかりバリューを取りに行きたい。」"},{"n":306,"ja":"トップヒット","lv":2,"en":"Top Hit","kana":"トップ・ヒット","alias":["トップペア完成"],"desc":"コミュニティカードの中で最もランクの高いカードと同じ数字が自分の手札にあり、トップペアを完成させた状態の別称です。トップヒットと同じ意味です。ワンペアの中では見える情報の中では最強の状態であり、多くの場合でそのハンドの基準点となり、主導権を握る根拠となります。キッカーの強さ次第で勝率が大きく変動するため、キッカーの強弱を見極めることが次のアクションへの鍵となります。","ex":"「フロップでエースがトップヒット。キッカーも強いので自信を持って攻める。」"},{"n":307,"ja":"トップペア","lv":1,"en":"Top Pair","kana":"トップペア","alias":["TP","最上段ペア"],"desc":"ボードに出ているカードのうち、最も高いカードと自分の手札がペアになっている状態を指します。ポストフロップで頻繁に登場する基本的な強さのハンドで、多くの場面でバリューベットの対象となります。ただしキッカー(残りのカード)の強さによって信頼度が変わり、過信は禁物です。","ex":"「フロップでトップペアが当たったので、キッカーの強さも踏まえて強気にベットした。」"},{"n":308,"ja":"トップレンジ","lv":5,"en":"Top Range","kana":"トップ・レンジ","alias":["最強の範囲","プレミアムレンジ"],"desc":"プレイヤーが特定の状況で持ちうる全ハンド（レンジ）の中で、最も強い「上位数％」のハンド群を指します。例えば、プリフロップでアンダーザガンからオープンした際のレンジの「トップ」にはAAやKKなどのプレミアムハンドが含まれます。自分がレンジのトップにいると確信できるボードでは、主導権を握って最大限のプレッシャーをかけることが理論上（GTO的）にも推奨される非常に有利な状態です。","ex":""},{"n":309,"ja":"飛ぶ（とぶ）","lv":1,"en":"Bust / Bust Out","kana":"トブ","alias":["バスト","バストアウト","飛ばす","シートオープン"],"desc":"トーナメントにおいて、持ちチップ（スタック）をすべて失い、その大会から敗退することを指す俗語です。「バスト（Bust）」「バストアウト」と同じ意味で、チップが尽きて卓から弾き飛ばされる様子を表しています。「飛んだ」と言えば自分が敗退したこと、「飛ばす」と言えば相手を敗退に追い込むことを意味します。トーナメントは一度飛べば原則として終わり（リエントリー可の大会を除く）であるため、生き残りをかけたチップの管理が極めて重要です。特に賞金圏内（インマネ）が近づくバブル期には、いかに飛ばずに勝ち上がるかという駆け引きが、大会の大きな見どころとなります。","ex":"「あと一人でインマネだったのに、痛恨のバッドビートで飛んでしまった。」"},{"n":310,"ja":"ドミネイト","lv":1,"en":"Dominate","kana":"ドミネイト","alias":["ドミる","ドミネート","支配される","ドミネートされる","間の1枚待ち","1枚待ち状態","ベリー"],"desc":"片方のハンドがもう片方のハンドに対し、共通のカードを含みつつキッカーで上回っているため、圧倒的に有利な状態を指します。例えばA-KはA-Qに対し、Aを共有しつつKでQを上回るためドミネイトしています。この状態では支配されている側がペアを作っても逆転が難しく、勝率に大きな差が生まれます。","ex":"「自分のAKは相手のAQを完全にドミネイトしていて、勝率は7割を超えていた。」"},{"n":311,"ja":"ドライボード","lv":4,"en":"Dry Board","kana":"ドライボード","alias":["ドライ","乾いた盤面"],"desc":"ドローの可能性が少なく、カード同士のつながりが薄いコミュニティカードの状態を指します。例えばK・7・2のようにスートもバラバラで数字も離れているボードが該当します。ドローが完成しにくいためベットが効きやすく、コンティニュエーションベットによるブラフが成功しやすい盤面とされます。","ex":"「K・7・2のドライボードだったので、ブラフのCベットが通りやすいと判断した。」"},{"n":312,"ja":"トラッシュハンド","lv":3,"en":"Trash Hand","kana":"トラッシュハンド","alias":["ゴミハンド"],"desc":"勝つ見込みが極めて低い、価値のない弱い手札を指します。7-2オフスートが代表例で、ほとんどの状況では参加せずに降りる(フォールド)べきハンドです。ただし、相手に弱さを悟られない強いブラフが決まれば、あえてトラッシュハンドで勝負を仕掛ける上級者もいます。","ex":"「7-2オフのトラッシュハンドが来たので、迷わずフォールドした。」"},{"n":313,"ja":"トラップ","lv":3,"en":"Trap","kana":"トラップ","alias":["罠"],"desc":"強いハンドを持っているのにあえて弱く見せかけ、相手を誘い込んで大きなポットを奪う罠のことです。チェックやスムースコールで油断させ、相手が自らベットやレイズを仕掛けてきたところを刈り取ります。スロープレイやチェックレイズはこのトラップを仕掛ける代表的な手段です。","ex":"「ナッツを引いたので、あえて弱く振る舞ってトラップを仕掛けた。」"},{"n":314,"ja":"トリップス","lv":1,"en":"Trips","kana":"トリップス","alias":["スリー・オブ・ア・カインド"],"desc":"自分の手札1枚と、ボード上のペアを組み合わせて完成するスリー・オブ・ア・カインドを指します。同じ3枚でも、手札のポケットペアとボードの1枚で作る「セット」とは区別されます。トリップスはボードにペアが見えているぶん相手にも警戒されやすく、セットほど隠匿性が高くありません。","ex":"「ボードのペアと手札の1枚でトリップスが完成したが、相手にも役が読まれやすかった。」"},{"n":315,"ja":"トリプルバレル","lv":5,"en":"Triple Barrel","kana":"トリプルバレル","alias":["3連ベット"],"desc":"フロップ・ターン・リバーの3つのストリートすべてで連続してベットし、最後まで圧力をかけ続けるプレイです。3発の銃弾を撃ち込むイメージで、相手の心を折って降ろすブラフとして大きな効果を持ちます。一方でリバーまでブラフを通すには相応のリスクと度胸が必要で、失敗すれば大きな損失となります。","ex":"「最後まで強気を貫くトリプルバレルで、ついに相手をフォールドに追い込んだ。」"},{"n":316,"ja":"トリプルバレルブラフ","lv":6,"en":"Triple Barrel Bluff","kana":"トリプル・バレル・ブラフ","alias":["トリプルバレル","3連発ブラフ"],"desc":"フロップ・ターン・リバーの3つのストリートすべてで連続してベット（バレル）を打ち続け、強い手を一貫して表現しながら相手を降ろしにいくブラフを指します。1発ずつのベットを「バレル（銃身）」になぞらえ、3連射することからこう呼ばれます。3ストリートにわたって攻め続けるには、各カードで自分のレンジに強い手が存在すると信じさせる「筋の通ったストーリー」が不可欠で、無理に打ち切ると大きな損失につながります。フラッシュやストレートのドローが外れたハンド（ブロッカーを持つ手）など、降ろせなくても見せ場のある手が選ばれやすく、相手のレンジとボードの変化を読み切る力が問われる、上級者の攻めの代表的なラインです。","ex":"「ドローが外れたが、筋は通っていたのでトリプルバレルブラフで押し切った。」"},{"n":317,"ja":"ドロー","lv":2,"en":"Draw","kana":"ドロー","alias":["引き","完成待ち"],"desc":"あと必要なカードが揃えば強い役が完成する、未完成だが伸びしろのある手の状態を指します。フラッシュ完成を待つ「フラッシュドロー」やストレートを待つ「ストレートドロー」が代表例です。完成に必要なカード(アウツ)の枚数から確率を計算し、コールに見合うかを判断することがドローを扱う鍵となります。","ex":"「フロップでフラッシュドローが付いたので、アウツを数えてコールの是非を判断した。」"},{"n":318,"ja":"ドローイングデッド","lv":3,"en":"Drawing Dead","kana":"ドローイング・デッド","alias":["通称：DD","絶望"],"desc":"コミュニティカードが全て開かれていないにもかかわらず、既に逆転の目（アウツ）が一切ない絶望的な状況を指します。例えば、自分がフラッシュを狙っていても、相手が既にフォーカードやフルハウスを完成させている場合などがこれに当たります。本人は「引けば勝てる」と信じてチップを投じていることが多いため、ポーカーにおいて最も残酷で損失の大きいシチュエーションの一つとされます。","ex":"「リバーで念願のフラッシュを引いたが、実はフロップの時点でドローイングデッドだった。」"},{"n":319,"ja":"ドローゲーム","lv":2,"en":"Draw Game","kana":"ドロー・ゲーム","alias":["ドローポーカー","引きゲーム","ギャップ理論"],"desc":"配られた手札の一部を捨てて新しいカードを引き（ドローし）、手役を作っていくタイプのポーカーの総称です。5枚ドローポーカーや、2-7トリプルドロー、バドゥーギなどがこれに該当します。コミュニティカードを共有するホールデム系と異なり、各プレイヤーの手札は伏せられたまま進行するため、相手が「何枚引いたか」「引かずにそのまま勝負したか（スタンドパット）」といった情報が、手を読む上での重要な手掛かりとなります。共有情報が少ない分、ベットパターンや引き枚数から相手の意図を推測する、独特の読み合いと心理戦が魅力のゲーム群です。","ex":"「ドローゲームでは、相手の引き枚数からハンドを推測する力が問われる。」"},{"n":320,"ja":"ドローデッド","lv":3,"en":"Drawing Dead","kana":"ドロー・デッド","alias":["ドローイングデッド"],"desc":"「ドローイングデッド」の略称、あるいはほぼ同義語として使われます。勝負の結末が既に数学的に決まっており、これからどんな素晴らしいカードを引いたとしても敗北が確定している状態を指します。相手の手が強すぎて、自分のドローが完成してもなお負けているという、ポーカーにおける究極の「詰み」の状態を口語的に表現する際に使われることが多い用語です。","ex":"「相手がクワッズを持っていたので、私のストレートドローはドローデッドだった。」"},{"n":321,"ja":"ドローハンド","lv":2,"en":"Drawing Hand","kana":"ドローハンド","alias":["ドロー","未完成手"],"desc":"現時点では完成していないものの、あと1枚有効なカードが加われば強い役になる手のことです。フラッシュドローやストレートドローを持った状態が代表例で、それ自体では勝てなくても完成すれば一転して強力なハンドになります。完成の確率(アウツ)と賭ける額が見合うかを計算し、攻めるか降りるかを判断します。","ex":"「リバーで化ける可能性のあるドローハンドだったので、オッズを計算しながら粘った。」"},{"n":322,"ja":"ドローヘビー","lv":4,"en":"Draw Heavy","kana":"ドロー・ヘビー","alias":["ドローヘビーボード","ウェットボード"],"desc":"ボード（コミュニティカード）にストレートやフラッシュなどのドローが多数存在し、後のカード次第で役が大きく動きやすい盤面の状態を指します。「ウェット（湿った）ボード」とほぼ同義で使われます。例えば「9♥8♥7♣」のように、スートが揃いつつ数字も連続したフロップは、フラッシュドローやストレートドローが豊富でドローヘビーです。こうした盤面では相手がドローを持っている可能性が高いため、強い完成ハンド（メイドハンド）でドローを潰すには、相手にタダでカードを見せない大きめのプロテクトベットが有効になります。逆にドローしか持たない側にとっては、ヒットの期待値が高い攻めやすい盤面でもあります。","ex":"「ドローヘビーなボードだから、セットでも大きく打ってドローを潰しにいく。」"},{"n":323,"ja":"ドロップ","lv":3,"en":"Drop","kana":"ドロップ","alias":["フォールド","棄権"],"desc":"日本語で「降りる」を意味し、自分のハンドを捨てて勝負を棄権するアクションのことです。それまでにベットしたチップを獲得する権利を放棄し、その代わりに追加のチップを支払う必要もなくなります。テキサスホールデムでは「フォールド」と呼ぶのが一般的ですが、古いルールやドローポーカー、あるいは初心者の間では「ドロップ」という言葉も依然として使われています。","ex":"「相手の大きなレイズには勝てないと判断し、潔くドロップ（フォールド）した。」"},{"n":324,"ja":"ドンクベット","lv":2,"en":"Donk Bet","kana":"ドンクベット","alias":["ドンク","ドンクリード","先打ち"],"desc":"前のストリートでアグレッサー(主導権を握った側)ではないプレイヤーが、相手の継続ベットを待たずに先制してベットすることを指します。ポジション不利な側が定石に反して打つことから、もとは「下手なプレイ(donkey)」を語源とする蔑称でした。しかし近年は意図的な戦術として有効活用される場面も増えています。","ex":"「相手のCベットを待たず、フロップで先にドンクベットを打って主導権を奪いにいった。」"},{"n":325,"ja":"ナッシュ均衡","lv":8,"en":"Nash Equilibrium","kana":"ナッシュ・キンコウ","alias":["GTO","最適戦略"],"desc":"全てのプレイヤーが互いに「相手の戦略に対して、自分の期待値を最大化する戦略」をとっている、均衡状態を指します。ポーカーにおける「GTO（ゲーム理論最適化）」の根幹をなす数学的概念です。一人のプレイヤーがこの均衡戦略（GTO）から外れない限り、他のプレイヤーはどのような戦略をとっても彼から利益を奪うことはできません。現代ポーカーの理論研究における到達点として非常に重要視されています。","ex":"「プッシュ・オア・フォールドの局面で、ナッシュ均衡に基づいたレンジ表を参照する。」"},{"n":326,"ja":"ナッツ","lv":1,"en":"Nuts","kana":"ナッツ","alias":["最強手"],"desc":"その盤面で考えうる、絶対に負けることのない最強の役を指します。誰もこれを上回る手を作れないため、安心して最大限のバリューを狙える理想的な状況です。ただしターンやリバーでボードが変化すると、それまでナッツだった手が「ナッツでなくなる」こともあるため、盤面の変化には常に注意が必要です。","ex":"「リバーで完成したのは負けようのないナッツだったので、迷わずオールインした。」"},{"n":327,"ja":"ナッツアドバンテージ","lv":6,"en":"Nuts Advantage","kana":"ナッツアドバンテージ","alias":["ナッツ優位"],"desc":"特定の盤面において、自分のレンジの方が相手より最強手(ナッツ)を持っている可能性が高い状態を指します。この優位を持つ側は、大きなベットやオーバーベットで相手に強い圧力をかけやすくなります。レンジ全体の優位「レンジアドバンテージ」と並び、GTOに基づくベット戦略を組み立てるうえで重要な概念です。","ex":"「このボードは自分のレンジにナッツが多く含まれるナッツアドバンテージがあるので、大きく打てる。」"},{"n":328,"ja":"ナッツストレート","lv":2,"en":"Nut Straight","kana":"ナッツストレート","alias":["最強ストレート"],"desc":"その盤面で作りうる中で最も強い、最高位のストレートを指します。同じストレートでも一番上の数字で構成されたものを指し、他のプレイヤーが作るどのストレートにも負けません。ただしフラッシュやフルハウスといった上位役には敗れるため、ボードにそれらの可能性があるかは別途警戒が必要です。","ex":"「ナッツストレートは完成したが、ボードが2スートだったのでフラッシュだけは警戒した。」"},{"n":329,"ja":"ナッツフラッシュ","lv":2,"en":"Nut Flush","kana":"ナッツフラッシュ","alias":["最強フラッシュ"],"desc":"そのスートで最も高いカード、通常はAを含む最強のフラッシュを指します。他のどのフラッシュにも負けないため、フラッシュ同士の勝負になっても安心して攻められる強力なハンドです。Aを持つことで相手の作りうるフラッシュをすべて上回れるため、ナッツフラッシュドローは特に価値の高いドローとされます。","ex":"「Aハイのナッツフラッシュだったので、相手もフラッシュなら確実に勝てると確信した。」"},{"n":330,"ja":"舐めプ（なめぷ）","lv":2,"en":"Disrespect Play","kana":"ナメプ","alias":["舐めプレイ","舐めたプレイ"],"desc":"「舐めたプレイ」の略で、相手を格下とみくびり、本来の最善手ではない雑なプレイや、わざと挑発的・遊び半分のプレイをすることを指す俗語です。例えば、明らかに降りるべき場面で相手を見下して安易にコールしたり、強いハンドをあえて弱く見せて弄ぶような行為が該当します。元はゲーム全般のスラングですが、ポーカーでも使われます。相手を侮ったプレイは時に手痛いしっぺ返しを食らうため、戒めの意味で使われることも多く、どんな相手であっても確率と状況に基づいて最善を尽くす姿勢こそが、長期的な勝者の条件だという教訓を含んだ言葉です。","ex":"「格下だと思って舐めプしたら、まさかのナッツを持たれて大火傷した。」"},{"n":331,"ja":"ニット","lv":3,"en":"Nit","kana":"ニット","alias":["岩","ロック"],"desc":"極端にタイトで、本当に強いプレミアムハンドでしか勝負しない、非常に保守的なプレイヤーを指す俗称です。リスクを徹底的に避けるため大きく負けにくい一方、勝負を仕掛けてくる時はほぼ最強級の手を持っているため、対戦相手から簡単に読まれてしまう弱点があります。ブラフを仕掛けやすい相手でもあります。","ex":"「あのニットがレイズしてきたなら、よほど強い手に違いないから降りておこう。」"},{"n":332,"ja":"ニューヨークバックレイズ","lv":7,"en":"New York Back Raise","kana":"ニューヨークバックレイズ","alias":["バックレイズ"],"desc":"自分が一度コールした後、後ろのプレイヤーがレイズし、再び自分の番が回ってきた時に改めてレイズし返すプレイを指します。最初に弱さを装ってコールしておくことで相手を誘い込み、油断させてから強烈な反撃を仕掛ける狙いがあります。相手の意表を突く、トリッキーで上級者向けの戦術です。","ex":"「一度コールして油断させた後、ニューヨークバックレイズで一気にレイズし返して驚かせた。」"},{"n":333,"ja":"ノードロック","lv":9,"en":"Nodelock","kana":"ノード・ロック","alias":["戦略固定"],"desc":"GTOソルバーの機能の一つで、ゲームツリー上の特定の地点（ノード）における一方のプレイヤーの戦略を、任意の値に「固定（ロック）」する操作を指します。例えば「相手はこのボードで本来より高い頻度でブラフする」「ナッツでも降りてしまう」といった、現実のプレイヤーが持つ偏った傾向をソルバーに入力し、その偏りに対する最適な搾取（エクスプロイト）戦略を計算させるために用います。GTOの均衡解そのものではなく、「理論的に正しくない相手をどう罰するか」を研究するための強力な手法であり、ソルバー学習を机上の理論から実戦的なエクスプロイトへと一歩進める鍵となります。","ex":"「相手がブラフ過多と読んで、ノードロックでその傾向への最適な対応を調べた。」"},{"n":334,"ja":"ノーリミット","lv":2,"en":"No Limit","kana":"ノーリミット","alias":["NL"],"desc":"1回のベットやレイズの上限額が定められておらず、いつでも手持ちのチップ全額(オールイン)まで賭けられるルール形式です。賭け額に制限がないぶん駆け引きやブラフの自由度が極めて高く、一瞬で大金が動くスリリングな展開を生みます。WSOPメインイベントを含め、現在最も主流の競技形式です。","ex":"「ノーリミットホールデムは、いつでもオールインを仕掛けられる緊張感が魅力だ。」"},{"n":335,"ja":"ノーリミットホールデム（NLHE）","lv":2,"en":"No-Limit Hold'em","kana":"ノー・リミット・ホールデム","alias":["NLH","NLHE","ノーリミットホールデム"],"desc":"テキサスホールデムの最も一般的なベッティング形式で、いつでも手持ちの全チップ（オールイン）を賭けることができるルールです。ベット額に上限がないため、知力、心理戦、スタック管理のすべてが極限まで試される「マインドスポーツ」として世界中で親しまれています。現在、ポーカーと言えばこの「ノーリミットホールデム」を指すほど標準的な種目となっています。","ex":"「カジノのメインフロアでは、常に多くのノーリミットホールデムの卓が立っている。」"},{"n":336,"ja":"ノックアウト","lv":2,"en":"Knockout","kana":"ノックアウト","alias":["バウンティ","KO"],"desc":"相手プレイヤーを脱落(バストアウト)させた際に、その場で賞金がもらえる特別な賞金体系のトーナメント形式です。「バウンティトーナメント」とも呼ばれ、各プレイヤーの頭に懸賞金が懸けられています。通常の最終順位による賞金とは別に、相手を倒すこと自体が収入になるため、より積極的なプレイが促されます。","ex":"「ノックアウト形式なので、相手を一人倒すごとに賞金が手に入るのが面白い。」"},{"n":337,"ja":"ノットインポジション","lv":3,"en":"Out of Position","kana":"ノット・イン・ポジション","alias":["アウトオブポジション","OOP"],"desc":"特定のプレイヤーに対し、先にアクションをしなければならない不利な位置関係にあることです。「アウトオブポジション（OOP）」と同じ意味になります。相手の行動を見てから判断できるインポジション（IP）とは対照的に、情報不足のまま決断を迫られるため、戦略構築が難しく、より強いハンドレンジでのプレイが求められる厳しい立場です。","ex":"「ノットインポジション（OOP）なので、相手の出方を伺うためにまずはチェックした。」"},{"n":338,"ja":"ハーフポット","lv":2,"en":"Half Pot","kana":"ハーフポット","alias":["1","2ポット"],"desc":"現在のポットの約半分の額を賭けるベットサイズを指します。相手にプレッシャーをかけつつ、自分のリスクは抑えられるバランスの取れた標準的なベット額として広く用いられます。相手のドローに対して割の合わないオッズを提示しつつ、バリューも取りやすいため、多くの場面で基準となるサイズです。","ex":"「相手のドローを潰しつつバリューも取りたいので、無難にハーフポットでベットした。」"},{"n":339,"ja":"バーンカード","lv":1,"en":"Burn Card","kana":"バーン・カード","alias":["バーン","焼き札","ボード"],"desc":"ディーラーがフロップ・ターン・リバーのコミュニティカードを場に開く直前に、デッキの一番上の1枚を伏せたまま捨てるカードのことです。「焼く（バーン）」と表現されます。これは、カードの裏にできた傷や汚れ、あるいはイカサマによって次に出るカードが事前に読まれてしまうことを防ぐための、不正防止の措置です。バーンカードはゲームには一切使われず、プレイヤーが見ることもできません。一見地味な手続きですが、ライブポーカーの公正さを支える重要なディーリング作法であり、きちんとバーンを行うことが正式なゲーム進行の基本とされています。","ex":"「ディーラーがバーンカードを1枚捨ててから、ターンを開いた。」"},{"n":340,"ja":"ハイ・ロー","lv":3,"en":"Hi-Lo","kana":"ハイ・ロー","alias":["ハイロースプリット"],"desc":"最も強い役(ハイ)と最も弱い役(ロー)を作ったプレイヤーがポットを分け合う、特殊なポーカー形式です。オマハハイローやスタッドハイローが代表的で、ローには通常「8以下の数字5枚」などの成立条件があります。ハイとローの両方を同一人物が獲得して総取りすることを「スクープ」と呼びます。","ex":"「ハイ・ローではハイとローの両取り、スクープを狙えるハンド選びが重要になる。」"},{"n":341,"ja":"バイイン","lv":1,"en":"Buy-in","kana":"バイイン","alias":["参加費"],"desc":"ゲームに参加するために最初に支払う金額を指します。トーナメントでは参加費そのものを意味し、これを支払って同量のスタートチップを受け取ります。キャッシュゲームでは、テーブルに着く際にチップへ換える持ち込み金額を指します。自分の資金(バンクロール)に見合ったバイインを選ぶことが、堅実なプレイの基本です。","ex":"「このトーナメントはバイイン1万円で、優勝賞金は数十万円にもなる。」"},{"n":342,"ja":"バイインゲーム","lv":1,"en":"Buy-in Game","kana":"バイ・イン・ゲーム","alias":["キャッシュゲーム","リングゲーム","リバイ"],"desc":"一定のレート（ステークス）で進行し、いつでも好きな時にチップを購入（バイイン）して参加・退席ができるゲーム形式です。特に「キャッシュゲーム」や「リングゲーム」時に使用します。バイイン額には通常、テーブルごとに最低額と最高額の制限（キャップ）が設けられており、プレイヤーは自分の資金管理（バンクロール）に合わせて適切なゲームを選択します。","ex":"「週末は仕事帰りにバイインゲーム（キャッシュゲーム）に寄って、数時間だけプレイする。」"},{"n":343,"ja":"ハイカード","lv":1,"en":"High Card","kana":"ハイカード","alias":["ノーペア","ブタ"],"desc":"何の役も完成しなかった場合の、最も弱い手の評価を指します。ペアすらない状態で、手札の中で最も高いカードの強さで勝敗を比較します。「ブタ」とも呼ばれ、ショーダウンまで残ってしまうとほとんど勝ち目はありませんが、A・Kなど高いカードを持っていれば、わずかに勝てる可能性が残ります。","ex":"「結局ペアすら作れず、Aハイのハイカードでショーダウンを迎えてしまった。」"},{"n":344,"ja":"ハイジャック","lv":1,"en":"Hijack","kana":"ハイジャック","alias":["HJ"],"desc":"カットオフの右隣、すなわちボタンから数えて3つ前のポジションを指します。比較的後方の有利なポジションに含まれ、ここから仕掛けるブラインドスチールなどのレイズも一定の効果を持ちます。ボタンやカットオフほどではないものの、ある程度ハンドの範囲を広げて積極的に攻められる位置です。","ex":"「ハイジャックは後方ポジションなので、少し広めのレンジでオープンレイズした。」"},{"n":345,"ja":"ハイポケット","lv":2,"en":"High Pocket Pair","kana":"ハイ・ポケット","alias":["ハイポケットペア","高ポケット","モンスタードロー"],"desc":"比較的高いランクのポケットペア、一般的にはエース・キング・クイーン・ジャック（AA・KK・QQ・JJ）あたりの強いポケットペアの総称です。フロップにオーバーカードが落ちる確率が低く、多くの場面でオーバーペア（ボードのどのカードよりも高いペア）として強く戦えるため、プリフロップから積極的にバリューを取りに行ける収益性の高いレンジです。ただし、ハイポケットといえども絶対ではなく、相手のセットやツーペア、ストレート・フラッシュの可能性を踏まえ、ボードの危険度に応じてベットサイズやポットの大きさをコントロールする視点が求められます。","ex":"「ハイポケットが入ったら、基本はアグレッシブにバリューを狙っていきたい。」"},{"n":346,"ja":"ハイローラー","lv":3,"en":"High Roller","kana":"ハイ・ローラー","alias":["ハイローラートーナメント","高額賭け","ハイステークス","高額所得プレイヤー"],"desc":"非常に高額な賭けを行うプレイヤー、あるいは高額な参加費（バイイン）が設定されたトーナメントの種別を指します。プレイヤーを指す場合は、大金を動かすことをいとわない富裕層や、ハイステークスのキャッシュゲームに参加する実力者を意味します。トーナメントを指す場合は、参加費が数十万円〜数百万円規模に設定され、少数精鋭の実力者やセレブが集う花形イベントを指し、さらに高額なものは「スーパーハイローラー」とも呼ばれます。賞金額も巨大で、世界トップクラスのプレイヤーたちが鎬を削る舞台として、ポーカーシーンの最高峰に位置づけられます。","ex":"「あの選手は今、世界中のハイローラートーナメントを転戦している。」"},{"n":347,"ja":"ハウス","lv":1,"en":"House","kana":"ハウス","alias":["カジノ","主催者"],"desc":"ポーカーゲームを運営し、場所やディーラー、トランプ等を提供しているカジノや施設そのものを指します。ハウスはポットから「レーキ（手数料）」を徴収することで運営を維持しています。また、公式ルールとは別にその施設特有の「ハウスルール」が定められている場合、裁定においてはハウスルールが最優先されるという厳格な慣習があります。","ex":"「トラブルの裁定については、ハウスの決定に従うのがポーカー界の鉄則だ。」"},{"n":348,"ja":"ハウスルール","lv":1,"en":"House Rule","kana":"ハウス・ルール","alias":["店舗ルール","ローカルルール"],"desc":"その店舗や大会（ハウス）が独自に定めている、標準的なルールとは異なる独自規定のことを指します。「ローカルルール」とも呼ばれます。例えば、ミスディールの扱い、口頭宣言の優先順位、ストリングベットの判定、リバイやアドオンの条件など、細かな運用は会場によって差があります。世界的にはTDA（トーナメントディレクターズ協会）による統一ルールが基準とされますが、各施設のハウスルールがそれに優先する場面もあるため、初めて訪れる会場では事前にハウスルールを確認しておくことがトラブル防止につながります。郷に入っては郷に従う姿勢が、円滑なプレイの基本です。","ex":"「初めての店だから、まずはミスディールの扱いなどハウスルールを確認しておこう。」"},{"n":349,"ja":"バウンティ","lv":3,"en":"Bounty","kana":"バウンティ","alias":["賞金首"],"desc":"トーナメントにおいて、特定のプレイヤーを敗退（ノックアウト）させた際に、そのプレイヤーを飛ばした側のプレイヤーが獲得できる特別なプライズ（懸賞金や賞品）のことです。これを採用したルールの大会は「バウンティ・トーナメント」と呼ばれます。通常の賞金プールとは別に設定されるため、相手を飛ばすこと自体に直接的な利益が発生し、通常よりもアグレッシブなプレイが促されます。特に「賞金首」となったプレイヤーのスタックが少ない場合には、本来なら降りるべき手でもバウンティ目当てにコールするプレイヤーが増えるなど、独特の戦略的ダイナミクスが生まれます。","ex":"チップリーダーを飛ばして高額なバウンティを獲得し、参加費の元を取った。"},{"n":350,"ja":"バウンティートーナメント","lv":3,"en":"Bounty Tournament","kana":"バウンティー・トーナメント","alias":["K.O.トーナメント"],"desc":"参加者一人ひとりの首に「賞金（バウンティ）」が懸けられており、相手を敗退（ノックアウト）させるたびに、そのプレイヤーが設定された賞金を即座に獲得できる形式のトーナメントです。通常の入賞賞金とは別にボーナスが得られるため、相手を飛ばすこと自体の価値が高まり、非常にアグレッシブで攻撃的なプレイが展開されます。チップ量が少ないプレイヤーは他の全員からターゲットにされるため、生き残ることが通常よりも難しくなりますが、その分スリリングでエキサイティングな展開が楽しめる人気の高いレギュレーションです。","ex":"「バウンティートーナメントでは、飛ばした人数分だけ賞金が積み重なっていく。」"},{"n":351,"ja":"バケーション","lv":3,"en":"Vacation","kana":"バケーション","alias":["離席中"],"desc":"トーナメント中に、食事や休憩、あるいはトイレなどの理由で一時的に座席を離れ、ブラインドやアンティだけを自動的に支払っている状態を指すユーモラスな表現です。席を外している間も自分の順番が来れば自動的にフォールド（棄権）されるため、チップが少しずつ削られていきます。オンラインポーカーでは「シットアウト」機能として備わっています。トーナメントの中盤以降はブラインド額が大きくなるため、長すぎる「バケーション」はスタックの壊滅を招くリスクがあり、プレイヤーの集中力が切れたサインと見なされることもあります。","ex":"「スタックに余裕があるので、少しだけバケーション（離席）して頭を冷やしてきた。」"},{"n":352,"ja":"バストアウト","lv":2,"en":"Bust Out","kana":"バスト・アウト","alias":["バスト","敗退","飛ぶ"],"desc":"プレイヤーが手持ちの全チップ（スタック）を失い、完全にゲームから敗退することを指します。トーナメントではこれをもって脱落（リエントリー不可の場合）となり、キャッシュゲームでは席を立たなければなりません。また、自分が他のプレイヤーを敗退させることを「誰々をバストさせる」と表現します。バストアウトはポーカーにおける一つの死を意味しますが、同時に次の挑戦への準備段階でもあります。敗因を冷静に分析し、ティルトにならずに次のゲームへ臨む姿勢が重要です。","ex":"「オールイン勝負で敗れ、無念のバストアウト。今回の遠征はここで終了だ。」"},{"n":353,"ja":"バックドア","lv":4,"en":"Backdoor","kana":"バックドア","alias":["ランナーランナー"],"desc":"ターンとリバーの両方で特定のカードを続けて引くことで、初めて役が完成する状態のことです。別名「ランナーランナー」とも呼ばれます。フロップ時点ではただのハイカードや弱いペアでも、連続して必要なカードが落ちることでフラッシュやストレートに大逆転する可能性を秘めています。例えばスペードが手札とボードに合計3枚ある場合、ターンとリバー共にスペードが出れば完成します。相手に警戒されにくいため、完成時には非常に大きなバリューを引き出せます。","ex":"フロップではただのハイカードだったが、バックドアでフラッシュが完成した。"},{"n":354,"ja":"バックドアストレートドロー","lv":4,"en":"Backdoor Straight Draw","kana":"バックドア・ストレート・ドロー","alias":["ランナーランナー・ストレート"],"desc":"ターンとリバーの2枚のカードを連続して適切に引くことで、初めてストレートが完成する状態のドローです。例えば、手元に「J・10」、ボードに「2・5・A」がある場合、ターンに「K」、リバーに「Q」が出ることでブロードウェイストレートが完成します。フラッシュ同様、相手からは役の完成がほぼ見えないため、ショーダウンで相手の強いメイドハンドを葬り去る強力な一撃となります。フロップ時点での勝率は微々たるものですが、ブラフの継続を正当化するバックアップ要因として機能します。","ex":"「ターンで数字が重なり、バックドアストレートドローが現実味を帯びてきた。」"},{"n":355,"ja":"バックドアフラッシュドロー","lv":4,"en":"Backdoor Flush Draw","kana":"バックドア・フラッシュ・ドロー","alias":["ランナーランナー・フラッシュ"],"desc":"フロップの時点で同じスートが3枚（手札2枚＋ボード1枚、またはその逆）あり、ターンとリバーの両方で同じスートを連続して引くことでフラッシュが完成する可能性がある状態です。完成確率は低いですが、1枚で完成するドローに比べて相手から非常に察知されにくく、予期せぬ大逆転を生むことがあります。これを考慮したセミブラフを打つことで、もしコールされてもリバーでナッツ級のフラッシュを完成させて大きなバリューを奪うチャンスが残るため、戦略的に価値のある隠れた「まくり目」となります。","ex":"「バックドアフラッシュドローがあったので、フロップでのベットにコールした。」"},{"n":356,"ja":"バックレイズ","lv":6,"en":"Back-Raise","kana":"バック・レイズ","alias":["ニューヨークバックレイズ"],"desc":"プリフロップで一度コール（リンプ）で入った後、誰かのレイズに対してさらにリレイズ（3ベット）を仕返すトリッキーなアクションです。「ニューヨークバックレイズ」というスラング（造語）で使用されます。非常に強いハンドを隠して相手のレイズを誘う「罠」として使われることが多く、これを受けた相手は「ナッツ級の手が潜んでいた」と判断し、非常に警戒を強めることになります。","ex":"「リンプから誰かのレイズを待ち、強力なバックレイズでポットを一気に膨らませた。」"},{"n":357,"ja":"パッシブ","lv":2,"en":"Passive","kana":"パッシブ","alias":["消極的"],"desc":"自らベットやレイズを仕掛けることを避け、主にチェックやコールを多用する消極的・受け身なプレイスタイルのことです。自分からポットを大きくすることを嫌い、相手のアクションに対してリアクションする傾向があります。ハンドレンジを絞ってコールを繰り返すプレイヤーは「タイトパッシブ」、多くのハンドでコールし続けるプレイヤーは「ルースパッシブ」と呼ばれます。このスタイルは大きな負けを避けやすい反面、ブラフでポットを奪う機会や、強いハンドで最大限の利益を得る機会を逃しやすいという弱点があります。","ex":"彼は非常にパッシブなので、ブラフを仕掛けやすい相手だ。"},{"n":358,"ja":"パッツモ","lv":2,"en":"Pattsumo","kana":"パッツモ","alias":["ぱっつも","ぱつづも","一発ツモ"],"desc":"フロップの3枚が開いたと同時に役が完成すること。特にストレートやフラッシュやフルハウスなどの5枚役ができた時に使用されることが多いです。語源は麻雀の一発ツモから来ており、日本のみで使用されます。","ex":"オープンレイザーの彼は、フロップが開くとポットの20%程度のbetをしてきた。おそらくパッツモだろう。"},{"n":359,"ja":"バッドビート","lv":2,"en":"Bad Beat","kana":"バッド・ビート","alias":["逆転負け","事故","不運な負け"],"desc":"勝率で大きく上回っていた強いハンドが、確率的に不利だったはずの相手に、最後のカードなどで運悪く逆転されて敗北することを指します。例えばオールインした時点で9割勝っていたハンドが、リバーで相手の数少ないアウツを引かれて負けてしまうような状況です。ポーカーが短期的には運の要素を強く含むゲームであることを象徴する出来事であり、技術的に正しいプレイを続けていても避けられない宿命のようなものです。重要なのは、バッドビートを受けた際に冷静さを失い、その後のプレイが乱れること（ティルト）こそが本当の損失だという点で、結果ではなく判断の正しさに目を向ける姿勢が長期的な勝者には不可欠です。","ex":"「9割勝っていたのにリバーで捲られた。とんでもないバッドビートだ。」"},{"n":360,"ja":"バッドビートジャックポット","lv":3,"en":"Bad Beat Jackpot","kana":"バッド・ビート・ジャックポット","alias":["BBJP","バッドビート特賞"],"desc":"非常に強い役を持っていたプレイヤーが、それを上回る役に逆転負け（バッドビート）した際に支払われる、特別な大型ジャックポットのことです。発生条件はルームによって異なりますが、例えば「Aのフルハウス以上が負けた場合」「クワッズがより上のクワッズに負けた場合」「ロイヤルフラッシュが絡んだ場合」など、めったに起こらない劇的な敗北が対象となります。配当は、負けた本人に最も多く、勝った相手やテーブルの同席者にも分配されるのが一般的です。レーキの一部を積み立てて原資とするため、長く当たりが出ないと金額が膨れ上がり、大きな話題を呼びます。","ex":"「クワッズがクワッズに負けてバッドビートジャックポットが発動し、卓中が沸いた。」"},{"n":361,"ja":"バブル","lv":3,"en":"Bubble","kana":"バブル","alias":["入賞直前"],"desc":"トーナメントにおいて、賞金がもらえる順位（ITM）まであと一人が敗退すれば確定するという極限状態の局面です。ここで敗退することを「バブルで飛ぶ」と言い、最も悔しい瞬間の一つとされます。この時間帯は「バブルライン」と呼ばれ、チップが少ないプレイヤーは生き残りをかけて極端に慎重になり、逆にチップリーダーは脱落の恐怖を背景に激しくプレッシャーをかけるなど、独特の心理戦と高い緊張感が漂う重要な局面です。","ex":"バブルの緊張感に負け、ショートスタックで無理な勝負をしてしまった。"},{"n":362,"ja":"バブルファクター","lv":7,"en":"Bubble Factor","kana":"バブル・ファクター","alias":["プレッシャー指数"],"desc":"バ
