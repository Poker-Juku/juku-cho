  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&state.openIdx<state.filtered.length-1)openSheet(state.openIdx+1);else if(dx>0&&state.openIdx>0)openSheet(state.openIdx-1)}
  else if(dy>90&&$("sheetBody").scrollTop<=0)closeSheet();
},{passive:true});
const input=$("searchInput");
input.addEventListener("input",()=>{state.q=input.value.trim();$("searchBox").classList.toggle("has-text",!!state.q);if(state.view==="today"&&state.q)setView("dict");else renderList()});
$("clearBtn").addEventListener("click",()=>{input.value="";state.q="";$("searchBox").classList.remove("has-text");renderList();input.focus()});
$("chips").querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
  $("chips").querySelector(".active").classList.remove("active");c.classList.add("active");state.band=c.dataset.band;
  if(state.view==="today")setView("dict");else renderList();
}));

/* ===== Scroll-to-top button (list/bookmark views) ===== */
const listAreaEl=$("listArea"),toTopBtn=$("toTopBtn");
listAreaEl.addEventListener("scroll",()=>{
  const show=(state.view==="dict"||state.view==="bookmark")&&listAreaEl.scrollTop>400;
  toTopBtn.classList.toggle("visible",show);
},{passive:true});
toTopBtn.addEventListener("click",()=>{
  listAreaEl.scrollTo({top:0,behavior:"smooth"});
});

/* ===== Quiz Engine ===== */
const MODE_LABELS={desc2term:"解説 → 用語",term2desc:"用語 → 解説",en2ja:"英語 → 日本語"};
const MODE_META={
  desc2term:{icon:"解→語",title:"解説から用語を当てる",desc:"解説文を読んで、正しい用語を4択から選びましょう。知識の定着に最適です。"},
  term2desc:{icon:"語→解",title:"用語から解説を当てる",desc:"用語名を見て、正しい解説文を4択から選びましょう。深い理解が試されます。"},
  en2ja:{icon:"英→和",title:"英語から日本語を当てる",desc:"英語表記を見て、対応する日本語の用語名を選びましょう。"},
};
const BAND_META={
  sho:{label:"初",hint:"難易度 一〜二の用語"},
  nami:{label:"並",hint:"難易度 三〜四の用語"},
  nan:{label:"難",hint:"難易度 五〜六の用語"},
  goku:{label:"極",hint:"難易度 七〜九の用語"},
};
const BAND_ORDER=["sho","nami","nan","goku"];
const QUIZ_TOTAL=20;
const PASS_COUNT=10;
const MARKERS=["A","B","C","D"];

/* 初 is always unlocked; each subsequent level unlocks per-mode after passing the previous one */
const quizProgress={
  desc2term:{sho:true,nami:false,nan:false,goku:false},
  term2desc:{sho:true,nami:false,nan:false,goku:false},
  en2ja:{sho:true,nami:false,nan:false,goku:false},
};
const quiz={mode:null,band:null,questions:[],idx:0,correct:0,wrong:0,answered:false};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function truncDesc(s,len){return s.length>len?s.slice(0,len)+"…":s}
function escapeRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
/* Hide the term's own name/reading/aliases inside text so the answer isn't given away.
   styled=true wraps the mask in a span (only safe for text that will NOT be truncated afterward). */
function maskSelf(text,term,styled){
  if(!text)return text;
  const variants=[term.ja,term.kana,term.en,...(term.alias||[])].filter(Boolean).sort((a,b)=>b.length-a.length);
  let masked=text;
  const rep=styled?'<span class="qq-mask">◯◯◯</span>':"◯◯◯";
  variants.forEach(v=>{ if(!v)return; masked=masked.replace(new RegExp(escapeRegex(v),"gi"),rep); });
  return masked;
}

/* ---- Menu: mode select ---- */
function renderQuizMenu(){
  quiz.mode=null;quiz.band=null;
  const qa=$("quizArea");
  qa.classList.remove("session");
  qa.innerHTML=`<div class="quiz-mode-select">
    <div class="quiz-mode-eyebrow">FLASH QUIZ ─ モード選択</div>
    ${Object.keys(MODE_META).map(m=>{
      const meta=MODE_META[m],prog=quizProgress[m];
      const dots=BAND_ORDER.map(b=>{
        const cls=prog[b]?"qm-dot done":"qm-dot locked";
        return `<span class="${cls}">${BAND_META[b].label}</span>`;
      }).join("");
      return `<div class="quiz-mode-card" data-mode="${m}">
        <div class="qm-icon">${meta.icon}</div>
        <h3>${meta.title}</h3>
        <p>${meta.desc}</p>
        <div class="qm-dots">${dots}</div>
      </div>`;
    }).join("")}
  </div>`;
  qa.querySelectorAll(".quiz-mode-card").forEach(el=>{
    el.addEventListener("click",()=>renderLevelSelect(el.dataset.mode));
  });
}

/* ---- Level select (lock/unlock per mode) ---- */
function renderLevelSelect(mode){
  quiz.mode=mode;quiz.band=null;
  const qa=$("quizArea");
  const prog=quizProgress[mode];
  qa.innerHTML=`<div class="quiz-mode-select">
    <div class="level-back-row"><button class="quiz-back" id="qBackToModes">←</button><span class="quiz-mode-eyebrow" style="margin:0">${MODE_LABELS[mode]} ─ レベル選択</span></div>
    ${BAND_ORDER.map(b=>{
      const meta=BAND_META[b],unlocked=prog[b];
      const poolCount=TERMS.filter(t=>bandOf(t.lv)===b).length;
      const prevLabel=BAND_META[BAND_ORDER[BAND_ORDER.indexOf(b)-1]]?.label||"前のレベル";
      const desc=unlocked?`${meta.hint}・全${Math.min(QUIZ_TOTAL,poolCount)}問`:`「${prevLabel}」を${PASS_COUNT}問正解でクリアすると解放`;
      return `<div class="level-card ${unlocked?"":"locked"}" data-band="${b}" ${unlocked?"":"data-locked=\"1\""}>
        <div class="level-badge ${unlocked?"":"locked"}">${unlocked?meta.label:"鍵"}</div>
        <div class="level-main"><h3>${meta.label}</h3><p>${desc}</p></div>
        ${unlocked?'<span class="level-arrow">→</span>':""}
      </div>`;
    }).join("")}
  </div>`;
  $("qBackToModes").addEventListener("click",renderQuizMenu);
  qa.querySelectorAll(".level-card").forEach(el=>{
    if(el.dataset.locked)return;
    el.addEventListener("click",()=>startQuiz(mode,el.dataset.band));
  });
}

/* ---- Question generation: unique within session, distractors prefer same band ---- */
function generateQuestions(band){
  const bandPool=TERMS.filter(t=>bandOf(t.lv)===band);
  const count=Math.min(QUIZ_TOTAL,bandPool.length);
  const answers=shuffle([...bandPool]).slice(0,count);
  return answers.map(answer=>{
    let distractorPool=TERMS.filter(t=>t.n!==answer.n&&bandOf(t.lv)===band);
    if(distractorPool.length<3)distractorPool=TERMS.filter(t=>t.n!==answer.n);
    const others=shuffle(distractorPool).slice(0,3);
    return{answer,choices:shuffle([answer,...others])};
  });
}

function startQuiz(mode,band){
  quiz.mode=mode;quiz.band=band;
  quiz.questions=generateQuestions(band);
  quiz.idx=0;quiz.correct=0;quiz.wrong=0;quiz.answered=false;
  $("quizArea").classList.add("session");
  renderQuizQuestion();
}

/* ---- Question screen: fixed top/mid/bottom panes, feedback lives at TOP ---- */
function renderQuizQuestion(){
  const qa=$("quizArea");
  const q=quiz.questions[quiz.idx];
  if(!q){renderQuizResult();return}
  quiz.answered=false;
  let questionHTML="",choicesHTML="";

  if(quiz.mode==="desc2term"){
    const maskedDesc=maskSelf(q.answer.desc,q.answer,true);
    questionHTML=`<div class="qq-eyebrow">QUESTION ─ この解説の用語は？</div><div class="qq-text">${maskedDesc}</div>`;
    choicesHTML=q.choices.map((c,i)=>`<button class="q-choice" data-n="${c.n}"><span class="q-marker">${MARKERS[i]}</span><span class="q-label">${c.ja}</span></button>`).join("");
  } else if(quiz.mode==="term2desc"){
    questionHTML=`<div class="qq-eyebrow">QUESTION ─ この用語の解説は？</div><div class="qq-term">${q.answer.ja}</div>`;
    choicesHTML=q.choices.map((c,i)=>{
      const maskedDesc=maskSelf(c.desc,c,false);
      return `<button class="q-choice" data-n="${c.n}"><span class="q-marker">${MARKERS[i]}</span><span class="q-label">${truncDesc(maskedDesc,50)}</span></button>`;
    }).join("");
  } else {
    questionHTML=`<div class="qq-eyebrow">QUESTION ─ この英語の日本語名は？</div><div class="qq-term" style="font-family:var(--font-mono);font-size:20px;letter-spacing:.05em">${q.answer.en}</div>`;
    choicesHTML=q.choices.map((c,i)=>`<button class="q-choice" data-n="${c.n}"><span class="q-marker">${MARKERS[i]}</span><span class="q-label">${c.ja}（${c.kana}）</span></button>`).join("");
  }

  qa.innerHTML=`<div class="quiz-session">
    <div class="quiz-topbar">
      <div class="quiz-topbar-row">
        <div class="quiz-hud-left"><button class="quiz-back" id="qBack">←</button><span class="quiz-mode-label">${MODE_LABELS[quiz.mode]}<small>${BAND_META[quiz.band].label}</small></span></div>
        <div class="quiz-counter"><b>${quiz.idx+1}</b>&nbsp;/&nbsp;${quiz.questions.length}</div>
      </div>
      <div class="quiz-progress"><div class="quiz-progress-fill" style="width:${(quiz.idx/quiz.questions.length)*100}%"></div></div>
    </div>
    <div class="quiz-feedback-slot" id="qFeedback"><div class="quiz-feedback-idle"><span class="stat-ok">正解 <b>${quiz.correct}</b></span><span class="stat-ng">不正解 <b>${quiz.wrong}</b></span></div></div>
    <div class="quiz-content-scroll">
      <div class="quiz-question-pane"><div class="quiz-question-card">${questionHTML}</div></div>
      <div class="quiz-choices-pane"><div class="quiz-choices">${choicesHTML}</div></div>
    </div>
    <div class="quiz-action-bar" id="qActionBar"></div>
  </div>`;

  $("qBack").addEventListener("click",renderQuizMenu);
  qa.querySelectorAll(".q-choice").forEach(btn=>btn.addEventListener("click",()=>answerQuiz(btn,q)));
}

function answerQuiz(btn,q){
  if(quiz.answered)return;
  quiz.answered=true;
  const chosen=+btn.dataset.n;
  const isCorrect=chosen===q.answer.n;
  if(isCorrect)quiz.correct++;else quiz.wrong++;
  $("quizArea").querySelectorAll(".q-choice").forEach(b=>{
    b.classList.add("answered");
    const n=+b.dataset.n;
    if(n===q.answer.n)b.classList.add("correct");
    else if(b===btn&&!isCorrect)b.classList.add("wrong");
    else b.classList.add("dimmed");
  });
  const isLast=quiz.idx>=quiz.questions.length-1;
  const nextLabel=isLast?"結果を見る":"次の問題へ";
  const fb=$("qFeedback");
  if(isCorrect){
    fb.innerHTML=`<div class="quiz-feedback-result ok"><div class="fb-msg ok">正解！♠</div></div>`;
  } else {
    fb.innerHTML=`<div class="quiz-feedback-result ng"><div class="fb-msg ng">不正解<small>正解は「${q.answer.ja}」</small></div></div>`;
  }
  const bar=$("qActionBar");
  bar.classList.add("visible");
  bar.innerHTML=`<button class="quiz-next-btn" id="qNext">${nextLabel}</button>`;
  $("qNext").addEventListener("click",()=>{quiz.idx++;renderQuizQuestion()});
}

function renderQuizResult(){
  const qa=$("quizArea");
  qa.classList.remove("session");
  const total=quiz.questions.length;
  const pct=Math.round((quiz.correct/total)*100);
  let title="",glyph="";
  if(pct>=90){glyph="極";title="素晴らしい！塾長も感服です"} else if(pct>=70){glyph="良";title="なかなかやるな！"} else if(pct>=50){glyph="可";title="もう少しで合格ラインです"} else {glyph="修";title="もう一度復習しましょう"}

  /* unlock next band on pass */
  let unlockHTML="";
  const bandIdx=BAND_ORDER.indexOf(quiz.band);
  const nextBand=BAND_ORDER[bandIdx+1];
  if(quiz.correct>=PASS_COUNT&&nextBand&&!quizProgress[quiz.mode][nextBand]){
    quizProgress[quiz.mode][nextBand]=true;
    unlockHTML=`<div class="qr-unlock"><b>${BAND_META[nextBand].label}が解放されました！</b><br>「${MODE_LABELS[quiz.mode]}」モードで挑戦できます。</div>`;
  } else if(quiz.correct<PASS_COUNT&&nextBand){
    unlockHTML=`<div class="qr-unlock">次のレベル解放まであと <b>${Math.max(0,PASS_COUNT-quiz.correct)}問</b> 正解が必要です（${PASS_COUNT}問正解で解放）。</div>`;
  }

  qa.innerHTML=`<div class="quiz-result">
    <div class="qr-glyph">${glyph}</div>
    <div class="qr-title">${title}</div>
    <div class="qr-sub">${total}問中 ${quiz.correct}問正解（正答率 ${pct}%）</div>
    ${unlockHTML}
    <div class="qr-stats">
      <div class="qr-stat"><div class="num g">${quiz.correct}</div><div class="label">正解</div></div>
      <div class="qr-stat"><div class="num r">${quiz.wrong}</div><div class="label">不正解</div></div>
      <div class="qr-stat"><div class="num">${pct}%</div><div class="label">正答率</div></div>
    </div>
    <div class="qr-actions">
      <button class="qr-retry" id="qrRetry">もう一度挑戦する</button>
      <button class="qr-back" id="qrBack">レベル選択に戻る</button>
    </div>
  </div>`;
  $("qrRetry").addEventListener("click",()=>startQuiz(quiz.mode,quiz.band));
  $("qrBack").addEventListener("click",()=>renderLevelSelect(quiz.mode));
}

function setView(v){

  else renderList();
}

/* ===== Fixed shell: stop the whole page from moving/bouncing =====
   Only designated inner containers (list, quiz, sheet, form fields) may scroll.
   Everything else (header, chips, nav, background) stays perfectly still. */
const SCROLLABLE_SELECTOR=".list-area,.quiz-area,.sheet-body,.quiz-content-scroll,.settings-list,.chips,input,textarea";
document.addEventListener("touchmove",e=>{
  if(!e.target.closest(SCROLLABLE_SELECTOR))e.preventDefault();
},{passive:false});

/* ===== Portrait-only ===== 
   True OS-level orientation locking only works inside an installed/fullscreen PWA.
   This is a best-effort lock for that context; the CSS rotate-lock overlay above
   is what actually guarantees portrait-only behavior in a normal browser tab. */
function tryLockPortrait(){
  try{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock("portrait").catch(()=>{});
    }
  }catch(e){}
}
tryLockPortrait();
window.addEventListener("load",tryLockPortrait);

/* ===== Offline support =====
   This file has no external dependencies (fonts/images/APIs), so once loaded it
   already works fully offline. The service worker below additionally caches the
   page for repeat visits when hosted on a real server (it silently does nothing
   when opened as a local file, since service workers require http/https). */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  const swSrc=`
    const CACHE="poker-juku-lexicon-v1";
    self.addEventListener("install",e=>{
      e.waitUntil(caches.open(CACHE).then(c=>c.add(self.registration.scope)));
      self.skipWaiting();
    });
    self.addEventListener("activate",e=>self.clients.claim());
    self.addEventListener("fetch",e=>{
      e.respondWith(
        caches.match(e.request).then(cached=>cached||fetch(e.request).then(res=>{
          const copy=res.clone();
          caches.open(CACHE).then(c=>c.put(e.request,copy));
          return res;
        }).catch(()=>caches.match(self.registration.scope)))
      );
    });
  `;
  const blobUrl=URL.createObjectURL(new Blob([swSrc],{type:"application/javascript"}));
  navigator.serviceWorker.register(blobUrl).catch(()=>{});
}
