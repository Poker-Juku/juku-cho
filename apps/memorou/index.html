<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A1520">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="伏せ帳">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
<title>伏せ帳 試作版</title>
<style>
/* Layout: one phone-width column (like the iPhone app), centered on wider screens; sheets slide up from the bottom. */
/* Single dark look (matches the Canva design): deep navy ground, teal accent, vermilion only on the 証明済 seal. */
:root{
  --bg:#0A1520; --surface:#122030; --sunk:#0E1A27; --ink:#E4ECF3; --ink2:#8496AA; --line:#1F3144;
  --accent:#3CC8B4; --accent-ink:#04201C; --accent-soft:rgba(60,200,180,.12); --seal:#E26A4E; --ok:#5FD3A0; --bad:#F2877C; --bad-bg:#3A1E1C; --hint-bg:#2E2A16; --hint-ink:#F0DC9C;
  --f-brand:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;
  --f-body:Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;width:100%;max-width:100%;overflow:hidden;overscroll-behavior:none}
/* Androidで画面全体が横にずれないようにする：ページ自体は動かさず、中の一覧・帯だけをスクロールさせる */
body{margin:0;padding:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-wrap:anywhere}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phone{position:relative;max-width:440px;width:100%;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;overflow:clip;touch-action:pan-y pinch-zoom}

.chips,.phr-tabs,.mtabs,.stbar,.thumbs,.tbl-wrap,.fmt{touch-action:pan-x pan-y;overscroll-behavior-x:contain}
@media (min-width:600px){.phone{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);touch-action:none;user-select:none;position:relative}
.bar .grip{position:absolute;left:50%;bottom:3px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
.brand{font-family:var(--f-brand);font-weight:800;font-size:20px;letter-spacing:.02em;flex:1}
.icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg{width:22px;height:22px}
.back{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:8px 4px;flex:1;text-align:left}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 110px}
.hint{background:var(--hint-bg);color:var(--hint-ink);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6}
.day{font-size:13px;font-weight:700;color:var(--ink2);margin:18px 2px 6px;font-variant-numeric:tabular-nums}
.memo{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.memo .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo .s{color:var(--ink2);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
.seal{display:inline-flex;align-items:center;gap:4px;color:var(--seal);border:1.5px solid var(--seal);border-radius:4px;padding:0 6px;font-weight:700;font-size:11px;letter-spacing:.05em}
.tag{background:var(--sunk);border-radius:4px;padding:0 6px}
.mtabs{flex:0 0 auto;display:flex;gap:4px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.mtab{flex:0 0 auto;border:0;background:none;color:var(--ink2);font-weight:700;font-size:14px;padding:10px 12px 9px;border-bottom:2px solid transparent;cursor:pointer;font-variant-numeric:tabular-nums}
.mtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.ctl{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;font-size:13px;color:var(--ink2)}
.tgl{width:36px;height:32px;border:0;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;border-radius:8px}
.tgl:hover{background:var(--sunk)}
.tgl svg{width:14px;height:14px;transition:transform .18s ease}
.tgl[aria-expanded="true"] svg{transform:rotate(90deg)}
.ctl b{color:var(--ink);font-weight:700}
.hbody{flex:1;display:flex;min-height:0}
.dlist{flex:0 0 auto;width:124px;overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);transition:width .18s ease;padding-bottom:110px}
.dlist.closed{width:0;border-right:0}
.dbtn{display:block;width:124px;border:0;background:none;text-align:left;padding:10px 12px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
.dbtn .dd{display:block;font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.dbtn .dc{display:block;font-size:11px;color:var(--ink2)}
.dbtn[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.dbtn[aria-current="true"] .dd{color:var(--accent)}
.hbody .scroll{padding-top:4px;min-width:0;padding-bottom:150px}
.memo .tm{color:var(--accent);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.tgl svg,.dlist{transition:none}}
.stbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.stbar .lbl{font-size:12px;color:var(--ink2);flex:0 0 auto;margin-right:2px}
.stb{flex:0 0 auto;border:1px solid var(--line);background:none;border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;color:var(--ink2)}
.stb[aria-pressed="true"]{color:var(--accent-ink);background:var(--st,var(--accent));border-color:var(--st,var(--accent));font-weight:700}
.stag{border-radius:4px;padding:0 6px;font-weight:700;font-size:11px;color:var(--accent-ink);background:var(--st)}
.st-todo{--st:#E26A4E}.st-doing{--st:#E0B04A}.st-watch{--st:#7FA7E0}.st-done{--st:#5FD3A0}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.85;margin:0}
.warnbox{background:var(--bad-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0}
.pill-note{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--ink2)}
.fab2{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));border:1.5px solid var(--accent);border-radius:999px;background:var(--surface);color:var(--accent);font-weight:700;font-size:15px;padding:9px 18px;display:flex;gap:6px;align-items:center;cursor:pointer}
.fab2 svg{width:18px;height:18px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbox{background:var(--sunk);border-radius:10px;padding:10px 12px;min-width:0}
.sbox h4{margin:0 0 4px;font-size:12px;color:var(--ink2)}
.sbox ol{margin:0;padding-left:1.2em;font-size:13px}
.sbox .none{font-size:12px;color:var(--ink2)}
.attn{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--seal);background:var(--surface);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:14px}
.attn small{display:block;color:var(--ink2);font-size:12px}
.fab{position:absolute;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:14px 24px;display:flex;gap:8px;align-items:center;cursor:pointer;box-shadow:0 6px 22px rgba(60,200,180,.28)}
.fab svg{width:20px;height:20px}
.empty{text-align:center;color:var(--ink2);padding:48px 12px}
/* editor */
.editor{flex:1;display:flex;flex-direction:column;min-height:0}
.phr{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);padding:2px 10px 8px}
.phr.closed{padding-bottom:2px}
.phr.closed .phr-body{display:none}
.phr-head{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);min-width:0}
.phr-head .tgl{width:32px;height:30px}
.phr-head .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;cursor:pointer;color:var(--ink)}
.mrow:last-child{border-bottom:0}
.mrow .mt{flex:1;min-width:0;font-size:15px}
.mrow .mv{color:var(--ink2);font-size:13px;white-space:nowrap}
.mrow .chev{color:var(--ink2);font-size:18px}
.sh-back{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 2px;font-size:15px}
.ptools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.psearch{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:8px 14px;margin-bottom:8px}
.plist{background:var(--sunk);border-radius:12px;padding:0 12px}
.p1{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer;color:var(--ink)}
.p1:last-child{border-bottom:0}
.p1 .pl{font-family:var(--f-brand);color:var(--accent);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p1 .pr{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p1 .pr small{color:var(--ink2);margin-left:6px;font-size:12px}
.p1[aria-expanded="true"]{border-bottom:0}
.p1 .chev{color:var(--ink2);transition:transform .15s}
.p1[aria-expanded="true"] .chev{transform:rotate(90deg)}
.plist .pcard{margin:0 -4px 10px;background:var(--surface)}
.pcount{font-size:12px;color:var(--ink2);margin:0 0 6px}
.sheet:has(.psearch){min-height:88%}
a.btn{text-decoration:none;display:inline-block}
.guide{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.guide .gi{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:18px;flex:0 0 auto}
.guide b{display:block;font-size:15px}
.guide small{color:var(--ink2);font-size:12px}
.steps{list-style:none;counter-reset:st;margin:0;padding:0}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;display:grid;place-items:center}
.steps b{display:block}
.steps span{color:var(--ink2);font-size:13px;line-height:1.7}
.faq h4{margin:18px 0 4px;font-size:13px;color:var(--ink2)}
.acc{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:11px 2px;font-weight:700;font-size:15px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"＋";color:var(--ink2);font-weight:400}
.acc[open] summary::after{content:"－"}
.acc p,.acc ul{margin:0 0 12px;color:var(--ink2);font-size:14px;line-height:1.8}
.acc ul{padding-left:1.2em}
.acc mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--ink);border-radius:3px}
.keypts{background:var(--sunk);border-radius:12px;padding:12px 14px 12px 30px;margin:8px 0 12px;font-size:14px;line-height:1.8}
.mailbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:12px 14px;margin:10px 0}
.mailbox code{font-family:var(--f-mono);font-size:14px;user-select:all;flex:1;min-width:0;overflow-wrap:anywhere}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.about-foot{text-align:center;color:var(--ink2);font-size:12px;margin:16px 0 4px;line-height:1.7}
.pcard{background:var(--sunk);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pcard .prow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.pcard .prow label{font-size:12px;color:var(--ink2);font-weight:700}
.pcard .pfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.pcard input.lbl-in{font-family:var(--f-brand);color:var(--accent);font-size:15px}
.diffbox{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.diffbox del{background:color-mix(in srgb,var(--seal) 30%,transparent);text-decoration:line-through;color:var(--ink)}
.diffbox ins{background:color-mix(in srgb,var(--ok) 28%,transparent);text-decoration:none;color:var(--ink)}
.findings{margin:6px 0 0;padding-left:1.2em;font-size:14px}
.findings li{margin-bottom:4px}
.legend{font-size:12px;color:var(--ink2)}
.legend del,.legend ins{padding:0 4px;border-radius:3px;white-space:nowrap;display:inline-block}
.legend del{background:color-mix(in srgb,var(--seal) 30%,transparent)}
.legend ins{background:color-mix(in srgb,var(--ok) 28%,transparent);text-decoration:none}
.phr-tabs{display:flex;gap:4px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.phr-tab{flex:0 0 auto;white-space:nowrap}
.phr-tab{border:0;background:none;padding:3px 10px;border-radius:999px;font-size:13px;color:var(--ink2);cursor:pointer}
.phr-tab[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip.learn::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}
.chip.top{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--ink)}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.add{border-style:dashed;background:none;color:var(--ink2)}
textarea.body{flex:1;width:100%;border:0;resize:none;background:var(--surface);padding:14px 16px;line-height:1.8;font-size:17px;min-height:200px}
textarea.body:focus{outline:none}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;background:var(--surface)}
.thumb{position:relative;flex:0 0 auto}
.thumb img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}
.thumb button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);cursor:pointer;font-size:14px;line-height:1}
.tools{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.grow{flex:1}
.proof{font-family:var(--f-mono);font-size:11px;color:var(--ink2);padding:6px 16px;background:var(--sunk);border-top:1px solid var(--line);overflow-wrap:anywhere}
.suggest{margin:0;padding:10px 16px;background:var(--hint-bg);color:var(--hint-ink);font-size:13px}
.suggest .chips{margin-top:6px}
.suggest .chip{background:var(--surface);color:var(--ink)}
/* sheets */
.sheet-wrap{position:absolute;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;z-index:40}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:18px;margin:0;flex:1}
.sheet h3{font-size:14px;color:var(--ink2);margin:22px 0 8px;letter-spacing:.04em}
.sh-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.group{background:var(--sunk);border-radius:12px;padding:4px 12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .lbl{flex:1;min-width:0}
.row .sub{display:block;font-size:12px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.sw{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:left .15s}
.sw:checked{background:var(--accent)}.sw:checked::after{left:21px}
input[type=text],input[type=password],textarea.box{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea.box{min-height:120px;font-size:14px;line-height:1.6}
textarea.mono{font-family:var(--f-mono);font-size:11px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--ink2);font-weight:700}
.person{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
.person .who{font-family:var(--f-brand);font-size:15px;color:var(--accent)}
.note{font-size:12px;color:var(--ink2);margin:6px 0 0}
.ver{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.ver pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;font-family:var(--f-body);font-size:14px}
.ver .h{font-family:var(--f-mono);font-size:11px;color:var(--ink2);overflow-wrap:anywhere}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--bad);font-weight:700}
.result{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.result.rok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.result.rng{background:var(--bad-bg)}
/* full screens */
.full{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px}
.logo{font-family:var(--f-brand);font-size:44px;letter-spacing:.02em}
.logo small{display:block;font-family:var(--f-body);font-size:13px;color:var(--ink2);text-align:center;letter-spacing:.1em;margin-top:4px}
.splash .logo{animation:rise .7s ease-out both}
@keyframes rise{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash .logo{animation:none}.sw,.sw::after{transition:none}}
/* ===== 起動画面：暗い背景に光が走り、タイトルが1文字ずつ浮かぶ。下の一言は起動するたびに替わる ===== */
.sp2{position:absolute;inset:0;z-index:70;background:#04080D;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .45s ease}
.sp2.out{opacity:0}

.sp2 .beam{position:absolute;left:-30%;right:-30%;top:46%;height:1px;background:linear-gradient(90deg,transparent,rgba(60,200,180,.9),transparent);box-shadow:0 0 18px 2px rgba(60,200,180,.35);transform:translateX(-100%);animation:spBeam 1.6s .2s cubic-bezier(.6,0,.2,1) both}

.sp2 .ttl::after{content:"";position:absolute;inset:-6px -10px;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);mix-blend-mode:overlay;transform:translateX(-120%);animation:spSheen 1.1s 1.25s ease-in-out both;pointer-events:none}
.sp2 .seal2{position:absolute;right:-30px;top:-14px;font-family:var(--f-body);font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--seal);border:1.5px solid var(--seal);border-radius:4px;padding:1px 5px;opacity:0;transform:rotate(-12deg) scale(1.9);animation:spStamp .35s 1.15s cubic-bezier(.3,1.6,.5,1) both}
.sp2 .sub{position:relative;margin-top:22px;min-height:1.6em;font-size:15px;letter-spacing:.14em;color:#9FB2C3;text-align:center;padding:8px 24px;opacity:0;animation:spSub 1s 1.45s ease-out both;background:none;border:0;cursor:pointer;font-family:inherit}
.sp2 .spn{margin-top:2px;font-size:10px;letter-spacing:.2em;color:#3E5266;opacity:0;animation:spSub 1s 1.6s ease-out both}
.sp2 .sub b{color:#DCEAF2;font-weight:700}
.move{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;background:#1B2B3A;border:1px solid var(--accent);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4)}.move b{font-size:15px}.move span{color:var(--accent);font-weight:700}.move small{color:var(--ink2);line-height:1.5}.move div{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.sp2 .en{position:relative;margin-top:8px;font-family:Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.55em;padding-left:.55em;color:#6F8699;opacity:0;animation:spSub 1s 1.05s ease-out both}
.sp2 .bar2{position:absolute;bottom:calc(46px + env(safe-area-inset-bottom,0px));width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.sp2 .bar2 i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0);animation:spBar var(--dur,3s) linear both}
.sp2 .skip{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:11px;color:#5D7084;letter-spacing:.1em}
@keyframes spGlow{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}40%{opacity:1}100%{opacity:.85;transform:translate(-50%,-50%) scale(1.05)}}
@keyframes spGrid{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
@keyframes spBeam{0%{transform:translateX(-100%);opacity:0}20%{opacity:1}100%{transform:translateX(100%);opacity:0}}
@keyframes spChar{to{opacity:1;filter:blur(0);transform:none}}
@keyframes spSheen{to{transform:translateX(120%)}}
@keyframes spStamp{to{opacity:1;transform:rotate(-12deg) scale(1)}}
@keyframes spSub{from{opacity:0;letter-spacing:.4em;filter:blur(4px)}to{opacity:1;letter-spacing:.14em;filter:none}}
@keyframes spBar{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.sp2 *,.sp2 .ttl span,.sp2 .ttl::after{animation-duration:.01s!important;animation-delay:0s!important}}

/* ===== チュートリアル：画面の縮小図に番号を付け、下の説明と番号で対応させる ===== */

.tut-page{cursor:pointer}
.tut-steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}

<script>
(function(){
"use strict";
/* ============ 使い方・規約類（memorou-app/content/docs.json と同じ内容） ============ */
const DOCS={"app": "伏せ帳", "appEn": "FUSECHO", "appKana": "ふせちょう", "price": "500円", "version": "0.1.0", "operator": "Juku-Cho（アプリ塾）", "email": "jukucho.2026@gmail.com", "form": "https://formspree.io/f/xjgnrdpy", "site": "https://fusecho.juku-cho.com/", "updated": "2026年10月17日", "help": {"quick": [{"t": "「書く」を押す", "d": "日時が入ったメモが開きます。上に並ぶ定型句（誰が・誰に・何を など）をタップすると、言葉がそのまま入ります。"}, {"t": "実名のまま書く", "d": "設定の「匿名化リスト」に名前を登録しておくと、書き出しやコピーの時だけ「Aさん」などに自動で置き換わります。"}, {"t": "保存する", "d": "保存するたびに日時と証明が押され、編集履歴が残ります。あとから書き換えられていないかを確かめられます。"}], "groups": [{"title": "書く", "items": [{"q": "定型句を増やしたり、減らしたりするには？", "a": "設定 →「定型句」で、項目ごとに「、」で区切って書き換えます。使わない項目は空にすると、メモ画面に表示されなくなります。"}, {"q": "本文を広く使いたい", "a": "メモ画面の定型句の左にある三角を押すと、定型句の帯をたためます。もう一度押すと開きます。"}, {"q": "画像は何枚まで付けられる？", "a": "1つのメモに10枚までです。標準では長辺2048pxに縮めて保存します。証拠として細部まで残したい時は、設定 →「画像」で「原寸」を選べます（容量を多く使います）。"}, {"q": "「対応状況」とは？", "a": "メモごとに「未対応・対応中・経過観察・対応済み」を選べます。選んだ状況は一覧に色で表示され、「情報整理」で対応が必要な記録として拾われます。"}]}, {"title": "匿名化", "items": [{"q": "匿名化はいつ働く？", "a": "書き出し、コピー、情報整理のコピーなど、メモがアプリの外に出る時に働きます。アプリの中では実名のまま表示されるので、書く時は普段どおりで大丈夫です。"}, {"q": "「田中さん」「田中部長」も置き換わる？", "a": "「さん・様・くん・部長」などが付いた形は、自動でまとめて置き換わります。あだ名や略し方で書くことが多い人は、匿名化リストでその人を開き、「あだ名・略し方」に追加してください（なくても大丈夫です）。"}, {"q": "置き換え後の名前を変えたい", "a": "設定 →「匿名化リスト」で人をタップすると、「置き換え後」「実名」「あだ名・略し方」を書き換えられます。同じ置き換え後の名前を2人に付けることはできません。"}, {"q": "大勢をまとめて登録したい", "a": "匿名化リストの「リストから読み込む」で、スプレッドシートの範囲を貼り付けるか、CSVファイルを選びます。A列に実名、C列に置き換え後を並べてください（B列はあだ名・略し方。空でもかまいません）。"}, {"q": "黄色い枠で「匿名化していない名前があります」と出た", "a": "保存した本文に、匿名化リストにない人名や会社名らしき言葉が見つかったお知らせです。タップするとそのまま登録できます。必要なければそのままで構いません。"}]}, {"title": "記録の証明", "items": [{"q": "「証明済」とは？", "a": "保存した時の日時・本文・画像から計算した値と、この端末だけが持つ鍵による署名を記録しています。あとからアプリを通さずに書き換えられると、確認の時に見つかります。"}, {"q": "書き間違いを直したい", "a": "そのまま直して保存してください。新しい版として残り、前の版も消えずに残ります。編集履歴は削除できません。いつ何を書き足したかを説明できるようにするためです。"}, {"q": "「不一致」と表示された", "a": "保存した時の記録と今の内容が一致しないという意味です。メモの「履歴」を開くと、どの文字が変わったか、いつからいつの間に変わったかが表示されます。"}, {"q": "裁判などの証拠になる？", "a": "書き換えがないことを示す材料にはなりますが、証拠としての扱いは状況によって異なります。必要な場合は、弁護士などの専門家にご相談ください。"}]}, {"title": "安全", "items": [{"q": "データはどこに保存される？", "a": "この端末の中だけです。開発者のサーバーには一切送りません。開発者があなたのメモを見ることもできません。保存するデータは端末の鍵で暗号化しています。"}, {"q": "インターネットにつながるのはどんな時？", "a": "記録・閲覧・匿名化・証明の確認は、すべて通信なしで動きます。通信するのは、①プロ版の購入・購入の復元・購入状態の確認（端末とアプリストアの間だけで行い、開発者のサーバーや外部サービスは使いません）、②自分で書き出し・共有・バックアップをした時、③お問い合わせなどのWebページを開いた時、の3つだけです。"}, {"q": "ロックのかかり方は？", "a": "起動した時と、ほかのアプリから戻った時に、Face ID・指紋（使えない時は端末のパスコード）で確認します。"}, {"q": "すぐに隠したい", "a": "画面上部の見出しを下へスワイプするか、端末を伏せるとすぐにロックがかかります。どちらも設定 →「セキュリティ」でオン・オフできます。"}, {"q": "人に画面を見られたくない", "a": "アプリを切り替える時や画面収録・配信中は、内容を隠す画面に切り替わります。隠す画面は「ロゴ」か「ダミーのメモ」を選べます。"}, {"q": "コピーした文章は安全？", "a": "クリップボードには、匿名化した文章だけが入ります。ただし、クリップボードはほかのアプリからも読めるので、貼り付けが済んだら別の文章をコピーし直しておくと安心です。"}, {"q": "キーボードで気をつけることは？", "a": "他社製のキーボードアプリの中には、入力した文字をインターネットへ送るものがあります。伏せ帳で書く時は、端末に最初から入っている標準のキーボードを使うと安心です。"}, {"q": "スマホを落としたら？", "a": "メモは端末の鍵で暗号化されていて、開くにはFace ID・指紋か端末のパスコードが必要です。端末のパスコードは、推測されにくいものにしておいてください。"}]}, {"title": "バックアップと機種変更", "items": [{"q": "機種変更する時は？", "a": "設定 →「バックアップ」で、パスワード付きのファイルを書き出します。新しい端末で同じ画面から読み込んでください。iPhoneとAndroidの間でも移せます。"}, {"q": "パスワードを忘れた", "a": "残念ながら、誰にも復元できません。バックアップのパスワードは、別の場所に控えておいてください。"}, {"q": "アプリを削除するとどうなる？", "a": "端末の中のメモもすべて消え、元に戻せません。削除する前に、必要に応じてバックアップを書き出してください。"}]}, {"title": "情報整理", "items": [{"q": "何ができる？", "a": "その月（またはすべての期間）の記録について、人物ごとの登場回数、出来事の内訳、対応が必要な記録をまとめ、文章でも整理します。整理は端末の中だけで行い、どこにも送信しません。"}, {"q": "まとめを人に渡したい", "a": "「コピー（匿名）」を使うと、匿名化した文章がコピーされます。メールや報告書にそのまま貼り付けられます。"}]}]}, "privacy": {"title": "プライバシーポリシー", "intro": "本ポリシーは、Juku-Cho（アプリ塾）（以下「当方」）が提供するアプリ「伏せ帳」（以下「本アプリ」）における、利用者の情報の取り扱いを定めるものです。", "summary": ["メモ・画像・匿名化リストは、すべてお使いの端末の中だけに保存されます。", "当方のサーバーへは何も送信しません。当方があなたのメモを見ることはできません。", "広告・アクセス解析・会員登録はありません。"], "sections": [{"h": "1. 収集する情報", "p": ["本アプリは、氏名・メールアドレス・電話番号など、個人を特定できる情報を収集しません。会員登録やログインの機能もありません。広告の配信やアクセス解析も行っていません。"]}, {"h": "2. 端末に保存する情報", "p": ["本アプリは、次の情報をお使いの端末の中だけに保存します。これらは端末の安全な保管場所（iPhoneのキーチェーン、AndroidのKeystore）にある鍵で暗号化され、当方を含む外部へ送信されることはありません。"], "list": ["メモの本文、編集履歴、添付した画像", "匿名化リスト（実名・置き換え後の名前など）", "定型句と各種の設定", "書き換えがないことを確かめるための控えと確認記録", "メモを消去した日時の記録（本文は残しません）"]}, {"h": "3. 端末の機能の利用", "p": ["本アプリは、次の目的に限って端末の機能を利用します。"], "list": ["Face ID・指紋・パスコード：アプリを開く時の本人確認のため。照合は端末のOSが行い、顔や指紋の情報が本アプリに渡ることはありません。", "カメラ・写真：利用者がメモに添付する画像を撮影・選択するため。選ばれた画像以外にはアクセスしません。", "モーションセンサー：「端末を伏せたらロック」機能のため。向きの判定にだけ使い、記録しません。"]}, {"h": "4. 外部への送信", "p": ["本アプリは、通常の記録・閲覧・匿名化・証明の確認を、インターネットにつながずに行います。通信が発生するのは、次の場面だけです。", "本アプリが外部へ情報を送るのは、利用者が自分で書き出し・共有・バックアップを行った時だけです。送信先は利用者が選んだアプリやサービスとなります。書き出しやコピーの内容は、匿名化リストに登録された名前が置き換えられた状態で渡されます。", "ブラウザで使える試作版には、利用者が自分でAIサービスのAPIキーを入力し、送信内容を確認して同意した場合にだけ、匿名化した記録をAnthropic社のAIへ送って要約する機能があります。スマートフォン版には、この機能はありません。", "将来、AIによる要約など外部への送信を伴う機能を追加する場合は、事前に本ポリシーを改定し、アプリの中で利用者の同意を得た場合にだけ動作するようにします。"], "list": ["プロ版の購入・購入の復元・購入状態の確認：端末とアプリストア（Apple・Google）の間だけで行います。当方のサーバーや、ほかの外部サービスは使いません。", "書き出し・共有・バックアップ：利用者が自分で選んだアプリやサービスに渡す時だけです。", "お問い合わせ・規約などのWebページを開く時：利用者が自分で開いた時だけです。"]}, {"h": "5. アプリストアから提供される情報と購入", "p": ["App Store・Google Playから、ダウンロード数や、利用者が共有を許可した場合のクラッシュ情報などの統計が当方に提供されることがあります。これらに個人を特定できる情報やメモの内容は含まれません。", "プロ版の購入の手続きと支払いは、Apple・Googleが行います。当方がクレジットカードなどの支払い情報を受け取ることはありません。購入済みかどうかの確認は、端末とアプリストアの間で行い、当方のサーバーは使いません。"]}, {"h": "6. お問い合わせで受け取る情報", "p": ["お問い合わせフォームで受け取ったお名前・メールアドレス・内容は、回答のためだけに使い、第三者に提供しません。フォームの送信には、送信サービス「Formspree」を利用しています。お問い合わせの際は、メモの内容や実名を送らないようお願いします。"]}, {"h": "7. データの削除", "p": ["本アプリの「設定 → すべてのデータを消す」を行うか、本アプリを端末から削除すると、保存した情報はすべて消去されます。当方の側に残る情報はありません。"]}, {"h": "8. 未成年の利用", "p": ["本アプリは個人情報を収集しないため、年齢確認は行っていません。未成年の方は、保護者の方と相談のうえご利用ください。"]}, {"h": "9. 本ポリシーの変更", "p": ["法令の変更や機能の追加に応じて、本ポリシーを変更することがあります。重要な変更がある場合は、アプリ内またはこのページでお知らせし、最終更新日を更新します。"]}, {"h": "10. お問い合わせ先", "p": ["本ポリシーに関するお問い合わせは、お問い合わせページのフォームからご連絡ください。"]}]}, "terms": {"title": "利用規約", "intro": "この利用規約（以下「本規約」）は、Juku-Cho（アプリ塾）（以下「当方」）が提供するアプリ「伏せ帳」（以下「本アプリ」）の利用条件を定めるものです。本アプリを利用した時点で、本規約に同意したものとみなします。", "sections": [{"h": "第1条（本アプリの内容）", "p": ["本アプリは、出来事や発言などを端末の中に記録し、匿名化して書き出すためのメモアプリです。記録は利用者の端末の中だけに保存されます。"]}, {"h": "第2条（記録の内容と責任）", "p": ["記録する内容と、その利用については、利用者が責任を負います。他人について記録する場合は、その人のプライバシーに配慮し、法令を守ってご利用ください。"]}, {"h": "第3条（記録の証明について）", "p": ["本アプリの証明機能は、記録が書き換えられていないことを確かめる手段を提供するものです。裁判などで証拠として認められることを保証するものではありません。"]}, {"h": "第4条（データの保管）", "p": ["記録は利用者の端末の中だけに保存され、当方は保管していません。端末の故障・紛失・アプリの削除などによるデータの消失に備え、利用者の責任でバックアップを行ってください。バックアップのパスワードを忘れた場合、当方を含め誰も復元できません。"]}, {"h": "第5条（禁止事項）", "p": ["利用者は、次の行為をしてはなりません。"], "list": ["法令または公序良俗に反する目的での利用", "他人の名誉を傷つけたり、嫌がらせをしたりする目的での利用", "本アプリの解析・改変・再配布など、当方の権利を侵害する行為"]}, {"h": "第6条（プロ版の購入と返金）", "p": ["本アプリは無料で利用でき、一部の機能はアプリ内課金（買い切り）で購入する「プロ版」として提供します。", "購入はApple IDまたはGoogleアカウントにひも付きます。機種変更や再インストールの後は、同じアカウントで「購入を復元」を行うことで、追加の支払いなく利用できます。", "購入・返金の手続きは、App Store・Google Playの各規定に従います。"]}, {"h": "第7条（免責）", "p": ["当方は、本アプリの不具合の修正に努めますが、本アプリがすべての端末で正常に動作することを保証するものではありません。", "本アプリの利用により利用者に損害が生じた場合、当方に故意または重大な過失があるときを除き、当方の賠償責任は、利用者が当方に支払った本アプリの購入代金の額を上限とします。"]}, {"h": "第8条（本規約の変更）", "p": ["当方は、必要に応じて本規約を変更することがあります。変更後の規約は、アプリ内またはこのページに掲載した時点で効力を生じます。"]}, {"h": "第9条（準拠法）", "p": ["本規約は日本法に準拠します。"]}]}, "contact": {"title": "お問い合わせ", "intro": "不具合のご報告、ご意見・ご要望は、お問い合わせフォームからお送りください。内容を確認のうえ、順次ご返信します。", "include": ["お使いの端末（例：iPhone 15、Pixel 8）", "OSのバージョン（例：iOS 19.1、Android 16）", "伏せ帳のバージョン（設定の最下部に表示）", "起きたこと・操作の手順"], "caution": "メモの内容や、記録した方の実名は送らないでください。当方はメモを見ることができず、調査にも必要ありません。", "before": "お問い合わせの前に、「使い方」のよくある質問もご確認ください。"}, "tutorial": {"pages": [{"scene": "intro", "title": "伏せ帳へようこそ", "lead": "人に見せられない出来事を、匿名で、すぐに、確かに残すメモアプリです。", "points": ["記録はこの端末の中だけ。サーバーには送りません", "実名で書いても、書き出す時はAさん・X社に置き換わります", "保存した日時と内容を証明し、後からの書き換えを見破ります"], "foot": "次のページから、画面のどこで何をするとどうなるかを説明します（約1分）。"}, {"scene": "cases", "title": "案件でまとめる", "lead": "ホームには「案件」が並びます。同じ出来事のメモを1つにまとめて、経過を順番に見られます。", "steps": [{"t": "案件のカードをタップ", "r": "その案件のメモが、古い順に並びます。カードには、メモの数・期間・最新のメモ・登場する人が出ます。"}, {"t": "「＋ 新しい案件」をタップ", "r": "名前を付けて案件を作ります（例：〇〇の件）。名前に実名を入れても、書き出す時はAさんなどに置き換わります。"}, {"t": "案件の中の「書き出し」をタップ", "r": "その案件のメモを古い順に1本の文章にまとめます。名前は匿名になり、各メモの証明も付きます。"}, {"t": "案件の中の「解決にする」をタップ", "r": "一覧の下の「解決した案件」にしまいます。「再開する」で元に戻せます。"}, {"t": "上の「日付」をタップ", "r": "月ごと・日ごとの一覧に切り替わります。「案件」を押すと、案件の一覧に戻ります。"}]}, {"scene": "home", "title": "日付で見る", "lead": "一覧の上の「日付」に切り替えると、メモが月ごと・日ごとに並びます。", "steps": [{"t": "上の月のタブをタップ", "r": "その月のメモを表示します。月が替わると、新しいタブが増えます。"}, {"t": "左上の三角マークをタップ", "r": "たたんであった日付の列が開き、三角が ▼ になります。もう一度押すとたたんで、メモを広く表示します。"}, {"t": "左の日付をタップ", "r": "その日のメモだけに絞ります。「すべて」で元に戻ります。"}, {"t": "メモをタップ", "r": "メモが開き、読む・書き足すができます。"}, {"t": "メモの下の札を見る", "r": "「証明済」は保存済みの証です。対応状況や、版（履歴）の数も表示されます。"}]}, {"scene": "write", "title": "メモを書く", "lead": "開いた瞬間に日時が入るので、すぐに書き始められます。", "steps": [{"t": "画面の右下「書く」をタップ", "r": "新しいメモが開き、今の日時が先頭に自動で入ります。"}, {"t": "上の「案件」の行をタップ", "r": "このメモを入れる案件を選べます。案件の中で「書く」を押した時は、最初からその案件に入ります。"}, {"t": "本文に入力", "r": "実名のままで大丈夫です。書き出す時に匿名になります。"}, {"t": "右下の「保存」をタップ", "r": "日時と内容が証明され、「証明済」の札が付きます。"}, {"t": "左上の「‹ 一覧」をタップ", "r": "ホームに戻ります。保存していない時は、確認が出ます。"}]}, {"scene": "helpers", "title": "定型句・画像・対応状況", "lead": "よく使う言葉と、メモの扱いを手早く付けられます。", "steps": [{"t": "分類（いつ・誰が・何が…）をタップ", "r": "下に並ぶ言葉が、その分類に切り替わります。"}, {"t": "言葉をタップ", "r": "入力中の位置に差し込まれます。よく使う言葉ほど前に並びます（設定の「定型句」でオン・オフできます）。「＋登録」で自分の言葉を増やせます。"}, {"t": "定型句の左の三角マーク（▼）をタップ", "r": "定型句をたたんで、本文を広く使えます。"}, {"t": "対応状況（未対応・対応中…）をタップ", "r": "メモに札が付きます。同じボタンをもう一度押すと外れます。"}, {"t": "「画像」をタップ", "r": "写真を添付します。1つのメモに10枚までです。"}]}, {"scene": "anon", "title": "名前を匿名にする", "lead": "画面では実名のまま。書き出しと情報整理の時に置き換わります。", "steps": [{"t": "保存後に出る名前を選んで「登録」", "r": "「匿名化していない名前があります」と出た名前を、まとめて匿名化リストに登録します。登録しない名前は、タップして外します。"}, {"t": "右上の歯車 →「匿名化リスト」", "r": "登録した人の一覧です。タップすると、置き換え後の名前（Aさんなど）を変えられます。"}, {"t": "一覧の上の「＋ 新しく登録」をタップ", "r": "実名と置き換え後の名前を入れて登録します。「リストから読み込む」なら、表計算のファイルからまとめて登録できます。"}], "note": "メールアドレスと電話番号も、書き出す時に伏せられます。"}, {"scene": "proof", "title": "証明と編集履歴", "lead": "保存した内容は消せない形で残り、書き換えられると分かります。", "steps": [{"t": "本文の下の「証明」の行を見る", "r": "保存した日時・版の番号・ハッシュ値（内容の指紋）です。"}, {"t": "「履歴」をタップ", "r": "すべての版と、改ざんの検査結果が見られます。"}, {"t": "書き直して「保存」", "r const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD=["日","月","火","水","木","金","土"];
const pad2=n=>String(n).padStart(2,"0");
const dKey=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
const dLabel=ts=>{const d=new Date(ts);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`};
const tLabel=ts=>{const d=new Date(ts);return `${d.getHours()}:${pad2(d.getMinutes())}`};

const SUFFIXES="さん|様|さま|氏|くん|君|ちゃん|先生|部長|課長|主任";

const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

async function sha(str){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

/* ============ storage (device only: IndexedDB) ============ */
const DB={db:null,
  async open(){ if(this.db) return this.db; this.db=await new Promise((res,rej)=>{const r=indexedDB.open("memorou",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}); return this.db },
  async get(k){try{const db=await this.open();return await new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return undefined}},
  async set(k,v){try{const db=await this.open();await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)});return true}catch(e){return false}}
};

/* 定型句のランキング：保存したメモに出てきた回数（定型句から選んだ言葉も、自分で書いた言葉も同じく数える） */
function countWord(text,w){if(!w)return 0;let n=0,i=0;while((i=text.indexOf(w,i))!==-1){n++;i+=w.length}return n}
function recordPhraseUse(prevText,newText){
  const use=st.phraseUse||(st.phraseUse={});
  PHRASE_CATS.forEach(([k])=>(st.phrases[k]||[]).forEach(w=>{
    const add=countWord(newText,w)-countWord(prevText||"",w);
    if(add>0){(use[k]||(use[k]={}))[w]=((use[k]||{})[w]||0)+add}
  }));
}
/* 名前の学習候補（誰が・誰に）：匿名化リストの名前と、メモに「〇〇さん」などで出てくる名前が
   「〇〇さんが」「〇〇さんに」の形で何回書かれたかを数える。定型句に登録しなくても候補に出る */
const LEARN_P={who:"が",whom:"に"};
const LEARN_STOP=new Set(["皆","お客","奥","みな","社長","先生","自分","上司","同僚","部下","利用者","保護者","園児","取引先","全員"]);
function learnedPhrases(k){
  const pt=LEARN_P[k]; if(!pt) return [];
  const texts=st.memos.map(m=>m.versions[m.versions.length-1].text);
  const reg=new Set(), found=new Set();
  st.people.forEach(p=>{if(p.real)reg.add(p.real);(p.aliases||[]).forEach(a=>{if(a)reg.add(a)})});
  const nameRe=new RegExp("([\\u4E00-\\u9FFF\\u30A1-\\u30F6ー]{1,6})(?:"+SUFFIXES+")","g");
  texts.forEach(t=>{let m;nameRe.lastIndex=0;while((m=nameRe.exec(t))) if(!LEARN_STOP.has(m[1])&&!reg.has(m[1])) found.add(m[1])});
  const cnt={}, need={};
  [...reg,...found].forEach(nm=>{
    const re=new RegExp(escRe(nm)+"((?:"+SUFFIXES+")?)"+pt,"g");
    texts.forEach(t=>{let m;while((m=re.exec(t))){const w=nm+m[1]+pt;cnt[w]=(cnt[w]||0)+1;need[w]=reg.has(nm)?1:2}});
  });
  const have=new Set(st.phrases[k]||[]);
  return Object.entries(cnt).filter(([w,n])=>!have.has(w)&&n>=need[w]).map(([w,n])=>({w,n,learn:true})).sort((a,b)=>b.n-a.n).slice(0,6);
}
/* メモ画面に並べる候補：登録した定型句＋名前の学習候補。ランキングがオンなら回数の多い順 */

/* ============ proof chain ============ */
function vBase(p,ts,text,imgs,salt){const a=[p,ts,text,imgs.map(i=>i.hash)]; if(salt) a.push(salt); return a}
async function makeVersion(prev,text,imgs,ts){
  ts=ts||Date.now(); const p=prev?prev.hash:"GENESIS";
  /* 秘密の乱数：書き出したハッシュから実名を総当たりで割り出されないようにする */
  const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");
  const hash=await sha(JSON.stringify(vBase(p,ts,text,imgs,salt)));
  const v={ts,text,imgs,hash,prev:p,salt};
  sealVersion(v);
  return v;
}
async function verifyMemo(m){
  let p="GENESIS";
  for(let i=0;i<m.versions.length;i++){
    const v=m.versions[i];
    if(v.prev!==p) return {ok:false,at:i,kind:"chain"};
    const h=await sha(JSON.stringify(vBase(p,v.ts,v.text,v.imgs,v.salt)));
    if(h!==v.hash) return {ok:false,at:i,kind:"content"};
    for(let k=0;k<v.imgs.length;k++){const im=v.imgs[k],d=st.images[im.id]; if(!d||await sha(d)!==im.hash) return {ok:false,at:i,kind:"img",imgIndex:k}}
    p=v.hash;
  }
  return {ok:true};
}
/* 確認の記録：最後に一致を確かめた時刻と、初めて不一致を見つけた時刻 */
async function checkMemo(m){
  const r=await verifyMemo(m), c=vault.checks[m.id]||(vault.checks[m.id]={});
  const now=Date.now();
  if(r.ok){c.lastOk=now;delete c.firstNg}else if(!c.firstNg){c.firstNg=now}
  persistVault();
  return r;
}
/* 文字単位の差分（前後の共通部分を除いてから比較） */
function diffText(a,b){
  let pre=0; while(pre<a.length&&pre<b.length&&a[pre]===b[pre]) pre++;
  let suf=0; while(suf<a.length-pre&&suf<b.length-pre&&a[a.length-1-suf]===b[b.length-1-suf]) suf++;
  const A=a.slice(pre,a.length-suf), B=b.slice(pre,b.length-suf);
  const ops=[]; if(pre) ops.push(["=",a.slice(0,pre)]);
  if(A.length*B.length>1500000){ if(A) ops.push(["-",A]); if(B) ops.push(["+",B]); }
  else{
    const n=A.length,m=B.length,dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
    for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    let i=0,j=0;const push=(t,c)=>{const l=ops[ops.length-1];if(l&&l[0]===t)l[1]+=c;else ops.push([t,c])};
    while(i<n&&j<m){if(A[i]===B[j]){push("=",A[i]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){push("-",A[i]);i++}else{push("+",B[j]);j++}}
    while(i<n)push("-",A[i++]); while(j<m)push("+",B[j++]);
  }
  if(suf){const l=ops[ops.length-1];if(l&&l[0]==="=")l[1]+=a.slice(a.length-suf);else ops.push(["=",a.slice(a.length-suf)])}
  return tidyDiff(ops);
}
/* 消えた・足された部分の区切りを、文の切れ目にそろえる（読みやすさのため） */
function tidyDiff(ops){
  const P=/[。、！？!?\n]/;
  for(let i=1;i<ops.length-1;i++){
    if(ops[i][0]==="="||ops[i-1][0]!=="="||ops[i+1][0]!=="=") continue;
    let E1=ops[i-1][1],X=ops[i][1],E2=ops[i+1][1];
    const score=(e1,x)=>(P.test(x.slice(-1))?2:0)+(e1===""||P.test(e1.slice(-1))?1:0);
    let best={e1:E1,x:X,e2:E2,s:score(E1,X)};
    let e1=E1,x=X,e2=E2;
    while(e1.length&&x.length&&e1.slice(-1)===x.slice(-1)){const k=E1.length-e1.length+1;x=e1.slice(-1)+x.slice(0,-1);e2=X.slice(X.length-k)+E2;e1=e1.slice(0,-1);const sc=score(e1,x);if(sc>best.s)best={e1,x,e2,s:sc}}
    e1=E1;x=X;e2=E2;
    while(e2.length&&x.length&&e2[0]===x[0]){e1=e1+x[0];x=x.slice(1)+e2[0];e2=e2.slice(1);const sc=score(e1,x);if(sc>best.s)best={e1,x,e2,s:sc}}
    ops[i-1][1]=best.e1;ops[i][1]=best.x;ops[i+1][1]=best.e2;
  }
  return ops.filter(o=>o[1]!=="");
}
function diffHtml(ops){return ops.map(([t,c])=>t==="="?esc(c):t==="-"?`<del>${esc(c)}</del>`:`<ins>${esc(c)}</ins>`).join("")}
function diffChanges(ops){
  const out=[];
  const q=s=>{s=s.replace(/\n/g,"↵");return s.length>40?s.slice(0,40)+"…":s};
  for(let i=0;i<ops.length;i++){
    const [t,c]=ops[i]; if(t==="=") continue;
    const before=(ops[i-1]&&ops[i-1][0]==="=")?ops[i-1][1].slice(-10):"";
    if(t==="-"&&ops[i+1]&&ops[i+1][0]==="+"){ out.push({kind:"replace",from:c,to:ops[i+1][1],ctx:before}); i++; }
    else out.push({kind:t==="-"?"del":"ins",text:c,ctx:before});
  }
  return out.map(x=>{
    const at=x.ctx.trim()?`（「…${q(x.ctx)}」の後）`:"";
    if(x.kind==="replace") return `「${q(x.from)}」が「${q(x.to)}」に変わっています${at}。`;
    if(x.kind==="del") return `「${q(x.text)}」が消されています${at}。`;
    return `「${q(x.text)}」が書き足されています${at}。`;
  });
}
/* 不一致の内容を文章にする */
function explainMismatch(m,r){
  const i=r.at, v=m.versions[i], seal=vault.seals[v.hash], c=vault.checks[m.id]||{};
  const findings=[]; let ops=null, what="内容";
  if(r.kind==="chain"){
    findings.push(`版${i}と版${i+1}のつながりが、保存時と違います。途中の版が抜き取られたか、差し替えられた可能性があります。`);
    what="版の並び";
  }else if(r.kind==="img"){
    findings.push(`添付画像の${r.imgIndex+1}枚目が、保存時の画像と一致しません。画像が差し替えられたか、消された可能性があります。`);
    what="画像";
  }else if(!seal){
    findings.push("保存時の控えが見つからないため、どこが変わったかは表示できません。内容が書き換えられたことは確かです。");
  }else{
    if(seal.ts!==v.ts){findings.push(`保存日時が「${fullStamp(seal.ts)}」から「${fullStamp(v.ts)}」に変わっています。`);what="保存日時"}
    if(seal.text!==v.text){ops=diffText(seal.text,v.text); const ch=diffChanges(ops); findings.push(...ch.slice(0,5)); if(ch.length>5)findings.push(`ほかに${ch.length-5}か所の変更があります。`); what=seal.ts!==v.ts?"本文と保存日時":"本文"}
    if(seal.imgs.join()!==v.imgs.map(x=>x.hash).join()){findings.push("添付画像の組み合わせが保存時と違います。");}
  }
  const savedAt=fullStamp(v.ts&&seal?seal.ts:v.ts);
  const from=c.lastOk&&c.lastOk>(seal?seal.ts:v.ts)?`${fullStamp(c.lastOk)}（最後に一致を確認）`:`${savedAt}（保存）`;
  const to=c.firstNg?`${fullStamp(c.firstNg)}（不一致を検知）`:"今回の確認";
  const when=`${from}から${to}までの間に、アプリを通さずに${what}が書き換えられた可能性があります。書き換えた正確な時刻は記録に残りません。`;
  return {title:`✕ 版${i+1}（${savedAt} 保存）が、保存時の記録と一致しません。`,findings,when,ops};
}
/* ============ anonymize & PII ============ */
function anonymize(text){
  let out=text;
  const pairs=[];
  st.people.forEach(p=>[p.real,...p.aliases].map(s=>(s||"").trim()).filter(Boolean).forEach(t=>pairs.push([t,p.label])));
  pairs.sort((a,b)=>b[0].length-a[0].length);
  if(pairs.length){
    const map=new Map(pairs);
    const re=new RegExp("("+pairs.map(p=>escRe(p[0])).join("|")+")(?:"+SUFFIXES+")?","g");
    out=out.replace(re,(m,g)=>map.get(g));
  }
  if(st.settings.maskContact) out=out.replace(EMAIL,"［メール］").replace(PHONE,"［電話番号］");
  return out;
}
function knownTerms(){const s=new Set();st.people.forEach(p=>{s.add(p.real);p.aliases.forEach(a=>s.add(a))});return s}
function findPII(text){
  const known=knownTerms(), out=new Map();
  const isKnown=w=>[...known].some(k=>k&&(w===k||w.startsWith(k)||k.startsWith(w)));
  const nameRe=new RegExp("([\\u4E00-\\u9FFF\\u30A1-\\u30F6ー]{1,6})(?:"+SUFFIXES+")","g");
  let m;
  const stop=new Set(["皆","お客","奥","みな","社長","先生"]);
  while((m=nameRe.exec(text))){const w=m[1]; if(!stop.has(w)&&!isKnown(w)) out.set(w,{word:w,kind:"人名"})}
  const C="[\\u4E00-\\u9FFF\\u30A1-\\u30F6ーA-Za-z0-9＆&]";
  const coRe=new RegExp("(?:株式会社|有限会社|合同会社|（株）|\\(株\\))\\s?("+C+"{1,15})|("+C+"{1,15})(?:株式会社|有限会社|合同会社)","g");
  while((m=coRe.exec(text))){const w=(m[1]||m[2]||"").trim(); if(w&&!isKnown(w)) out.set(w,{word:w,kind:"会社名"})}
  return [...out.values()].slice(0,8);
}

/* ============ backup crypto ============ */
const b64=u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
/* バックアップのパスワード確認：ファイルを持ち出されると総当たりを何度でも試されるため、短い・単純なものは断る */
function pwProblem(pw){
  if([...pw].reduce((n,c)=>n+(c.charCodeAt(0)<128?1:2),0)<10) return "パスワードは英数字なら10文字以上、日本語なら5文字以上にしてください";
  if(new Set(pw).size<5) return "同じ文字のくり返しが多すぎます。いろいろな文字を混ぜてください";
  const low=pw.toLowerCase();
  if(["password","qwerty","abcdefg","1234567","abc123","iloveyou","memorou","fusecho"].some(w=>low.includes(w))||/^(0123456789|1234567890|9876543210)/.test(pw)) return "よく使われる並びが含まれています。別のパスワードにしてください";
  return null;
}
async function keyFrom(pass,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encryptState(pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyFrom(pass,salt),new TextEncoder().encode(JSON.stringify(st))));
  const all=new Uint8Array(28+ct.length);all.set(salt);all.set(iv,16);all.set(ct,28);
  return "FUSECHO1:"+b64(all);
}
async function decryptState(code,pass){
  code=code.trim(); const pre=["FUSECHO1:","MEMOROU1:"].find(x=>code.startsWith(x)); if(!pre) throw new Error("format");
  const all=unb64(code.slice(pre.length)); const salt=all.slice(0,16),iv=all.slice(16,28),ct=all.slice(28);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},await keyFrom(pass,salt),ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

const STATUSES=[["todo","未対応"],["doing","対応中"],["watch","経過観察"],["done","対応済み"]];
const ST_LABEL=Object.fromEntries(STATUSES);
const ATTN_WORDS=["未解決","再発","経過観察","未対応","対応中","解決していない","解決していません","様子を見る","様子見","また起きた","再び起きた"];
function attnReason(m){
  if(m.status) return (m.status==="done")?null:ST_LABEL[m.status];
  const t=m.versions[m.versions.length-1].text, hit=ATTN_WORDS.find(w=>t.includes(w));
  return hit?`本文に「${hit}」`:null;
}
/* 戻せる匿名化：送信用に置き換え、対応表で元に戻す */
function anonymizeReversible(text){
  const map=new Map(); // token -> original
  const pairs=[];
  st.people.forEach(p=>{
    const back=p.label.endsWith("さん")?p.real+"さん":p.real;
    map.set(p.label,back);
    [p.real,...p.aliases].map(x=>(x||"").trim()).filter(Boolean).forEach(t=>pairs.push([t,p.label]));
  });
  pairs.sort((a,b)=>b[0].length-a[0].length);
  let out=text;
  if(pairs.length){
    const lm=new Map(pairs);
    const re=new RegExp("("+pairs.map(x=>escRe(x[0])).join("|")+")(?:"+SUFFIXES+")?","g");
    out=out.replace(re,(m0,g)=>lm.get(g));
  }
  const seen=new Map(); let ne=0,np=0;
  out=out.replace(EMAIL,m0=>{if(!seen.has(m0)){const t=`［メール${++ne}］`;seen.set(m0,t);map.set(t,m0)}return seen.get(m0)});
  out=out.replace(PHONE,m0=>{if(!seen.has(m0)){const t=`［電話${++np}］`;seen.set(m0,t);map.set(t,m0)}return seen.get(m0)});
  return {text:out,map};
}
function restoreText(text,map){
  const keys=[...map.keys()].sort((a,b)=>b.length-a.length);
  if(!keys.length) return text;
  const re=new RegExp(keys.map(escRe).join("|"),"g");
  return text.replace(re,k=>map.get(k));
}
/* AIなしで文章を組み立てる（匿名のまま作る） */
function buildProse(memos,scopeLabel){
  const txt=m=>m.versions[m.versions.length-1].text;
  const md=ts=>{const d=new Date(ts);return `${d.getMonth()+1}月${d.getDate()}日`};
  const memoTitle=m=>{const t=memoTitleRaw(m).replace(/[。．.]+$/,"").split("。")[0];return t.length>28?t.slice(0,28)+"…":t};
  if(!memos.length) return `${scopeLabel}の記録はありません。`;
  const attn=memos.filter(attnReason), done=memos.filter(m=>m.status==="done");
  const people=st.people.map(p=>{const t=[p.real,...p.aliases].filter(Boolean);const ms=memos.filter(m=>t.some(w=>txt(m).includes(w)));return [p,ms]}).filter(x=>x[1].length).sort((a,b)=>b[1].length-a[1].length);
  const topW=list=>(list||[]).map(w=>[w,memos.filter(m=>txt(m).includes(w)).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  const what=topW(st.phrases.whatSubj), acts=topW(st.phrases.what);
  const cnt=k=>memos.filter(m=>m.status===k).length;
  let o=`■ 全体の要点\n`;
  o+=`${scopeLabel}の記録は${memos.length}件です（${md(memos[0].versions[0].ts)}〜${md(memos[memos.length-1].versions[0].ts)}）。`;
  o+=attn.length?`このうち対応が必要そうな記録が${attn.length}件あります（未対応${cnt("todo")}件・対応中${cnt("doing")}件・経過観察${cnt("watch")}件）。`:`対応が必要そうな記録はありません。`;
  if(people.length) o+=`最も多く登場したのは${people[0][0].label}で${people[0][1].length}件です。`;
  if(what.length) o+=`出来事では「${what.slice(0,3).map(x=>x[0]).join("」「")}」が記録されています。`;
  if(acts.length) o+=`やり取りでは「${acts.slice(0,3).map(x=>x[0]).join("」「")}」が見られます。`;
  o+=`\n\n■ 人物ごとの状況`;
  if(!people.length) o+=`\n匿名化リストに登録された人物は登場していません。`;
  people.forEach(([p,ms])=>{const last=ms[ms.length-1];const a=ms.filter(attnReason).length;
    o+=`\n${p.label}：${ms.length}件。最新は${md(last.versions[0].ts)}「${memoTitle(last)}」。${a?`対応が必要そうな記録が${a}件あります。`:""}`});
  o+=`\n\n■ 対応が必要なこと`;
  if(!attn.length) o+=`\nありません。`;
  attn.slice().reverse().forEach(m=>{o+=`\n${md(m.versions[0].ts)}「${memoTitle(m)}」（${attnReason(m)}）`});
  o+=`\n\n■ 対応済み`;
  o+=done.length?done.map(m=>`\n${md(m.versions[0].ts)}「${memoTitle(m)}」`).join(""):`\nありません。`;
  return o;
}
async function getApiKey(){return (await DB.get("apikey"))||""}
async function callClaude(key,prompt){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:1500,messages:[{role:"user",content:prompt}]})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
  return (j.content||[]).map(c=>c.text||"").join("");
}

/* メモは1つの案件に入る（memo.caseId）。案件への出し入れは本文の証明（ハッシュ）とは別に caseLog に残す */
const caseOf=id=>(st.cases||[]).find(c=>c.id===id)||null;
const memosOfCase=id=>st.memos.filter(m=>(m.caseId||null)===(id||null)).sort((a,b)=>a.versions[0].ts-b.versions[0].ts);
function setMemoCase(m,caseId){
  if((m.caseId||null)===(caseId||null))return;
  m.caseId=caseId||null; (m.caseLog||(m.caseLog=[])).push({ts:Date.now(),caseId:caseId||null}); persist();
}
function createCase(name){const c={id:uid(),name:name.trim(),createdAt:Date.now(),closed:false};(st.cases||(st.cases=[])).push(c);persist();return c}
function caseStats(list){
  const people=st.people.filter(p=>{const t=[p.real,...p.aliases].filter(Boolean);return list.some(m=>t.some(w=>m.versions[m.versions.length-1].text.includes(w)))});
  const last=list[list.length-1];
  return {n:list.length,first:list[0],last,people,attn:list.filter(attnReason).length};
}
const mdShort=ts=>{const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()}`};

async function saveMemo(){
  const d=ui.draft; d.text=$("#body").value;
  if(!d.text.trim()&&!d.imgs.length){toast("本文が空です");return}
  let m=st.memos.find(x=>x.id===ui.editId);
  const cur=m?m.versions[m.versions.length-1]:null;
  const same=cur&&cur.text===d.text&&cur.imgs.map(i=>i.id).join()===d.imgs.map(i=>i.id).join();
  if(same){toast("変更はありません");return}
  Object.assign(st.images,d.newImgs); d.newImgs={};
  const v=await makeVersion(cur,d.text,d.imgs.slice());
  recordPhraseUse(cur?cur.text:"",d.text);
  if(m) m.versions.push(v); else {m={id:uid(),versions:[v]};if(d.caseId){m.caseId=d.caseId;m.caseLog=[{ts:v.ts,caseId:d.caseId}]}if(d.status){m.status=d.status;m.statusLog=[{ts:v.ts,status:d.status}]}st.memos.push(m);ui.editId=m.id}
  persist();
  ui.suggest=findPII(d.text);
  toast(m.versions.length>1?`版${m.versions.length}として保存しました`:"保存しました");
  renderEditor();
}

function personEditHtml(i){
  const p=st.people[i];
  return `<div class="pcard" data-pi="${i}">
    <div class="prow"><label for="pl_${i}">置き換え後</label><input type="text" class="lbl-in" id="pl_${i}" data-pf="label" value="${esc(p.label)}"></div>
    <div class="prow"><label for="pr_${i}">実名</label><input type="text" id="pr_${i}" data-pf="real" value="${esc(p.real)}"></div>
    <details class="alias"${p.aliases.length?" open":""}><summary>あだ名・略し方（必要な時だけ）</summary><div class="prow"><label for="pa_${i}">あだ名・略し方</label><input type="text" id="pa_${i}" data-pf="aliases" value="${esc(p.aliases.join("、"))}" placeholder="例：たなっち（、で区切る）"></div></details>
    <div class="pfoot"><span>例：「${esc(p.real)}さん」→「${esc(p.label)}」</span><button class="btn bad" data-delp="${i}">削除</button></div>
  </div>`;
}
function applyPersonEdit(i,field,value,el){
  const p=st.people[i]; if(!p) return false;
  value=value.trim();
  if(field==="label"){
    if(!value){toast("置き換え後の名前を入力してください");el.value=p.label;return false}
    if(st.people.some((x,j)=>j!==i&&x.label===value)){toast(`「${value}」は別の人に使われています。同じ名前にすると区別できません`);el.value=p.label;return false}
    p.label=value;
  }else if(field==="real"){
    if(!value){toast("実名を入力してください");el.value=p.real;return false}
    if(st.people.some((x,j)=>j!==i&&x.real===value)){toast(`「${value}」はすでに登録されています`);el.value=p.real;return false}
    p.real=value;
  }else{
    p.aliases=[...new Set(value.split(/[、,，]/).map(x=>x.trim()).filter(x=>x&&x!==p.real))];
    el.value=p.aliases.join("、");
  }
  persist(); toast("匿名化リストを更新しました");
  const card=el.closest(".pcard"); if(card) card.querySelector(".pfoot span").textContent=`例：「${p.real}さん」→「${p.label}」`;
  return true;
}

    el.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{st.settings[b.dataset.seg]=b.dataset.v;persist();b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});

/* 使い方：3ステップ＋検索できるよくある質問（たたんで表示） */
function pageHelp(sub){
  const H=DOCS.help;
  const hl=(t,q)=>{t=esc(t);if(!q)return t;return t.split(esc(q)).join(`<mark>${esc(q)}</mark>`)};
  const groupsHtml=q=>{
    let n=0;
    const html=H.groups.map(g=>{
      const items=g.items.filter(it=>!q||it.q.includes(q)||it.a.includes(q));
      n+=items.length;
      return items.length?`<h4>${esc(g.title)}</h4>${items.map(it=>`<details class="acc"${q?" open":""}><summary>${hl(it.q,q)}</summary><p>${hl(it.a,q)}</p></details>`).join("")}`:"";
    }).join("");
    return n?html:`<p class="note">「${esc(q)}」に当てはまる質問は見つかりませんでした。下の「お問い合わせ」からご連絡ください。</p>`;
  };
  openSheet(sub("使い方")+`
    <input type="search" class="psearch" id="hSearch" placeholder="知りたいことを入力（例：機種変更、匿名化）" aria-label="よくある質問を探す">
    <div id="hQuick"><button class="guide" data-act="tutorial" style="margin-top:4px"><span class="gi">▶</span><span style="flex:1;min-width:0"><b>チュートリアルを見る</b><small>画面のどこで何をするか（${DOCS.tutorial.pages.length}ページ・約1分）</small></span><span class="chev">›</span></button><h3 style="margin-top:6px">はじめての方へ</h3>
    <ol class="steps">${H.quick.map(x=>`<li><div><b>${esc(x.t)}</b><span>${esc(x.d)}</span></div></li>`).join("")}</ol>
    <p class="note">試作版では、Face ID・指紋の代わりに暗証番号を使います。</p></div>
    <h3>よくある質問</h3>
    <div class="faq" id="hFaq">${groupsHtml("")}</div>
    <div class="linkrow"><button class="btn" data-go2="contact">解決しない時はお問い合わせ</button></div>`,
  el=>{
    el.querySelector("#hSearch").addEventListener("input",e=>{const q=e.target.value.trim();el.querySelector("#hQuick").hidden=!!q;el.querySelector("#hFaq").innerHTML=groupsHtml(q)});
    el.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>sheetSettings(b.dataset.go2));
  });
}

/* 匿名化リストのページ：1人1行の一覧＋検索。タップした人だけ編集欄を開く */
function pagePeople(sub,sw,bindCommon,focus){
  let q="", openId=null, adding=!!focus;
  const draw=()=>{
    const ql=q.trim();
    const list=st.people.map((p,i)=>({p,i})).filter(({p})=>!ql||[p.label,p.real,...p.aliases].some(x=>x.includes(ql)));
    return list.length?list.map(({p,i})=>`<button class="p1" data-tog="${esc(p.id||i)}" aria-expanded="${openId===(p.id||String(i))}">
        <span class="pl">${esc(p.label)}</span><span class="pr">${esc(p.real)}</span><span class="chev">›</span></button>
        ${openId===(p.id||String(i))?personEditHtml(i):""}`).join("")
      :`<p class="note" style="padding:10px 0">${ql?`「${esc(ql)}」に当てはまる人はいません。`:"まだ登録がありません。上の「＋ 新しく登録」から登録してください。"}</p>`;
  };
  const addForm=()=>`<div class="group" style="padding:12px;margin-bottom:10px" id="addBox">
      <div class="field"><label for="pReal">実名（会社名も可）</label><input type="text" id="pReal" placeholder="例：田中" value="${esc(focus&&focus.word||"")}"></div>
      <div class="field"><label for="pLabel">置き換え後（Aさん・X社など自由に変えられます）</label><input type="text" id="pLabel" value="${esc(focus&&focus.kind==="会社名"?"X社":nextLabel())}"></div>
      <div style="display:flex;gap:8px"><button class="btn pri" id="pAdd">登録</button><button class="btn" id="pAddCancel">閉じる</button></div>
    </div>`;
  openSheet(sub("匿名化リスト")+`
    <p class="note" style="margin:0 0 6px">登録した名前は、書き出しやコピーの時に自動で置き換わります。「さん」「様」などが付いた形もまとめて置き換えます。</p>
    <div class="ptools"><button class="btn pri" id="pNew">＋ 新しく登録</button><button class="btn" data-act="importList">リストから読み込む</button></div>
    <div id="addHost">${adding?addForm():""}</div>
    <input type="search" class="psearch" id="pSearch" placeholder="名前で探す（実名・置き換え後）" aria-label="匿名化リストを探す">
    <p class="pcount" id="pCount">${st.people.length}人を登録中・タップで編集</p>
    <div class="plist" id="peopleBox">${draw()}</div>
    <div class="row"><span class="lbl">メールアドレス・電話番号も伏せる</span>${sw("maskContact")}</div>`,
  el=>{
    bindCommon(el);
    const box=el.querySelector("#peopleBox"), host=el.querySelector("#addHost");
    const redraw=()=>{box.innerHTML=draw();el.querySelector("#pCount").textContent=`${st.people.length}人を登録中・タップで編集`};
    const bindAdd=()=>{
      const pr=el.querySelector("#pReal"); if(!pr) return;
      el.querySelector("#pAddCancel").onclick=()=>{adding=false;host.innerHTML=""};
      el.querySelector("#pAdd").onclick=()=>{
        const real=pr.value.trim(); if(!real){toast("実名を入力してください");return}
        const aliases=[];
        const label=el.querySelector("#pLabel").value.trim()||nextLabel();
        if(st.people.some(x=>x.real===real)){toast(`「${real}」はすでに登録されています。下の一覧で編集できます`);return}
        if(st.people.some(x=>x.label===label)){toast(`「${label}」は別の人に使われています`);return}
        st.people.push({id:uid(),label,real,aliases});persist();
        ui.suggest=ui.suggest.filter(x=>x.word!==real);
        pr.value="";el.querySelector("#pLabel").value=nextLabel();
        focus=null; redraw(); pr.focus();
        toast(`${real} → ${label} で登録しました`);
      };
      setTimeout(()=>(focus&&focus.word?el.querySelector("#pAlias"):pr).focus(),50);
    };

function parseTable(text){
  text=text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  const firstLine=text.split("\n").find(l=>l.trim())||"";
  const delim=firstLine.includes("\t")?"\t":",";
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c; continue }
    if(c==='"'&&cell==="") q=true;
    else if(c===delim){row.push(cell);cell=""}
    else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c;
  }
  row.push(cell);rows.push(row);
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(Boolean));
}
function planImport(rows){
  if(rows.length&&/実名|名前|氏名|name/i.test(rows[0][0]||"")) rows=rows.slice(1);
  const plan=[]; const usedLabels=new Set(st.people.map(p=>p.label)); const seen=new Set();
  const nextFree=()=>{for(let i=0;i<26;i++){const l=String.fromCharCode(65+i)+"さん";if(!usedLabels.has(l)){usedLabels.add(l);return l}}let n=st.people.length+plan.length+1;while(usedLabels.has("人物"+n))n++;usedLabels.add("人物"+n);return "人物"+n};
  rows.forEach(r=>{
    const real=(r[0]||"").trim(); if(!real) return;
    const aliases=(r[1]||"").split(/[、,，;；／\/|｜]/).map(x=>x.trim()).filter(x=>x&&x!==real);
    let label=(r[2]||"").trim();
    if(seen.has(real)){plan.push({real,aliases,label,status:"skip",why:"表の中で重複"});return}
    seen.add(real);
    const ex=st.people.find(p=>p.real===real);
    if(ex){
      const add=aliases.filter(a=>!ex.aliases.includes(a));
      const relabel=label&&label!==ex.label;
      if(!add.length&&!relabel){plan.push({real,aliases,label:ex.label,status:"skip",why:"登録済み"});return}
      plan.push({real,aliases:add,label:relabel?label:ex.label,status:"upd",why:[add.length?`あだ名+${add.length}`:"",relabel?"置き換え後を変更":""].filter(Boolean).join("・"),ex});
      return;
    }
    if(label) usedLabels.add(label); else label=nextFree();
    plan.push({real,aliases,label,status:"new",why:""});
  });
  return plan;
}
async function readTextFile(file){
  const buf=await file.arrayBuffer();
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}
  catch(e){try{return new TextDecoder("shift_jis").decode(buf)}catch(e2){return new TextDecoder().decode(buf)}}
}

const SPLASH_LINES=DOCS.splash.map(x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"));
function showSplash(then){
  const N=SPLASH_LINES.length; let idx=(st.settings.splashIdx||0)%N; st.settings.splashIdx=idx+1;
  const stats=st.settings.splashStats||(st.settings.splashStats={full:0,skip:0,next:0}); persist();
  let dur=3000; const t0=Date.now();
  const s=document.createElement("div");s.className="sp2";s.dataset.kind="splash";s.setAttribute("aria-label","伏せ帳");
  s.style.setProperty("--dur",dur+"ms");
  s.innerHTML=`<div class="grid"></div><div class="glow"></div><div class="beam"></div>
    <div class="ttl" aria-hidden="true">${[..."伏せ帳"].map((c,k)=>`<span style="animation-delay:${.25+k*.09}s">${c}</span>`).join("")}<em class="seal2">証明済</em></div><span class="en" aria-hidden="true">FUSECHO</span>
    <button class="sub" id="spSub" aria-label="次のひとこと">${SPLASH_LINES[idx]}</button><span class="spn" id="spN">${idx+1} / ${N}</span>
    <div class="bar2"><i></i></div><span class="skip">ひとことをタップで次へ ・ ほかの所をタップで開く</span>`;
  $("#overlay").appendChild(s);
  let done=false, timer;
  const end=how=>{if(done)return;done=true;clearTimeout(timer);stats[how]=(stats[how]||0)+1;persist();s.classList.add("out");setTimeout(()=>{s.remove();then&&then()},450)};
  const arm=ms=>{clearTimeout(timer);timer=setTimeout(()=>end("full"),ms)};
  arm(dur);
  // ひとことを押すと次の一言へ。読む時間ぶん（1.6秒）だけ表示を延ばす
  s.querySelector("#spSub").addEventListener("click",e=>{e.stopPropagation();
    idx=(idx+1)%N; st.settings.splashIdx=idx+1; stats.next=(stats.next||0)+1; persist();
    const el=s.querySelector("#spSub"); el.style.animation="none"; void el.offsetWidth; el.style.animation="spSub .6s ease-out both";
    el.innerHTML=SPLASH_LINES[idx]; s.querySelector("#spN").textContent=`${idx+1} / ${N}`;
    const left=Math.max(1600,dur-(Date.now()-t0)); dur=(Date.now()-t0)+left; arm(left);
    const bar=s.querySelector(".bar2 i"); bar.style.animation="none"; void bar.offsetWidth; bar.style.animation=`spBar ${left}ms linear both`;
  });
  s.addEventListener("click",()=>end("skip"));
}

/* 1ページの中も、番号ごとに1つずつ見せる。画面をタップか「次へ」で次の番号、最後の番号のあと次のページへ */
function showTutorial(onDone){
  const pages=DOCS.tutorial.pages; let i=0, j=0;
  const el=document.createElement("div"); el.className="tut"; el.dataset.kind="tutorial";
  el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-label","使い方チュートリアル");
  const finish=()=>{el.remove();document.removeEventListener("keydown",key);st.settings.tutorialSeen=true;persist();onDone&&onDone()};
  const nSteps=pg=>(pg.steps||[]).length||1;
  const draw=()=>{
    const pg=pages[i], steps=pg.steps||[], lastPage=i===pages.length-1, lastStep=j===nSteps(pg)-1;
    const proto=pg.scene==="hide"?DOCS.tutorial.protoNote:"";
    const note=[pg.note,proto].filter(Boolean).join(" ");
    const cur=steps[j];
    el.innerHTML=`<div class="tut-top"><span class="tut-count">${i+1} / ${pages.length}</span>${lastPage&&lastStep?"<span></span>":`<button class="tut-skip" data-t="skip">スキップ</button>`}</div>
      <div class="tut-page" id="tutPage"><h2>${esc(pg.title)}</h2><p class="tut-lead">${esc(pg.lead)}</p>
        ${TUT_SCENES[pg.scene](j)}
        ${pg.points?`<div class="tut-pts">${pg.points.map((x,k)=>`<div>${TUT_PT_IC[k]||""}<span>${esc(x)}</span></div>`).join("")}</div>`:""}
        ${cur?`<div class="tut-one" aria-live="polite"><i>${j+1}</i><div><b>${esc(cur.t)}</b><span>${esc(cur.r)}</span></div></div>
          <div class="tut-prog"><span class="nums" aria-hidden="true">${steps.map((_,k)=>`<i class="${k===j?"on":k<j?"done":""}">${k+1}</i>`).join("")}</span><span>${lastStep?"":"画面をタップで次へ"}</span></div>`:""}
        ${note&&(lastStep||pg.noteAlways)?`<p class="tut-note">${esc(note)}</p>`:""}
        ${pg.foot?`<p class="tut-lead" style="margin-top:14px">${esc(pg.foot)}</p>`:""}
      </div>
      <div class="tut-bot"><button class="btn" data-t="prev" ${i===0&&j===0?"disabled style=\"visibility:hidden\"":""}>戻る</button>
        <span class="tut-dots" aria-hidden="true">${pages.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</span>
        <button class="btn pri" data-t="next">${lastPage&&lastStep?"はじめる":"次へ"}</button></div>`;
    // 今の番号の枠と番号だけを出す
    el.querySelectorAll(".tsc .pin").forEach(pn=>{if(+pn.textContent===j+1&&cur)pn.parentElement.classList.add("cur")});
    // 押した結果を動きで見せる（ホームの②：少し待ってから日付の列が開き、三角が▼になる）
    const anim=el.querySelector('[data-anim="open"]');
    if(anim)setTimeout(()=>{if(!anim.isConnected)return;anim.classList.add("open");const t=anim.querySelector(".trisvg");if(t)t.style.transform="rotate(90deg)"},800);
    const pgEl=el.querySelector("#tutPage"); let x0=null,y0=null;
    pgEl.addEventListener("pointerdown",e=>{x0=e.clientX;y0=e.clientY});
    pgEl.addEventListener("pointerup",e=>{if(x0==null)return;const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;
      if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1);
      else if(Math.abs(dx)<10&&Math.abs(dy)<10&&!e.target.closest("button,a"))go(1)});
  };
  const go=d=>{
    const pg=pages[i];
    if(d>0){ if(j<nSteps(pg)-1){j++;return draw()} if(i>=pages.length-1)return finish(); i++;j=0;return draw() }
    if(j>0){j--;return draw()} if(i===0)return; i--; j=nSteps(pages[i])-1; draw();
  };
  const key=e=>{if(e.key==="ArrowRight"||e.key===" ")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key==="Escape")finish()};
  el.addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;e.stopPropagation();({skip:finish,prev:()=>go(-1),next:()=>go(1)})[b.dataset.t]()});
  document.addEventListener("keydown",key);
  draw(); $("#overlay").appendChild(el); el.querySelector("[data-t=next]").focus();
}

/* ============ emergency swipe ============ */
function bindSwipe(){
  const bar=$("#bar"); if(!bar) return;
  let y0=null;
  bar.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;y0=e.clientY;bar.setPointerCapture(e.pointerId)});
  bar.addEventListener("pointermove",e=>{if(y0==null)return;if(e.clientY-y0>70&&st.settings.swipeLock){y0=null;lock("緊急ロック")}});
  const end=()=>{y0=null};bar.addEventListener("pointerup",end);bar.addEventListener("pointercancel",end);
}

let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now(); if(!ui.locked) showCover("cover")}
  else{clearOverlay("cover"); if(hiddenAt&&!ui.locked&&ui.screen!=="splash") lock("アプリに戻りました"); hiddenAt=0}
});
window.addEventListener("blur",()=>{if(!ui.locked&&!document.hidden&&ui.screen!=="splash")showCover("cover")});
window.addEventListener("focus",()=>clearOverlay("cover"));
document.addEventListener("pointerdown",()=>clearOverlay("cover"),true);
/* iPhone のブラウザは、アプリ切替の画面写しを撮るのが早く、離れたあとに隠しても間に合わない。
   そこで、画面の一番下（ホームバー）に指が触れた時点で先に隠す。離れなかった時はすぐ戻す */
let edgeCover=null;
document.addEventListener("touchstart",e=>{
  const t=e.touches[0]; if(!t||ui.locked||ui.screen==="splash")return;
  if(t.clientY>window.innerHeight-28){edgeCover=showCover("cover");}
},{passive:true,capture:true});
const edgeEnd=()=>{const c=edgeCover;edgeCover=null;if(!c)return;setTimeout(()=>{if(!document.hidden&&c.isConnected)c.remove()},450)};
document.addEventListener("touchend",edgeEnd,{passive:true,capture:true});
document.addEventListener("touchcancel",edgeEnd,{passive:true,capture:true});
window.addEventListener("pagehide",()=>{if(!ui.locked)showCover("cover")});

/* ============ sample ============ */
async function seed(){
  vault={seals:{},checks:{}};
  const base=new Date(); base.setHours(9,10,0,0);
  const day=86400000;
  const mk=async(offsetDays,mins,texts)=>{const m={id:uid(),versions:[]};let prev=null;
    for(let i=0;i<texts.length;i++){const ts=base.getTime()-offsetDays*day+mins*60000+i*47*60000;const v=await makeVersion(prev,texts[i],[],ts);m.versions.push(v);prev=v}
    return m};
  const head=(o,m)=>{const ts=base.getTime()-o*day+m*60000;return `${dLabel(ts)} ${tLabel(ts)}\n`};
  st.memos=[
    await mk(2,0,[head(2,0)+"田中さんが朝礼で佐藤さんに対して大声で注意した。周りに5人ほどいた。\n佐藤さんは黙ったまま。目撃者あり。未解決。"]),
    await mk(1,320,[head(1,320)+"佐藤さんから事務所で相談を受けた。昨日の件で気持ちが落ち込んでいるとのこと。",
                    head(1,320)+"佐藤さんから事務所で相談を受けた。昨日の件で気持ちが落ち込んでいるとのこと。\n追記：本人の希望で、田中部長にはまだ伝えない。経過観察。"]),
    await mk(1,600,[head(1,600)+"夜勤中に利用者さんが居室で転倒。ケガは軽い擦り傷。\n家族へ連絡。対応済み。第三者同席。"]),
    await mk(0,30,[head(0,30)+"株式会社ミナト企画の鈴木様から電話。納期の再確認。連絡先 03-1234-5678、suzuki@minato.example.jp\n山本くんにも共有済み。"])
  ];
  [["todo"],["watch"],["done"]].forEach(([k],i)=>{st.memos[i].status=k;st.memos[i].statusLog=[{ts:st.memos[i].versions[0].ts,status:k}]});
  /* 案件のサンプル。「はじめにの案件」は、読みながら操作して使い方が分かるメモ */
  const guide=DOCS.guideCase;
  const gMemos=[];
  for(let i=0;i<guide.memos.length;i++){const ts=Date.now()-(guide.memos.length-i)*60000;
    const v=await makeVersion(null,`${dLabel(ts)} ${tLabel(ts)}\n${guide.memos[i]}`,[],ts);gMemos.push({id:uid(),versions:[v]})}
  const cG={id:uid(),name:guide.name,createdAt:Date.now()-3600000,closed:false,guide:true};
  const c1={id:uid(),name:"田中さんの朝礼の件",createdAt:st.memos[0].versions[0].ts,closed:false};
  const c2={id:uid(),name:"居室での転倒の件",createdAt:st.memos[2].versions[0].ts,closed:false};
  st.cases=[cG,c1,c2];
  gMemos.forEach(m=>{m.caseId=cG.id});
  st.memos[0].caseId=c1.id; st.memos[1].caseId=c1.id; st.memos[2].caseId=c2.id;
  st.memos.forEach(m=>{if(m.caseId)m.caseLog=[{ts:m.versions[0].ts,caseId:m.caseId}]});
  st.memos=[...st.memos,...gMemos];
  st.images={};
  st.people=[{id:uid(),label:"Aさん",real:"田中",aliases:[]},{id:uid(),label:"Bさん",real:"佐藤",aliases:[]}];
  st.phraseUse={}; st.memos.forEach(m=>{let prev="";m.versions.forEach(v=>{recordPhraseUse(prev,v.text);prev=v.text})});
  st.deletions=[]; st.sample=true;
}

  const ins=e.target.closest("[data-ins],[data-insw]");
  if(ins){const ta=$("#body"),w=ins.dataset.insw!==undefined?ins.dataset.insw:st.phrases[ui.phrCat][+ins.dataset.ins];const a=ta.selectionStart,b=ta.selectionEnd;ta.setRangeText(w,a,b,"end");ta.focus();ui.draft.text=ta.value;return}
  const rm=e.target.closest("[data-rmimg]"); if(rm){ui.draft.text=$("#body").value;ui.draft.imgs.splice(+rm.dataset.rmimg,1);return renderEditor()}
  const sb=e.target.closest("[data-status]");
  if(sb){const k=sb.dataset.status, m=st.memos.find(x=>x.id===ui.editId); if($("#body"))ui.draft.text=$("#body").value;
    if(m){const nv=m.status===k?"":k; m.status=nv; (m.statusLog||(m.statusLog=[])).push({ts:Date.now(),status:nv}); persist(); toast(nv?`対応状況を「${ST_LABEL[nv]}」にしました`:"対応状況を外しました")}
    else{ui.draft.status=ui.draft.status===k?"":k}
    return renderEditor()}
  const sg=e.target.closest("[data-sug]"); if(sg){ui.draft.text=$("#body").value;const x=ui.suggest[+sg.dataset.sug];x.sel=x.sel===false;return renderEditor()}
  const a=e.target.closest("[data-act]"); if(!a) return;
  switch(a.dataset.act){
    case "new": return openEditor(null);
    case "sugAll": ui.draft.text=$("#body").value; ui.suggest.forEach(x=>x.sel=true); return renderEditor();
    case "sugSkip": ui.draft.text=$("#body").value; ui.suggest=[]; return renderEditor();
    case "sugAdd": {ui.draft.text=$("#body").value;
      const pick=ui.suggest.filter(x=>x.sel!==false), added=[];
      pick.forEach(x=>{if(st.people.some(p=>p.real===x.word))return;const label=x.kind==="会社名"?nextCompanyLabel():nextLabel();st.people.push({id:uid(),label,real:x.word,aliases:[]});added.push(`${x.word}→${label}`)});
      persist(); ui.suggest=[];
      toast(added.length?`${added.length}件を匿名化リストに登録しました（${added.join("、")}）`:"登録済みでした"); return renderEditor()}
    case "newCase": return sheetCaseName(null,c=>{ui.caseId=c.id;renderHome()});
    case "toggleClosed": ui.closedOpen=!ui.closedOpen; return renderHome();
    case "caseBack": ui.caseId=null; return renderHome();
    case "pickCase": return sheetCasePick();
    case "caseExport": return sheetCaseExport();
    case "caseRename": return sheetCaseName(caseOf(ui.caseId),()=>renderHome());
    case "caseClose": {const c=caseOf(ui.caseId); if(!c)return; c.closed=!c.closed; persist(); toast(c.closed?"解決にしました。一覧の「解決した案件」に移ります":"再開しました"); return renderHome()}
    case "caseDelete": {const c=caseOf(ui.caseId); if(!c)return; const n=memosOfCase(c.id).length;
      if(!await confirmBox(`「${c.name}」を消します。中のメモ${n}件は消えず、「案件に入っていないメモ」に移ります。`,"案件を消す",true))return;
      memosOfCase(c.id).forEach(m=>setMemoCase(m,null)); st.cases=st.cases.filter(x=>x!==c); persist(); ui.caseId=null; toast("案件を消しました"); return renderHome()}
    case "summary": return sheetSummary();
    case "togglePhr": {if($("#body"))ui.draft.text=$("#body").value; st.settings.phrOpen=st.settings.phrOpen===false; persist(); return renderEditor()}
    case "cloudConsent": return sheetCloudConsent();
    case "toggleList": {st.settings.listOpen=st.settings.listOpen===false;persist();
      const open=st.settings.listOpen, dl=$("#dlist"), t=a;
      dl.classList.toggle("closed",!open); t.setAttribute("aria-expanded",String(open)); t.setAttribute("aria-label",open?"日付リストをたたむ":"日付リストを開く"); return}
    case "home": {const ta=$("#body");const m=st.memos.find(x=>x.id===ui.editId);const cur=m?m.versions[m.versions.length-1]:null;
      const changed=ta&&(cur?ta.value!==cur.text:ta.value.replace(/^.*\n/,"").trim()!=="");
      if(changed&&!await confirmBox("保存していない変更があります。保存せずに一覧へ戻りますか？","保存せず戻る",true))return;
      return goHome()}
    case "save": return saveMemo();
    case "settings": if($("#body"))ui.draft.text=$("#body").value; return sheetSettings();
    case "phrases": ui.draft.text=$("#body").value; return sheetSettings("phrases");
    case "settingsMenu": return sheetSettings();
    case "closeSheet": closeSheet(); if(ui.screen==="edit")renderEditor(); else renderHome(); return;
    case "history": return sheetHistory();
    case "export": return sheetExport();
    case "backup": return sheetBackup();
    case "importList": return sheetImportList();
    case "setPin": return sheetPin();
    case "lockNow": return lock("ロックしました");
    case "delete": {
      const m=st.memos.find(x=>x.id===ui.editId);
      if(!await confirmBox(`このメモ（全${m.versions.length}版）を消去します。元に戻せません。消去した日時だけが記録に残ります。`,"消去する",true))return;
      st.deletions.push({memoId:m.id,createdAt:m.versions[0].ts,deletedAt:Date.now(),lastHash:m.versions[m.versions.length-1].hash,versions:m.versions.length});
      st.memos=st.memos.filter(x=>x!==m);
      const used=new Set(st.memos.flatMap(x=>x.versions.flatMap(v=>v.imgs.map(i=>i.id))));Object.keys(st.images).forEach(k=>{if(!used.has(k))delete st.images[k]});
      persist(); toast("消去しました"); return goHome();
    }
    case "tutorial": closeSheet(); return showTutorial(()=>{ui.screen==="edit"?renderEditor():renderHome()});
    case "splash": closeSheet(); return showSplash(()=>{ui.screen==="edit"?renderEditor():renderHome()});
    case "demoSwitch": {closeSheet();const c=showCover("cover","アプリ切替の再現中です（3秒）");setTimeout(()=>c.remove(),3000);return}
    case "demoRec": {closeSheet();const c=showCover("cover","画面収録・配信を検知した状態です。タップで終了");c.dataset.kind="rec";c.addEventListener("click",()=>c.remove());return}
    case "demoFaceDown": closeSheet(); if(!st.settings.faceDownLock){toast("「端末を伏せたら緊急ロック」がオフです");return} return lock("端末を伏せました");
    case "demoTamper": {
      const m=[...st.memos].sort((a,b)=>a.versions[0].ts-b.versions[0].ts)[0]; if(!m){toast("メモがありません");return}
      const v=m.versions[0];
      if(v.text.includes("大声で注意した")) v.text=v.text.replace("大声で注意した","注意した").replace("周りに5人ほどいた。","");
      else v.text=v.text.replace(/\n?$/,"（後から書き足し）\n");
      persist(); closeSheet();
      ui.editId=m.id; openEditor(m.id); setTimeout(sheetHistory,50); return;
    }
    case "demoSeed": if(!await confirmBox("サンプルのメモと匿名化リストで置き換えます。今あるメモは消えます。","入れる",true))return; await seed();for(const m of st.memos)await checkMemo(m);persist();closeSheet();return goHome();
    case "wipe": if(!await confirmBox("メモ・設定・消去記録をすべて消します。元に戻せません。","すべて消す",true))return; st=defaultState();vault={seals:{},checks:{}};persistVault();persist();closeSheet();return goHome();
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheetHost").innerHTML){closeSheet();ui.screen==="edit"?renderEditor():renderHome()}});

/* ============ boot ============ */
/* 旧アドレス（MEMO郎時代）で開いた時のお知らせ。ブラウザのデータはアドレスごとに分かれるため、自動では移せない */
function moveNotice(){
  if(location.hostname!==DOCS.oldSite) return;
  const n=document.createElement("div"); n.className="move";
  n.innerHTML=`<b>伏せ帳は新しいアドレスに移りました</b><span>${esc(DOCS.site.replace("https://","").replace(/\/$/,""))}</span><small>この画面のメモは自動では移りません。続けて使う時は「バックアップを書き出す」で書き出して、新しいアドレスで読み込んでください。</small><div><button class="btn" data-mv="bk">バックアップを書き出す</button><a class="btn pri" href="${DOCS.site}">新しいアドレスを開く</a><button class="btn" data-mv="x">あとで</button></div>`;
  document.body.appendChild(n);
  n.querySelector('[data-mv=bk]').onclick=()=>sheetBackup();
  n.querySelector('[data-mv=x]').onclick=()=>n.remove();
}
(async function boot(){
  ui.screen="splash";
  const saved=await DB.get("state");
  if(saved&&saved.v){st=Object.assign(defaultState(),saved);st.settings=Object.assign(defaultState().settings,saved.settings||{});
    if(!(saved.phrasesV>=2)){const old=saved.phrases||{};st.phrases={};
      const OLD={who:"自分,Aさん,Bさん",whom:"Aさんに,Bさんに,全員に",what:"指示した,注意した,相談を受けた,発言があった,トラブル",where:"事務所で,現場で,会議室で,電話で,チャットで"};
      PHRASE_CATS.forEach(([k])=>{const mine=(old[k]||[]);st.phrases[k]=(mine.join(",")===OLD[k])?PHRASE_DEFAULTS[k].slice():[...new Set([...mine,...PHRASE_DEFAULTS[k]])]});
      st.phrasesV=2; persist()}}
  else{await seed();storageOk=await DB.set("state",st)}
  const vs=await DB.get("vault"); if(vs&&vs.seals) vault=Object.assign({seals:{},checks:{}},vs);
  for(const m of st.memos){ const r=await verifyMemo(m);
    if(r.ok) m.versions.forEach(v=>{if(!vault.seals[v.hash])vault.seals[v.hash]={ts:v.ts,text:v.text,imgs:v.imgs.map(i=>i.hash),prev:v.prev}});
    await checkMemo(m); }
  persistVault();
  showSplash(()=>{ui.screen="home";renderHome();
    // 初回だけチュートリアル。暗証番号を設定済みの人（使い慣れた人）は出さずにロックへ
    if(st.settings.pin){st.settings.tutorialSeen=true;persist();lock()}
    else if(!st.settings.tutorialSeen) showTutorial();});
  moveNotice();
})();
})();
</script>
